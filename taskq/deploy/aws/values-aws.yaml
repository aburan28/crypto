# Helm values for taskq on EKS with ElastiCache. provision.sh passes
# keda.external.address and creates the secrets and the efs-sc StorageClass.
image:
  repository: ghcr.io/aburan28/taskq-worker
  tag: latest
redis:
  enabled: false
  externalUrlSecret: {name: taskq-redis, key: url}     # rediss://:TOKEN@primary:6379/0
results:
  create: true
  storageClassName: efs-sc
  accessMode: ReadWriteMany
  storage: 100Gi                                        # EFS ignores the size; it is required
pools:
  - name: cpu
    queues: [cpu]
    replicas: 2                                         # = nodes in cpu-c7i
    labels: {pool: cpu-c7i}
    resources:
      requests: {cpu: "6", memory: 12Gi}
      limits: {cpu: "6", memory: 12Gi}
    nodeSelector: {taskq/pool: cpu}
    tolerations: [{key: taskq/pool, operator: Equal, value: cpu, effect: NoSchedule}]
  # Enable with the cryptanalysis GPU image once it is published, then
  # `eksctl scale nodegroup --cluster taskq --name gpu-g7e --nodes 1`.
  # - name: gpu-sm120
  #   queues: [gpu-sm120]
  #   replicas: 1
  #   labels: {gpu: sm120}
  #   image: {repository: ghcr.io/aburan28/cryptanalysis-taskq-gpu, tag: latest}
  #   resources:
  #     requests: {cpu: "6", memory: 48Gi, nvidia.com/gpu: 1}
  #     limits: {cpu: "6", memory: 48Gi, nvidia.com/gpu: 1}
  #   nodeSelector: {taskq/pool: gpu-sm120}
  #   tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
keda:
  enabled: false        # no node autoscaler here: extra pods would only sit Pending
  external:
    enableTLS: true
    passwordSecret: {name: taskq-redis, key: password}
