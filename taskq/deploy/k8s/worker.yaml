# One task per pod. Scale replicas for throughput; use a separate Deployment
# (queue + nodeSelector + labels) per hardware class. Guaranteed QoS
# (requests == limits, integer CPUs) plus the static CPU manager policy gives
# the pod exclusive cores, which is what makes its timings comparable.
apiVersion: v1
kind: ConfigMap
metadata: {name: taskq-repos}
data:
  repos.yaml: |
    crypto: https://github.com/aburan28/crypto.git
    crypto-autoresearcher: https://github.com/aburan28/crypto-autoresearcher.git
    cryptanalysis: https://github.com/aburan28/cryptanalysis.git
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: taskq-worker-cpu}
spec:
  replicas: 4
  selector: {matchLabels: {app: taskq-worker, queue: cpu}}
  template:
    metadata: {labels: {app: taskq-worker, queue: cpu}}
    spec:
      # Longer than the longest acceptable SIGTERM-to-requeue gap.
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: ghcr.io/aburan28/taskq-worker:latest
          args: ["worker", "--queue", "cpu", "--label", "pool=cpu-c7i",
                 "--repos", "/etc/taskq/repos.yaml"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: taskq, key: redis-password}}
            - {name: TASKQ_REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@taskq-redis:6379/0"}
            - {name: TASKQ_ARTIFACT_DIR, value: /results/artifacts}
            - {name: TASKQ_RESULT_DIR, value: /results/results}
            - {name: TASKQ_CACHE_DIR, value: /var/cache/taskq}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          resources:
            requests: {cpu: "4", memory: 8Gi}
            limits: {cpu: "4", memory: 8Gi}
          volumeMounts:
            - {name: repos, mountPath: /etc/taskq}
            - {name: cache, mountPath: /var/cache/taskq}
            - {name: results, mountPath: /results}
      volumes:
        - name: repos
          configMap: {name: taskq-repos}
        - name: cache
          emptyDir: {sizeLimit: 50Gi}
        - name: results
          persistentVolumeClaim: {claimName: taskq-results}  # ReadWriteMany
