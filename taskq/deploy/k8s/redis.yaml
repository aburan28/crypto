# Redis is the system of record for the queue: AOF on, fsync every second,
# on a persistent volume. Losing it loses queued/running state, not results
# already mirrored to the workers' result volume.
apiVersion: v1
kind: ConfigMap
metadata: {name: taskq-redis}
data:
  redis.conf: |
    appendonly yes
    appendfsync everysec
    save 900 1
    maxmemory-policy noeviction
    # ACL: workers and submitters authenticate; set the password via the Secret.
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: taskq-redis}
spec:
  serviceName: taskq-redis
  replicas: 1
  selector: {matchLabels: {app: taskq-redis}}
  template:
    metadata: {labels: {app: taskq-redis}}
    spec:
      containers:
        - name: redis
          image: redis:7.4
          args: ["/etc/redis/redis.conf", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: taskq, key: redis-password}}
          ports: [{containerPort: 6379}]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: conf, mountPath: /etc/redis}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 2Gi}
      volumes:
        - name: conf
          configMap: {name: taskq-redis}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: taskq-redis}
spec:
  selector: {app: taskq-redis}
  ports: [{port: 6379}]
