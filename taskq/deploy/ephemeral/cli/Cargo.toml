[package]
name = "ephemeral"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Run one command on a fresh EC2 instance that terminates itself (Rust port of ../ephemeral)"
publish = false

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-ec2 = "1.268.0"
aws-sdk-s3 = "1.152.0"
aws-sdk-ssm = "1.128.0"
aws-smithy-http-client = { version = "1.5.0", features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = { version = "1.19.0", features = ["client"] }
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }

[workspace]

# The AWS SDK crates are large; debug info would multiply the build several times over.
[profile.dev]
debug = 0

[profile.release]
strip = true
