apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskq.name" . }}-repos
  labels: {{- include "taskq.labels" . | nindent 4 }}
data:
  repos.yaml: |
    {{- toYaml .Values.repos | nindent 4 }}
{{- if and .Values.results.create (not .Values.results.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "taskq.resultsClaim" . }}
  labels: {{- include "taskq.labels" . | nindent 4 }}
  annotations: {"helm.sh/resource-policy": keep}
spec:
  accessModes: [{{ .Values.results.accessMode }}]
  {{- with .Values.results.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.results.storage }}}}
{{- end }}
