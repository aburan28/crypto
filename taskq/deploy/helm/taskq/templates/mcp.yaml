{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskq.name" . }}-mcp
  labels: {{- include "taskq.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mcp}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mcp}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["mcp"]
          env:
            {{- include "taskq.redisEnv" . | nindent 12 }}
            - {name: TASKQ_MCP_TRANSPORT, value: streamable-http}
          ports: [{name: http, containerPort: {{ .Values.mcp.port }}}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskq.name" . }}-mcp
  labels: {{- include "taskq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mcp}
  ports: [{name: http, port: {{ .Values.mcp.port }}, targetPort: http}]
{{- end }}
