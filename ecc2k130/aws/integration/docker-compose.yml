# The three stores the control plane talks to, on ports chosen not to collide
# with a developer's own Postgres or Redis.
#
# Every one of them is disposable: the data lives in the container, nothing is
# mounted, and `services.sh down` takes the volumes with it.  A suite that can
# corrupt something you wanted to keep is a suite nobody runs.
name: ecc2k130-controlplane-integration

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: controlplane
      POSTGRES_PASSWORD: integration
      POSTGRES_DB: controlplane
      # No fsync: this database exists for the length of one test run, and
      # the suite's threaded claim races are the thing being measured.
      POSTGRES_INITDB_ARGS: "--nosync"
    command: >-
      postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off
               -c max_connections=200
    ports:
      - "${ECC_IT_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlplane -d controlplane"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # No persistence: the cache is a hint store, and a fixture that survives
    # a restart is a fixture that leaks between runs.
    command: redis-server --save "" --appendonly no --maxmemory 256mb
    ports:
      - "${ECC_IT_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # From Chainguard, not MinIO's own registries: `minio/minio` on Docker Hub
  # and `quay.io/minio/minio` (every tag, dated releases included) now answer
  # an anonymous manifest request with 401, which failed this workflow's runs
  # from late September 2026 ("minio Error unauthorized").
  # cgr.dev/chainguard/minio is MinIO built from source, current, linux/amd64
  # and arm64, and anonymous; the suite passed against the binary in its
  # RELEASE.2026-09-22 image (51 tests, 1,016 objects written).
  #
  # The only unpinned image here: the anonymous tier publishes `latest` and
  # `latest-dev` and no version tags, and the S3 surface this uses -- put,
  # head, get, list_objects_v2 with a continuation token -- has been the same
  # for years.  The image runs as a non-root user and ships a world-writable
  # /data, so `server /data` needs no override.  `services.sh` waits on its
  # health endpoint rather than on a healthcheck inside the container (the
  # image has no shell), because what matters is that it answers from here.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --address ":9000"
    environment:
      MINIO_ROOT_USER: ecc2k130
      MINIO_ROOT_PASSWORD: ecc2k130-integration
    ports:
      - "${ECC_IT_S3_PORT:-9010}:9000"
