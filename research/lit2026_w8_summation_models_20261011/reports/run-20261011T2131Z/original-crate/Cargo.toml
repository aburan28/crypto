[package]
name = "w8-original"
version = "0.1.0"
edition = "2021"

# The W8 harness source, compiled against the program-baseline library
# (commit 4b6e09b78, the shared worktree wt/lit2026-baseline), to give the
# `original` arm.  Nothing in the baseline worktree is edited.
[dependencies]
crypto = { path = "/Volumes/SSD990-2/crypto/wt/lit2026-baseline" }
num-bigint = { version = "0.4", features = ["rand"] }
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }

[workspace]
