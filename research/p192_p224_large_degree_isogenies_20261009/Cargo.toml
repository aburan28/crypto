[package]
name = "p192-p224-kernel-first-replay"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "replay-one"
path = "replay_one.rs"
test = false

[[bin]]
name = "verification-poly-checks"
path = "verification_poly_checks.rs"

[[bin]]
name = "verification-kernel-checks"
path = "verification_kernel_checks.rs"

[[bin]]
name = "replay-control"
path = "replay_control.rs"
test = false

[[bin]]
name = "continuation-report"
path = "report.rs"
test = false

[dependencies]
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
blake3 = "1.5"
subtle = "2.5"
hex = "0.4"
getrandom = "0.2"
