<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Proposed F4/F5 follow-up workflow</title>
  <desc id="desc">Original proposed sequence: freeze a native matched protocol, measure eligible runtime and peak memory, profile complete calls, test held-out scaling and publish evidence. Independently fix the unfinished isogeny test. Current execution status is in NEXT_STEPS.md.</desc>
