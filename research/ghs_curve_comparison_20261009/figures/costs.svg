<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">Mean counted ECDLP work by exact binary curve</title>
  <desc id="desc">Five registered binary curves at field degrees 13 and 15. Rho negation and BSGS negation mean group-addition equivalents over eight independent target solves each. BSGS uses stored table entries and leaves hash costs unpriced.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#18324a}.title{font-size:23px;font-weight:bold}.sub{font-size:14px}.label{font-size:13px}.axis{font-size:13px}.rho{fill:#355d87}.bsgs{fill:#cf7847}.grid{stroke:#d7e0e7;stroke-width:1}</style>
  <text x="28" y="34" class="title">Counted ECDLP work differs across exact curve models</text>
  <text x="28" y="57" class="sub">Mean group-addition equivalents per verified target; 8 targets per curve, one round, macOS L0</text>
  <rect x="690" y="25" width="18" height="12" class="rho"/><text x="714" y="36" class="sub">rho.negation</text><rect x="823" y="25" width="18" height="12" class="bsgs"/><text x="847" y="36" class="sub">bsgs.negation</text>
  <path d="M440 83 V435 M540 83 V435 M640 83 V435 M740 83 V435 M840 83 V435 M940 83 V435" class="grid"/>
  <text x="440" y="455" class="axis">0</text><text x="532" y="455" class="axis">50</text><text x="630" y="455" class="axis">100</text><text x="730" y="455" class="axis">150</text><text x="830" y="455" class="axis">200</text><text x="930" y="455" class="axis">250</text>
  <text x="20" y="111" class="label">A  n=13, r=2003, b=1</text><rect x="440" y="89" width="264" height="17" class="rho"/><rect x="440" y="110" width="101.75" height="17" class="bsgs"/><text x="713" y="103" class="label">132.0</text><text x="551" y="124" class="label">50.9</text>
  <text x="20" y="181" class="label">B  n=13, r=4091, b=0x1503</text><rect x="440" y="159" width="333.25" height="17" class="rho"/><rect x="440" y="180" width="131.75" height="17" class="bsgs"/><text x="782" y="173" class="label">166.6</text><text x="581" y="194" class="label">65.9</text>
  <text x="20" y="251" class="label">C  n=15, r=751, b=1</text><rect x="440" y="229" width="201.5" height="17" class="rho"/><rect x="440" y="250" width="70.5" height="17" class="bsgs"/><text x="651" y="243" class="label">100.8</text><text x="520" y="264" class="label">35.3</text>
  <text x="20" y="321" class="label">D  n=15, r=8191, b=0x2493</text><rect x="440" y="299" width="424.25" height="17" class="rho"/><rect x="440" y="320" width="221.75" height="17" class="bsgs"/><text x="874" y="313" class="label">212.1</text><text x="672" y="334" class="label">110.9</text>
  <text x="20" y="391" class="label">E  n=15, r=16477, b=0x702a</text><rect x="440" y="369" width="473.5" height="17" class="rho"/><rect x="440" y="390" width="291.25" height="17" class="bsgs"/><text x="923" y="383" class="label">236.8</text><text x="742" y="404" class="label">145.6</text>
  <text x="28" y="482" class="sub">A-E map to full ICV1 identities in costs.tsv. Bars are sample means; no wall-time comparison or scaling inference.</text>
  <text x="28" y="501" class="sub">Hash-table and canonicalisation work is counted separately but unpriced in this operation unit.</text>
</svg>
