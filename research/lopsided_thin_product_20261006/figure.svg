<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="sans-serif">
<title>Lopsided thin products into the IC pipeline (arXiv:2610.06783v1 integration)</title>
<defs>
<marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#333"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>
<text x="20" y="28" font-size="17" font-weight="bold">Thin lopsided products into the IC pipeline  proved technique vs this round's proposals</text>
<text x="20" y="48" font-size="12" fill="#444">Source: AlmanVassilevska Williams, arXiv:2610.06783v1. Green = proved in the paper. Amber = proposal assessed (not implemented) in this round.</text>

<!-- Paper chain (green), left to right -->
<g font-size="11">
<rect x="20" y="70" width="210" height="86" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="30" y="90" font-weight="bold">Schoenhage identity [paper]</text>
<text x="30" y="106">10-multiplication identity</text>
<text x="30" y="121">Lemma 6, Sec 2.2  sparsity</text>
<text x="30" y="136">is load-bearing</text>

<rect x="250" y="70" width="210" height="86" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="260" y="90" font-weight="bold">Coppersmith recursion [paper]</text>
<text x="260" y="106">batch of thin products</text>
<text x="260" y="121">Sec 2.3 (modified variant)</text>
<text x="260" y="136">encoding shared over blocks</text>

<rect x="480" y="70" width="210" height="86" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="490" y="90" font-weight="bold">Prune by wanted set [paper]</text>
<text x="490" y="106">visit only leaves W needs</text>
<text x="490" y="121">Sec 2.4  the new idea</text>
<text x="490" y="136">union H N²/D^{1/18} leaves</text>

<rect x="710" y="70" width="220" height="86" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="720" y="90" font-weight="bold">Thin product [paper Thm 1/5]</text>
<text x="720" y="106">N×D by D×N, |W| d N²/D</text>
<text x="720" y="121">cost O(N²/D^0.063) ops</text>
<text x="720" y="136">D d N^{1/18} (general: µ&lt;0.1204)</text>

<rect x="950" y="70" width="230" height="86" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="960" y="90" font-weight="bold">Lopsided sparse triangle [paper]</text>
<text x="960" y="106">(XY)[a,b] = # shared middle</text>
<text x="960" y="121">vertices; data-structure form:</text>
<text x="960" y="136">query O(D^0.437) (Thm 3)</text>
</g>
<g stroke="#333" stroke-width="1.5">
<line x1="230" y1="113" x2="250" y2="113" marker-end="url(#arr)"/>
<line x1="460" y1="113" x2="480" y2="113" marker-end="url(#arr)"/>
<line x1="690" y1="113" x2="710" y2="113" marker-end="url(#arr)"/>
<line x1="930" y1="113" x2="950" y2="113" marker-end="url(#arr)"/>
</g>

<!-- Reductions row -->
<g font-size="11">
<rect x="20" y="180" width="440" height="80" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="30" y="200" font-weight="bold">Paper consequences [paper Thm 2, Sec 35]</text>
<text x="30" y="216">3SUM O(n^1.9992) · APSP O(n^2.9995) · Exact Triangle O(n^2.9983) · thin-hint OMv refuted</text>
<text x="30" y="232">via known reductions (Patrascu; VWXu; ChanXu; CVX22). SETH / OV unaffected.</text>
<text x="30" y="248">Real-valued versions: Las Vegas, comparison/addition/subtraction only.</text>
</g>
<line x1="1065" y1="156" x2="240" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- IC proposals (amber) -->
<text x="20" y="288" font-size="14" font-weight="bold">IC insertion points  all PROPOSALS, none implemented (this round: stage diagnostic, S unset)</text>
<g font-size="11">
<rect x="20" y="300" width="270" height="120" rx="8" fill="#fff8e1" stroke="#f9a825"/>
<text x="30" y="320" font-weight="bold">Relation-verification batch</text>
<text x="30" y="336">PROPOSAL  blocked:</text>
<text x="30" y="352">PDP systems are polynomial</text>
<text x="30" y="368">(Semaev / Weil), not inner</text>
<text x="30" y="384">products; needs a new</text>
<text x="30" y="400">reduction, not substitution.</text>

<rect x="310" y="300" width="270" height="120" rx="8" fill="#fff3c4" stroke="#f9a825" stroke-width="2.5"/>
<text x="320" y="320" font-weight="bold">Factor-base queries  closest fit</text>
<text x="320" y="336">PROPOSAL  blocked:</text>
<text x="320" y="352">offline W vs online queries</text>
<text x="320" y="368">mirrors relation queries, but</text>
<text x="320" y="384">IC yield is algebraic, not</text>
<text x="320" y="400">set-theoretic.</text>

<rect x="600" y="300" width="270" height="120" rx="8" fill="#fff8e1" stroke="#f9a825"/>
<text x="610" y="320" font-weight="bold">Sparse-LA block</text>
<text x="610" y="336">PROPOSAL  blocked:</text>
<text x="610" y="352">block Wiedemann needs large</text>
<text x="610" y="368">sparse matvecs over Z/rZ,</text>
<text x="610" y="384">not dense small-integer thin</text>
<text x="610" y="400">products.</text>

<rect x="890" y="300" width="290" height="120" rx="8" fill="#fff8e1" stroke="#f9a825"/>
<text x="900" y="320" font-weight="bold">Target-descent batch</text>
<text x="900" y="336">PROPOSAL  blocked:</text>
<text x="900" y="352">descent is per-target recursion;</text>
<text x="900" y="368">batching changes the workload</text>
<text x="900" y="384">to multi-target, which cannot</text>
<text x="900" y="400">replace the one-target comparison.</text>
</g>

<rect x="20" y="440" width="1160" height="60" rx="8" fill="#eceff1" stroke="#546e7a"/>
<text x="30" y="462" font-size="12" font-weight="bold">Promotion gate (AGENTS.md §§3, 8, 12): full-pipeline S below matched baseline with floor ratio falling = advance; stage count down / S flat-or-worse = relabelling.</text>
<text x="30" y="482" font-size="12">Reference interface implemented + tested: src/cryptanalysis/lopsided_thin_product.rs (8 tests green). End-to-end S, phase costs, speedup: null.</text>
</svg>
