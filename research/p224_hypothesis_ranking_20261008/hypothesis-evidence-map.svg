<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <!-- Editable source: this file. Evidence: run/*.json at aa57a6fd. -->
  <title>P-224: ranked hypotheses against the checks run here</title>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1a1a2e">NIST P-224: each hypothesis, what this run checked, what stays open</text>
  <text x="24" y="56" font-size="12" fill="#555">Green = measured or derived here (run/*.json, rev aa57a6fd). Amber = holds only within a stated bound. Grey = not publicly testable.</text>

  <g font-size="12" fill="#1a1a2e">
    <text x="24" y="88" font-weight="700">hypothesis (supplied rank)</text>
    <text x="300" y="88" font-weight="700">checked in this change</text>
    <text x="640" y="88" font-weight="700">open after it</text>
  </g>

  <!-- H1 -->
  <rect x="20" y="100" width="260" height="104" rx="8" fill="#eef1fb" stroke="#4a5bb5"/>
  <text x="32" y="124" font-size="14" font-weight="700" fill="#1a1a2e">1. Weak class testable on b,</text>
  <text x="32" y="142" font-size="14" font-weight="700" fill="#1a1a2e">ground over SHA-1 seeds</text>
  <text x="32" y="164" font-size="11" fill="#333">needs density ε ≥ 2^-k feasible in 1997–99</text>
  <text x="32" y="180" font-size="11" fill="#333">and a class nobody public has named</text>
  <rect x="292" y="100" width="336" height="104" rx="8" fill="#e8f5ec" stroke="#2e8b57"/>
  <text x="304" y="122" font-size="11" fill="#1a1a2e">C1: SEED → c → b²c ≡ −27 holds, all 5 NIST curves;</text>
  <text x="304" y="138" font-size="11" fill="#1a1a2e">   derived c = FIPS 186-4 printed c (so b is SHA-1-bound)</text>
  <rect x="304" y="146" width="312" height="50" rx="4" fill="#fff6e0" stroke="#c98a00"/>
  <text x="312" y="162" font-size="11" fill="#1a1a2e">C6: KS on (b mod q)/q, q ≤ 10⁸: p = 0.75, 0.12,</text>
  <text x="312" y="176" font-size="11" fill="#1a1a2e">0.22, 0.32; empirical p = 0.128 vs 1,000 nulls.</text>
  <text x="312" y="190" font-size="11" fill="#1a1a2e">Power: residue-biasing classes only.</text>
  <rect x="640" y="100" width="300" height="104" rx="8" fill="#f2f2f2" stroke="#888"/>
  <text x="652" y="124" font-size="11" fill="#333">Any class defined by a property other than</text>
  <text x="652" y="140" font-size="11" fill="#333">b mod small q (j, trace, isogenous curve,</text>
  <text x="652" y="156" font-size="11" fill="#333">derived Legendre patterns). Seed preimage</text>
  <text x="652" y="172" font-size="11" fill="#333">unknown (2023 bounty, no public recovery).</text>

  <!-- H2 -->
  <rect x="20" y="216" width="260" height="104" rx="8" fill="#eef1fb" stroke="#4a5bb5"/>
  <text x="32" y="240" font-size="14" font-weight="700" fill="#1a1a2e">2. The prime, not the curve</text>
  <text x="32" y="262" font-size="11" fill="#333">p = 2²²⁴ − 2⁹⁶ + 1, chosen openly;</text>
  <text x="32" y="278" font-size="11" fill="#333">no grinding needed</text>
  <rect x="292" y="216" width="336" height="104" rx="8" fill="#e8f5ec" stroke="#2e8b57"/>
  <text x="304" y="238" font-size="11" fill="#1a1a2e">C2: p−1 = 2⁹⁶·(2¹²⁸−1), largest prime 2^45.9, v₂ = 96</text>
  <text x="304" y="254" font-size="11" fill="#1a1a2e">   P-192 p+1: same 46-bit smoothness (v₂ = 64)</text>
  <text x="304" y="270" font-size="11" fill="#1a1a2e">   P-521 p+1 = 2⁵²¹; P-256 p+1 has v₂ = 96</text>
  <text x="304" y="286" font-size="11" fill="#1a1a2e">   control brainpoolP224r1: v₂ = 1 / 8, rough</text>
  <text x="304" y="306" font-size="11" fill="#b03030">   → "strongest in the NIST set" holds for p−1 only</text>
  <rect x="640" y="216" width="300" height="104" rx="8" fill="#fff6e0" stroke="#c98a00"/>
  <text x="652" y="240" font-size="11" fill="#333">PKM (2016) Kummer towers need 2^t | p−1:</text>
  <text x="652" y="256" font-size="11" fill="#333">P-224 gives t ≤ 96. Repo tower oracle: solving</text>
  <text x="652" y="272" font-size="11" fill="#333">degree rising, shape-matched null matches the</text>
  <text x="652" y="288" font-size="11" fill="#333">tower; linear growth undecided (inconclusive).</text>
  <text x="652" y="306" font-size="11" fill="#b03030">→ not "only F_p^*": PKM uses it for ECDLP</text>

  <!-- H3 -->
  <rect x="20" y="332" width="260" height="104" rx="8" fill="#eef1fb" stroke="#4a5bb5"/>
  <text x="32" y="356" font-size="14" font-weight="700" fill="#1a1a2e">3. Hidden endomorphism /</text>
  <text x="32" y="374" font-size="14" font-weight="700" fill="#1a1a2e">isogeny structure</text>
  <text x="32" y="396" font-size="11" fill="#333">class-group action, small-norm maps,</text>
  <text x="32" y="412" font-size="11" fill="#333">transfer via the embedding degree</text>
  <rect x="292" y="332" width="336" height="104" rx="8" fill="#e8f5ec" stroke="#2e8b57"/>
  <text x="304" y="354" font-size="11" fill="#1a1a2e">C3: t²−4p = 3²·D_K, D_K ≈ −2^222.5 squarefree,</text>
  <text x="304" y="370" font-size="11" fill="#1a1a2e">   conductor 3 → End(P-224) = O_K (surface curve)</text>
  <text x="304" y="386" font-size="11" fill="#1a1a2e">C5: embedding degree k = (n−1)/3 ≈ 2^222.4</text>
  <text x="304" y="402" font-size="11" fill="#1a1a2e">C7: SafeCurves D_K and twist factorisations check</text>
  <text x="304" y="422" font-size="11" fill="#1a1a2e">   (P-256: published D_K checks; rho alone did not split it)</text>
  <rect x="640" y="332" width="300" height="104" rx="8" fill="#fff6e0" stroke="#c98a00"/>
  <text x="652" y="356" font-size="11" fill="#333">h(D_K) not computed (heuristic ≈ 2^106–2^111).</text>
  <text x="652" y="372" font-size="11" fill="#333">Isogeny walk: ℓ ≤ 61, ≤ 20k curves, no DLP</text>
  <text x="652" y="388" font-size="11" fill="#333">cost measured, no transport. P-224 is on the</text>
  <text x="652" y="404" font-size="11" fill="#333">surface of a depth-1 3-volcano (P-256: depth 0).</text>

  <!-- H4 -->
  <rect x="20" y="448" width="260" height="80" rx="8" fill="#eef1fb" stroke="#4a5bb5"/>
  <text x="32" y="472" font-size="14" font-weight="700" fill="#1a1a2e">4. New ECDLP algorithm</text>
  <text x="32" y="490" font-size="14" font-weight="700" fill="#1a1a2e">known only to the designer</text>
  <text x="32" y="512" font-size="11" fill="#333">applies to honest instances too</text>
  <rect x="292" y="448" width="336" height="80" rx="8" fill="#f2f2f2" stroke="#888"/>
  <text x="304" y="472" font-size="11" fill="#333">Nothing to run. A finite public check cannot</text>
  <text x="304" y="488" font-size="11" fill="#333">falsify it (p256_speculation: NotPubliclyTestable).</text>
  <rect x="640" y="448" width="300" height="80" rx="8" fill="#f2f2f2" stroke="#888"/>
  <text x="652" y="472" font-size="11" fill="#333">Residual. The repo's IC ladder stays above</text>
  <text x="652" y="488" font-size="11" fill="#333">rho for prime-field curves; that bounds known</text>
  <text x="652" y="504" font-size="11" fill="#333">methods, not unknown ones.</text>

  <!-- Implementation track -->
  <rect x="20" y="540" width="920" height="64" rx="8" fill="#fbeeee" stroke="#b03030"/>
  <text x="32" y="560" font-size="12" font-weight="700" fill="#1a1a2e">Separate track (implementation, not an algebraic trapdoor):</text>
  <text x="32" y="578" font-size="11" fill="#1a1a2e">C4: P-224 twist = 3²·11·47·3015283·40375823·267983539294927·ℓ′, ℓ′ ≈ 2^117.1 → twist rho ≈ 2^58.4 (P-256: 2^120.3).</text>
  <text x="32" y="594" font-size="11" fill="#1a1a2e">v₂(p−1) = 96 makes square roots a 96-step Tonelli–Shanks.</text>
</svg>
