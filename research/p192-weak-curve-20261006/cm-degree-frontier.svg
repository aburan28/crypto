<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="470" viewBox="0 0 1060 470" role="img" aria-labelledby="title description">
  <title id="title">P-192 CM exact search boundary and theorem control</title>
  <desc id="description">Derived and frozen logarithmic ideal norm values. These are not timing measurements.</desc>
  <style>
    text { font-family: "DejaVu Sans", sans-serif; fill: #0f172a; }
    .title { font-size: 19px; font-weight: 700; }
    .subtitle { font-size: 12px; fill: #475569; }
    .label { font-size: 12px; font-weight: 600; }
    .status { font-size: 9px; fill: #64748b; }
    .value { font-size: 11px; font-weight: 700; }
    .tick { font-size: 10px; fill: #475569; }
    .grid { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 3 5; }
    .axis { stroke: #334155; stroke-width: 1.3; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="32" y="30" class="title">CM degree frontier: exact scope versus non-scalar theorem bound</text>
  <text x="32" y="52" class="subtitle">Unit: log₂ ideal norm / geometric degree. Derived and preregistered values only; no run or timing result is plotted.</text>

  <line x1="340.00" y1="72" x2="340.00" y2="412" class="grid"/>
  <text x="340.00" y="433" text-anchor="middle" class="tick">0</text>
  <line x1="501.28" y1="72" x2="501.28" y2="412" class="grid"/>
  <text x="501.28" y="433" text-anchor="middle" class="tick">48</text>
  <line x1="662.56" y1="72" x2="662.56" y2="412" class="grid"/>
  <text x="662.56" y="433" text-anchor="middle" class="tick">96</text>
  <line x1="823.84" y1="72" x2="823.84" y2="412" class="grid"/>
  <text x="823.84" y="433" text-anchor="middle" class="tick">144</text>
  <line x1="985.12" y1="72" x2="985.12" y2="412" class="grid"/>
  <text x="985.12" y="433" text-anchor="middle" class="tick">192</text>
  <line x1="1012.00" y1="72" x2="1012.00" y2="412" class="grid"/>
  <text x="1012.00" y="433" text-anchor="middle" class="tick">200</text>
  <line x1="340" y1="412" x2="1012" y2="412" class="axis"/>

  <g id="ramified-5-square">
    <text x="326" y="102" text-anchor="end" class="label">scalar ramified control 5^2</text>
    <rect x="340" y="84" width="15.60" height="25" rx="4" fill="#7e22ce"/>
    <text x="363.60" y="102" class="value">4.644 bits</text>
    <text x="326" y="119" text-anchor="end" class="status">derived · EXP-SCURVE-647ade</text>
  </g>
  <g id="ramified-11-square">
    <text x="326" y="152" text-anchor="end" class="label">scalar ramified control 11^2</text>
    <rect x="340" y="134" width="23.25" height="25" rx="4" fill="#7e22ce"/>
    <text x="371.25" y="152" class="value">6.919 bits</text>
    <text x="326" y="169" text-anchor="end" class="status">derived · EXP-SCURVE-647ade</text>
  </g>
  <g id="ramified-31-square">
    <text x="326" y="202" text-anchor="end" class="label">scalar ramified control 31^2</text>
    <rect x="340" y="184" width="33.29" height="25" rx="4" fill="#7e22ce"/>
    <text x="381.29" y="202" class="value">9.908 bits</text>
    <text x="326" y="219" text-anchor="end" class="status">derived · EXP-SCURVE-647ade</text>
  </g>
  <g id="exact-search-boundary">
    <text x="326" y="252" text-anchor="end" class="label">frozen exact census boundary</text>
    <rect x="340" y="234" width="161.28" height="25" rx="4" fill="#2563eb"/>
    <text x="509.28" y="252" class="value">48.000 bits</text>
    <text x="326" y="269" text-anchor="end" class="status">frozen · EXP-SCURVE-647ade</text>
  </g>
  <g id="non-scalar-lower-bound">
    <text x="326" y="302" text-anchor="end" class="label">non-scalar norm lower bound ceil(abs(D)/4)</text>
    <rect x="340" y="284" width="644.92" height="25" rx="4" fill="#b91c1c"/>
    <text x="934.00" y="302" class="value">191.941 bits</text>
    <text x="326" y="319" text-anchor="end" class="status">derived · EXP-SCURVE-647ade</text>
  </g>
  <g id="symbolic-discriminant-control">
    <text x="326" y="352" text-anchor="end" class="label">symbolic abs(D) relation</text>
    <rect x="340" y="334" width="651.64" height="25" rx="4" fill="#64748b"/>
    <text x="934.00" y="352" class="value">193.941 bits</text>
    <text x="326" y="369" text-anchor="end" class="status">derived · EXP-SCURVE-647ade</text>
  </g>
  <text x="676" y="460" text-anchor="middle" class="subtitle">log₂(norm)</text>
</svg>
