[package]
name = "isogeny-coverage-report"
version = "0.1.0"
edition = "2021"
[workspace]
[[bin]]
name = "coverage-report"
path = "report.rs"
test = false
[dependencies]
num-bigint = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
