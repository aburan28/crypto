<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1440" height="1120" viewBox="0 0 1440 1120" role="img"
     aria-labelledby="figure-title figure-description">
  <title id="figure-title">Three distinct spaces in the exact degree-83 signed-orbit pipeline</title>
  <desc id="figure-description">83 field coordinates over F2 encode elliptic-curve points. The retained factor base is a point-defined union of 600 signed-Frobenius orbits containing 99,600 points. Their relation labels are vectors in (Z/rZ)^600. The verified archived witness is lambda^74 e525 minus lambda e163 minus lambda^40 e220 minus lambda^23 e399. Its dot product with factor logs recovers d, whose scalar multiplication is independently replayed against Q. Normal-basis arithmetic representation, factor-base membership and the relation-vector basis are distinct. This diagram makes no speed claim.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087F83"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", sans-serif; fill: #25354A; }
      .title { font-size: 37px; font-weight: 700; fill: #142B45; }
      .subtitle { font-size: 22px; fill: #5B6A7A; }
      .label { font-size: 19px; font-weight: 700; letter-spacing: 1px; fill: #087F83; }
      .heading { font-size: 27px; font-weight: 700; fill: #142B45; }
      .body { font-size: 22px; }
      .small { font-size: 19px; fill: #5B6A7A; }
      .formula { font-size: 27px; }
      .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 20px; }
      .box { fill: #F4F7F9; stroke: #DAE4EB; stroke-width: 2; }
      .accent { fill: #EFF6F7; stroke: #087F83; stroke-width: 2; }
      .arrow { fill: none; stroke: #087F83; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1440" height="1120" fill="#FFFFFF"/>
  <rect x="36" y="32" width="70" height="5" fill="#087F83"/>
  <text class="title" x="36" y="90">One exact pipeline, three distinct spaces</text>
  <text class="subtitle" x="36" y="128">Field degree: 83 · prime-subgroup size: approximately 53 bits · r = 8569786107849059</text>
  <text class="small" x="36" y="155">The cyclic subgroup has one scalar dimension over Z/rZ; the 600 IC coordinates are formal coefficient labels.</text>

  <!-- Space 1: field coordinates and arithmetic representations. -->
  <rect class="box" x="36" y="170" width="418" height="338" rx="10"/>
  <text class="label" x="56" y="205">01 / FIELD COORDINATES</text>
  <text class="heading" x="56" y="250">83 coordinates over F₂</text>
  <text class="formula" x="56" y="286">F = F₂[z] /</text>
  <text class="formula" x="56" y="320">(z⁸³ + z⁷ + z⁴ + z² + 1)</text>
  <text class="body" x="56" y="359">Polynomial and normal bases</text>
  <text class="body" x="56" y="389">represent the same field values.</text>
  <text class="body" style="font-size:20px" x="56" y="430">Squaring rotates normal coordinates.</text>
  <text class="body" x="56" y="460">Least rotations define orbit keys.</text>
  <text class="small" x="56" y="491">Not a factor-base membership rule.</text>

  <!-- Space 2: a point-defined union of signed Frobenius orbits. -->
  <rect class="box" x="511" y="170" width="418" height="338" rx="10"/>
  <text class="label" x="531" y="205">02 / FACTOR-BASE POINT SET</text>
  <text class="heading" x="531" y="250">600 orbit representatives</text>
  <text class="formula" x="531" y="294">B = { ε τᵏ(Rⱼ) }</text>
  <text class="body" x="531" y="336">0 ≤ k &lt; 83; j = 0,…,599; ε = ±1</text>
  <text class="body" x="531" y="366">99,600 distinct signed-orbit points</text>
  <text class="body" x="531" y="413">Membership is defined by points.</text>
  <text class="body" x="531" y="443">This B is not a linear subspace</text>
  <text class="body" x="531" y="474">of the 83 field coordinates.</text>

  <!-- Space 3: standard column coordinates over the prime subgroup ring. -->
  <rect class="box" x="986" y="170" width="418" height="338" rx="10"/>
  <text class="label" x="1006" y="205">03 / RELATION COEFFICIENTS</text>
  <text class="heading" x="1006" y="250">Vectors in (Z/rZ)⁶⁰⁰</text>
  <text class="formula" x="1006" y="294">v(ε τᵏ(Rⱼ)) = ε λᵏ eⱼ</text>
  <text class="body" x="1006" y="336">eⱼ selects one orbit/log column.</text>
  <text class="body" x="1006" y="366">Coefficients track phase and sign.</text>
  <text class="body" x="1006" y="413">These 600 column coordinates</text>
  <text class="body" x="1006" y="443">are separate from field encoding</text>
  <text class="body" x="1006" y="474">and the actual point-set B.</text>

  <path class="arrow" d="M 463 332 L 500 332"/>
  <path class="arrow" d="M 938 332 L 975 332"/>
  <text class="small" x="476" y="378" text-anchor="middle" transform="rotate(-90 476 378)">encodes</text>
  <text class="small" x="951" y="375" text-anchor="middle" transform="rotate(-90 951 375)">labels</text>

  <!-- The algebraic transport invariant links points to coefficient vectors. -->
  <rect class="accent" x="36" y="540" width="1368" height="108" rx="10"/>
  <text class="label" x="56" y="572">SIGNED-FROBENIUS TRANSPORT ON THE PRIME SUBGROUP</text>
  <text class="formula" x="56" y="608">τ(x,y) = (x²,y²) · −P = (x,x+y) · τ(P) = [λ]P</text>
  <text class="body" x="56" y="636">λ = 2998004823950457 · λ² − λ + 2 = 0 (mod r) · exact order 83</text>

  <!-- Exact archived four-point witness; all values copied from INVARIANTS.md. -->
  <text class="label" x="36" y="697">RETAINED FOUR-POINT WITNESS: P₁ + P₂ + P₃ + P₄ = Q</text>
  <text class="small" x="36" y="730">Point indices [87298, 27061, 36601, 66281] · signs and shifts independently replayed in the archived receipt</text>
  <rect class="box" x="36" y="754" width="1368" height="95" rx="10"/>
  <text x="64" y="814" font-size="38">
    <tspan>v</tspan><tspan baseline-shift="sub" font-size="24">Q</tspan><tspan baseline-shift="baseline"> = λ</tspan><tspan baseline-shift="super" font-size="24">74</tspan><tspan baseline-shift="baseline">e</tspan><tspan baseline-shift="sub" font-size="24">525</tspan><tspan baseline-shift="baseline"> − λe</tspan><tspan baseline-shift="sub" font-size="24">163</tspan><tspan baseline-shift="baseline"> − λ</tspan><tspan baseline-shift="super" font-size="24">40</tspan><tspan baseline-shift="baseline">e</tspan><tspan baseline-shift="sub" font-size="24">220</tspan><tspan baseline-shift="baseline"> − λ</tspan><tspan baseline-shift="super" font-size="24">23</tspan><tspan baseline-shift="baseline">e</tspan><tspan baseline-shift="sub" font-size="24">399</tspan>
  </text>

  <rect class="box" x="36" y="884" width="816" height="98" rx="10"/>
  <text class="label" x="56" y="915">FACTOR-LOG DOT PRODUCT</text>
  <text class="formula" x="56" y="954">Lⱼ = log_G(Rⱼ) · d = v_Q · L (mod r)</text>
  <path class="arrow" d="M 865 932 L 899 932"/>
  <rect class="accent" x="910" y="884" width="494" height="98" rx="10"/>
  <text class="label" x="930" y="915">INDEPENDENT FINAL REPLAY</text>
  <text class="heading" x="930" y="957">[d]G = Q</text>

  <line x1="36" y1="1011" x2="1404" y2="1011" stroke="#DAE4EB" stroke-width="2"/>
  <text class="small" x="36" y="1041">Full factor-log/rank transcript is not retained: final witness replay does not certify every preparation equation.</text>
  <text class="mono" x="36" y="1073">Exact legacy model: icv1-f2m83-t6151469093347-9eba6cd5 · primary binding: explicit field + r + G + Q</text>
  <text class="small" x="36" y="1103">Source: verification/INVARIANTS.md and verification/CURVE_ID_ERRATUM.md · correctness diagram; no runtime claim</text>
</svg>
