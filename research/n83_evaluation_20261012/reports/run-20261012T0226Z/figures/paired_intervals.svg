  <g id="text_16">
   <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b6a7a" x="7.2" y="34.128" transform="rotate(-0 7.2 34.128)">IC/strong values are native reciprocals of the frozen strong/IC estimator; no new resampling</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b6a7a" x="7.2" y="278.064" transform="rotate(-0 7.2 278.064)">IC/strong &gt; 1 means greater IC cost; parity is the dashed line. A/A compares two strong runs with the same seed.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b6a7a" x="7.2" y="293.904" transform="rotate(-0 7.2 293.904)">Each interval is conditional on n=5 paired repeats of one Q and one host. It is not a fresh-target population interval.</text>
