   <g id="text_1">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'" transform="translate(19.081506 35.652813)">certified cheapest loop</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'" transform="translate(27.01785 43.814672)">(exhaustive to the</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'" transform="translate(23.309194 51.976531)">norm bound), native</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'" transform="translate(125.967975 35.652813)">H_D: analytic q-series,</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'" transform="translate(128.768194 43.814672)">fixed point, rounding</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'" transform="translate(133.834725 51.976531)">&lt; 2^-16 asserted</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'" transform="translate(232.759881 35.652547)">CM curve / F_p, crater</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'" transform="translate(237.280819 43.814406)">walk (Velu), closing</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'" transform="translate(248.202787 51.976266)">isomorphism</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'" transform="translate(327.692694 35.653078)">twist E'/F_(p^2): psi = +mu,</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'" transform="translate(341.012725 43.814938)">loop = ±lambda(±s)</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'" transform="translate(344.743162 51.976266)">24 pts x 5 D: PASS</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'" transform="translate(342.41735 130.692547)">GLV-GLS-4 vs GLS-2</text>
