    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'" transform="translate(345.365256 147.016266)">(5 D, pinned core)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'" transform="translate(125.750694 130.693078)">binary GLS: Frobenius-</text>
