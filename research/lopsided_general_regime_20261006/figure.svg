<text x="20" y="560" font-size="11" fill="#333">Watch condition (conjunction): a new base identity past eps* = 0.1204 AND a reduction reshaping an algebraic workload into thin products. Either alone changes nothing.</text>
<text x="20" y="582" font-size="11" fill="#333">Gate-parameterization next action: extend screen_workload with the six table2.json rows after PR #1493 merges (acceptance: existing tests unchanged).</text>
