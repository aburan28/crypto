<text x="430" y="424" font-size="12" font-weight="bold">RING: small-integer products over Z?</text>
<text x="430" y="446" font-size="11">MSM checks: group ops, eps~1 scale-free</text>
<text x="430" y="466" font-size="11">sparse LA: matvecs over Z/rZ</text>
<text x="430" y="486" font-size="11">paper: no new sparse-MM either (Sec 6)</text>
