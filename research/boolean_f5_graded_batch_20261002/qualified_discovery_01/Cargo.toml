[package]
name = "boolean-f5-graded-batch"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "boolean-f5-graded-batch"
path = "worker.rs"

[dependencies]
crypto = { path = "../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
