name: Matrix-F5 branchless strip default confirmation

on:
  pull_request:
    paths:
      - 'src/cryptanalysis/gf2_elim.rs'
      - 'src/cryptanalysis/matrix_f5_f2.rs'
      - 'examples/f4_f2_bench.rs'
      - 'research/gf2_branchless_strip_20260929/PROTOCOL.md'
      - 'research/gf2_branchless_strip_20260929/confirm_default.py'
      - '.github/workflows/f5-gf2-branchless-confirm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-f5:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        threads: [1, 4]
    env:
      RAYON_NUM_THREADS: ${{ matrix.threads }}
      CARGO_BUILD_JOBS: '2'
      KIC_GF2_FORCE_AVX2: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98'
      - uses: Swatinem/rust-cache@v2
      - name: Check exact shared-kernel and F5 output
        run: |
          cargo test --release --lib cryptanalysis::gf2_elim::tests -- --test-threads=1
          cargo test --release --lib cryptanalysis::matrix_f5_f2::tests -- --test-threads=1
      - name: Build F5 stage benchmark
        run: cargo build --release --example f4_f2_bench
      - name: Frozen default-on paired repeat
        run: |
          python3 research/gf2_branchless_strip_20260929/confirm_default.py \
            target/release/examples/f4_f2_bench \
            research/gf2_branchless_strip_20260929/ci-result-t${{ matrix.threads }}.json \
            --pairs 5 --threads ${{ matrix.threads }}
      - name: Preserve complete runs and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f5-branchless-confirm-t${{ matrix.threads }}-${{ github.sha }}
          path: research/gf2_branchless_strip_20260929/ci-result-t${{ matrix.threads }}.json
          if-no-files-found: warn
