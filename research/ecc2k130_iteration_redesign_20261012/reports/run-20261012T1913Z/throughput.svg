<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">ECC2K130 iteration redesign throughput screen</title>
  <desc id="desc">Matched RunPod RTX PRO 6000 shipping and minimal table-walk arms, with the repository's separately documented full one-block recipe shown as historical context.</desc>
  <rect width="900" height="520" fill="#fff"/>
  <text x="450" y="34" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#111">ECC2K130 iteration redesign screen</text>
  <text x="450" y="59" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">RTX PRO 6000 Blackwell Server Edition · billions of complete updates/s</text>
  <g font-family="sans-serif" font-size="12" fill="#555">
    <line x1="105" y1="390" x2="820" y2="390" stroke="#333"/>
    <line x1="105" y1="310" x2="820" y2="310" stroke="#ddd"/>
    <line x1="105" y1="230" x2="820" y2="230" stroke="#ddd"/>
    <line x1="105" y1="150" x2="820" y2="150" stroke="#ddd"/>
    <line x1="105" y1="70" x2="820" y2="70" stroke="#ddd"/>
    <text x="92" y="394" text-anchor="end">0</text>
    <text x="92" y="314" text-anchor="end">5</text>
    <text x="92" y="234" text-anchor="end">10</text>
    <text x="92" y="154" text-anchor="end">15</text>
    <text x="92" y="74" text-anchor="end">20</text>
    <line x1="105" y1="70" x2="820" y2="70" stroke="#b44" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="815" y="64" text-anchor="end" fill="#a33">20 B/s target</text>
  </g>
  <rect x="155" y="242.8" width="145" height="147.2" rx="4" fill="#2a78d6"/>
  <rect x="375" y="368.1" width="145" height="21.9" rx="4" fill="#d95757"/>
  <rect x="595" y="68.8" width="145" height="321.2" rx="4" fill="#8b9299"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="227" y="229" font-size="18" font-weight="700" fill="#1d5da8">9.200</text>
    <text x="447" y="355" font-size="18" font-weight="700" fill="#a63f3f">1.368</text>
    <text x="667" y="53" font-size="18" font-weight="700" fill="#555">20.078</text>
    <text x="227" y="414" font-size="14" fill="#222">shipping</text>
    <text x="447" y="414" font-size="14" fill="#222">minimal v3 arm</text>
    <text x="667" y="414" font-size="14" fill="#222">full recipe*</text>
    <text x="227" y="435" font-size="11" fill="#555">measured, median of 3</text>
    <text x="447" y="435" font-size="11" fill="#555">measured, median of 3</text>
    <text x="667" y="435" font-size="11" fill="#555">documented prior run</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#333">
    <text x="110" y="475">* Historical full one-block v3 recipe from ONE-BLOCK-GEOMETRY.md; not re-run in this screen.</text>
    <text x="110" y="494">The new Make target now selects that full recipe. The red arm is the intentionally minimal diagnostic build.</text>
  </g>
</svg>
