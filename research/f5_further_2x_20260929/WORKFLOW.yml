name: Matrix-F5 further 2x paired test

on:
  pull_request:
    paths:
      - 'src/cryptanalysis/matrix_f5_f2.rs'
      - 'examples/f4_f2_bench.rs'
      - 'research/f5_further_2x_20260929/**'
      - '.github/workflows/f5-further-2x.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-f5:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RAYON_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98'
      - uses: Swatinem/rust-cache@v2
      - name: Check exact unpack and F5 row space
        run: cargo test --release --lib cryptanalysis::matrix_f5_f2::tests -- --test-threads=1
      - name: Build F5 stage benchmark
        run: cargo build --release --example f4_f2_bench
      - name: Frozen one-thread paired repeat
        run: |
          python3 research/f5_further_2x_20260929/paired_f5.py \
            target/release/examples/f4_f2_bench \
            research/f5_further_2x_20260929/ci-result.json \
            --pairs 5 --threads 1
      - name: Preserve complete runs and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f5-further-2x-${{ github.sha }}
          path: research/f5_further_2x_20260929/ci-result.json
          if-no-files-found: warn
