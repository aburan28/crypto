<svg xmlns="http://www.w3.org/2000/svg" width="940" height="250" viewBox="0 0 940 250">
<rect width="940" height="250" fill="white"/>
<text x="28" y="35" font-size="22">V1 inverse-cubic splitter: observed cap failure</text>
<rect x="28" y="72" width="205" height="95" rx="9" fill="#edf4fb" stroke="#4477aa"/>
<text x="44" y="105" font-size="16">rational cubic roots</text><text x="44" y="133" font-size="14">can all lie in Fp</text>
<path d="M237 120 L267 120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="272" y="72" width="205" height="95" rx="9" fill="#edf4fb" stroke="#4477aa"/>
<text x="288" y="105" font-size="16">V1 shifts [i,0]</text><text x="288" y="133" font-size="14">stay in Fp</text>
<path d="M481 120 L511 120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="516" y="72" width="205" height="95" rx="9" fill="#fff4e6" stroke="#d95f02"/>
<text x="532" y="105" font-size="16">all nonzero Fp values</text><text x="532" y="133" font-size="14">are squares in Fp²</text>
<path d="M725 120 L755 120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="760" y="72" width="155" height="95" rx="9" fill="#fdeaea" stroke="#b22222"/>
<text x="776" y="105" font-size="16">32-shift cap</text><text x="776" y="133" font-size="14">exit 101</text>
<text x="28" y="215" font-size="14" fill="#555">V2 uses extension-field shifts [i,1]; the failed V1 receipt is retained.</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#333"/></marker></defs>
</svg>
