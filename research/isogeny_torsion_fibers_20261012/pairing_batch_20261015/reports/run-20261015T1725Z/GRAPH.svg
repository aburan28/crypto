<title id="title">Instrumentation gap at order-67 batch prefix 64</title>
<desc id="desc">For rounds zero, one and two, coarse pairing/rho ratios were 3.803, 3.372 and 3.419, while phase sums divided by rho were 1.055, 0.846 and 0.786.</desc>
