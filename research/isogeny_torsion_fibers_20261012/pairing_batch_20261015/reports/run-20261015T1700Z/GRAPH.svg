<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">Charged rho retry diagnostic on the first order-19 target</title>
<desc id="desc">The V2 first seed ran 806452 unverified steps; the charged second seed solved in 11 steps. V3 caps an attempt at 80 steps.</desc>
<rect width="900" height="390" fill="#fff"/>
<text x="25" y="41" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#173047">First rho seed dominates V2 reference</text>
<text x="25" y="67" font-family="Arial,sans-serif" font-size="14" fill="#526b7d">Same target p=61, r=19 · step count plotted on a log₁₀ scale</text>
<line x1="215" y1="97" x2="215" y2="320" stroke="#8094a3"/>
<line x1="215" y1="320" x2="815" y2="320" stroke="#8094a3"/>
<g stroke="#dfe6ea"><line x1="315" y1="98" x2="315" y2="320"/><line x1="415" y1="98" x2="415" y2="320"/><line x1="515" y1="98" x2="515" y2="320"/><line x1="615" y1="98" x2="615" y2="320"/><line x1="715" y1="98" x2="715" y2="320"/><line x1="815" y1="98" x2="815" y2="320"/></g>
<g font-family="Arial,sans-serif" font-size="14" fill="#526b7d"><text x="205" y="344">1</text><text x="300" y="344">10</text><text x="397" y="344">10²</text><text x="498" y="344">10³</text><text x="597" y="344">10⁴</text><text x="697" y="344">10⁵</text><text x="797" y="344">10⁶</text></g>
<g font-family="Arial,sans-serif" font-size="16" fill="#173047"><text x="25" y="137">V2 first seed</text><text x="25" y="207">V2 retry one</text><text x="25" y="277">V3 attempt cap</text></g>
<rect x="215" y="114" width="590" height="31" rx="4" fill="#b45134"/>
<rect x="215" y="184" width="104" height="31" rx="4" fill="#438b64"/>
<rect x="215" y="254" width="190" height="31" rx="4" fill="#6d8190"/>
<g font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#173047"><text x="650" y="136" fill="#fff">806,452 · unverified</text><text x="330" y="206">11 · solved</text><text x="417" y="276">80 steps</text></g>
<text x="25" y="374" font-family="Arial,sans-serif" font-size="13" fill="#526b7d">V1 stopped before target output. V2 charged both attempts; V3 changed the cap before further runs.</text>
</svg>
