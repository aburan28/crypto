    <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:22px;font-weight:bold}.head{font-size:17px;font-weight:bold}.body{font-size:13px}.small{font-size:12px}.edge{font-size:13px;font-weight:bold}</style>
