    <path d="M395 140 C525 193 675 193 805 140" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="500" y="174" width="252" height="20" fill="#f8fafc"/>
    <text x="512" y="187" class="edge">ψ₂: degree 1, public scaling</text>
    <text x="50" y="213" class="small">Checked pointwise on rational E: φ = ψ₂ ◦ [10 mod 19]. Both destination relation arms verified 8/8 answers.</text>
  </g>
