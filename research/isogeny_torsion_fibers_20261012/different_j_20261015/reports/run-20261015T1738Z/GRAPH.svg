<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">Different-j rational fibers and subgroup transport</title>
<desc id="desc">Exactly 4575 source points map three-to-one onto 1525 rational destination image points, while the 61-point target subgroup maps injectively.</desc>
<rect width="900" height="500" fill="#fff"/>
<text x="24" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#173047">Exact rational fibers · F₆₇² degree-three map</text>
<text x="24" y="63" font-family="Arial,sans-serif" font-size="14" fill="#526b7d">FIBER_AUDIT_V1 · all 4575 rational points · all 3721 ordered subgroup pairs</text>
<rect x="23" y="100" width="350" height="150" rx="9" fill="#e9f3fb" stroke="#4382ae" stroke-width="2"/>
<text x="41" y="128" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#174f79">Source E · j=7</text>
<text x="41" y="155" font-family="Arial,sans-serif" font-size="15" fill="#173047">y²=x³+46x+37 · 4575 rational points</text>
<text x="41" y="186" font-family="Arial,sans-serif" font-size="11" fill="#526b7d">ICV1:fpk-67-2-4083a0ca:-85:4575:7,0:</text>
<text x="41" y="203" font-family="Arial,sans-serif" font-size="11" fill="#526b7d">unk:unk:r:653aff0a31ca</text>
<text x="41" y="231" font-family="Arial,sans-serif" font-size="14" fill="#174f79">kernel O, (3,1), (3,66)</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#916c23"/></marker></defs>
<path d="M 386 175 L 507 175" stroke="#916c23" stroke-width="4" marker-end="url(#arrow)"/>
<text x="447" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#77571d">degree 3</text>
<text x="447" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#77571d">3 per image</text>
<rect x="524" y="100" width="351" height="150" rx="9" fill="#e9f6ed" stroke="#438e68" stroke-width="2"/>
<text x="542" y="128" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#276245">Destination E′ · j=11</text>
<text x="542" y="155" font-family="Arial,sans-serif" font-size="15" fill="#173047">y²=x³+53x+25 · 4575 rational points</text>
<text x="542" y="186" font-family="Arial,sans-serif" font-size="11" fill="#526b7d">ICV1:fpk-67-2-4083a0ca:-85:4575:11,0:</text>
<text x="542" y="203" font-family="Arial,sans-serif" font-size="11" fill="#526b7d">unk:unk:r:3dc527efd80b</text>
<text x="542" y="231" font-family="Arial,sans-serif" font-size="14" fill="#276245">1525 rational points in map image</text>
<rect x="23" y="290" width="852" height="121" rx="9" fill="#f7f7f2" stroke="#d3d8c9"/>
<text x="42" y="322" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173047">Target subgroup · order 61 · cofactor 75</text>
<text x="42" y="354" font-family="Arial,sans-serif" font-size="16" fill="#173047">61 source points  →  61 distinct destination points</text>
<text x="42" y="383" font-family="Arial,sans-serif" font-size="14" fill="#526b7d">All 61²=3721 ordered pair homomorphism checks passed; relation yield was unchanged in the paired solve.</text>
<text x="24" y="456" font-family="Arial,sans-serif" font-size="14" fill="#526b7d">A three-point rational fiber supplies one subgroup image here. This is exact finite-instance evidence, not a general speed claim.</text>
</svg>
