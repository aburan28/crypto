<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" font-family="sans-serif">
<title>Screening funnel: 12 candidate transfers through three gates</title>
<rect x="0" y="0" width="1200" height="650" fill="#ffffff"/>
<text x="20" y="28" font-size="17" font-weight="bold">Screening funnel -- 12 candidate transfers, zero repo passers, gate named per reject</text>
<text x="20" y="48" font-size="12" fill="#444">Gate order matches screen_workload: shape, then ring, then size. Numbered candidates refer to the REPORT table.</text>

<rect x="490" y="60" width="220" height="44" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
<text x="600" y="78" font-size="12" font-weight="bold" text-anchor="middle">12 candidate transfers</text>
<text x="600" y="94" font-size="11" text-anchor="middle">surveyed [this work]</text>

<polygon points="600,120 720,180 600,240 480,180" fill="#fff8e1" stroke="#f9a825"/>
<text x="600" y="172" font-size="12" font-weight="bold" text-anchor="middle">Gate 1 -- Shape</text>
<text x="600" y="188" font-size="11" text-anchor="middle">shared bilinear middle?</text>
<line x1="600" y1="104" x2="600" y2="120" stroke="#333" stroke-width="1.5"/>

<rect x="20" y="120" width="330" height="120" rx="8" fill="#ffebee" stroke="#c62828"/>
<text x="30" y="140" font-size="12" font-weight="bold">Structural rejects (5)</text>
<text x="30" y="157" font-size="11">#1 pair-table / MITM probes</text>
<text x="30" y="173" font-size="11">#2 BSGS giant-step lookups</text>
<text x="30" y="189" font-size="11">#3 rho distinguished-point tables</text>
<text x="30" y="205" font-size="11">#6 F4/F5 Macaulay batches</text>
<text x="30" y="221" font-size="11">hash probes / poly matrices -- nothing to prune</text>
<line x1="480" y1="150" x2="350" y2="160" stroke="#333" stroke-width="1.5"/>
<text x="400" y="145" font-size="11">no</text>

<polygon points="600,260 720,320 600,380 480,320" fill="#fff8e1" stroke="#f9a825"/>
<text x="600" y="312" font-size="12" font-weight="bold" text-anchor="middle">Gate 2 -- Ring</text>
<text x="600" y="328" font-size="11" text-anchor="middle">small integers?</text>
<line x1="600" y1="240" x2="600" y2="260" stroke="#333" stroke-width="1.5"/>
<text x="612" y="252" font-size="11">yes</text>

<rect x="850" y="260" width="330" height="120" rx="8" fill="#ffebee" stroke="#c62828"/>
<text x="860" y="280" font-size="12" font-weight="bold">Ring rejects (2)</text>
<text x="860" y="297" font-size="11">#4 batch MSM relation verification</text>
<text x="860" y="313" font-size="11">#5 block-Wiedemann sparse LA</text>
<text x="860" y="329" font-size="11">group ops / residues mod r</text>
<text x="860" y="345" font-size="11">#4 also fails size: eps about 1 at R about F</text>
<text x="860" y="361" font-size="11">(scale-free -- doubling keeps eps=1)</text>
<line x1="720" y1="300" x2="850" y2="310" stroke="#333" stroke-width="1.5"/>
<text x="775" y="295" font-size="11">no</text>

<polygon points="600,400 720,460 600,520 480,460" fill="#fff8e1" stroke="#f9a825"/>
<text x="600" y="452" font-size="12" font-weight="bold" text-anchor="middle">Gate 3 -- Size</text>
<text x="600" y="468" font-size="11" text-anchor="middle">eps at most 1/18, kap at least 1/2?</text>
<line x1="600" y1="380" x2="600" y2="400" stroke="#333" stroke-width="1.5"/>
<text x="612" y="392" font-size="11">yes</text>

<rect x="20" y="400" width="330" height="120" rx="8" fill="#ffebee" stroke="#c62828"/>
<text x="30" y="420" font-size="12" font-weight="bold">Size rejects -- repo: 0</text>
<text x="30" y="437" font-size="11">MSM operating shape: eps=1 (demo)</text>
<text x="30" y="453" font-size="11">full-wanted demo: kap=0 below 1/2</text>
<text x="30" y="469" font-size="11">both FailsRegime, exact coordinates</text>
<line x1="480" y1="440" x2="350" y2="450" stroke="#333" stroke-width="1.5"/>
<text x="400" y="435" font-size="11">no</text>

<rect x="850" y="400" width="330" height="120" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="860" y="420" font-size="12" font-weight="bold">Pass: synthetic only (1)</text>
<text x="860" y="437" font-size="11">N=2^18, D=2, |W|=N^2/2</text>
<text x="860" y="453" font-size="11">eps=1/18, kap=1: FitsConcrete</text>
<text x="860" y="469" font-size="11">proves the gate is not vacuous</text>
<text x="860" y="485" font-size="11">promotion: matched full-DLP suites in S</text>
<line x1="720" y1="470" x2="850" y2="460" stroke="#333" stroke-width="1.5"/>
<text x="775" y="455" font-size="11">yes</text>

<rect x="20" y="540" width="1160" height="90" rx="8" fill="#f5f5f5" stroke="#757575"/>
<text x="30" y="562" font-size="12" font-weight="bold">Paper-excluded / absent lane (5) -- bypasses the gates, recorded so no follow-up re-screens them without new evidence</text>
<text x="30" y="582" font-size="11">#9 no convolution stage in the ECDLP path; #10 isogeny graphs tiny + unweighted (scale/model mismatch); #11 real-RAM variants N/A here</text>
<text x="30" y="600" font-size="11">#12 SETH, OV, k-SUM/XOR with k at least 4, unhinted OMv, 3SUM-indexing -- explicitly unaffected (paper Sec. 1.2, Fig. 1)</text>
</svg>
