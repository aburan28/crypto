<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="sans-serif">
<title>Screening map in the (epsilon, kappa) plane: gate evaluations, not measurements</title>
<rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold">Screening map -- gate evaluations in the (eps, kap) plane, NOT measurements</text>
<text x="20" y="46" font-size="12" fill="#444">Points are exact closed-form gate evaluations of workload shapes (|W| = N^2/D^kap, eps = ln D / ln N). Structural rejects have no coordinates.</text>

<!-- pass region: eps in [0,1/18], kap in [0.5,1.3] -> x 120..163, y 60..231 -->
<rect x="120" y="60" width="43" height="171" fill="#e8f5e9"/>
<text x="122" y="80" font-size="11" fill="#2e7d32">PASS</text>

<!-- axes -->
<line x1="120" y1="60" x2="120" y2="360" stroke="#333" stroke-width="1.5"/>
<line x1="120" y1="360" x2="980" y2="360" stroke="#333" stroke-width="1.5"/>
<!-- gate lines -->
<line x1="163" y1="60" x2="163" y2="360" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="120" y1="231" x2="980" y2="231" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6 4"/>
<g font-size="11" fill="#333">
<text x="112" y="380">0</text>
<text x="150" y="380">1/18</text>
<text x="505" y="380">0.5</text>
<text x="895" y="380">1.0</text>
<text x="480" y="408">eps = ln D / ln N (concrete gate: eps at most 1/18)</text>
<text x="55" y="363">0</text>
<text x="45" y="234">0.5</text>
<text x="55" y="127">1.0</text>
<text x="30" y="220" transform="rotate(-90 30 220)">kap (|W| = N^2/D^kap; gate: kap at least 1/2)</text>
</g>
<g stroke="#ddd" stroke-width="1">
<line x1="120" y1="231" x2="980" y2="231"/>
<line x1="120" y1="124" x2="980" y2="124"/>
<line x1="120" y1="339" x2="980" y2="339"/>
</g>

<!-- points: fit (0.0556,1.0)->(163,124); MSM (1,1)->(902,124); oversized (0.0556,0)->(163,339) -->
<circle cx="163" cy="124" r="7" fill="#2e7d32"/>
<text x="175" y="120" font-size="12" fill="#2e7d32" font-weight="bold">synthetic fitter (eps=1/18, kap=1)</text>
<text x="175" y="136" font-size="11" fill="#2e7d32">N=2^18, D=2, |W|=N^2/2</text>
<circle cx="902" cy="124" r="7" fill="#c62828"/>
<text x="700" y="105" font-size="12" fill="#c62828" font-weight="bold">MSM operating point (eps=1, kap=1)</text>
<text x="700" y="90" font-size="11" fill="#c62828">R about F at every scale: scale-free fail</text>
<circle cx="163" cy="339" r="7" fill="#c62828"/>
<text x="175" y="343" font-size="12" fill="#c62828" font-weight="bold">oversized-W demo (kap=0)</text>

<!-- structural box -->
<rect x="120" y="420" width="860" height="60" rx="8" fill="#f5f5f5" stroke="#757575"/>
<text x="130" y="442" font-size="12" font-weight="bold">No coordinates -- structural rejects (hash probes / poly matrices, NoSharedMiddle):</text>
<text x="130" y="462" font-size="11">#1 pair-table + MITM probes, #2 BSGS lookups, #3 rho tables, #6 Macaulay batches. Ring rejects (#4 MSM, #5 Wiedemann) fail before size.</text>
</svg>
