<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Published covering cases by extension degree and minimum versus higher genus">
  <rect width="800" height="340" fill="#fbfcff"/>
  <text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#15243b">Published elliptic covering cases by extension degree</text>
  <text x="400" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#44556c">Iijima–Momose–Chao 2015, Section 5; 36 numbered cases; one bar per degree d</text>
  <line x1="100" y1="270" x2="705" y2="270" stroke="#617086" stroke-width="2"/>
  <line x1="100" y1="65" x2="100" y2="270" stroke="#617086" stroke-width="2"/>
  <text x="82" y="274" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
  <text x="82" y="204" text-anchor="end" font-family="sans-serif" font-size="11">5</text>
  <text x="82" y="134" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
  <line x1="95" y1="200" x2="705" y2="200" stroke="#e5eaf0"/>
  <line x1="95" y1="130" x2="705" y2="130" stroke="#e5eaf0"/>
  <rect x="150" y="214" width="80" height="42" fill="#ef8f57"/>
  <rect x="150" y="256" width="80" height="14" fill="#267c92"/>
  <rect x="290" y="158" width="80" height="84" fill="#ef8f57"/>
  <rect x="290" y="242" width="80" height="28" fill="#267c92"/>
  <rect x="430" y="116" width="80" height="140" fill="#ef8f57"/>
  <rect x="430" y="256" width="80" height="14" fill="#267c92"/>
  <rect x="570" y="88" width="80" height="168" fill="#ef8f57"/>
  <rect x="570" y="256" width="80" height="14" fill="#267c92"/>
  <g font-family="sans-serif" font-size="14" text-anchor="middle" fill="#17283d">
    <text x="190" y="205">4</text><text x="330" y="149">8</text><text x="470" y="107">11</text><text x="610" y="79">13</text>
    <text x="190" y="292">d = 2</text><text x="330" y="292">d = 3</text><text x="470" y="292">d = 5</text><text x="610" y="292">d = 7</text>
  </g>
  <rect x="180" y="313" width="14" height="14" fill="#267c92"/><text x="200" y="325" font-family="sans-serif" font-size="12">minimum genus g = d: 1, 2, 1, 1</text>
  <rect x="475" y="313" width="14" height="14" fill="#ef8f57"/><text x="495" y="325" font-family="sans-serif" font-size="12">higher genus: 3, 6, 10, 12</text>
</svg>
