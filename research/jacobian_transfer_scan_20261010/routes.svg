<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="white"/>
  <text x="490" y="28" text-anchor="middle" font-size="17" font-weight="bold">Jacobian transfer routes the scan enumerates, by field of the source curve E</text>
  <text x="490" y="48" text-anchor="middle" fill="#444">solid edge: route is exact on this curve (geometry computed) · dashed: construction family, not exercised · dotted: existence open or heuristic</text>

  <!-- Source boxes -->
  <g>
    <rect x="30" y="90" width="260" height="60" rx="8" fill="#fde0dd" stroke="#d62728" stroke-width="2"/>
    <text x="160" y="115" text-anchor="middle" font-weight="bold">E / GF(2^N), N = n·l</text>
    <text x="160" y="135" text-anchor="middle">binary, koblitz, subfield families (136 curves)</text>

    <rect x="360" y="90" width="260" height="60" rx="8" fill="#deebf7" stroke="#1f77b4" stroke-width="2"/>
    <text x="490" y="115" text-anchor="middle" font-weight="bold">E / GF(p)</text>
    <text x="490" y="135" text-anchor="middle">prime family (176 curves)</text>

    <rect x="690" y="90" width="260" height="60" rx="8" fill="#fee6ce" stroke="#ff7f0e" stroke-width="2"/>
    <text x="820" y="115" text-anchor="middle" font-weight="bold">E / GF(p^k), k ≥ 2</text>
    <text x="820" y="135" text-anchor="middle">extension family (9 curves)</text>
  </g>

  <!-- Binary destinations -->
  <g stroke="#d62728" stroke-width="2" fill="none">
    <line x1="90" y1="150" x2="70" y2="230"/>
    <line x1="160" y1="150" x2="160" y2="230" stroke-dasharray="2 4"/>
    <line x1="240" y1="150" x2="260" y2="230" stroke-dasharray="7 4"/>
  </g>
  <g>
    <rect x="10" y="230" width="120" height="96" rx="6" fill="#fff5f4" stroke="#d62728"/>
    <text x="70" y="250" text-anchor="middle" font-weight="bold">GHS descent</text>
    <text x="70" y="268" text-anchor="middle" font-size="11">Jac(C) / GF(2^l)</text>
    <text x="70" y="284" text-anchor="middle" font-size="11">g = 2^(m−1) [−1]</text>
    <text x="70" y="300" text-anchor="middle" font-size="11">m = Hess magic number</text>
    <text x="70" y="316" text-anchor="middle" font-size="11">exact, every l | N</text>

    <rect x="100" y="340" width="120" height="96" rx="6" fill="#fff5f4" stroke="#d62728" stroke-dasharray="2 4"/>
    <text x="160" y="360" text-anchor="middle" font-weight="bold">isogeny extension</text>
    <text x="160" y="378" text-anchor="middle" font-size="11">E ~ E′ with m′ ≤ d+1</text>
    <text x="160" y="394" text-anchor="middle" font-size="11">then GHS on E′</text>
    <text x="160" y="410" text-anchor="middle" font-size="11">census of √b′ exact;</text>
    <text x="160" y="426" text-anchor="middle" font-size="11">class membership heuristic</text>

    <rect x="200" y="230" width="120" height="96" rx="6" fill="#fff5f4" stroke="#d62728" stroke-dasharray="7 4"/>
    <text x="260" y="250" text-anchor="middle" font-weight="bold">same-field cover</text>
    <text x="260" y="268" text-anchor="middle" font-size="11">H → E, degree 3</text>
    <text x="260" y="284" text-anchor="middle" font-size="11">Jac(H) / GF(2^N), g = 3</text>
    <text x="260" y="300" text-anchor="middle" font-size="11">COVERS.md construction</text>
    <text x="260" y="316" text-anchor="middle" font-size="11">q^(4/3) ≥ √q: boundary</text>
  </g>
  <line x1="160" y1="150" x2="160" y2="340" stroke="#d62728" stroke-width="2" stroke-dasharray="2 4"/>

  <!-- Prime destinations -->
  <g stroke="#1f77b4" stroke-width="2" fill="none">
    <line x1="430" y1="150" x2="410" y2="230" stroke-dasharray="7 4"/>
    <line x1="550" y1="150" x2="570" y2="230" stroke-dasharray="2 4"/>
  </g>
  <g>
    <rect x="350" y="230" width="120" height="96" rx="6" fill="#f3f8fd" stroke="#1f77b4" stroke-dasharray="7 4"/>
    <text x="410" y="250" text-anchor="middle" font-weight="bold">same-field cover</text>
    <text x="410" y="268" text-anchor="middle" font-size="11">H → E, degree 2</text>
    <text x="410" y="284" text-anchor="middle" font-size="11">Jac(H) / GF(p), g = 2</text>
    <text x="410" y="300" text-anchor="middle" font-size="11">COVERS.md construction</text>
    <text x="410" y="316" text-anchor="middle" font-size="11">q ≥ √q: boundary</text>

    <rect x="510" y="230" width="120" height="96" rx="6" fill="#f3f8fd" stroke="#1f77b4" stroke-dasharray="2 4"/>
    <text x="570" y="250" text-anchor="middle" font-weight="bold">base change + descent</text>
    <text x="570" y="268" text-anchor="middle" font-size="11">E / GF(p^k) → C / GF(p)</text>
    <text x="570" y="284" text-anchor="middle" font-size="11">g ≥ k, priced at g = k</text>
    <text x="570" y="300" text-anchor="middle" font-size="11">existence open</text>
    <text x="570" y="316" text-anchor="middle" font-size="11">p^(2−2/k) ≥ √p: boundary</text>
  </g>

  <!-- Extension destinations -->
  <g stroke="#ff7f0e" stroke-width="2" fill="none">
    <line x1="760" y1="150" x2="740" y2="230" stroke-dasharray="7 4"/>
    <line x1="880" y1="150" x2="900" y2="230" stroke-dasharray="2 4"/>
  </g>
  <g>
    <rect x="680" y="230" width="120" height="96" rx="6" fill="#fff8f0" stroke="#ff7f0e" stroke-dasharray="7 4"/>
    <text x="740" y="250" text-anchor="middle" font-weight="bold">Gaudry–Diem IC</text>
    <text x="740" y="268" text-anchor="middle" font-size="11">on E(GF(p^k)) itself</text>
    <text x="740" y="284" text-anchor="middle" font-size="11">factor base from GF(p)</text>
    <text x="740" y="300" text-anchor="middle" font-size="11">p^(2−2/k) · 2^(k(k−1))</text>
    <text x="740" y="316" text-anchor="middle" font-size="11">no transfer map</text>

    <rect x="840" y="230" width="120" height="96" rx="6" fill="#fff8f0" stroke="#ff7f0e" stroke-dasharray="2 4"/>
    <text x="900" y="250" text-anchor="middle" font-weight="bold">cover descent</text>
    <text x="900" y="268" text-anchor="middle" font-size="11">C / GF(p) → E / GF(p^k)</text>
    <text x="900" y="284" text-anchor="middle" font-size="11">g ≥ k, priced at g = k</text>
    <text x="900" y="300" text-anchor="middle" font-size="11">signal: #E even (2-torsion)</text>
    <text x="900" y="316" text-anchor="middle" font-size="11">existence open</text>
  </g>

  <!-- Pricing box -->
  <rect x="330" y="360" width="620" height="130" rx="8" fill="#f7f7f7" stroke="#555"/>
  <text x="640" y="382" text-anchor="middle" font-weight="bold">One unit, one reference (cost.rs)</text>
  <text x="345" y="404" font-size="12">destination = min( rho on Jac: √(πr/4)·10g²·M(q′) , hyperelliptic IC: g²·q′^(2−2/g)·10g²·M(q′) , Enge–Gaudry: L_{q′^g}(1/2, √2)·10g²·M(q′) )</text>
  <text x="345" y="424" font-size="12">reference = √(πr/4) · 10 · M(q),   M(w bits) = w^1.585,   total = search + transfer + destination (log-sum)</text>
  <text x="345" y="444" font-size="12">ratio_log2 = log2(reference) − log2(total);   formula_advantage iff ratio ≥ 8 bits and the Jacobian can carry r (g·log2 q′ + 1 ≥ log2 r)</text>
  <text x="345" y="464" font-size="12">formula_marginal iff 0 &lt; ratio &lt; 8 (exponents favour it, constants decide);  boundary iff at or above rho;  not_carried iff too small or E over the subfield (m ≤ 1)</text>
  <text x="345" y="482" font-size="11" fill="#555">Every row is a formula under these constants. A formula_advantage row is a lead with open obligations (map, subgroup action, relations, measurement), never a speedup.</text>

  <!-- Arrows from destinations to pricing -->
  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="70" y1="326" x2="330" y2="420"/>
    <line x1="260" y1="326" x2="330" y2="400"/>
    <line x1="160" y1="436" x2="330" y2="450"/>
    <line x1="410" y1="326" x2="420" y2="360"/>
    <line x1="570" y1="326" x2="580" y2="360"/>
    <line x1="740" y1="326" x2="720" y2="360"/>
    <line x1="900" y1="326" x2="860" y2="360"/>
  </g>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>

  <!-- Automation strip -->
  <rect x="30" y="520" width="920" height="80" rx="8" fill="#eef7ee" stroke="#2ca02c"/>
  <text x="490" y="542" text-anchor="middle" font-weight="bold">Automation: docs/curves/registry.json → jacobian_transfers build → docs/curves/jacobian-transfers.json → table into JACOBIAN_TRANSFERS.md → chart</text>
  <text x="490" y="562" text-anchor="middle" font-size="12">CI (.github/workflows/jacobian-transfers.yml): `check` rebuilds and diffs on every PR touching the registry or the screen, on push to main, weekly, and on dispatch</text>
  <text x="490" y="582" text-anchor="middle" font-size="12">a registered curve that has not been screened, an edited row, or a parameter change without a regenerated file fails the build</text>
</svg>
