<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Degree-83 prebuilt factor-base lifecycle">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: sans-serif; fill: #172554; }
    .title { font-size: 20px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12px; fill: #334155; }
    .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 12; }
    .pending { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 12; }
    .edge { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <text class="title" x="22" y="32">Prebuild once; verify and account for every use</text>
  <rect class="box" x="22" y="72" width="164" height="112"/>
  <text class="label" x="36" y="106">Public recipe</text>
  <text class="small" x="36" y="130">curve + subgroup</text>
  <text class="small" x="36" y="150">seed or source space</text>
  <path class="edge" d="M186,128 H222"/>
  <rect class="box" x="224" y="72" width="184" height="112"/>
  <text class="label" x="238" y="106">Construct points</text>
  <text class="small" x="238" y="130">project to subgroup</text>
  <text class="small" x="238" y="150">close under π and ±</text>
  <path class="edge" d="M408,128 H444"/>
  <rect class="box" x="446" y="72" width="164" height="112"/>
  <text class="label" x="460" y="106">Retained object</text>
  <text class="small" x="460" y="130">K orbit columns</text>
  <text class="small" x="460" y="150">166K labeled points</text>
  <path class="edge" d="M610,128 H646"/>
  <rect class="box" x="648" y="72" width="150" height="112"/>
  <text class="label" x="662" y="106">Checked import</text>
  <text class="small" x="662" y="130">hash + point replay</text>
  <text class="small" x="662" y="150">per-run cost</text>
  <path class="edge" d="M798,128 H834"/>
  <rect class="pending" x="836" y="72" width="142" height="112"/>
  <text class="label" x="850" y="106">Relation oracle</text>
  <text class="small" x="850" y="130">m = 2, 3, 4</text>
  <text class="small" x="850" y="150">yield + rank open</text>
  <text class="small" x="22" y="232">Blue: constructed and replayable in the archived primary-curve panel. Orange: natural performance still requires a matched run.</text>
  <text class="small" x="22" y="251">Curve: icv1-f2m83-tm6151469093347-debefd74. π is Frobenius; ± is point negation.</text>
</svg>
