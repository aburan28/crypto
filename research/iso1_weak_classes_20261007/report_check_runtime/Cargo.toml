[package]
name = "iso1-report-check-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "crypto_lib"
path = "lib.rs"

[[bin]]
name = "iso1_report_check"
path = "../../../examples/iso1_report_check.rs"

[[bin]]
name = "iso1_theorem_check"
path = "../../../examples/iso1_theorem_check.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
