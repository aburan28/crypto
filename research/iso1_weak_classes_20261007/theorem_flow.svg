<g font-size="18" font-weight="bold"><text x="45" y="120">λ = α^q / α ∈ T</text><text x="382" y="120">Rational 2-isogeny</text><text x="719" y="120">Full rational 4-torsion</text></g>
<g font-size="16"><text x="45" y="153">|T| is odd ⇒ λ = μ⁴</text><text x="45" y="181">L_λ: y² = x(x−1)(x−λ)</text><text x="382" y="153">Kernel: O and (0,0)</text><text x="382" y="181">Target root differences square</text><text x="719" y="153">16 divides one twist order</text><text x="719" y="181">Ordinary ⇒ 4 divides f_π</text></g>
