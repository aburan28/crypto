<text x="28" y="240" font-size="16">Theorem applies at every size; independent of the census point counter.</text>
<text x="45" y="301" font-size="19" font-weight="bold">Cubic extension q = p²: exact absolute-Frobenius quotient</text>
<text x="45" y="334" font-size="17">λ ↦ λ^p and λ ↦ λ⁻¹ preserve the trace pair. Orbit sizes: 2, 6, 12.</text>
