[package]
name = "iso1-census-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "crypto_lib"
path = "src/lib.rs"

[[bin]]
name = "iso1_class_census"
path = "../../../examples/iso1_class_census.rs"

[[bin]]
name = "iso1_census_audit"
