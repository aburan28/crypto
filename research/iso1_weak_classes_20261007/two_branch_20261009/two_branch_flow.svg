<svg xmlns='http://www.w3.org/2000/svg' width='1400' height='700' viewBox='0 0 1400 700'><rect width='1400' height='700' fill='white'/><style>text{font-family:Arial,sans-serif;fill:#203047}.box{fill:#eef4fa;stroke:#537498;stroke-width:2}.arrow{fill:none;stroke:#537498;stroke-width:3}</style><text x='45' y='48' font-size='28'>Exact class support and verified construction</text><rect class='box' x='45' y='90' width='600' height='190' rx='12'/><text x='70' y='128' font-size='23'>Cubic / split-quadratic branch</text><text x='70' y='170' font-size='21'>Norm-one torus: N+ = p^4 + p^2 + 1</text><text x='70' y='210' font-size='21'>2-quotient has full rational 4-torsion</text><text x='70' y='250' font-size='21'>Selected CM orders: c divides f_pi / 4</text><rect class='box' x='730' y='90' width='625' height='190' rx='12'/><text x='755' y='128' font-size='23'>Nonsplit-quadratic branch</text><text x='755' y='170' font-size='21'>Alternating torus: N- = p^4 - p^2 + 1</text><text x='755' y='210' font-size='21'>One rational nonidentity 2-torsion point</text><text x='755' y='250' font-size='21'>Selected CM orders: v2(c) = v2(f_pi)</text><path class='arrow' d='M345 280V330H700 M1040 280V330H700V370'/><rect class='box' x='260' y='370' width='875' height='95' rx='12'/><text x='290' y='408' font-size='23'>Exact union: either torus / CM intersection is nonempty</text><text x='290' y='445' font-size='19'>Membership is certified separately from the route to that representative</text><path class='arrow' d='M700 465V515'/><rect class='box' x='100' y='515' width='1200' height='110' rx='12'/><text x='130' y='553' font-size='22'>Independent source - rational kernel maps - literal cubic or quartic model</text><text x='130' y='590' font-size='20'>Every retained edge and endpoint replayed; capped searches retain unresolved labels</text></svg>
