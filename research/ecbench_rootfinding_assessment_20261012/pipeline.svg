<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300"><rect width="1120" height="300" fill="white"/><text x="28" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#101828">Where the replacement acts</text><g font-family="Arial, sans-serif" font-size="16" text-anchor="middle"><rect x="25" y="90" width="160" height="74" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="105" y="120">Build factor base</text><text x="105" y="144" font-size="13">reusable setup</text><rect x="230" y="90" width="180" height="74" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="320" y="120">Build pair table</text><text x="320" y="144" font-size="13">optional, O(N²)</text><rect x="455" y="90" width="160" height="74" rx="8" fill="#ccfbf1" stroke="#0f766e"/><text x="535" y="120">Target queries</text><text x="535" y="144" font-size="13">relation trials</text><rect x="660" y="90" width="160" height="74" rx="8" fill="#ccfbf1" stroke="#0f766e"/><text x="740" y="120">Decompose</text><text x="740" y="144" font-size="13">subtract / probe</text><rect x="865" y="90" width="220" height="74" rx="8" fill="#ccfbf1" stroke="#0f766e"/><text x="975" y="120">Matrix + verification</text><text x="975" y="144" font-size="13">recovered scalar checked</text></g><g fill="none" stroke="#667085" stroke-width="3"><path d="M185 127H230M410 127H455M615 127H660M820 127H865"/></g><g fill="#667085"><path d="M226 121l8 6-8 6M451 121l8 6-8 6M656 121l8 6-8 6M861 121l8 6-8 6"/></g><text x="28" y="215" font-family="Arial, sans-serif" font-size="16" fill="#344054">Cold cost charges every box once per target. Reusable setup can be amortized only over a declared number of targets.</text><text x="28" y="248" font-family="Arial, sans-serif" font-size="16" fill="#344054">The paper changes the decomposition box; relation yield and matrix work do not disappear.</text></svg>