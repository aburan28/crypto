[package]
name = "hundred-prime-isogeny-report"
version = "0.1.0"
edition = "2021"
[workspace]
[[bin]]
name = "hundred-report"
path = "report.rs"
test = false
[[bin]]
name = "walk-controls"
path = "walk_controls.rs"
test = false
[[bin]]
name = "hundred-audit"
path = "audit.rs"
test = false

[dependencies]
num-bigint = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
