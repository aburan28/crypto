<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="Signed base support rises from 224 to 1344 accepted targets while the logarithm columns remain 16">
  <rect width="760" height="360" fill="#f9fafb"/>
  <text x="34" y="43" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172554">P-192 Type I: sign closure of a fixed base</text>
  <text x="34" y="69" font-family="Arial,sans-serif" font-size="14" fill="#475569">Exact quotient three-sum census · same two-character query law</text>
  <text x="34" y="117" font-family="Arial,sans-serif" font-size="16" fill="#1e293b">Positive base (16 classes)</text>
  <rect x="255" y="100" width="74" height="23" fill="#94a3b8"/>
  <text x="340" y="118" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">816 distinct; 224 accepted</text>
  <text x="34" y="175" font-family="Arial,sans-serif" font-size="16" fill="#1e293b">Signed base (32 classes)</text>
  <rect x="255" y="158" width="500" height="23" fill="#2563eb"/>
  <text x="255" y="205" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">5,504 distinct; 1,344 accepted (6× accepted support)</text>
  <line x1="34" y1="233" x2="726" y2="233" stroke="#cbd5e1"/>
  <text x="34" y="269" font-family="Arial,sans-serif" font-size="16" fill="#172554">Logarithm columns: 16 → 16</text>
  <text x="34" y="298" font-family="Arial,sans-serif" font-size="14" fill="#475569">64 frozen accepted scalar queries: 0 matches under either base</text>
  <text x="34" y="326" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Bars show all distinct support, scaled to 5,504. Accepted counts are labels, not bar lengths.</text>
</svg>
