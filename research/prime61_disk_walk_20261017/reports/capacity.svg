<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><rect width="1000" height="650" fill="#f8fafc"/><g font-family="DejaVu Sans,sans-serif" fill="#16304a"><text x="28" y="35" font-size="25" font-weight="bold">Disk-backed prime61 walk: checkpointed capacity pilot</text><text x="28" y="62" font-size="15">2026-10-17 • single native worker • three cumulative checkpoints • full class still open</text><rect x="28" y="82" width="944" height="82" rx="7" fill="#e1edf5"/><text x="45" y="112" font-size="17" font-weight="bold">One source in RAM → SQLite frontier / witnesses / runs → compressed snapshot → Drive</text><text x="45" y="143" font-size="15">Atomic expansion and run commits; exact j deduplication; hash-checked restore and resume.</text><text x="28" y="200" font-size="18" font-weight="bold">Discovered curves (count)</text><text x="528" y="200" font-size="18" font-weight="bold">Expansion-process peak RSS (KiB)</text><text x="28" y="242" font-size="14">1 expanded</text><rect x="145" y="225" width="17" height="24" fill="#367ba5"/><text x="170" y="242" font-size="14">16</text><text x="528" y="242" font-size="14">1 expanded</text><rect x="650" y="225" width="212" height="24" fill="#638c72"/><text x="905" y="242" font-size="14">18464</text><text x="28" y="318" font-size="14">8 expanded</text><rect x="145" y="301" width="107" height="24" fill="#367ba5"/><text x="260" y="318" font-size="14">96</text><text x="528" y="318" font-size="14">8 expanded</text><rect x="650" y="301" width="211" height="24" fill="#638c72"/><text x="905" y="318" font-size="14">18400</text><text x="28" y="394" font-size="14">32 expanded</text><rect x="145" y="377" width="280" height="24" fill="#367ba5"/><text x="433" y="394" font-size="14">250</text><text x="528" y="394" font-size="14">32 expanded</text><rect x="650" y="377" width="211" height="24" fill="#638c72"/><text x="905" y="394" font-size="14">18400</text><text x="28" y="469" font-size="14">32 expanded • 250 discovered • 480 verified edges • 218 pending • 0 failures</text><rect x="28" y="494" width="944" height="86" rx="7" fill="#fff0d1"/><text x="44" y="522" font-size="17" font-weight="bold">64 measured curves × 12 streams = 768 capped runs</text><text x="44" y="549" font-size="15">76,800,000 target trials • 0 relations • 0 solves • peak worker RSS across phases: 18464 KiB</text><text x="28" y="608" font-size="13">Capacity diagnostics, not a speedup comparison. SQLite retains the graph on disk; disk use still grows.</text><text x="28" y="633" font-size="12">Sources: results/pilot/expand-*.stdout and final-status.stdout; restore control and native baseline audit.</text></g></svg>