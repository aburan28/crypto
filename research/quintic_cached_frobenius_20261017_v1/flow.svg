<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420"><style>text{font-family:sans-serif;fill:#17334a}.box{fill:#eef4f8;stroke:#446a83;stroke-width:2}.arr{stroke:#446a83;stroke-width:2;fill:none}</style>
<text x="26" y="32" font-size="23">Proposed cached quintic support step — no measured result</text>
<rect class="box" x="25" y="65" width="300" height="100" rx="8"/><text x="42" y="94" font-size="17">Fixed field/basis + monic H</text><text x="42" y="120" font-size="16">Cache X^6 mod H and X^8 mod H</text><text x="42" y="145" font-size="16">At most15M setup in the stated model</text>
<path class="arr" d="M325 115H385"/><rect class="box" x="385" y="65" width="300" height="100" rx="8"/><text x="400" y="94" font-size="17">F(r)=sum r_i^2 * X^(2i) mod H</text><text x="400" y="120" font-size="16">Square coefficients in K</text><text x="400" y="145" font-size="16">5S+10M per cached square</text>
<path class="arr" d="M685 115H735"/><rect class="box" x="735" y="65" width="280" height="100" rx="8"/><text x="750" y="94" font-size="17">18 recurrence steps</text><text x="750" y="120" font-size="16">r &lt;- F(r) + beta_i*r</text><text x="750" y="145" font-size="16">Exact for repeated H too</text>
<path class="arr" d="M875 165V215H535V250"/><rect class="box" x="385" y="250" width="400" height="110" rx="8"/><text x="402" y="278" font-size="17">r=0: accept domain support</text><text x="402" y="305" font-size="16">r!=0 and H squarefree: reject</text><text x="402" y="333" font-size="16">Otherwise retain exact r^8=0 test</text>
<text x="25" y="224" font-size="17">Counterexample guard:</text><text x="25" y="250" font-size="16">GF4: omega^2=omega+1.</text><text x="25" y="276" font-size="16">F is not K-linear.</text>
<text x="25" y="395" font-size="16">Boundary: supplied-quintic support only. Search, all-root extraction and qualified8x F4/F5/F6 comparison remain open.</text></svg>
