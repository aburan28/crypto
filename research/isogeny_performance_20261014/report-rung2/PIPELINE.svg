<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160"><rect width="900" height="160" fill="white"/><g font-family="Arial,sans-serif" font-size="16" fill="#17324d"><text x="15" y="24">Same public inputs and constructor boundary for each algorithm revision</text><g fill="#e7f2ef" stroke="#238779"><rect x="15" y="45" width="185" height="75"/><rect x="240" y="45" width="185" height="75"/><rect x="465" y="45" width="185" height="75"/><rect x="690" y="45" width="195" height="75"/></g><text x="25" y="73">Frozen E, E', degree</text><text x="25" y="100">Sigma when required</text><text x="250" y="73">Baseline / candidate</text><text x="250" y="100">Separate field counts</text><text x="475" y="73">Exact map fingerprint</text><text x="475" y="100">Kohel + transports</text><text x="700" y="73">A/A, then interleaved</text><text x="700" y="100">A/B + Linux isolation</text><text x="205" y="87">→</text><text x="430" y="87">→</text><text x="655" y="87">→</text><text x="15" y="146">Timing qualification comes from the native isolation receipt; counts do not establish whole-search time.</text></g></svg>