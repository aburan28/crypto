<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="sans-serif">
<title>EC kernels against the thin-product gates, and the entry-size plane</title>
<rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>
<text x="20" y="28" font-size="17" font-weight="bold">No EC kernel reaches size: every block sits at shape or ring</text>
<text x="20" y="48" font-size="12" fill="#444">Left: kernel funnel. Right: the (N, entry-size) plane -- our kernels sit hundreds of bits above the feasible wedge.</text>
<rect x="20" y="70" width="340" height="150" rx="8" fill="#ffebee" stroke="#c62828"/>
<text x="30" y="94" font-size="12" font-weight="bold">SHAPE: many wants, one thin middle?</text>
<text x="30" y="116" font-size="11">point formulas: O(1), no N</text>
<text x="30" y="136" font-size="11">scalar mul: sequential, no middle</text>
<text x="30" y="156" font-size="11">IPA ab: ONE pair, |W|=1</text>
<text x="30" y="176" font-size="11">transforms: single RHS</text>
<rect x="20" y="240" width="340" height="150" rx="8" fill="#fff8e1" stroke="#f9a825"/>
<text x="30" y="264" font-size="12" font-weight="bold">RING: small-integer products?</text>
<text x="30" y="286" font-size="11">MSM / IPA-G: group ACTIONS</text>
<text x="30" y="306" font-size="11">256-bit mod-p scalars</text>
<text x="30" y="326" font-size="11">identity cannot act on points</text>
<text x="30" y="346" font-size="11">encoding explodes on 256-bit entries</text>
<rect x="20" y="410" width="340" height="150" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="30" y="434" font-size="12" font-weight="bold">SIZE: inside the envelope?</text>
<text x="30" y="456" font-size="11">nothing arrives here</text>
<text x="30" y="476" font-size="11">widest row eps 0.114 unused</text>
<text x="30" y="496" font-size="11">cf. round 4: size never binds</text>
<line x1="180" y1="220" x2="180" y2="240" stroke="#333" stroke-width="1.5"/>
<polygon points="174,240 186,240 180,250" fill="#333"/>
<line x1="180" y1="390" x2="180" y2="410" stroke="#333" stroke-width="1.5"/>
<polygon points="174,410 186,410 180,420" fill="#333"/>
<text x="20" y="600" font-size="11" fill="#333">One-shot bound: |W|=1 cannot amortize preprocessing (must read D entries; naive costs D).</text>
<text x="20" y="622" font-size="11" fill="#333">Revisit hook: a kernel that IS many small-integer inner products over one thin middle earns a measurement protocol.</text>
<polygon points="430,459 430,459 460,448 490,437 520,427 550,416 580,405 610,394 640,383 670,372 700,361 730,351 760,340 790,329 820,318 850,307 880,296 910,285 940,275 970,264 1000,253 1030,242 1060,231 1090,220 1120,209 1150,199 1150,470 430,470" fill="#e8f5e9"/>
<text x="820.0" y="358" font-size="11" fill="#2e7d32">feasible wedge (schematic): entry bits O(log N)</text>
<line x1="430" y1="470" x2="1150" y2="470" stroke="#333"/>
<line x1="430" y1="90" x2="430" y2="470" stroke="#333"/>
<text x="422" y="490" font-size="11">2^0</text>
<text x="542" y="490" font-size="11">2^4</text>
<text x="662" y="490" font-size="11">2^8</text>
<text x="782" y="490" font-size="11">2^12</text>
<text x="902" y="490" font-size="11">2^16</text>
<text x="1022" y="490" font-size="11">2^20</text>
<text x="1142" y="490" font-size="11">2^24</text>
<text x="1090" y="508" font-size="11">N (batch size)</text>
<text x="396" y="474" font-size="11">0b</text>
<text x="396" y="387" font-size="11">64b</text>
<text x="396" y="300" font-size="11">128b</text>
<text x="396" y="213" font-size="11">192b</text>
<text x="396" y="127" font-size="11">256b</text>
<text x="386" y="80" font-size="11">entry bits</text>
<circle cx="430" cy="123" r="5" fill="#c62828"/>
<text x="440" y="115" font-size="11" fill="#c62828">point formulas (N=1)</text>
<circle cx="430" cy="131" r="5" fill="#c62828"/>
<text x="440" y="123" font-size="11" fill="#c62828">IPA scalars (N=1)</text>
<circle cx="730" cy="123" r="5" fill="#c62828"/>
<text x="740" y="115" font-size="11" fill="#c62828">batch-1000 (still 256-bit)</text>
<circle cx="1030" cy="123" r="5" fill="#c62828"/>
<text x="1040" y="115" font-size="11" fill="#c62828">batch-1M (still 256-bit)</text>
<text x="730.0" y="266" font-size="11" fill="#333">Every kernel sits ~250 bits above the wedge;</text>
<text x="730.0" y="284" font-size="11" fill="#333">growing N never narrows the gap (field size fixed).</text>
<text x="430" y="560" font-size="11" fill="#666">Right panel is a schematic from stated bounds (256-bit scalars; N^O(1) entry rule), not measurements. Editable source: figure.mmd.</text>
</svg>
