[package]
name = "isogeny_algos"
version = "0.1.0"
edition = "2021"
description = "Baseline implementations of isogeny-computation algorithms (Velu, Kohel, sqrt-Velu, Elkies/BMSS, Galbraith, GHS, Couveignes, Delfs-Galbraith) with a benchmark harness"

# Standalone crate: keep it out of any parent workspace.
[workspace]

[lints.clippy]
# Index-heavy polynomial and matrix code reads more directly with explicit indices, and the
# isogeny formulas take many curve parameters; the repository's other crates allow the same.
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
opt-level = 3
debug = false
