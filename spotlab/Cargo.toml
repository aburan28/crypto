[package]
name = "spotlab"
version = "0.1.0"
edition = "2021"
description = "Run checkpointing experiments on the cheapest AWS or GCP spot capacity, resuming across preemptions"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "spotlab"
path = "src/main.rs"

[dependencies]
anyhow = "1"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
