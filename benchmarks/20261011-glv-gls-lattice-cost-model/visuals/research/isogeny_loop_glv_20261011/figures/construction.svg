   <g id="text_1">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(63.015903 66.766713)">E / F_p</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(40.297247 75.888791)">CM by O_K, trace t</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(37.944216 85.04412)">4p = t^2 + |D| v^2</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(233.250344 66.783635)">loop of horizontal</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(220.117781 75.905713)">l-isogenies on the crater</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(215.475844 85.027791)">alpha in O_K, deg N(alpha)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(421.13519 66.783932)">eigenvalue on E'[r]</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(416.69394 75.90601)">lambda = (A + B s)/2</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(428.104628 85.027495)">s = (2 mu - t)/v</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(53.404278 180.94468)">E' / F_(p^2)</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(47.19306 190.066759)">quadratic twist</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(25.14356 199.188837)">#E' = (p-1)^2 + t^2 = h r</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(219.3655 180.944977)">psi = phi o pi_p o phi^-1</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(245.961938 190.067055)">psi^2 = -1</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(230.338 199.189134)">mu = (p-1)/t mod r</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(433.17644 180.944977)">4-dim lattice</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(409.371222 190.067055)">k0 + k1 mu + k2 lambda</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(404.981034 199.189134)">+ k3 lambda mu = 0 mod r</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #52514e" x="171.005264" y="66.769813" transform="rotate(-0 171.005264 66.769813)">cheapest loop</text>
   </g>
   <g id="text_8">
    <text style="font-style: italic; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #52514e" x="171.005264" y="84.425911" transform="rotate(-0 171.005264 84.425911)">certified, native</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #52514e" x="361.794736" y="66.769813" transform="rotate(-0 361.794736 66.769813)">ring map</text>
   </g>
   <g id="text_10">
    <text style="font-style: italic; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #52514e" x="361.794736" y="84.425911" transform="rotate(-0 361.794736 84.425911)">derived, asserted</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #52514e" x="171.005264" y="180.931155" transform="rotate(-0 171.005264 180.931155)">GLS map</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #52514e" x="361.794736" y="180.931155" transform="rotate(-0 361.794736 180.931155)">with lambda</text>
   </g>
   <g id="text_13">
    <text style="font-style: italic; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #52514e" x="361.794736" y="198.587253" transform="rotate(-0 361.794736 198.587253)">LLL, native</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="80.440642" y="132.830502" transform="rotate(-0 80.440642 132.830502)">twist phi</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(96.231375 250.714114)">alpha' = phi o alpha o phi^-1 is F_(p^2)-rational. Its action on points of a constructed E' is not</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(59.256 259.356083)">validated here (no curve is built): the eigenvalue lambda is derived from the ring map, status 'not point-validated'.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="10.404" y="16.558594" transform="rotate(-0 10.404 16.558594)">GLV-GLS with an isogeny-loop endomorphism: what is computed and what is only derived</text>
   </g>
  </g>
 </g>
