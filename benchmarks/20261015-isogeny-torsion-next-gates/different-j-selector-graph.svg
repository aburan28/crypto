<title id="title">SCREEN_V1 different-j isogeny candidate</title>
<desc id="desc">At p=61 the subgroup predicate rejected the curve; at p=67 a rational order-three kernel produced a degree-three candidate map between curves of j 7 and 11, checked on 64 samples.</desc>
