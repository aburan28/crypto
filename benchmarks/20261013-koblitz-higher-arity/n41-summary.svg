  <text x="70" y="493" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#17243a">B. Same-cell isolated extraction wall (B2 = 1.00)</text>
  <line x1="275" y1="528" x2="1075" y2="528" stroke="#aeb7c4" stroke-width="1"/>
  <g font-family="DejaVu Sans" font-size="18" fill="#25334a"><text x="70" y="574">B2 quartic</text><text x="70" y="634">B3 chain</text></g>
  <rect x="275" y="550" width="760" height="32" rx="3" fill="#78909c"/>
  <rect x="275" y="610" width="118" height="32" rx="3" fill="#2c7a7b"/>
