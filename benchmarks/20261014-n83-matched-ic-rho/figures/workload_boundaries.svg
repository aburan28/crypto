   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142b45" x="18.24" y="25.155556" transform="rotate(-0 18.24 25.155556)">Measured process boundaries</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(176.334063 74.282438)">Inputs already available: exact public point(s) and retained K600 artifact</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(196.205938 86.620016)">Historical K600 selection / construction cost remains unavailable</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(57.122656 154.046284)">Fresh singleton</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(58.273672 165.150104)">1 public target</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(41.931641 176.253924)">8 pairs / 16 processes</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(266.871688 154.046284)">Once-only setup</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(243.5195 165.150104)">Parse, curve / basis, index,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(250.149266 176.253924)">rank / logs or rho jumps</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(510.103516 154.046284)">One complete target solve</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(502.303047 165.150104)">Q checks, attempts, recovery,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(497.246172 176.253924)">built-in verification, output / exit</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(39.754063 248.541099)">Genuine shared cohort</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(53.066328 259.644919)">32 public targets</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(54.46625 270.748739)">3 paired cohorts</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(266.871688 248.541099)">Once-only setup</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(246.628719 259.644919)">Both arms initialize once;</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(246.055672 270.748739)">all preparation is charged</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(508.751406 248.541099)">32 sequential target solves</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(489.038594 259.644919)">Fresh target-dependent state / seed</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #25354a" transform="translate(486.489766 270.748739)">No shared multi-target collision table</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a15d80" x="18.24" y="324.859259" transform="rotate(-0 18.24 324.859259)">Producer query timers are secondary: IC and rho Q-validation boundaries differ.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #5b6a7a" transform="translate(18.24 348.672769)">Outside both clocks: target generation, research / tuning, compilation, independent post-hoc audit.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #5b6a7a" transform="translate(18.24 360.118519)">Cold denotes a fresh process, not an OS-cache flush. Complete process costs lead this report.</text>
   </g>
  </g>
