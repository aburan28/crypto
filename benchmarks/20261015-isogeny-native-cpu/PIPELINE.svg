<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="150"><rect width="1100" height="150" fill="white"/><g font-family="Arial,sans-serif" fill="#17324d"><rect x="10" y="10" width="300" height="80" fill="#edf5fa" stroke="#6c91ac"/><text x="25" y="39" font-size="17">Frozen curves, codomains and sigma</text><text x="25" y="67" font-size="15">Setup / independent reference excluded</text><text x="330" y="60" font-size="24">→</text><rect x="370" y="10" width="310" height="80" fill="#edf5fa" stroke="#6c91ac"/><text x="385" y="39" font-size="17">Native constructor · 5 samples per run</text><text x="385" y="67" font-size="15">1 warm call; reserved guest CPU</text><text x="700" y="60" font-size="24">→</text><rect x="740" y="10" width="350" height="80" fill="#edf5fa" stroke="#6c91ac"/><text x="755" y="39" font-size="17">Exact map / kernel + point checks</text><text x="755" y="67" font-size="15">Verify outside timed interval; retain failures</text><text x="20" y="127" font-size="14">Every raw pair median, binary/source identity and isolation command rechecked. VM host neighbours/frequency unobserved.</text></g></svg>
