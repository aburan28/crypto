[package]
name = "backend-leaderboard"
version = "0.1.0"
edition = "2021"
publish = false
description = "Read-only native backend frontiers from sealed ecbench evidence"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[profile.release]
debug = 0
