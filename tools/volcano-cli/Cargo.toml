[package]
name = "volcano-cli"
version = "0.1.0"
edition = "2021"
publish = false
description = "Resumable ordinary prime-field isogeny-class enumeration"

[workspace]

[lib]
name = "volcano_cli"

[[bin]]
name = "isogeny-class"
path = "src/main.rs"

[dependencies]
isogeny_algos = { path = "../../isogeny_algos" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
