[package]
name = "gpu-rootfind-sys"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "FFI + native build of the GPU root-finding 2-decomposition oracle (gpu/rootfind/)"

# This crate exists so that the *root* crate has no build script.  Cargo
# fingerprints a package with a build script by walking every file under
# the package root; for the 80k-file repository root that walk fails on
# the CI runners (gix: "Failed to update the excludes stack", triggered by
# the tracked directory symlinks under .claude/skills/).  Scoped to this
# directory the walk is a handful of files.  The root crate pulls this in
# only through its optional `gpu-rootfind` feature, so the default build
# compiles no C++ and runs no build script at all.

[lib]
path = "src/lib.rs"

[build-dependencies]
cc = "1"
