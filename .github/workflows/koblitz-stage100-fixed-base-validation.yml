name: Koblitz Stage 100 n53 fixed-base validation

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage100_fixed_base_validation.py"
      - ".github/workflows/koblitz-stage100-fixed-base-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate fixed-base reference controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage100_fixed_base_validation.py
          python3 scripts/run_koblitz_stage100_fixed_base_validation.py self-test
          cargo test --release --example koblitz_rank_fixture
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-fixed-base-validation:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage100_fixed_base_validation.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage100-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare repeated and fixed-base reference validation
        run: |
          python3 scripts/run_koblitz_stage100_fixed_base_validation.py run \
            --build "$RUNNER_TEMP/stage100-build" \
            --output "$RUNNER_TEMP/stage100-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage100_fixed_base_validation.py verify \
            --build "$RUNNER_TEMP/stage100-build" \
            --output "$RUNNER_TEMP/stage100-run" \
            > "$RUNNER_TEMP/stage100-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage100-fixed-base-validation-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage100-build
            ${{ runner.temp }}/stage100-run
            ${{ runner.temp }}/stage100-verification.json
