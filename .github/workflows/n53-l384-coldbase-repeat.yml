name: n53 L384 cold-base matched repeat

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'research/sat_factor_base_review_20260908/autolab_combined_l384_coldbase_n53_20260925/**'
      - '.github/workflows/n53-l384-coldbase-repeat.yml'

permissions:
  contents: write

jobs:
  hash-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check frozen sources and inputs without opening outcome rows
        run: |
          python3 research/sat_factor_base_review_20260908/autolab_combined_l384_coldbase_n53_20260925/check_protocol.py
          git diff --check
      - name: Replay committed outcome only if an archive exists
        run: |
          bundle=research/sat_factor_base_review_20260908/autolab_combined_l384_coldbase_n53_20260925/evidence
          if test -f "$bundle/archive_manifest.json"; then
            python3 research/sat_factor_base_review_20260908/autolab_combined_l384_coldbase_n53_20260925/verify_archive.py --bundle "$bundle"
          fi

  outcome:
    if: github.event.action == 'labeled' && github.event.label.name == 'run-n53-coldbase-once' && github.event.pull_request.head.repo.full_name == github.repository
    needs: hash-only
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    concurrency:
      group: n53-l384-coldbase-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse held freeze and recheck source boundary
        env:
          KIC_L384_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin main
          python3 - <<'PY'
          import sys
          from pathlib import Path
          root = Path('research/sat_factor_base_review_20260908/autolab_combined_l384_coldbase_n53_20260925')
          sys.path.insert(0, str(root))
          import check_protocol
          check_protocol.preflight(require_release=True)
          print('released exact-source preflight PASS')
          PY
      - name: Refuse a moved PR head or an already archived outcome
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          STARTING_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$HEAD_BRANCH:refs/remotes/origin/$HEAD_BRANCH"
          test "$(git rev-parse "origin/$HEAD_BRANCH")" = "$STARTING_HEAD"
          test ! -e research/sat_factor_base_review_20260908/autolab_combined_l384_coldbase_n53_20260925/evidence/archive_manifest.json
      - name: Build both frozen producers
        run: |
          cp research/sat_factor_base_review_20260908/autolab_combined_l384_coldbase_n53_20260925/Cargo.lock Cargo.lock
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "$(sha256sum research/sat_factor_base_review_20260908/autolab_combined_l384_coldbase_n53_20260925/Cargo.lock | cut -d' ' -f1)"
          rustc --version | grep '^rustc 1.93.1 '
          cargo --version | grep '^cargo 1.93.1 '
          cargo build --locked --release --example koblitz_s5_sat_instance --example koblitz_rho_batch_ks
      - name: Record executable and toolchain hashes before measured work
        run: |
          sha256sum target/release/examples/koblitz_s5_sat_instance target/release/examples/koblitz_rho_batch_ks
          rustc --version
          cargo --version
      - name: Measure native base, 512 training, matched rho and 384 public Q
        env:
          KIC_L384_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 research/sat_factor_base_review_20260908/autolab_combined_l384_coldbase_n53_20260925/run_panel.py --out /tmp/n53-l384-coldbase-panel
      - name: Seal every attempted output, including failure and cap receipts
        if: always()
        run: |
          if test -d /tmp/n53-l384-coldbase-panel; then
            python3 research/sat_factor_base_review_20260908/autolab_combined_l384_coldbase_n53_20260925/archive.py \
              --panel /tmp/n53-l384-coldbase-panel --out /tmp/n53-l384-coldbase-sealed
          fi
      - name: Commit immutable evidence to the dispatch branch
        if: always()
        env:
          STARTING_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if ! test -f /tmp/n53-l384-coldbase-sealed/archive_manifest.json; then exit 0; fi
          git fetch origin "$HEAD_BRANCH:refs/remotes/origin/$HEAD_BRANCH"
          test "$(git rev-parse "origin/$HEAD_BRANCH")" = "$STARTING_HEAD"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          bundle=research/sat_factor_base_review_20260908/autolab_combined_l384_coldbase_n53_20260925/evidence
          mkdir -p "$bundle"
          test ! -e "$bundle/archive_manifest.json"
          cp /tmp/n53-l384-coldbase-sealed/evidence.tar.gz /tmp/n53-l384-coldbase-sealed/archive_manifest.json "$bundle/"
          if test -f /tmp/n53-l384-coldbase-sealed/panel.json; then cp /tmp/n53-l384-coldbase-sealed/panel.json "$bundle/"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$bundle"
          git commit -m 'research: preserve cold-base n53 L384 matched panel'
          git push origin "HEAD:$HEAD_BRANCH"
      - name: Upload raw attempts even if evidence commit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n53-l384-coldbase-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/n53-l384-coldbase-panel/
          if-no-files-found: warn
          retention-days: 30
