name: Paired n37 n41 full-rank controls

on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# PRs retain source, correctness and existing-evidence checks.
# Fresh timing panels and their result gates run only after merge or by manual dispatch.
jobs:
  clean-source-paired-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 30 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source pins pass live or from a committed snapshot, else fail closed
        run: python3 research/notes/ecc2k130/paired_fullrank_20260925/test_verify_committed.py -v
      - name: Validate committed clean panel if present
        run: |
          if test -f research/notes/ecc2k130/paired_fullrank_clean_evidence_20260925/clean_archive_manifest.json; then
            python3 research/notes/ecc2k130/paired_fullrank_20260925/verify_committed.py \
              --root . \
              --bundle research/notes/ecc2k130/paired_fullrank_clean_evidence_20260925
            echo "PANEL_ARCHIVED=1" >> "$GITHUB_ENV"
          fi
      - name: Build exact branch source
        if: github.event_name != 'pull_request' && (env.PANEL_ARCHIVED != '1')
        run: cargo build --release --example koblitz_rank_fixture --example koblitz_rho_fixture
      - name: Require clean source and pinned-main ancestry
        if: github.event_name != 'pull_request' && (env.PANEL_ARCHIVED != '1')
        run: |
          git rev-parse HEAD
          git status --porcelain
          test -z "$(git status --porcelain)"
          git cat-file -t 3bec69ca636cebc71f828a3035c49b8258e13f5f
          git merge-base --is-ancestor 3bec69ca636cebc71f828a3035c49b8258e13f5f HEAD
      - name: Run n37 pilot and holdouts
        if: github.event_name != 'pull_request' && (env.PANEL_ARCHIVED != '1')
        run: |
          python3 research/notes/ecc2k130/paired_fullrank_20260925/run.py --out /tmp/paired-panel/n37_seed0 --n 37 --seed-index 0
          python3 research/notes/ecc2k130/paired_fullrank_20260925/run.py --out /tmp/paired-panel/n37_seed1 --n 37 --seed-index 1
          python3 research/notes/ecc2k130/paired_fullrank_20260925/run.py --out /tmp/paired-panel/n37_seed2 --n 37 --seed-index 2
      - name: Run n41 pilot
        if: github.event_name != 'pull_request' && (env.PANEL_ARCHIVED != '1')
        run: python3 research/notes/ecc2k130/paired_fullrank_20260925/run.py --out /tmp/paired-panel/n41_seed0 --n 41 --seed-index 0
      - name: Enforce n41 pilot resource gate
        if: github.event_name != 'pull_request' && (env.PANEL_ARCHIVED != '1')
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/paired-panel/n41_seed0/manifest.json').read_text())
          assert report['replay_verdict'] == 'PASS'
          assert all(not arm['timed_out'] and arm['peak_rss_bytes'] < 2 * 1024**3 for arm in report['arms'])
          PY
      - name: Run n41 holdouts
        if: github.event_name != 'pull_request' && (env.PANEL_ARCHIVED != '1')
        run: |
          python3 research/notes/ecc2k130/paired_fullrank_20260925/run.py --out /tmp/paired-panel/n41_seed1 --n 41 --seed-index 1
          python3 research/notes/ecc2k130/paired_fullrank_20260925/run.py --out /tmp/paired-panel/n41_seed2 --n 41 --seed-index 2
      - name: Seal six clean-source replayed pairs
        if: github.event_name != 'pull_request' && (env.PANEL_ARCHIVED != '1')
        run: python3 research/notes/ecc2k130/paired_fullrank_20260925/archive.py --runs /tmp/paired-panel --out /tmp/paired-panel-sealed
      - name: Archive raw outputs including failures
        if: github.event_name != 'pull_request' && (always() && env.PANEL_ARCHIVED != '1')
        uses: actions/upload-artifact@v4
        with:
          name: paired-n37-n41-fullrank-${{ github.sha }}
          path: /tmp/paired-panel/
          if-no-files-found: warn
          retention-days: 30
