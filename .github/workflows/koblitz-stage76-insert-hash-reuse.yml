name: Koblitz Stage 76 n53 insert-hash reuse

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage76_insert_hash_reuse.py"
      - ".github/workflows/koblitz-stage76-insert-hash-reuse.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate insert-hash reuse controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage76_insert_hash_reuse.py
          python3 scripts/run_koblitz_stage76_insert_hash_reuse.py self-test
          cargo test --release --example koblitz_rank_fixture
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-insert-hash-reuse:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage76_insert_hash_reuse.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage76-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare recomputed hash, reused hash, and rho
        run: |
          python3 scripts/run_koblitz_stage76_insert_hash_reuse.py run \
            --build "$RUNNER_TEMP/stage76-build" \
            --output "$RUNNER_TEMP/stage76-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage76_insert_hash_reuse.py verify \
            --build "$RUNNER_TEMP/stage76-build" \
            --output "$RUNNER_TEMP/stage76-run" \
            > "$RUNNER_TEMP/stage76-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage76-insert-hash-reuse-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage76-build
            ${{ runner.temp }}/stage76-run
            ${{ runner.temp }}/stage76-verification.json
