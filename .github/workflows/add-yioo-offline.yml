name: Add yioo key offline

on:
  push:
    branches: [infra/durable-g7e-devhost]
    paths: ['.github/workflows/add-yioo-offline.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add-key:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      INSTANCE_ID: i-04b1d89ecccfcc808
      SUBNET_ID: subnet-0ffc4f0562edc244f
      SG_ID: sg-057bb9457c2b7173e
      YIOO_PUB_B64: c3NoLWVkMjU1MTkgQUFBQUMzTnphQzFsWkRJMU5URTVBQUFBSUlHSU5VWHdLRWk0c1oyVktmaGVYemF2S3R1ck9BcDNVKys1cHpRaVJCUUwgeWlvbw==
      YIOO_BLOB: AAAAC3NzaC1lZDI1NTE5AAAAIIGINUXwKEi4sZ2VKfheXzavKturOAp3U++5pzQiRBQL
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/durable-g7e-devhost
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Stop G7 and identify root volume
        run: |
          set -euo pipefail
          aws ec2 stop-instances --instance-ids "$INSTANCE_ID" >/dev/null
          aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
          root_dev=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].RootDeviceName' --output text)
          vol=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].BlockDeviceMappings[?DeviceName=='$root_dev'].Ebs.VolumeId | [0]" --output text)
          test -n "$vol" && test "$vol" != None
          echo "ROOT_DEVICE=$root_dev" >> "$GITHUB_ENV"
          echo "ROOT_VOLUME=$vol" >> "$GITHUB_ENV"
          echo "root=$root_dev volume=$vol"

      - name: Detach root volume
        run: |
          set -euo pipefail
          aws ec2 detach-volume --volume-id "$ROOT_VOLUME" >/dev/null
          aws ec2 wait volume-available --volume-ids "$ROOT_VOLUME"

      - name: Launch verifier helper
        run: |
          set -euo pipefail
          ami=$(aws ec2 describe-images --owners amazon \
            --filters 'Name=name,Values=al2023-ami-2023.*-x86_64' 'Name=state,Values=available' \
            --query 'reverse(sort_by(Images,&CreationDate))[0].ImageId' --output text)
          test -n "$ami" && test "$ami" != None
          cat > /tmp/helper-userdata.sh <<EOF
          #!/bin/bash
          exec >/dev/console 2>&1
          set +e
          TARGET_VOL="$ROOT_VOLUME"
          PUB_B64="$YIOO_PUB_B64"
          EXPECTED_BLOB="$YIOO_BLOB"
          compact="\${TARGET_VOL//-/}"
          echo "YIOO_HELPER_START target=\$TARGET_VOL"
          dev=''
          for i in \$(seq 1 120); do
            for d in /dev/nvme*n1; do
              [ -b "\$d" ] || continue
              serial=\$(cat "/sys/block/\$(basename "\$d")/device/serial" 2>/dev/null | tr -d ' ' || true)
              if [ "\$serial" = "\$compact" ]; then dev="\$d"; break 2; fi
            done
            link="/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_\${compact}"
            if [ -e "\$link" ]; then dev=\$(readlink -f "\$link"); break; fi
            sleep 2
          done
          if [ -z "\$dev" ]; then echo YIOO_HELPER_NO_DEVICE; sleep 300; exit 2; fi
          echo "YIOO_HELPER_DEVICE \$dev"
          part=\$(lsblk -nrpo NAME,FSTYPE "\$dev" | awk '\$2=="ext4" || \$2=="xfs" {print \$1; exit}')
          if [ -z "\$part" ]; then part=\$(lsblk -nrpo NAME,TYPE "\$dev" | awk '\$2=="part"{print \$1; exit}'); fi
          [ -n "\$part" ] || part="\$dev"
          echo "YIOO_HELPER_FS \$part"
          mkdir -p /mnt/g7
          if ! mount "\$part" /mnt/g7; then echo YIOO_HELPER_MOUNT_FAILED; sleep 300; exit 3; fi
          target=/mnt/g7/home/ubuntu/.ssh/authorized_keys
          if [ ! -d /mnt/g7/home/ubuntu ]; then echo YIOO_HELPER_NO_UBUNTU_HOME; umount /mnt/g7; sleep 300; exit 4; fi
          mkdir -p /mnt/g7/home/ubuntu/.ssh
          [ -f "\$target" ] && cp -a "\$target" "\${target}.pre-yioo" || true
          pub=\$(printf '%s' "\$PUB_B64" | base64 -d)
          touch "\$target"
          grep -F "\$EXPECTED_BLOB" "\$target" >/dev/null || printf '%s\n' "\$pub" >> "\$target"
          chmod 700 /mnt/g7/home/ubuntu/.ssh
          chmod 600 "\$target"
          owner=\$(stat -c '%u:%g' /mnt/g7/home/ubuntu)
          chown -R "\$owner" /mnt/g7/home/ubuntu/.ssh
          if grep -F "\$EXPECTED_BLOB" "\$target" >/dev/null; then
            echo "YIOO_KEY_INSTALLED \$EXPECTED_BLOB"
          else
            echo YIOO_KEY_VERIFY_FAILED
          fi
          sync
          umount /mnt/g7
          echo YIOO_HELPER_READY_FOR_DETACH
          sleep 300
          EOF
          helper=$(aws ec2 run-instances \
            --image-id "$ami" --instance-type t3.micro \
            --subnet-id "$SUBNET_ID" --security-group-ids "$SG_ID" \
            --user-data file:///tmp/helper-userdata.sh \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=yioo-key-verifier},{Key=Purpose,Value=temporary-key-migration}]' \
            --query 'Instances[0].InstanceId' --output text)
          echo "HELPER_ID=$helper" >> "$GITHUB_ENV"
          aws ec2 wait instance-running --instance-ids "$helper"
          echo "helper=$helper"

      - name: Attach root and prove yioo key is present
        run: |
          set -euo pipefail
          aws ec2 attach-volume --volume-id "$ROOT_VOLUME" --instance-id "$HELPER_ID" --device /dev/sdf >/dev/null
          aws ec2 wait volume-in-use --volume-ids "$ROOT_VOLUME"
          ok=''
          for i in $(seq 1 60); do
            aws ec2 get-console-output --instance-id "$HELPER_ID" --latest --output text > /tmp/helper-console.txt 2>/dev/null || true
            if grep -F "YIOO_KEY_INSTALLED $YIOO_BLOB" /tmp/helper-console.txt >/dev/null; then ok=1; break; fi
            if grep -E 'YIOO_HELPER_(NO_DEVICE|MOUNT_FAILED|NO_UBUNTU_HOME)|YIOO_KEY_VERIFY_FAILED' /tmp/helper-console.txt; then
              cat /tmp/helper-console.txt | tail -n 100
              exit 1
            fi
            sleep 5
          done
          cat /tmp/helper-console.txt | tail -n 100
          test -n "$ok"
          echo 'Verified yioo public key on G7 root filesystem'

      - name: Restore root volume and restart G7
        if: always()
        run: |
          set -u
          if [ -n "${HELPER_ID:-}" ]; then
            aws ec2 stop-instances --instance-ids "$HELPER_ID" >/dev/null 2>&1 || true
            aws ec2 wait instance-stopped --instance-ids "$HELPER_ID" 2>/dev/null || true
          fi
          if [ -n "${ROOT_VOLUME:-}" ]; then
            aws ec2 detach-volume --volume-id "$ROOT_VOLUME" --force >/dev/null 2>&1 || true
            aws ec2 wait volume-available --volume-ids "$ROOT_VOLUME" 2>/dev/null || true
            attached=$(aws ec2 describe-volumes --volume-ids "$ROOT_VOLUME" --query 'Volumes[0].Attachments[0].InstanceId' --output text 2>/dev/null || true)
            if [ -z "$attached" ] || [ "$attached" = None ]; then
              aws ec2 attach-volume --volume-id "$ROOT_VOLUME" --instance-id "$INSTANCE_ID" --device "$ROOT_DEVICE" >/dev/null
              aws ec2 wait volume-in-use --volume-ids "$ROOT_VOLUME"
            fi
          fi
          if [ -n "${HELPER_ID:-}" ]; then aws ec2 terminate-instances --instance-ids "$HELPER_ID" >/dev/null 2>&1 || true; fi
          aws ec2 start-instances --instance-ids "$INSTANCE_ID" >/dev/null
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"
          echo 'G7 restored and running'

      - name: Confirm SSH is reachable
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if nc -vz -w 4 184.34.70.106 22; then exit 0; fi
            sleep 5
          done
          exit 1
