name: Koblitz Stage 144 current gate audit
on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay Stage 143 historical audit and Stage 144 current audit
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage143_gate_audit.py scripts/compose_koblitz_stage144_gate_audit.py
          python3 -m json.tool docs/ic/params/k1n59-cofactor-projected-l15-rank-interval4-control-public-59001.json >/dev/null
          python3 -m json.tool docs/ic/runs/koblitz-n59-rank-solve-interval4-rejection-20260922.json >/dev/null
          git apply --check docs/ic/patches/koblitz-n59-rank-solve-interval4-rejected-20260922.patch
          python3 scripts/compose_koblitz_stage143_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-143-current-gate-audit-20260922 > "$RUNNER_TEMP/stage143-historical.json"
          python3 scripts/compose_koblitz_stage144_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-144-current-gate-audit-20260922 > "$RUNNER_TEMP/stage144-current.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
