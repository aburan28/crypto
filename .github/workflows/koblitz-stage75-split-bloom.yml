name: Koblitz Stage 75 n53 split-index Bloom filter

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage75_split_bloom.py"
      - ".github/workflows/koblitz-stage75-split-bloom.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate split-index Bloom controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage75_split_bloom.py
          python3 scripts/run_koblitz_stage75_split_bloom.py self-test
          cargo test --release --example koblitz_rank_fixture
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-split-bloom:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage75_split_bloom.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage75-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare two-mix filter, split-index filter, and rho
        run: |
          python3 scripts/run_koblitz_stage75_split_bloom.py run \
            --build "$RUNNER_TEMP/stage75-build" \
            --output "$RUNNER_TEMP/stage75-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage75_split_bloom.py verify \
            --build "$RUNNER_TEMP/stage75-build" \
            --output "$RUNNER_TEMP/stage75-run" \
            > "$RUNNER_TEMP/stage75-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage75-split-bloom-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage75-build
            ${{ runner.temp }}/stage75-run
            ${{ runner.temp }}/stage75-verification.json
