name: Koblitz Stage 138 current gate audit
on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay Stage 137 historical audit and Stage 138 current audit
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage137_gate_audit.py scripts/compose_koblitz_stage138_gate_audit.py
          python3 -m json.tool docs/ic/params/k1n59-cofactor-projected-l15-witness-cached-full-public-59001.json >/dev/null
          python3 -m json.tool docs/ic/runs/koblitz-n59-witness-key-cache-optimization-20260921.json >/dev/null
          python3 scripts/compose_koblitz_stage137_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-137-current-gate-audit-20260921 > "$RUNNER_TEMP/stage137-historical.json"
          python3 scripts/compose_koblitz_stage138_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-138-current-gate-audit-20260921 > "$RUNNER_TEMP/stage138-current.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
