name: Koblitz Stage 160 current gate audit

on:
  pull_request:
    paths:
      - "docs/index-calculus-scoreboard.html"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-159-current-gate-audit-20260922/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-160-fixed-x1-constant-specialisation-20260922/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-160-fixed-x1-verification.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-160-current-gate-audit-20260923/**"
      - "scripts/compose_koblitz_stage159_gate_audit.py"
      - "scripts/compose_koblitz_stage160_gate_audit.py"
      - "scripts/verify_koblitz_stage160_fixed_x1.py"
      - ".github/workflows/koblitz-stage160-current-gate-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify historical Stage 159 and current Stage 160
        run: |
          python3 -m py_compile \
            scripts/compose_koblitz_stage159_gate_audit.py \
            scripts/compose_koblitz_stage160_gate_audit.py \
            scripts/verify_koblitz_stage160_fixed_x1.py
          python3 scripts/compose_koblitz_stage159_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-159-current-gate-audit-20260922 \
            > "$RUNNER_TEMP/stage159-historical-audit.json"
          python3 scripts/verify_koblitz_stage160_fixed_x1.py \
            > "$RUNNER_TEMP/stage160-result-verification.json"
          cmp "$RUNNER_TEMP/stage160-result-verification.json" \
            research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-160-fixed-x1-verification.json
          python3 scripts/compose_koblitz_stage160_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-160-current-gate-audit-20260923 \
            > "$RUNNER_TEMP/stage160-current-audit.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
