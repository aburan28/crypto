name: N83 final candidate five same-point Tier 1 IC rho pairs

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: n83-final-tier1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  five-same-point-pairs:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Freeze five public points and selected finalist preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-final-tier1"
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k_abba_20261015/generate.py > /dev/null
          python3 research/n83_root4_highk_20261015/generate.py > /dev/null
          python3 research/n83_best_e2e_20261015/generate.py > /dev/null
          python3 research/n83_legacy_challenger_20261015/generate.py > /dev/null
          python3 research/n83_root4_bloom_20261015/generate.py > /dev/null
          python3 research/n83_root11_highk_20261015/generate.py > /dev/null
          python3 research/n83_final_tournament_20261015/generate.py > /dev/null
          python3 research/n83_final_tier1_20261015/generate.py > \
            "$RUNNER_TEMP/n83-final-tier1/fixture-check.json"
          test "$(sha256sum research/n83_final_tier1_20261015/targets.jsonl | cut -d' ' -f1)" = \
            34c530851eb135b7e348ac976caaae37c5883c52b52962ad496028c058b1dcda
          test "$(sha256sum research/n83_final_tier1_20261015/answers.jsonl | cut -d' ' -f1)" = \
            8705b909479f4ee1eb8a19fe327c0622cd890e0d8443e08bdbdf04a4c6b99548
          test "$(sha256sum examples/koblitz_orbit_dlp_fast.rs | cut -d' ' -f1)" = \
            f2745227d95e36ef45c73c5104a23ada6cebb0794405368581d2be17044845dc
          test "$(sha256sum examples/n83_rho_optimization_eval.rs | cut -d' ' -f1)" = \
            fb14072f4fa5d08e18d8b79130b6d58a220adae0f76369cc9be949691c83eaa0
          python3 research/n83_final_tier1_20261015/run.py --preflight > \
            "$RUNNER_TEMP/n83-final-tier1/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-final-tier1/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-final-tier1/cargo-version.txt"

      - name: Hash and check selected tournament result
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          selection=research/n83_final_tier1_20261015/selection.json
          artifact_id=$(jq -r .tournament_artifact_id "$selection")
          expected_zip=$(jq -r .tournament_artifact_sha256 "$selection")
          expected_analysis=$(jq -r .tournament_analysis_sha256 "$selection")
          selected_pipeline=$(jq -r .pipeline "$selection")
          selected_candidate=$(jq -r .candidate_id "$selection")
          mkdir -p "$RUNNER_TEMP/n83-tournament-reference"
          gh api "repos/aburan28/crypto/actions/artifacts/$artifact_id/zip" > \
            "$RUNNER_TEMP/n83-tournament-reference/raw.zip"
          test "$(sha256sum "$RUNNER_TEMP/n83-tournament-reference/raw.zip" | cut -d' ' -f1)" = \
            "$expected_zip"
          unzip -q "$RUNNER_TEMP/n83-tournament-reference/raw.zip" -d \
            "$RUNNER_TEMP/n83-tournament-reference/raw"
          analysis="$RUNNER_TEMP/n83-tournament-reference/raw/results/analysis.json"
          test "$(sha256sum "$analysis" | cut -d' ' -f1)" = "$expected_analysis"
          test "$(jq -r .status "$analysis")" = COMPLETE
          test "$(jq -r .selected_pipeline "$analysis")" = "$selected_pipeline"
          test "$(jq -r .balanced_comparison.selected_candidate_id "$analysis")" = \
            "$selected_candidate"
          jq '{selected_pipeline, status, selected_candidate_id: .balanced_comparison.selected_candidate_id}' \
            "$analysis" > "$RUNNER_TEMP/n83-final-tier1/tournament-check.json"

      - name: Build and test exact IC and strong-rho producers
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-final-tier1-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast \
            --example n83_rho_optimization_eval > \
            "$RUNNER_TEMP/n83-final-tier1/example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast \
            --example n83_rho_optimization_eval > \
            "$RUNNER_TEMP/n83-final-tier1/build.log" 2>&1
          sha256sum "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            "$CARGO_TARGET_DIR/release/examples/n83_rho_optimization_eval" > \
            "$RUNNER_TEMP/n83-final-tier1/binaries.sha256"

      - name: Run five alternating same-point pairs
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-final-tier1-target"
          python3 research/n83_final_tier1_20261015/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --rho-binary "$CARGO_TARGET_DIR/release/examples/n83_rho_optimization_eval" \
            --output "$RUNNER_TEMP/n83-final-tier1/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-final-tier1/run.log"

      - name: Independently replay all five point and scalar pairs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-final-tier1/results" ]; then
            python3 research/n83_final_tier1_20261015/verify.py \
              "$RUNNER_TEMP/n83-final-tier1/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-final-tier1/verify.log"
          fi

      - name: Preserve pairs, calibration and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-final-tier1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-final-tier1/
          if-no-files-found: error
          retention-days: 14
