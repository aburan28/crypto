name: Koblitz Stage 119 n53 unknown support A/B

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage119_unknown_ab.py"
      - ".github/workflows/koblitz-stage119-unknown-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate unknown-support controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage119_unknown_ab.py
          python3 scripts/run_koblitz_stage119_unknown_ab.py self-test
          cargo test --release --example koblitz_rank_fixture
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-unknown-support-ab:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage119_unknown_ab.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage119-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare sparse and dense support on the unknown target
        run: |
          python3 scripts/run_koblitz_stage119_unknown_ab.py run \
            --build "$RUNNER_TEMP/stage119-build" \
            --output "$RUNNER_TEMP/stage119-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage119_unknown_ab.py verify \
            --build "$RUNNER_TEMP/stage119-build" \
            --output "$RUNNER_TEMP/stage119-run" \
            > "$RUNNER_TEMP/stage119-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage119-unknown-support-ab-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage119-build
            ${{ runner.temp }}/stage119-run
            ${{ runner.temp }}/stage119-verification.json
