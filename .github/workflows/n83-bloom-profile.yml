name: N83 K3300 root Bloom profile comparison

on:
  push:
    branches: [codex/n83-bloom-profile-20261015]
    paths:
      - .github/workflows/n83-bloom-profile.yml
      - examples/koblitz_orbit_dlp_fast.rs
      - research/n83_bloom_profile_20261015/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-bloom-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  six-arm-bloom-profile-comparison:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Freeze reused 4000 public points and source preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-bloom-profile"
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > \
            "$RUNNER_TEMP/n83-bloom-profile/prior-fixture-check.json"
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > \
            "$RUNNER_TEMP/n83-bloom-profile/prior-k3350-fixture-check.json"
          python3 research/n83_k_abba_20261015/generate.py > \
            "$RUNNER_TEMP/n83-bloom-profile/fixture-check.json"
          python3 research/n83_bloom_profile_20261015/run.py --preflight > \
            "$RUNNER_TEMP/n83-bloom-profile/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-bloom-profile/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-bloom-profile/cargo-version.txt"

      - name: Build and test exact N83 producer
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-bloom-profile-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-bloom-profile/example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-bloom-profile/build.log" 2>&1

      - name: Run six bounded Bloom profile arms
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-bloom-profile-target"
          python3 research/n83_bloom_profile_20261015/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --output "$RUNNER_TEMP/n83-bloom-profile/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-bloom-profile/run.log"

      - name: Independently replay six bases and all 24000 targets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-bloom-profile/results" ]; then
            python3 research/n83_bloom_profile_20261015/verify.py \
              "$RUNNER_TEMP/n83-bloom-profile/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-bloom-profile/verify.log"
          fi

      - name: Preserve all raw rows and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-bloom-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-bloom-profile/
          if-no-files-found: error
          retention-days: 14
