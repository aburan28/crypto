name: N83 root Bloom profile sealed replay

on:
  push:
    branches: [codex/n83-bloom-profile-20261015]
    paths:
      - .github/workflows/n83-bloom-profile.yml
      - research/n83_bloom_profile_20261015/**
      - research/n83_bloom_profile_results_20261015/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: n83-bloom-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  six-arm-bloom-sealed-replay:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the executed source snapshot
        shell: bash
        run: |
          set -euo pipefail
          frozen=42fc71945cd7087f78464abc65c4bae7c52a93e8
          git fetch --no-tags --depth=1 origin "$frozen"
          test "$(git rev-parse FETCH_HEAD)" = "$frozen"
          mkdir -p "$RUNNER_TEMP/n83-bloom-profile-frozen-source"
          git archive "$frozen" Cargo.lock \
            examples/koblitz_orbit_dlp_fast.rs \
            examples/n83_rho_optimization_eval.rs \
            research/n83_dense_root_20261013 \
            research/n83_factor_base_100_20261014 \
            research/n83_factor_base_refine_20261014 \
            research/n83_factor_base_confirm_20261015 \
            research/n83_indexed5_20261013 \
            research/n83_root4_20261014 \
            research/n83_k3250_sparse_fresh_20261015 \
            research/n83_k3350_sparse_fresh_20261015 \
            research/n83_k_abba_20261015 \
            research/n83_bloom_profile_20261015 \
            | tar -xf - -C "$RUNNER_TEMP/n83-bloom-profile-frozen-source"
          test "$(sha256sum "$RUNNER_TEMP/n83-bloom-profile-frozen-source/examples/koblitz_orbit_dlp_fast.rs" | cut -d' ' -f1)" = \
            f2745227d95e36ef45c73c5104a23ada6cebb0794405368581d2be17044845dc

      - name: Download the exact completed raw artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-bloom-profile-sealed"
          gh api repos/aburan28/crypto/actions/artifacts/11969951389/zip > \
            "$RUNNER_TEMP/n83-bloom-profile-sealed/raw.zip"
          test "$(sha256sum "$RUNNER_TEMP/n83-bloom-profile-sealed/raw.zip" | cut -d' ' -f1)" = \
            d4f7c9f0b773eaa05e0f18043c8d11503a456d5aa7a5a426e4e891bd9959c43d
          unzip -q "$RUNNER_TEMP/n83-bloom-profile-sealed/raw.zip" -d \
            "$RUNNER_TEMP/n83-bloom-profile-sealed/raw"
          test "$(sha256sum "$RUNNER_TEMP/n83-bloom-profile-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            f15dc07f8b816038d824ef56962caf46e062a568e1ca998134cfd08f4f2119b6

      - name: Independently replay six bases and all 24000 answers
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 "$RUNNER_TEMP/n83-bloom-profile-frozen-source/research/n83_k3250_sparse_fresh_20261015/generate.py" > \
            "$RUNNER_TEMP/n83-bloom-profile-sealed/prior-fixture-check.json"
          python3 "$RUNNER_TEMP/n83-bloom-profile-frozen-source/research/n83_k3350_sparse_fresh_20261015/generate.py" > \
            "$RUNNER_TEMP/n83-bloom-profile-sealed/prior-k3350-fixture-check.json"
          python3 "$RUNNER_TEMP/n83-bloom-profile-frozen-source/research/n83_k_abba_20261015/generate.py" > \
            "$RUNNER_TEMP/n83-bloom-profile-sealed/fixture-check.json"
          python3 "$RUNNER_TEMP/n83-bloom-profile-frozen-source/research/n83_bloom_profile_20261015/verify.py" \
            "$RUNNER_TEMP/n83-bloom-profile-sealed/raw/results" > \
            "$RUNNER_TEMP/n83-bloom-profile-sealed/local-replay.log"
          test "$(sha256sum "$RUNNER_TEMP/n83-bloom-profile-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            f15dc07f8b816038d824ef56962caf46e062a568e1ca998134cfd08f4f2119b6

      - name: Reproduce the canonical current-head result records
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k_abba_20261015/generate.py > /dev/null
          python3 research/n83_bloom_profile_results_20261015/materialize.py \
            --artifact-zip "$RUNNER_TEMP/n83-bloom-profile-sealed/raw.zip" \
            --artifact-sha256 d4f7c9f0b773eaa05e0f18043c8d11503a456d5aa7a5a426e4e891bd9959c43d \
            --analysis-sha256 f15dc07f8b816038d824ef56962caf46e062a568e1ca998134cfd08f4f2119b6 \
            "$RUNNER_TEMP/n83-bloom-profile-sealed/raw/results"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Preserve current-head replay receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-bloom-profile-sealed-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/n83-bloom-profile-sealed/local-replay.log
            ${{ runner.temp }}/n83-bloom-profile-sealed/fixture-check.json
          if-no-files-found: ignore
          retention-days: 14
