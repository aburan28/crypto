name: N83 K3300 root11 sparse and Bloom sealed replay

on:
  push:
    branches: [codex/n83-root11-bloom-sparse-20261015]
    paths:
      - .github/workflows/n83-root11-bloom-sparse.yml
      - research/n83_root11_bloom_sparse_20261015/**
      - research/n83_root11_bloom_sparse_results_20261015/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: n83-root11-bloom-sparse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  same-base-combined-sealed-replay:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the executed source snapshot
        shell: bash
        run: |
          set -euo pipefail
          frozen=9289963251767f88340e1c8900d18f50f1b40ee0
          git fetch --no-tags --depth=1 origin "$frozen"
          test "$(git rev-parse FETCH_HEAD)" = "$frozen"
          mkdir -p "$RUNNER_TEMP/n83-bloom-sparse-frozen-source"
          git archive "$frozen" Cargo.lock \
            examples/koblitz_orbit_dlp_fast.rs \
            examples/n83_rho_optimization_eval.rs \
            research/n83_dense_root_20261013 \
            research/n83_indexed5_20261013 \
            research/n83_root4_20261014 \
            research/n83_factor_base_refine_20261014 \
            research/n83_root11_bloom_sparse_20261015 \
            | tar -xf - -C "$RUNNER_TEMP/n83-bloom-sparse-frozen-source"
          test "$(sha256sum "$RUNNER_TEMP/n83-bloom-sparse-frozen-source/examples/koblitz_orbit_dlp_fast.rs" | cut -d' ' -f1)" = \
            814afa03ae1c386e62e518be3c7a55fb108b09c41b05bef64ca1371787466c39

      - name: Download the exact completed raw artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-bloom-sparse-sealed"
          gh api repos/aburan28/crypto/actions/artifacts/11948835612/zip > \
            "$RUNNER_TEMP/n83-bloom-sparse-sealed/raw.zip"
          test "$(sha256sum "$RUNNER_TEMP/n83-bloom-sparse-sealed/raw.zip" | cut -d' ' -f1)" = \
            20be795e5e1a596f92f357e8764d2529ee349a546d18c439b6bd8354901d1916
          unzip -q "$RUNNER_TEMP/n83-bloom-sparse-sealed/raw.zip" -d \
            "$RUNNER_TEMP/n83-bloom-sparse-sealed/raw"
          test "$(sha256sum "$RUNNER_TEMP/n83-bloom-sparse-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            cb5ba82cab460faa12b27c5fe8a7926899be538d18fb4d81c44bb8760f71267f

      - name: Independently replay both bases and all 2000 target answers
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 "$RUNNER_TEMP/n83-bloom-sparse-frozen-source/research/n83_root11_bloom_sparse_20261015/verify.py" \
            "$RUNNER_TEMP/n83-bloom-sparse-sealed/raw/results" > \
            "$RUNNER_TEMP/n83-bloom-sparse-sealed/local-replay.log"
          test "$(sha256sum "$RUNNER_TEMP/n83-bloom-sparse-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            cb5ba82cab460faa12b27c5fe8a7926899be538d18fb4d81c44bb8760f71267f

      - name: Reproduce the canonical current-head result records
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_root11_bloom_sparse_results_20261015/materialize.py \
            --artifact-zip "$RUNNER_TEMP/n83-bloom-sparse-sealed/raw.zip" \
            --artifact-sha256 20be795e5e1a596f92f357e8764d2529ee349a546d18c439b6bd8354901d1916 \
            --analysis-sha256 cb5ba82cab460faa12b27c5fe8a7926899be538d18fb4d81c44bb8760f71267f \
            "$RUNNER_TEMP/n83-bloom-sparse-sealed/raw/results"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Preserve current-head replay receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-root11-bloom-sparse-sealed-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-bloom-sparse-sealed/local-replay.log
          if-no-files-found: ignore
          retention-days: 14
