name: N83 final twelve-point Tier 1 online holdout

on:
  push:
    branches: [codex/n83-final-holdout-implementation-20261017]
    paths:
      - research/n83_final_online_holdout_20261017/dispatch.json

permissions:
  contents: read

concurrency:
  group: n83-final-online-${{ github.ref }}
  cancel-in-progress: false

jobs:
  final-online-half:
    if: github.repository == 'aburan28/crypto' && github.ref == 'refs/heads/codex/n83-final-holdout-implementation-20261017'
    strategy:
      fail-fast: false
      matrix:
        half: [0, 1]
    runs-on: ubuntu-24.04
    timeout-minutes: 260
    env:
      FIVE_RESULT_DIR: research/n83_smallk_challenge_20261017/results
      K992_RESULT_DIR: research/n83_k992_cold_followup_20261017/results
    steps:
      - uses: actions/checkout@v4

      - name: Replay sealed inputs and dispatch
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          mkdir -p "$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}"
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k_abba_20261015/generate.py > /dev/null
          python3 research/n83_root4_highk_20261015/generate.py > /dev/null
          python3 research/n83_best_e2e_20261015/generate.py > /dev/null
          python3 research/n83_legacy_challenger_20261015/generate.py > /dev/null
          python3 research/n83_root4_bloom_20261015/generate.py > /dev/null
          python3 research/n83_root11_highk_20261015/generate.py > /dev/null
          python3 research/n83_compact4_crosslayout_20261016/generate.py > /dev/null
          python3 research/n83_cold_factor_base_20261016/generate.py > /dev/null
          python3 research/n83_e2e_precision_20261016/generate.py --verify-sealed > /dev/null
          python3 research/n83_e2e_final_holdout_20261016/generate.py --verify-sealed > /dev/null
          python3 research/n83_k3072_current_source_20261017/generate.py --verify-sealed > /dev/null
          python3 research/n83_smallk_challenge_20261017/generate.py --verify-sealed > /dev/null
          python3 research/n83_k992_cold_followup_20261017/generate.py --verify-sealed > /dev/null
          python3 research/n83_final_online_holdout_20261017/generate.py --verify-sealed > \
            "$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}/fixture-check.json"
          python3 research/n83_final_online_holdout_20261017/check_dispatch.py > \
            "$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}/dispatch-check.json"
          python3 research/n83_final_online_holdout_20261017/test_choice_selector.py > \
            "$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}/selector-test.json"
          python3 research/n83_runner_identity_replay_20261017/test_jobs.py > \
            "$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}/identity-test.log" 2>&1
          python3 research/n83_final_online_holdout_20261017/run.py \
            --preflight --half "${{ matrix.half }}" \
            --five-validated "$FIVE_RESULT_DIR/validated_rows.json" \
            --five-selection "$FIVE_RESULT_DIR/selection.json" \
            --k992-validated "$K992_RESULT_DIR/validated_rows.json" \
            --k992-selection "$K992_RESULT_DIR/selection.json" > \
            "$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}/schedule-preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}/cargo-version.txt"

      - name: Build and test exact IC and same-point rho producers
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}/ic-example-tests.log" 2>&1
          cargo test --release --locked --example n83_rho_optimization_eval > \
            "$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}/rho-example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}/ic-build.log" 2>&1
          cargo build --release --locked --example n83_rho_optimization_eval > \
            "$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}/rho-build.log" 2>&1

      - name: Run calibrated same-point pairs on six public points
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}-target"
          python3 research/n83_final_online_holdout_20261017/run.py \
            --half "${{ matrix.half }}" \
            --five-validated "$FIVE_RESULT_DIR/validated_rows.json" \
            --five-selection "$FIVE_RESULT_DIR/selection.json" \
            --k992-validated "$K992_RESULT_DIR/validated_rows.json" \
            --k992-selection "$K992_RESULT_DIR/selection.json" \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --rho-binary "$CARGO_TARGET_DIR/release/examples/n83_rho_optimization_eval" \
            --output "$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}/run.log"

      - name: Independently replay bases relations scalars and resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}/results" ]; then
            python3 research/n83_final_online_holdout_20261017/verify.py \
              "$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}/results" \
              --half "${{ matrix.half }}" \
              --five-validated "$FIVE_RESULT_DIR/validated_rows.json" \
              --five-selection "$FIVE_RESULT_DIR/selection.json" \
              --k992-validated "$K992_RESULT_DIR/validated_rows.json" \
              --k992-selection "$K992_RESULT_DIR/selection.json" \
              2>&1 | tee "$RUNNER_TEMP/n83-final-online-half-${{ matrix.half }}/verify.log"
          fi

      - name: Preserve all raw receipts and failed pairs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-final-online-half-${{ matrix.half }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-final-online-half-${{ matrix.half }}/
          if-no-files-found: error
          retention-days: 14
