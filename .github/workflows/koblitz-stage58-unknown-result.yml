name: Koblitz Stage 58 n53 unknown-scalar result

on:
  pull_request:
    paths:
      - "scripts/verify_koblitz_stage58_unknown_result.py"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/koblitz-stage58-n53-unknown-evidence-34714165792.tar.gz*"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-58-*-34714165792.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-58-n53-unknown-result-20260912/**"
      - ".github/workflows/koblitz-stage58-unknown-result.yml"

permissions:
  contents: read

jobs:
  verify-hosted-result:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify hosted n53 unknown-scalar result
        run: |
          python3 -m py_compile scripts/verify_koblitz_stage58_unknown_result.py
          python3 scripts/verify_koblitz_stage58_unknown_result.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-58-n53-unknown-result-20260912 \
            > "$RUNNER_TEMP/stage58-verification.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
