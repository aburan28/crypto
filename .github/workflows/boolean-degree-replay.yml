name: Boolean degree evidence replay
on:
  pull_request:
    paths:
      - 'research/boolean_degree_replay_20260922/**'
      - '.github/workflows/boolean-degree-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/boolean_degree_replay_20260922/requirements.txt
      - run: python -m unittest discover -s research/boolean_degree_replay_20260922 -p test_check.py -v
      - run: python research/boolean_degree_replay_20260922/check.py
      - run: python research/boolean_degree_replay_20260922/check.py --sympy
      - name: Frozen evidence remains unchanged
        run: git diff --exit-code -- research/boolean_degree_replay_20260922
