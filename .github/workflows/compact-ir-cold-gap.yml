name: Compact Ir matched cold native gap

on:
  pull_request:
    paths:
      - '.github/workflows/compact-ir-cold-gap.yml'
      - 'research/notes/ecc2k130/compact_ir_cold_gap_20260930/**'
      - 'research/notes/ecc2k130/compact_ir_ledger_20260930/run_panel.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Cargo.toml
            docs/ic/calibration.json
            src
            examples/koblitz_orbit_dlp_s3_batch.rs
            examples/koblitz_rho_batch_ks_v2_n61.rs
            examples/koblitz_rho_batch_ks_v3.rs
            research/notes/ecc2k130/compact_shared_log_20260925/Cargo.lock
            research/notes/ecc2k130/compact_orbit_rank_evidence_20260929/verify_rank.py
            research/notes/ecc2k130/compact_orbit_point_panel_20260929
            research/notes/ecc2k130/compact_s3_prefilter_20260930
            research/notes/ecc2k130/compact_ir_ledger_20260930
            research/notes/ecc2k130/compact_ir_cold_gap_20260930
            research/notes/ecc2k130/compact_frozen_source_replay_20260929
            research/sat_factor_base_review_20260908/autolab_orbit_extract_20260924/independent_replay.py
            tools/isolated_bench.py
            .github/workflows/compact-s3-prefilter.yml
      - name: Check frozen cells and Python syntax
        run: |
          python3 -m py_compile research/notes/ecc2k130/compact_ir_ledger_20260930/run_panel.py \
            research/notes/ecc2k130/compact_ir_cold_gap_20260930/*.py
          python3 -m unittest discover -s research/notes/ecc2k130/compact_ir_ledger_20260930 -p 'test_panel.py' -v
          python3 -m unittest discover -s research/notes/ecc2k130/compact_frozen_source_replay_20260929 -p 'test_materialize.py' -v
          python3 -c 'import sys; sys.path.insert(0,"research/notes/ecc2k130/compact_ir_cold_gap_20260930"); from run_cold import load_cell; [load_cell(x) for x in ("n37_L1","n37_L1024","n41_L1","n53_L1")]'
          python3 research/notes/ecc2k130/compact_ir_cold_gap_20260930/analyze_cold.py \
            --archive research/notes/ecc2k130/compact_ir_cold_gap_20260930/evidence/run_36694337420 \
            --out "$RUNNER_TEMP/cold-analysis.json"
          python3 -c 'import json,sys; sys.path.insert(0,"research/notes/ecc2k130/compact_ir_ledger_20260930"); from archive import equivalent; assert equivalent(json.load(open(sys.argv[1])), json.load(open(sys.argv[2])))' \
            "$RUNNER_TEMP/cold-analysis.json" research/notes/ecc2k130/compact_ir_cold_gap_20260930/ANALYSIS.json
      - name: Materialize and build the exact frozen source
        run: |
          mkdir -p "${{ runner.temp }}/compact-ir-cold"
          python3 research/notes/ecc2k130/compact_frozen_source_replay_20260929/materialize.py \
            --freeze research/notes/ecc2k130/compact_s3_prefilter_20260930/FROZEN.json \
            --dest "${{ runner.temp }}/compact-ir-cold-frozen-src" \
            --receipt "${{ runner.temp }}/compact-ir-cold/materialization.json"
          cp "${{ runner.temp }}/compact-ir-cold-frozen-src/research/notes/ecc2k130/compact_shared_log_20260925/Cargo.lock" \
            "${{ runner.temp }}/compact-ir-cold-frozen-src/Cargo.lock"
          cargo build --manifest-path "${{ runner.temp }}/compact-ir-cold-frozen-src/Cargo.toml" \
            --release --locked --example koblitz_orbit_dlp_s3_batch --example koblitz_rho_batch_ks_v3
      - name: One-arm native n37 integration smoke and independent replay
        run: |
          python3 research/notes/ecc2k130/compact_ir_cold_gap_20260930/run_cold.py \
            --cell n37_L1 --mode smoke \
            --frozen-root "${{ runner.temp }}/compact-ir-cold-frozen-src" \
            --batch "${{ runner.temp }}/compact-ir-cold-frozen-src/target/release/examples/koblitz_orbit_dlp_s3_batch" \
            --rho "${{ runner.temp }}/compact-ir-cold-frozen-src/target/release/examples/koblitz_rho_batch_ks_v3" \
            --materialization "${{ runner.temp }}/compact-ir-cold/materialization.json" \
            --out "${{ runner.temp }}/compact-ir-cold/n37_L1_smoke"
          python3 research/notes/ecc2k130/compact_ir_cold_gap_20260930/verify_cold.py \
            --cell n37_L1 --mode smoke \
            --run-dir "${{ runner.temp }}/compact-ir-cold/n37_L1_smoke" \
            --out "${{ runner.temp }}/compact-ir-cold/n37_L1_smoke/receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-ir-cold-validation
          path: ${{ runner.temp }}/compact-ir-cold
          if-no-files-found: warn
          retention-days: 90

  measure:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cell: [n37_L1, n37_L1024, n41_L1, n53_L1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Cargo.toml
            docs/ic/calibration.json
            src
            examples/koblitz_orbit_dlp_s3_batch.rs
            examples/koblitz_rho_batch_ks_v2_n61.rs
            examples/koblitz_rho_batch_ks_v3.rs
            research/notes/ecc2k130/compact_shared_log_20260925/Cargo.lock
            research/notes/ecc2k130/compact_orbit_rank_evidence_20260929/verify_rank.py
            research/notes/ecc2k130/compact_orbit_point_panel_20260929
            research/notes/ecc2k130/compact_s3_prefilter_20260930
            research/notes/ecc2k130/compact_ir_ledger_20260930
            research/notes/ecc2k130/compact_ir_cold_gap_20260930
            research/notes/ecc2k130/compact_frozen_source_replay_20260929
            research/sat_factor_base_review_20260908/autolab_orbit_extract_20260924/independent_replay.py
            tools/isolated_bench.py
            .github/workflows/compact-s3-prefilter.yml
      - name: Materialize and build the exact frozen source
        run: |
          mkdir -p "${{ runner.temp }}/compact-ir-cold"
          python3 research/notes/ecc2k130/compact_frozen_source_replay_20260929/materialize.py \
            --freeze research/notes/ecc2k130/compact_s3_prefilter_20260930/FROZEN.json \
            --dest "${{ runner.temp }}/compact-ir-cold-frozen-src" \
            --receipt "${{ runner.temp }}/compact-ir-cold/materialization.json"
          cp "${{ runner.temp }}/compact-ir-cold-frozen-src/research/notes/ecc2k130/compact_shared_log_20260925/Cargo.lock" \
            "${{ runner.temp }}/compact-ir-cold-frozen-src/Cargo.lock"
          cargo build --manifest-path "${{ runner.temp }}/compact-ir-cold-frozen-src/Cargo.toml" \
            --release --locked --example koblitz_orbit_dlp_s3_batch --example koblitz_rho_batch_ks_v3
      - name: Run the fixed isolated cold blocks
        id: run
        env:
          RAYON_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          CPU=$(python3 -c 'import os; print(sorted(os.sched_getaffinity(0))[-1])')
          CPUS=$(cat "/sys/devices/system/cpu/cpu${CPU}/topology/thread_siblings_list")
          PARENT="${{ runner.temp }}/compact-ir-cold"
          RUN_DIR="$PARENT/${{ matrix.cell }}"
          STATUS=1
          for ATTEMPT in 1 2 3 4 5 6; do
            sleep 20
            LOG="$PARENT/${{ matrix.cell }}_preflight_${ATTEMPT}.log"
            set +e
            python3 tools/isolated_bench.py reserve --cpus "$CPUS" --max-psi 5 \
              --out "$PARENT/${{ matrix.cell }}.isolation.jsonl" \
              --label "compact-ir-cold-${{ matrix.cell }}" -- \
              python3 research/notes/ecc2k130/compact_ir_cold_gap_20260930/run_cold.py \
                --cell "${{ matrix.cell }}" --mode measure \
                --frozen-root "${{ runner.temp }}/compact-ir-cold-frozen-src" \
                --batch "${{ runner.temp }}/compact-ir-cold-frozen-src/target/release/examples/koblitz_orbit_dlp_s3_batch" \
                --rho "${{ runner.temp }}/compact-ir-cold-frozen-src/target/release/examples/koblitz_rho_batch_ks_v3" \
                --materialization "$PARENT/materialization.json" \
                --out "$RUN_DIR" --cpu "$CPU" > "$LOG" 2>&1
            STATUS=$?
            set -e
            cat "$LOG"
            if [ "$STATUS" -eq 0 ] || [ -d "$RUN_DIR" ]; then
              break
            fi
            if ! grep -q '^machine is busy:' "$LOG"; then
              break
            fi
          done
          if [ -d "$RUN_DIR" ]; then
            if [ -f "$PARENT/${{ matrix.cell }}.isolation.jsonl" ]; then
              cp "$PARENT/${{ matrix.cell }}.isolation.jsonl" "$RUN_DIR/isolation.jsonl"
            fi
            cp "$PARENT"/${{ matrix.cell }}_preflight_*.log "$RUN_DIR/"
            cp "$PARENT/materialization.json" "$RUN_DIR/"
          fi
          exit "$STATUS"
      - name: Independently replay every rank and point log
        if: always() && steps.run.outcome != 'skipped'
        run: |
          python3 research/notes/ecc2k130/compact_ir_cold_gap_20260930/verify_cold.py \
            --cell "${{ matrix.cell }}" --mode measure \
            --run-dir "${{ runner.temp }}/compact-ir-cold/${{ matrix.cell }}" \
            --out "${{ runner.temp }}/compact-ir-cold/${{ matrix.cell }}/receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-ir-cold-${{ matrix.cell }}
          path: ${{ runner.temp }}/compact-ir-cold
          if-no-files-found: warn
          retention-days: 90
