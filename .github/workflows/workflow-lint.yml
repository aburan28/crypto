name: Workflow syntax
# YAML structure plus GitHub Actions expressions, triggers and job semantics.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/run-actionlint.sh'
# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /.github/scripts/run-actionlint.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml==6.0.3
      - name: Every workflow parses and declares triggers
        run: |
          python3 - <<'PY'
          import glob, sys, yaml

          bad = []
          files = sorted(glob.glob('.github/workflows/*.yml')
                         + glob.glob('.github/workflows/*.yaml'))
          for path in files:
              try:
                  doc = yaml.safe_load(open(path))
              except yaml.YAMLError as err:
                  bad.append('%s: %s' % (path, str(err).replace('\n', ' ')))
                  continue
              # YAML 1.1 reads a bare `on` as the boolean True.
              triggers = doc.get('on', doc.get(True))
              if not triggers:
                  bad.append('%s: no `on:` triggers' % path)
              if not doc.get('jobs'):
                  bad.append('%s: no `jobs:`' % path)
          for line in bad:
              print(line)
          print('checked %d workflows, %d problems' % (len(files), len(bad)))
          sys.exit(1 if bad else 0)
          PY
      - name: GitHub Actions workflow semantics (actionlint 1.7.12)
        run: bash .github/scripts/run-actionlint.sh
