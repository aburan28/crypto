name: Koblitz Stage 164 current gate audit

on:
  pull_request:
    paths:
      - "docs/index-calculus-scoreboard.html"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-163-current-gate-audit-20260923/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-164-native-f4-dense-20260923/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-164-native-f4-dense-verification.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-164-current-gate-audit-20260923/**"
      - "scripts/compose_koblitz_stage163_gate_audit.py"
      - "scripts/compose_koblitz_stage164_gate_audit.py"
      - "scripts/verify_koblitz_stage164_dense_f4.py"
      - ".github/workflows/koblitz-stage164-current-gate-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify historical Stage 163 and current Stage 164
        run: |
          python3 -m py_compile \
            scripts/compose_koblitz_stage163_gate_audit.py \
            scripts/compose_koblitz_stage164_gate_audit.py \
            scripts/verify_koblitz_stage164_dense_f4.py
          python3 scripts/compose_koblitz_stage163_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-163-current-gate-audit-20260923 \
            > "$RUNNER_TEMP/stage163-historical-audit.json"
          python3 scripts/verify_koblitz_stage164_dense_f4.py \
            > "$RUNNER_TEMP/stage164-result-verification.json"
          cmp "$RUNNER_TEMP/stage164-result-verification.json" \
            research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-164-native-f4-dense-verification.json
          python3 scripts/compose_koblitz_stage164_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-164-current-gate-audit-20260923 \
            > "$RUNNER_TEMP/stage164-current-audit.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
