name: Koblitz Stage 55 n53 PCLMUL A/B

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage55_n53_pclmul.py"
      - ".github/workflows/koblitz-stage55-n53-pclmul.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate PCLMUL comparison controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage55_n53_pclmul.py
          python3 scripts/run_koblitz_stage55_n53_pclmul.py self-test
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-pclmul-ab:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage55_n53_pclmul.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage55-build" \
            --jobs 4 \
            --timeout 1800
      - name: Run portable, PCLMUL, and rho on the same n53 target
        run: |
          python3 scripts/run_koblitz_stage55_n53_pclmul.py run \
            --build "$RUNNER_TEMP/stage55-build" \
            --output "$RUNNER_TEMP/stage55-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage55_n53_pclmul.py verify \
            --build "$RUNNER_TEMP/stage55-build" \
            --output "$RUNNER_TEMP/stage55-run" \
            > "$RUNNER_TEMP/stage55-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage55-n53-pclmul-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage55-build
            ${{ runner.temp }}/stage55-run
            ${{ runner.temp }}/stage55-verification.json
