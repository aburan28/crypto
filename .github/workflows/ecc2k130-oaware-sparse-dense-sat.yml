name: ECC2K-130 n13 O-aware sparse-dense SAT freeze
on:
  pull_request:
    paths:
      - 'research/notes/ecc2k130/n13_oaware_sparse_dense_sat_20260925/**'
      - 'research/notes/ecc2k130/n13_oaware_sat_benchmark_20260925/**'
      - 'research/notes/ecc2k130/rotated_s3_o_branch_20260925/**'
      - 'research/notes/ecc2k130/rotated_s3_sparse_cnf_20260925/**'
      - 'research/notes/ecc2k130/rotated_pdp_corpus_20260925/**'
      - 'research/notes/ecc2k130/rotated_subspace_support_20260925/**'
      - '.github/workflows/ecc2k130-oaware-sparse-dense-sat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-hash-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # merge-ancestry checks include #785, #786 and #787
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile frozen source
        run: |
          python3 -m py_compile research/notes/ecc2k130/n13_oaware_sparse_dense_sat_20260925/{run,verify,ci_replay,analyze,selftest,runtime_controls}.py
      - name: Check merged ancestry, frozen bytes and identical target semantics
        run: |
          python3 research/notes/ecc2k130/n13_oaware_sparse_dense_sat_20260925/ci_replay.py
      - name: Check synthetic ABBA and strict decision threshold
        run: |
          python3 research/notes/ecc2k130/n13_oaware_sparse_dense_sat_20260925/selftest.py
