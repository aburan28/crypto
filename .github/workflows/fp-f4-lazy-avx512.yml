name: Prime F4 lazy AVX-512 experiment

on:
  pull_request:
    paths:
      - 'src/cryptanalysis/f4_fp.rs'
      - 'research/fp_f4_lazy_avx512_20260928/PROTOCOL.md'
      - 'research/fp_f4_lazy_avx512_20260928/paired_fp_f4.py'
      - '.github/workflows/fp-f4-lazy-avx512.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-output-and-paired-complete-f4:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      RAYON_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98'
      - uses: Swatinem/rust-cache@v2
      - name: AVX-512 boundary and prime F4 exactness tests
        run: |
          cargo test --release --lib avx512_lazy_accumulation_matches_scalar_at_boundaries -- --test-threads=1
          cargo test --release --lib f4_fp::tests -- --test-threads=1
      - name: Build and retain unmodified reference
        run: |
          git worktree add --detach --no-checkout "$RUNNER_TEMP/fp-f4-avx512-reference" 4eaa93aeeac8f502cb55f0932cb7c00b091201e4
          git -C "$RUNNER_TEMP/fp-f4-avx512-reference" sparse-checkout set src examples docs/ic research/f4_linear_algebra_20260914
          git -C "$RUNNER_TEMP/fp-f4-avx512-reference" reset --hard HEAD
          CARGO_TARGET_DIR="$RUNNER_TEMP/fp-f4-avx512-reference-target" cargo build --release --manifest-path "$RUNNER_TEMP/fp-f4-avx512-reference/Cargo.toml" --example f4_fp_bench
          cp "$RUNNER_TEMP/fp-f4-avx512-reference-target/release/examples/f4_fp_bench" "$RUNNER_TEMP/fp-f4-avx512-reference-binary"
      - name: Build candidate
        run: cargo build --release --example f4_fp_bench
      - name: Five A/A, current/candidate, and wide/candidate pairs per seed
        run: |
          python3 research/fp_f4_lazy_avx512_20260928/paired_fp_f4.py \
            "$RUNNER_TEMP/fp-f4-avx512-reference-binary" \
            target/release/examples/f4_fp_bench \
            research/fp_f4_lazy_avx512_20260928/ci-result.json \
            --pairs 5 --threads 1
      - name: Preserve raw calls and both binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fp-f4-lazy-avx512-${{ github.sha }}
          path: |
            research/fp_f4_lazy_avx512_20260928/ci-result.json
            ${{ runner.temp }}/fp-f4-avx512-reference-binary
            target/release/examples/f4_fp_bench
          if-no-files-found: warn
