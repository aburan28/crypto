name: Koblitz Stage 142 current gate audit
on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay Stage 141 historical audit and Stage 142 current audit
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage141_gate_audit.py scripts/compose_koblitz_stage142_gate_audit.py
          python3 -m json.tool docs/ic/params/k1n59-cofactor-projected-l15-coverage-tail-control-public-59001.json >/dev/null
          python3 -m json.tool docs/ic/runs/koblitz-n59-rank-tail-attribution-correction-20260922.json >/dev/null
          python3 scripts/compose_koblitz_stage141_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-141-current-gate-audit-20260922 > "$RUNNER_TEMP/stage141-historical.json"
          python3 scripts/compose_koblitz_stage142_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-142-current-gate-audit-20260922 > "$RUNNER_TEMP/stage142-current.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
