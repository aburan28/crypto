name: Chained PDP orbit holdout replay

on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:

jobs:
  independent-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay all finite-base witnesses, certified skips and ranks
        run: |
          set -euo pipefail
          base=research/ecc2k130_pdp_chain_holdout_20260925
          python3 "$base/verify.py" "$base/receipt_projected.json"
          python3 "$base/verify.py" "$base/receipt_raw.json"
          python3 "$base/verify.py" "$base/receipt_mask512.json"
          python3 "$base/verify.py" "$base/receipt_power2048.json"
          python3 "$base/verify_prefix.py" "$base/receipt_mask512.json" "$base/receipt_power2048.json"
          python3 "$base/verify_archives.py"
