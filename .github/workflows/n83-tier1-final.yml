name: N83 fresh-point Tier 1 paired IC versus rho

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-tier1-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  five-fresh-pairs:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 04e6a33bb67f37177b7d251982676e9dc7959682

      - name: Freeze selected candidate, fresh targets and runner allocation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 04e6a33bb67f37177b7d251982676e9dc7959682
          export GITHUB_SHA=04e6a33bb67f37177b7d251982676e9dc7959682
          mkdir -p "$RUNNER_TEMP/n83-tier1-final"
          python3 research/n83_tier1_final_20261014/generate_fixtures.py > \
            "$RUNNER_TEMP/n83-tier1-final/fixture-check.json"
          python3 research/n83_tier1_final_20261014/run.py --preflight > \
            "$RUNNER_TEMP/n83-tier1-final/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-tier1-final/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-tier1-final/cargo-version.txt"

      - name: Build and test exact IC and strong-rho workers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 04e6a33bb67f37177b7d251982676e9dc7959682
          export GITHUB_SHA=04e6a33bb67f37177b7d251982676e9dc7959682
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-tier1-final-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast \
            > "$RUNNER_TEMP/n83-tier1-final/ic-example-tests.log" 2>&1
          cargo test --release --locked --example n83_rho_optimization_eval \
            > "$RUNNER_TEMP/n83-tier1-final/rho-example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast \
            --example n83_rho_optimization_eval \
            > "$RUNNER_TEMP/n83-tier1-final/build.log" 2>&1

      - name: Run five alternating same-point candidate and rho pairs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 04e6a33bb67f37177b7d251982676e9dc7959682
          export GITHUB_SHA=04e6a33bb67f37177b7d251982676e9dc7959682
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-tier1-final-target"
          python3 research/n83_tier1_final_20261014/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --rho-binary "$CARGO_TARGET_DIR/release/examples/n83_rho_optimization_eval" \
            --output "$RUNNER_TEMP/n83-tier1-final/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-tier1-final/run.log"

      - name: Independently replay answers and evaluate Tier 1 noise gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-tier1-final/results" ]; then
            python3 research/n83_tier1_final_20261014/verify.py \
              "$RUNNER_TEMP/n83-tier1-final/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-tier1-final/verify.log"
          fi

      - name: Preserve every raw pair and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-tier1-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-tier1-final/
          if-no-files-found: error
          retention-days: 14
