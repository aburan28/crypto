# Publishes the whole GitHub Pages site (landing page, index-calculus
# scoreboard, ECC2K-130 dashboard) via scripts/site/build.py. The workflow
# name is kept for the check names other configuration refers to.
name: ECC2K-130 status pages

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ecc2k130-status.yml"
      - "scripts/rho_status/**"
      - "scripts/site/**"
      - "docs/ecc2k130-status/**"
      - "docs/site/**"
      - "docs/index-calculus-scoreboard.html"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ecc2k130-status.yml"
      - "scripts/rho_status/**"
      - "scripts/site/**"
      - "docs/ecc2k130-status/**"
      - "docs/site/**"
      - "docs/index-calculus-scoreboard.html"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ecc2k130-status-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Offline snapshot tests
        run: python3 scripts/rho_status/test_rho_status.py
      - name: Site build tests
        run: python3 scripts/site/test_build.py

  publish:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Snapshot via walker SSH hop
        env:
          RHO_WALKER_HOST: ${{ secrets.RHO_WALKER_HOST }}
          RHO_CAMPAIGN: ecc2k-130
          RHO_STATUS_OUT: docs/ecc2k130-status/status.json
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/walker.pem"
          printf '%s\n' "${{ secrets.RHO_WALKER_SSH_KEY }}" > "$RUNNER_TEMP/walker.pem"
          export RHO_WALKER_SSH_KEY="$RUNNER_TEMP/walker.pem"
          chmod +x scripts/rho_status/fetch_via_walker.sh
          scripts/rho_status/fetch_via_walker.sh
          python3 -c 'import json,sys; d=json.load(open("docs/ecc2k130-status/status.json")); assert d["campaign_id"]=="ecc2k-130"; assert "point_key" not in json.dumps(d)'

      - name: Merge previous Pages history
        env:
          PAGES_HISTORY_URL: https://aburan28.github.io/crypto/history.json
        run: |
          set -euo pipefail
          set +e
          http_code=$(curl -sS -L -o /tmp/history-prev.json -w "%{http_code}" "$PAGES_HISTORY_URL")
          curl_exit=$?
          set -e
          if [ "$http_code" = "404" ]; then
            echo '{"points":[]}' > /tmp/history-prev.json
          elif [ "$curl_exit" -ne 0 ] || [ "$http_code" != "200" ]; then
            echo "Failed to fetch live history.json (curl=$curl_exit HTTP=$http_code)" >&2
            exit 1
          fi
          python3 scripts/rho_status/render.py \
            --status docs/ecc2k130-status/status.json \
            --history-in /tmp/history-prev.json \
            --history-out docs/ecc2k130-status/history.json

      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: python3 scripts/site/build.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
