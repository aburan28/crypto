name: ECC2K-130 decision gates
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-subspace-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check exact n=131 Frobenius module dimensions
        run: python3 research/notes/ecc2k130/frobenius_subspace_gate_20260925.py
