name: Optimized IC producer admission
on:
  pull_request:
    paths:
      - 'research/ic_candidate_tournament_20260915/producer/**'
      - 'research/ic_candidate_tournament_20260915/identity.py'
      - 'research/ic_candidate_tournament_20260915/measurement.py'
      - 'research/ic_candidate_tournament_20260915/oracle.py'
      - 'research/ic_candidate_tournament_20260915/tournament.py'
      - 'research/ic_candidate_tournament_20260915/test_producer.py'
      - 'research/ic_candidate_tournament_20260915/autolab.py'
      - 'research/ic_candidate_tournament_20260915/driver_admission.py'
      - 'research/ic_candidate_tournament_20260915/generic*.py'
      - 'research/ic_candidate_tournament_20260915/goal_20260924/generic-qualification-adapter/**'
      - 'research/ic_candidate_tournament_20260915/goal_20260924/generic-reference-qualification/**'
      - 'research/ic_candidate_tournament_20260915/test_generic_qualification.py'
      - 'examples/ic_tournament_worker.rs'
      - 'research/ic_candidate_tournament_20260915/driver_smoke.py'
      - 'research/ic_candidate_tournament_20260915/test_driver_admission.py'
      - 'research/ic_candidate_tournament_20260915/qualification.py'
      - 'research/ic_candidate_tournament_20260915/qualify_references.py'
      - 'research/ic_candidate_tournament_20260915/test_qualification.py'
      - 'research/ic_candidate_tournament_20260915/goal_20260924/reference-qualification/**'
      - '.github/workflows/ic-producer.yml'
  workflow_dispatch:
    inputs:
      qualify_references:
        description: Run the frozen five-cell development qualification after all producer controls pass
        type: boolean
        default: false
      qualify_generic:
        description: Run the registered five-cell generic/reference comparison and native whole-mode observer study
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ic-producer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  archived-producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        reference: [both, scaled, pairinv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install pinned profiler and static toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind musl-tools zstd
          test "$(valgrind --version)" = valgrind-3.22.0
      - name: Restore and verify exact source before applying reviewed patches
        run: |
          python research/ic_candidate_tournament_20260915/producer/prepare.py \
            --reference '${{ matrix.reference }}' --out "$RUNNER_TEMP/ic-producer"
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['RUNNER_TEMP'])/'ic-producer/preparation.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('IC_SOURCE_MANIFEST_SHA256='+receipt['source_manifest_sha256']+'\n')
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '${{ runner.temp }}/ic-producer/source -> ../build'
          shared-key: ic-producer-${{ matrix.reference }}
      - name: Harness regression tests
        run: python -m unittest discover -s research/ic_candidate_tournament_20260915 -p 'test_*.py'
      - name: Optimized release arithmetic and strict descent controls
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ic-producer/build
        run: |
          cd "$RUNNER_TEMP/ic-producer/source"
          cargo test --locked --release --lib koblitz_tiny_ic --jobs 2
          cargo test --locked --release --lib ic_phase --jobs 2
          cargo test --locked --release --lib rho_ --jobs 2
          cargo test --locked --release --example ic_tournament_worker --jobs 2
          cargo build --locked --release --example ic_tournament_worker --jobs 2
      - name: Fixed public vectors, complete phase closure and canonical records
        run: |
          python research/ic_candidate_tournament_20260915/producer/integration.py \
            --prepared "$RUNNER_TEMP/ic-producer" \
            --worker "$RUNNER_TEMP/ic-producer/build/x86_64-unknown-linux-musl/release/examples/ic_tournament_worker" \
            --out "$RUNNER_TEMP/ic-producer-evidence"
          python "$RUNNER_TEMP/ic-producer-evidence/evaluator/producer/audit.py" "$RUNNER_TEMP"
      - name: Preserve evidence and exact derived source, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ic-producer-${{ matrix.reference }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ic-producer-evidence
            ${{ runner.temp }}/ic-producer/preparation.json
            ${{ runner.temp }}/ic-producer/source-manifest.json
            ${{ runner.temp }}/ic-producer/source
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true
      - name: Existing native and instruction driver admission controls
        if: matrix.reference == 'scaled'
        run: |
          python research/ic_candidate_tournament_20260915/driver_smoke.py \
            --prepared "$RUNNER_TEMP/ic-producer" --out "$RUNNER_TEMP/ic-driver-evidence"
      - name: Source-bound generic build and mixed-adapter tournament control
        if: matrix.reference == 'scaled'
        run: |
          cp research/ic_candidate_tournament_20260915/ci/Cargo.lock Cargo.lock
          cargo fetch --locked
          python research/ic_candidate_tournament_20260915/generic_build.py \
            --out "$RUNNER_TEMP/ic-generic-driver-build"
          env -u IC_SOURCE_MANIFEST_SHA256 RAYON_NUM_THREADS=1 cargo test --locked --release --no-default-features \
            --example ic_tournament_worker prepared_target_tests -- --ignored --test-threads=1
          python research/ic_candidate_tournament_20260915/generic_driver_smoke.py \
            --prepared "$RUNNER_TEMP/ic-producer" --generic-build "$RUNNER_TEMP/ic-generic-driver-build" \
            --out "$RUNNER_TEMP/ic-generic-driver-control"
          python research/ic_candidate_tournament_20260915/generic_observer.py prepare --control \
            --round "$RUNNER_TEMP/ic-generic-driver-control/tournament" --out "$RUNNER_TEMP/ic-generic-driver-observer"
          python "$RUNNER_TEMP/ic-generic-driver-observer/evaluator/generic_observer.py" run \
            --out "$RUNNER_TEMP/ic-generic-driver-observer"
          python "$RUNNER_TEMP/ic-generic-driver-observer/evaluator/generic_observer.py" verify \
            --out "$RUNNER_TEMP/ic-generic-driver-observer"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP'])/'ic-generic-driver-observer/summary.json').read_text())
          assert (report['pairs'], report['complete_pairs'], report['incomplete_pairs'], report['failed_pairs']) == (45,36,9,0)
          assert report['promotion_eligible'] is False and report['legacy_scientific_admission'] is None
          PY
      - name: Preserve driver controls including failed preparation and raw runs
        if: always() && matrix.reference == 'scaled'
        uses: actions/upload-artifact@v4
        with:
          name: ic-driver-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ic-driver-evidence
            ${{ runner.temp }}/ic-generic-driver-build
            ${{ runner.temp }}/ic-generic-driver-control
            ${{ runner.temp }}/ic-generic-driver-observer
            !${{ runner.temp }}/ic-driver-evidence/**/build/**
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true

  generic-reference-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.qualify_generic
    needs: archived-producer
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install calibrated profiler and static toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind musl-tools zstd
          test "$(valgrind --version)" = valgrind-3.22.0
      - uses: actions/download-artifact@v4
        with:
          pattern: ic-producer-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-producer-inputs
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ic-generic-reference-qualification
      - name: Build the source-bound generic worker
        run: |
          cp research/ic_candidate_tournament_20260915/ci/Cargo.lock Cargo.lock
          cargo fetch --locked
          python research/ic_candidate_tournament_20260915/generic_build.py \
            --out "$RUNNER_TEMP/ic-generic-qualification-build"
      - name: Execute the registered comparison and whole-mode observer study
        run: |
          python research/ic_candidate_tournament_20260915/generic_reference_qualification.py \
            --artifacts "$RUNNER_TEMP/qualified-producer-inputs" \
            --generic-build "$RUNNER_TEMP/ic-generic-qualification-build" \
            --out "$RUNNER_TEMP/ic-generic-reference-qualification"
      - name: Retain every result and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ic-generic-reference-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ic-generic-reference-qualification
            ${{ runner.temp }}/ic-generic-qualification-build
            !${{ runner.temp }}/ic-generic-reference-qualification/**/build/**
            !${{ runner.temp }}/ic-generic-qualification-build/target/**
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true

  reference-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.qualify_references
    needs: archived-producer
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install calibrated profiler and static toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind musl-tools zstd
          test "$(valgrind --version)" = valgrind-3.22.0
      - uses: actions/download-artifact@v4
        with:
          pattern: ic-producer-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-producer-inputs
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ic-reference-qualification
      - name: Qualify all archived sources and matched rho widths on one host
        run: |
          python research/ic_candidate_tournament_20260915/qualify_references.py \
            --artifacts "$RUNNER_TEMP/qualified-producer-inputs" \
            --out "$RUNNER_TEMP/ic-reference-qualification"
      - name: Preserve the declared panel and every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ic-reference-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ic-reference-qualification
            !${{ runner.temp }}/ic-reference-qualification/**/build/**
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true
