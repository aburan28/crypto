name: Koblitz Stage 31 n31 unknown scalar

on:
  pull_request:
    paths:
      - "scripts/run_koblitz_stage31_n31_unknown_scalar.py"
      - "scripts/verify_koblitz_stage30_31_results.py"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/STAGE31_N31_UNKNOWN_SCALAR.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/STAGE30_31_RESULTS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-30-n31-factor-search-result-20260911/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-31-n31-unknown-scalar-result-20260911/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-30-31-verification-20260911.json"
      - ".github/workflows/koblitz-stage31-n31-unknown-scalar.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate controls and retained results
        run: |
          python3 scripts/run_koblitz_stage31_n31_unknown_scalar.py self-test
          if test -f research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-30-31-verification-20260911.json; then
            python3 scripts/verify_koblitz_stage30_31_results.py > "$RUNNER_TEMP/stage30-31-verification.json"
            cmp "$RUNNER_TEMP/stage30-31-verification.json" research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-30-31-verification-20260911.json
          fi

  replay-retained-result:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Reverify relation logs, public solutions, and rho
        run: |
          cp research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-20-rust-build/Cargo.lock Cargo.lock
          cargo build --release --locked --bin ic
          cp -R research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-31-n31-unknown-scalar-result-20260911/stage31-run/workflow "$RUNNER_TEMP/workflow"
          target/release/ic --json workflow \
            --params research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-31-n31-unknown-scalar-result-20260911/stage31-run/params.json \
            --dir "$RUNNER_TEMP/workflow" \
            > "$RUNNER_TEMP/replay.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "replay.json").read_text())
          assert value["status"] == "complete"
          assert value["solutions"]["count"] == value["solutions"]["verified"] == 5
          assert all(row["expected"] == "not_constructed" and row["verified"] for row in value["solutions"]["items"])
          baseline = next(row["vs_rho"] for row in value["stages"] if row["stage"] == "baseline")
          assert baseline["claim_boundary"] == "public_hash_unknown_scalar"
          assert baseline["ic"]["verified"] == baseline["rho"]["verified"] == 5
          PY

  unknown-scalar:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download validated Stage-30 factor base
        uses: actions/download-artifact@v4
        with:
          name: koblitz-stage30-n31-search-34639879925
          path: ${{ runner.temp }}/stage30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34639879925
      - name: Build and charge the exact workflow binary
        run: |
          mkdir "$RUNNER_TEMP/stage31-build"
          cp research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-20-rust-build/Cargo.lock Cargo.lock
          /usr/bin/time -v -o "$RUNNER_TEMP/stage31-build/build.time" cargo build --release --locked --bin ic
      - name: Run five public unknown-scalar targets and rho
        run: |
          test -f "$RUNNER_TEMP/stage30/stage30-search/factor-base.json"
          python3 scripts/run_koblitz_stage31_n31_unknown_scalar.py run \
            --ic target/release/ic \
            --factor-base "$RUNNER_TEMP/stage30/stage30-search/factor-base.json" \
            --output "$RUNNER_TEMP/stage31-run" \
            --timeout 3600
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage31-n31-unknown-scalar-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage31-build
            ${{ runner.temp }}/stage31-run
