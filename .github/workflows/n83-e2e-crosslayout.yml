name: N83 precision-source cold root11 root22 screen

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-e2e-crosslayout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exposed-point-crosslayout:
    if: github.repository == 'aburan28/crypto' && github.ref == 'refs/heads/codex/n83-e2e-crosslayout-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Replay frozen exposed-point fixture and exact six-arm schedule
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          mkdir -p "$RUNNER_TEMP/n83-e2e-crosslayout"
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k_abba_20261015/generate.py > /dev/null
          python3 research/n83_root4_highk_20261015/generate.py > /dev/null
          python3 research/n83_best_e2e_20261015/generate.py > /dev/null
          python3 research/n83_legacy_challenger_20261015/generate.py > /dev/null
          python3 research/n83_root4_bloom_20261015/generate.py > /dev/null
          python3 research/n83_root11_highk_20261015/generate.py > /dev/null
          python3 research/n83_compact4_crosslayout_20261016/generate.py > /dev/null
          python3 research/n83_cold_factor_base_20261016/generate.py > \
            "$RUNNER_TEMP/n83-e2e-crosslayout/fixture-check.json"
          python3 research/n83_e2e_crosslayout_20261016/run.py --preflight > \
            "$RUNNER_TEMP/n83-e2e-crosslayout/schedule-preflight.json"
          python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); assert len(x["arms"]) == 6 and len({a[0] for a in x["arms"]}) == 6' \
            "$RUNNER_TEMP/n83-e2e-crosslayout/schedule-preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-e2e-crosslayout/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-e2e-crosslayout/cargo-version.txt"

      - name: Build and test exact IC and same-point rho producers
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-e2e-crosslayout-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-e2e-crosslayout/ic-example-tests.log" 2>&1
          cargo test --release --locked --example n83_rho_optimization_eval > \
            "$RUNNER_TEMP/n83-e2e-crosslayout/rho-example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-e2e-crosslayout/ic-build.log" 2>&1
          cargo build --release --locked --example n83_rho_optimization_eval > \
            "$RUNNER_TEMP/n83-e2e-crosslayout/rho-build.log" 2>&1

      - name: Run six cold arms and exposed same-point rho
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-e2e-crosslayout-target"
          python3 research/n83_e2e_crosslayout_20261016/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --rho-binary "$CARGO_TARGET_DIR/release/examples/n83_rho_optimization_eval" \
            --output "$RUNNER_TEMP/n83-e2e-crosslayout/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-e2e-crosslayout/run.log"

      - name: Independently replay bases relations answers and resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-e2e-crosslayout/results" ]; then
            python3 research/n83_e2e_crosslayout_20261016/verify.py \
              "$RUNNER_TEMP/n83-e2e-crosslayout/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-e2e-crosslayout/verify.log"
          fi

      - name: Preserve all raw receipts and failed arms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-e2e-crosslayout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-e2e-crosslayout/
          if-no-files-found: error
          retention-days: 14
