name: Koblitz Stage 35 algebraic walked descent

on:
  pull_request:
    paths:
      - "src/bin/ic/workflow.rs"
      - "tests/ic_framework.rs"
      - "scripts/run_koblitz_stage35_algebraic_walk.py"
      - "scripts/verify_koblitz_stage35_result.py"
      - "scripts/compose_koblitz_stage36_gate_audit.py"
      - "scripts/verify_koblitz_stage37_repeat.py"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-35-n41-algebraic-walk-params.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/STAGE35_N41_ALGEBRAIC_WALK.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/STAGE35_N41_ALGEBRAIC_WALK_RESULTS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/STAGE37_ALGEBRAIC_WALK_REPEAT.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/koblitz-stage35-algebraic-walk-evidence-34693802792.tar.gz"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/koblitz-stage35-algebraic-walk-evidence-34693802792.tar.gz.sha256"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-35-workflow-34693802792.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-35-artifacts-34693802792.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-35-algebraic-walk-result-20260912/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-36-current-gate-audit-20260912/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/koblitz-stage37-algebraic-walk-repeat-34694400320.tar.gz"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/koblitz-stage37-algebraic-walk-repeat-34694400320.tar.gz.sha256"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-37-repeat-workflow-34694400320.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-37-repeat-artifacts-34694400320.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-37-algebraic-walk-repeat-result-20260912/**"
      - ".github/workflows/koblitz-stage35-algebraic-walk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate walked-probe bounds and reported summands
        run: |
          python3 -m py_compile scripts/run_koblitz_stage35_algebraic_walk.py
          python3 scripts/run_koblitz_stage35_algebraic_walk.py self-test
          cp research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-20-rust-build/Cargo.lock Cargo.lock
          RUSTFLAGS=-Awarnings cargo test --locked --test ic_framework \
            workflow_runs_in_stages_and_resumes_without_redoing_work -- --exact
          rm Cargo.lock
          if test -f research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-35-algebraic-walk-result-20260912/verification.json; then
            python3 scripts/verify_koblitz_stage35_result.py verify \
              > "$RUNNER_TEMP/stage35-retained-verification.json"
          fi
          if test -f research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-36-current-gate-audit-20260912/audit.json; then
            python3 scripts/compose_koblitz_stage36_gate_audit.py verify \
              > "$RUNNER_TEMP/stage36-gate-audit.json"
          fi
          if test -f research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-37-algebraic-walk-repeat-result-20260912/verification.json; then
            python3 scripts/verify_koblitz_stage37_repeat.py verify \
              > "$RUNNER_TEMP/stage37-repeat-verification.json"
          fi
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  replay-retained-result:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Reverify algebraic base, relation logs, public targets, and rho
        run: |
          sha256sum --check research/sat_factor_base_review_20260908/continuation-05-sota-gates/koblitz-stage35-algebraic-walk-evidence-34693802792.tar.gz.sha256
          mkdir "$RUNNER_TEMP/stage35-archive"
          tar -xzf research/sat_factor_base_review_20260908/continuation-05-sota-gates/koblitz-stage35-algebraic-walk-evidence-34693802792.tar.gz \
            -C "$RUNNER_TEMP/stage35-archive"
          cp research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-20-rust-build/Cargo.lock Cargo.lock
          RUSTFLAGS=-Awarnings cargo build --release --locked --bin ic
          cp -R "$RUNNER_TEMP/stage35-archive/koblitz-stage35-algebraic-walk-34693802792/stage35-run/workflow" \
            "$RUNNER_TEMP/stage35-replay"
          target/release/ic --json workflow \
            --params "$RUNNER_TEMP/stage35-archive/koblitz-stage35-algebraic-walk-34693802792/stage35-run/params.json" \
            --dir "$RUNNER_TEMP/stage35-replay" \
            > "$RUNNER_TEMP/stage35-replay.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "stage35-replay.json").read_text())
          assert value["status"] == "complete"
          assert value["evidence_scope"] == "public_hash_unknown_scalar"
          assert value["summands"] == 3 and value["descent_summands"] == 2
          assert value["solutions"]["count"] == value["solutions"]["verified"] == 5
          assert all(row["expected"] == "not_constructed" and row["verified"] for row in value["solutions"]["items"])
          baseline = next(row["vs_rho"] for row in value["stages"] if row["stage"] == "baseline")
          assert baseline["claim_boundary"] == "public_hash_unknown_scalar"
          assert baseline["ic"]["verified"] == baseline["rho"]["verified"] == 5
          PY
          rm Cargo.lock
          python3 scripts/verify_koblitz_stage35_result.py verify \
            > "$RUNNER_TEMP/stage35-static-verification.json"

  algebraic-walk:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean dependency acquisition and four-core build
        run: |
          python3 scripts/run_koblitz_stage35_algebraic_walk.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage35-build" \
            --jobs 4 \
            --timeout 3000
      - name: Run algebraic search, logs, walked descents, and rho on one CPU
        run: |
          python3 scripts/run_koblitz_stage35_algebraic_walk.py run \
            --build "$RUNNER_TEMP/stage35-build" \
            --output "$RUNNER_TEMP/stage35-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage35_algebraic_walk.py verify \
            --build "$RUNNER_TEMP/stage35-build" \
            --output "$RUNNER_TEMP/stage35-run" \
            > "$RUNNER_TEMP/stage35-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage35-algebraic-walk-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage35-build
            ${{ runner.temp }}/stage35-run
            ${{ runner.temp }}/stage35-verification.json
