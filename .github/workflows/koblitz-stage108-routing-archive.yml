name: Koblitz Stage 108 routing selection archive

on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-routing-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Replay frozen routing evidence
        run: |
          python3 -m py_compile scripts/verify_koblitz_stage108_routing_archive.py
          python3 scripts/verify_koblitz_stage108_routing_archive.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-108-routing-selection-archive-20260913
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
