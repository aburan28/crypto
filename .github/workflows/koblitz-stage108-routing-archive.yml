name: Koblitz Stage 108 routing selection archive

on:
  pull_request:
    paths:
      - "scripts/verify_koblitz_stage108_routing_archive.py"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/STAGE108_ROUTING_SELECTION_RESULT_20260913.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-108-routing-selection-archive-20260913/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/koblitz-stage105-sharded-support-evidence-34733277351.tar.gz*"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/koblitz-stage106-shard-routing-evidence-*.tar.gz*"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/koblitz-stage107-*-evidence-*.tar.gz*"

permissions:
  contents: read

jobs:
  verify-routing-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Replay frozen routing evidence
        run: |
          python3 -m py_compile scripts/verify_koblitz_stage108_routing_archive.py
          python3 scripts/verify_koblitz_stage108_routing_archive.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-108-routing-selection-archive-20260913
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
