name: Native F5 registration custody

# Data only: never dispatch the registered worker or execute archived binaries.
on:
  pull_request:
    paths:
      - 'src/bin/icprog.rs'
      - 'src/bin/icprog/f5_control.rs'
      - 'src/cryptanalysis/prepared_control_archive.rs'
      - 'research/ic_candidate_tournament_20260915/goal_20260924/native-f5-control-registration-v1/**'
      - '.github/workflows/ic-native-f5-registration.yml'
  push:
    branches: [main]
    paths:
      - 'src/bin/icprog.rs'
      - 'src/bin/icprog/f5_control.rs'
      - 'src/cryptanalysis/prepared_control_archive.rs'
      - 'research/ic_candidate_tournament_20260915/goal_20260924/native-f5-control-registration-v1/**'
      - '.github/workflows/ic-native-f5-registration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  custody:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Bootstrap native build serialization
        run: rustc --edition 2021 src/bin/isolated_bench/busy_unix.rs -o "$RUNNER_TEMP/native-busy"
      - name: Native data controls and custody checker
        run: |
          "$RUNNER_TEMP/native-busy" busy -- cargo generate-lockfile
          rustc --version --verbose > "$RUNNER_TEMP/custody-rustc.txt"
          "$RUNNER_TEMP/native-busy" busy -- cargo test --locked --lib prepared_control_archive -- --test-threads=1
          "$RUNNER_TEMP/native-busy" busy -- cargo test --locked --bin icprog f5_control -- --test-threads=1
          "$RUNNER_TEMP/native-busy" busy -- cargo build --locked --bin icprog
      - name: Replay the exact full F5 preregistration as data
        run: |
          "$RUNNER_TEMP/native-busy" busy -- target/debug/icprog f5-control-replay-custody \
            --publication research/ic_candidate_tournament_20260915/goal_20260924/native-f5-control-registration-v1/publication \
            --registration-sha256 5a50e01c02fa7e14f227dea413cb9e569f73d68d684a68541e49fd357660f060 \
            --out "$RUNNER_TEMP/f5-registration-custody.json"
      - name: Preserve and reject the original padded gzip packaging failure
        run: |
          if "$RUNNER_TEMP/native-busy" busy -- target/debug/icprog f5-control-replay-custody \
            --publication research/ic_candidate_tournament_20260915/goal_20260924/native-f5-control-registration-v1/failed-packaging-v1 \
            --registration-sha256 5a50e01c02fa7e14f227dea413cb9e569f73d68d684a68541e49fd357660f060 \
            --out "$RUNNER_TEMP/failed-f5-custody.json" \
            > "$RUNNER_TEMP/failed-packaging.stdout" 2> "$RUNNER_TEMP/failed-packaging.stderr"; then
            echo 'The failed packaging archive must not pass custody.'; exit 1
          fi
          test ! -e "$RUNNER_TEMP/failed-f5-custody.json"
          grep -qx 'icprog: invalid gzip header' "$RUNNER_TEMP/failed-packaging.stderr"
      - uses: actions/upload-artifact@v4
        with:
          name: native-f5-registration-custody-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/f5-registration-custody.json
            ${{ runner.temp }}/failed-packaging.stdout
            ${{ runner.temp }}/failed-packaging.stderr
            ${{ runner.temp }}/custody-rustc.txt
            Cargo.lock
          if-no-files-found: error
