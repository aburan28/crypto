name: Koblitz Stage 39 fixed algebraic holdout

on:
  pull_request:
    paths:
      - "scripts/run_koblitz_stage39_fixed_algebraic_holdout.py"
      - "scripts/verify_koblitz_stage39_result.py"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/koblitz-stage39-fixed-algebraic-evidence-34699822015.tar.gz"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/koblitz-stage39-fixed-algebraic-evidence-34699822015.tar.gz.sha256"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-39-workflow-34699822015.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-39-artifacts-34699822015.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-39-fixed-algebraic-result-20260912/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-39-n41-fixed-algebraic-holdout-params.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/STAGE39_FIXED_ALGEBRAIC_HOLDOUT.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-38-algebraic-collection-result-20260912/verification.json"
      - ".github/workflows/koblitz-stage39-fixed-algebraic-holdout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate fixed algebraic rule and holdout streams
        run: |
          python3 -m py_compile scripts/run_koblitz_stage39_fixed_algebraic_holdout.py
          python3 -m py_compile scripts/verify_koblitz_stage39_result.py
          python3 scripts/run_koblitz_stage39_fixed_algebraic_holdout.py self-test
          python3 scripts/verify_koblitz_stage39_result.py > /tmp/stage39-result-verification.json
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  fixed-algebraic-holdout:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean dependency acquisition and four-core build
        run: |
          python3 scripts/run_koblitz_stage39_fixed_algebraic_holdout.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage39-build" \
            --jobs 4 \
            --timeout 3000
      - name: Run fixed algebraic construction on one CPU
        run: |
          python3 scripts/run_koblitz_stage39_fixed_algebraic_holdout.py run \
            --build "$RUNNER_TEMP/stage39-build" \
            --params research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-39-n41-fixed-algebraic-holdout-params.json \
            --output "$RUNNER_TEMP/stage39-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage39_fixed_algebraic_holdout.py verify \
            --build "$RUNNER_TEMP/stage39-build" \
            --output "$RUNNER_TEMP/stage39-run" \
            > "$RUNNER_TEMP/stage39-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage39-fixed-algebraic-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage39-build
            ${{ runner.temp }}/stage39-run
            ${{ runner.temp }}/stage39-verification.json
