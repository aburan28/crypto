name: Koblitz Stage 136 current gate audit
on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay Stage 135 historical audit and Stage 136 current audit
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage135_gate_audit.py scripts/compose_koblitz_stage136_gate_audit.py
          python3 -m json.tool docs/ic/runs/koblitz-n59-l15-collector-tuning-20260921.json >/dev/null
          python3 scripts/compose_koblitz_stage135_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-135-current-gate-audit-20260921 > "$RUNNER_TEMP/stage135-historical.json"
          python3 scripts/compose_koblitz_stage136_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-136-current-gate-audit-20260921 > "$RUNNER_TEMP/stage136-current.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
