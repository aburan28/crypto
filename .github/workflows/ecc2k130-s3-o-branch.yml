name: ECC2K-130 O-aware recursive S3 CNF gate
on:
  pull_request:
    paths:
      - 'research/notes/ecc2k130/rotated_s3_o_branch_20260925/**'
      - 'research/notes/ecc2k130/rotated_subspace_support_20260925/gate.py'
      - '.github/workflows/ecc2k130-s3-o-branch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check frozen sources
        run: |
          python3 -m py_compile research/notes/ecc2k130/rotated_s3_o_branch_20260925/{export,verify,run,ci_replay}.py
          python3 research/notes/ecc2k130/rotated_s3_o_branch_20260925/ci_replay.py
      - name: Check committed evidence when present
        run: |
          receipt=research/notes/ecc2k130/rotated_s3_o_branch_20260925/evidence/receipt.json
          if test -f "$receipt"; then
            python3 research/notes/ecc2k130/rotated_s3_o_branch_20260925/ci_replay.py --evidence "$receipt"
          fi
