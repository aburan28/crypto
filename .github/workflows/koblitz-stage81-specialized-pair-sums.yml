name: Koblitz Stage 81 n53 specialized initial pair sums

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage81_specialized_pair_sums.py"
      - ".github/workflows/koblitz-stage81-specialized-pair-sums.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate specialized initial-pair-sum controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage81_specialized_pair_sums.py
          python3 scripts/run_koblitz_stage81_specialized_pair_sums.py self-test
          cargo test --release --example koblitz_rank_fixture
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-specialized-pair-sums:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage81_specialized_pair_sums.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage81-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare generic pair sums, specialized pair sums, and rho
        run: |
          python3 scripts/run_koblitz_stage81_specialized_pair_sums.py run \
            --build "$RUNNER_TEMP/stage81-build" \
            --output "$RUNNER_TEMP/stage81-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage81_specialized_pair_sums.py verify \
            --build "$RUNNER_TEMP/stage81-build" \
            --output "$RUNNER_TEMP/stage81-run" \
            > "$RUNNER_TEMP/stage81-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage81-specialized-pair-sums-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage81-build
            ${{ runner.temp }}/stage81-run
            ${{ runner.temp }}/stage81-verification.json
