name: Koblitz Stage 77 n53 compact query scratch

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage77_compact_scratch.py"
      - ".github/workflows/koblitz-stage77-compact-scratch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate compact query scratch controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage77_compact_scratch.py
          python3 scripts/run_koblitz_stage77_compact_scratch.py self-test
          cargo test --release --example koblitz_rank_fixture
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-compact-scratch:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage77_compact_scratch.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage77-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare optional scratch, compact scratch, and rho
        run: |
          python3 scripts/run_koblitz_stage77_compact_scratch.py run \
            --build "$RUNNER_TEMP/stage77-build" \
            --output "$RUNNER_TEMP/stage77-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage77_compact_scratch.py verify \
            --build "$RUNNER_TEMP/stage77-build" \
            --output "$RUNNER_TEMP/stage77-run" \
            > "$RUNNER_TEMP/stage77-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage77-compact-scratch-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage77-build
            ${{ runner.temp }}/stage77-run
            ${{ runner.temp }}/stage77-verification.json
