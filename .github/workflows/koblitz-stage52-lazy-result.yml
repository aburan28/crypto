name: Koblitz Stage 52 lazy-label result

on:
  pull_request:
    paths:
      - "scripts/verify_koblitz_stage52_lazy_result.py"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/koblitz-stage52-n53-lazy-evidence-34711534312.tar.gz*"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-52-*-34711534312.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-52-n53-lazy-result-20260912/**"
      - ".github/workflows/koblitz-stage52-lazy-result.yml"

permissions:
  contents: read

jobs:
  verify-hosted-result:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify hosted lazy-label result
        run: |
          python3 -m py_compile scripts/verify_koblitz_stage52_lazy_result.py
          python3 scripts/verify_koblitz_stage52_lazy_result.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-52-n53-lazy-result-20260912 \
            > "$RUNNER_TEMP/stage52-verification.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
