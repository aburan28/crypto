name: ECC2K local certification gates
on:
  pull_request:
    paths:
      - 'ecc2k130/**'
      - 'src/cryptanalysis/ecc2k130_guard.rs'
      - 'src/bin/ecc2k_guard.rs'
      - '.github/workflows/ecc2k130-certification.yml'
  push:
    branches: [main]
    paths:
      - 'ecc2k130/**'
      - 'src/cryptanalysis/ecc2k130_guard.rs'
      - 'src/bin/ecc2k_guard.rs'
      - '.github/workflows/ecc2k130-certification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The sigma step schedule must exclude orbit returns through the tested bound: a walk
  # caught in one runs to maxIters and reports nothing, on the campaign's
  # budget. `check-cycles` exits non-zero on a real hit or a degenerate step.
  no-fruitless-cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib ecc2k130_guard
      - run: make -C ecc2k130 check-cycles

  local-software:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # boto3 for the ingest's own tests: test_dp_ingest.py is offline
      # but imports the module, which reaches for boto3 to build a
      # database URL from Secrets Manager.
      - run: python -m pip install numpy==2.2.6 boto3
      # `build/test-production` is the binary; `test-production` is the
      # target that RUNS it and the aws test modules. Naming the file
      # compiled the tests and never ran one.
      - run: make -C ecc2k130 cpu test-production
      - name: Cycle hint and common-exit regressions
        run: make -C ecc2k130 test-cycle-rule test-cycle-escape test-table-walk-host TABLE_PROBE_POINTS=16
      - name: Table replay, format isolation and restart regressions
        run: |
          g++ -O2 -std=c++17 -DECC_NO_CUDA -DECC_BATCH=2 -DECC_WALK_TABLE=1 -Wno-unknown-pragmas ecc2k130/src/testproduction.cpp -o /tmp/test-production-table
          /tmp/test-production-table
      # Generated-header checks, the CLI checks and the codegen unit tests.
      # Nothing ran them in CI, and testdirectbuild.py sat red on main for
      # days after modal_app.py's image grew CPU_THREADS and CPU_BINARIES.
      - run: make -C ecc2k130 check-cli
      - run: make -C ecc2k130 certify-local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-certification-not-live-production
          path: |
            ecc2k130/build/certification-local.json
            ecc2k130/build/certification-local-logs/

  table-cuda-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA compiler (no GPU needed)
        run: |
          curl -sSfLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cuda-nvcc-12-9 cuda-cudart-dev-12-9
          echo /usr/local/cuda-12.9/bin >> "$GITHUB_PATH"
      - name: Compile both cold-path table layouts
        run: |
          nvcc -O2 -std=c++17 -arch=sm_90 --diag-error=20011,20014 -DECC_WALK_TABLE=1 -c ecc2k130/src/testtablewalkcuda.cu -o /tmp/table-probe.o
          nvcc -O2 -std=c++17 -arch=sm_90 --diag-error=20011,20014 -DECC_WALK_TABLE=1 -DECC_TABLE_PIVOT_BYTES=1 -DECC_TABLE_ADDEND_GLOBAL=1 -c ecc2k130/src/testtablewalkcuda.cu -o /tmp/table-probe-hybrid.o
      - name: Compile packed table client
        run: |
          nvcc -O2 -std=c++17 -arch=sm_90 --diag-error=20011,20014 -DECC_WALK_TABLE=1 -DECC_WITNESS=0 -DECC_BATCH=2 -DECC_PACKED_WEIGHTED_PREFIX=2 -DECC_PACKED_POLY_STATE=1 -DECC_PACKED_POLY_CHAIN=1 -DECC_PACKED_CACHE_DENOM=1 -DECC_PACKED_PAIR_PRODUCTS=1 -DECC_PACKED_UNROLL_INV=1 -DECC_TABLE_TAG_DENOM=1 -c ecc2k130/src/main.cu -o /tmp/table-client.o
