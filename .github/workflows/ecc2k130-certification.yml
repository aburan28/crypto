name: ECC2K local certification gates
on:
  pull_request:
    paths:
      - 'ecc2k130/**'
      - 'src/cryptanalysis/ecc2k130_guard.rs'
      - 'src/bin/ecc2k_guard.rs'
      - '.github/workflows/ecc2k130-certification.yml'
  push:
    branches: [main]
    paths:
      - 'ecc2k130/**'
      - 'src/cryptanalysis/ecc2k130_guard.rs'
      - 'src/bin/ecc2k_guard.rs'
      - '.github/workflows/ecc2k130-certification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The walk's step schedule must never admit a fruitless cycle: a walk
  # caught in one runs to maxIters and reports nothing, on the campaign's
  # budget. `check-cycles` exits non-zero on a real hit or a degenerate step.
  no-fruitless-cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib ecc2k130_guard
      - run: make -C ecc2k130 check-cycles

  local-software:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # boto3 for the ingest's own tests: test_dp_ingest.py is offline
      # but imports the module, which reaches for boto3 to build a
      # database URL from Secrets Manager.
      - run: python -m pip install numpy==2.2.6 boto3
      # `build/test-production` is the binary; `test-production` is the
      # target that RUNS it and the aws test modules. Naming the file
      # compiled the tests and never ran one.
      - run: make -C ecc2k130 cpu test-production
      - run: make -C ecc2k130 certify-local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-certification-not-live-production
          path: |
            ecc2k130/build/certification-local.json
            ecc2k130/build/certification-local-logs/
