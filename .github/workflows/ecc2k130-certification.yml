name: ECC2K local certification gates
on:
  pull_request:
    paths:
      - 'ecc2k130/**'
      - 'src/cryptanalysis/ecc2k130_guard.rs'
      - 'src/bin/ecc2k_guard.rs'
      - 'src/cryptanalysis/ecc2k130_merge.rs'
      - 'src/bin/ecc2k_merge.rs'
      - '.github/workflows/ecc2k130-certification.yml'
  push:
    branches: [main]
    paths:
      - 'ecc2k130/**'
      - 'src/cryptanalysis/ecc2k130_guard.rs'
      - 'src/bin/ecc2k_guard.rs'
      - 'src/cryptanalysis/ecc2k130_merge.rs'
      - 'src/bin/ecc2k_merge.rs'
      - '.github/workflows/ecc2k130-certification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The generator's own checks: the packed/sigma/reduction generators agree
  # with the committed headers, the Modal entry points survive click, the
  # autolab self-test, the codegen unit tests (report parsing, autotune,
  # audits, the lambda-projective formulas and price table against
  # LAMBDA-PROJECTIVE.md). Ten seconds, nothing compiled, nothing installed:
  # the failures it catches were invisible until someone ran `make check-cli`
  # by hand. The fruitless-cycle check has its own job below.
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make -C ecc2k130 check-cli
      - run: make -C ecc2k130 test-sigma-fused-shared-scratch-model
      - run: python3 ecc2k130/codegen/lambda_projective.py --table

  # The sigma step schedule must exclude orbit returns through the tested bound: a walk
  # caught in one runs to maxIters and reports nothing, on the campaign's
  # budget. `check-cycles` exits non-zero on a real hit or a degenerate step.
  no-fruitless-cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib ecc2k130_guard
      - run: make -C ecc2k130 check-cycles

  # The Rust merge (ecc2k-merge) must stay byte-for-byte with merge.py until
  # merge.py is retired: the certification suite's merge tests run against
  # it, then test_merge_parity.py holds the two side by side on real corpora.
  merge-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 boto3
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib ecc2k130_merge
      - run: cargo build --release --bin ecc2k-merge
      - run: make -C ecc2k130 cpu build/test-production
      - name: Certification merge tests against the Rust merge
        run: ECC_MERGE_BIN="$PWD/target/release/ecc2k-merge" python3 -m unittest discover -s ecc2k130/aws -p test_certification.py -v
      - name: Byte-for-byte parity with merge.py
        run: ECC_MERGE_BIN="$PWD/target/release/ecc2k-merge" python3 -m unittest discover -s ecc2k130/aws -p test_merge_parity.py -v

  local-software:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # boto3 for the ingest's own tests: test_dp_ingest.py is offline
      # but imports the module, which reaches for boto3 to build a
      # database URL from Secrets Manager.
      - run: python -m pip install numpy==2.2.6 boto3
      # `build/test-production` is the binary; `test-production` is the
      # target that RUNS it and the aws test modules. Naming the file
      # compiled the tests and never ran one.
      - run: make -C ecc2k130 cpu test-production
      - name: Cycle hint and common-exit regressions
        run: make -C ecc2k130 test-cycle-rule test-cycle-escape test-table-walk-host TABLE_PROBE_POINTS=16
      - name: Table replay, format isolation and restart regressions
        run: |
          g++ -O2 -std=c++17 -DECC_NO_CUDA -DECC_BATCH=2 -DECC_WALK_TABLE=1 -Wno-unknown-pragmas ecc2k130/src/testproduction.cpp -o /tmp/test-production-table
          /tmp/test-production-table
      # Generated-header checks, the CLI checks and the codegen unit tests.
      # Nothing ran them in CI, and testdirectbuild.py sat red on main for
      # days after modal_app.py's image grew CPU_THREADS and CPU_BINARIES.
      - run: make -C ecc2k130 check-cli
      - run: make -C ecc2k130 certify-local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-certification-not-live-production
          path: |
            ecc2k130/build/certification-local.json
            ecc2k130/build/certification-local-logs/

  table-cuda-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA compiler (no GPU needed)
        run: |
          curl -sSfLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cuda-nvcc-12-9 cuda-cudart-dev-12-9
          echo /usr/local/cuda-12.9/bin >> "$GITHUB_PATH"
      - name: Compile both cold-path table layouts
        run: |
          nvcc -O2 -std=c++17 -arch=sm_90 --diag-error=20011,20014 -DECC_WALK_TABLE=1 -c ecc2k130/src/testtablewalkcuda.cu -o /tmp/table-probe.o
          nvcc -O2 -std=c++17 -arch=sm_90 --diag-error=20011,20014 -DECC_WALK_TABLE=1 -DECC_TABLE_PIVOT_BYTES=1 -DECC_TABLE_ADDEND_GLOBAL=1 -c ecc2k130/src/testtablewalkcuda.cu -o /tmp/table-probe-hybrid.o
      - name: Compile packed table client
        run: |
          nvcc -O2 -std=c++17 -arch=sm_90 --diag-error=20011,20014 -DECC_WALK_TABLE=1 -DECC_WITNESS=0 -DECC_BATCH=2 -DECC_PACKED_WEIGHTED_PREFIX=2 -DECC_PACKED_POLY_STATE=1 -DECC_PACKED_POLY_CHAIN=1 -DECC_PACKED_CACHE_DENOM=1 -DECC_PACKED_PAIR_PRODUCTS=1 -DECC_PACKED_UNROLL_INV=1 -DECC_TABLE_TAG_DENOM=1 -c ecc2k130/src/main.cu -o /tmp/table-client.o
      - name: Compile GPU-wide hint stages (no GPU needed)
        run: |
          for resolver_threads in 128 256 512; do
            nvcc -O2 -std=c++17 -arch=sm_90 --diag-error=20011,20014 \
              -DECC_WALK_TABLE=1 -DECC_WITNESS=0 -DECC_BATCH=2 -DECC_THREADS=128 -DECC_MINBLOCKS=1 \
              -DECC_PACKED_WEIGHTED_PREFIX=2 -DECC_PACKED_POLY_STATE=1 -DECC_PACKED_POLY_CHAIN=1 \
              -DECC_PACKED_CACHE_DENOM=1 -DECC_PACKED_PAIR_PRODUCTS=1 -DECC_PACKED_UNROLL_INV=1 \
              -DECC_TABLE_TAG_DENOM=1 -DECC_TABLE_PIPE_SELECT=1 -DECC_TABLE_SPLIT_FORWARD=1 \
              -DECC_TABLE_BATCH_HINTS=1 -DECC_TABLE_GLOBAL_HINTS=1 \
              -DECC_TABLE_GLOBAL_HINT_THREADS="$resolver_threads" \
              -c ecc2k130/src/main.cu -o "/tmp/table-global-hints-client-$resolver_threads.o"
          done
          g++ -O2 -std=c++17 -Wall -Wextra -Werror \
            ecc2k130/benchmarks/global-hints/test_queue.cpp -o /tmp/table-global-hints-model
          /tmp/table-global-hints-model
          g++ -O2 -std=c++17 -Wall -Wextra -Werror \
            ecc2k130/benchmarks/global-hints/summarize.cpp -o /tmp/table-global-hints-summary
          /tmp/table-global-hints-summary --self-test
          g++ -O2 -std=c++17 -Wall -Wextra -Werror \
            ecc2k130/benchmarks/global-hints/independent_audit.cpp -o /tmp/table-global-hints-audit
          /tmp/table-global-hints-audit --self-test
          g++ -O2 -std=c++17 -Wall -Wextra -Werror \
            ecc2k130/benchmarks/global-hints/resolver-geometry/summarize.cpp \
            -o /tmp/table-global-hints-geometry-summary
          /tmp/table-global-hints-geometry-summary --self-test
          g++ -O2 -std=c++17 -Wall -Wextra -Werror \
            ecc2k130/benchmarks/global-hints/resolver-geometry/independent_audit.cpp \
            -o /tmp/table-global-hints-geometry-audit
          /tmp/table-global-hints-geometry-audit --self-test
