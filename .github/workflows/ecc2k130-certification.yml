name: ECC2K local certification gates
on:
  pull_request:
    paths:
      - 'ecc2k130/**'
      - '.github/workflows/ecc2k130-certification.yml'
  push:
    branches: [main]
    paths:
      - 'ecc2k130/**'
      - '.github/workflows/ecc2k130-certification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The generator's own checks: the packed/sigma/reduction generators agree
  # with the committed headers, the Modal entry points survive click, the
  # autolab self-test, the codegen unit tests (report parsing, autotune,
  # audits, the lambda-projective formulas and price table against
  # LAMBDA-PROJECTIVE.md) and the fruitless-cycle check on every curve.
  # Ten seconds, nothing compiled, nothing installed: the failures it catches
  # were invisible until someone ran `make check-cli` by hand.
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make -C ecc2k130 check-cli
      - run: make -C ecc2k130 check-cycles
      - run: python3 ecc2k130/codegen/lambda_projective.py --table

  local-software:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6
      - run: make -C ecc2k130 cpu build/test-production
      - run: make -C ecc2k130 certify-local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-certification-not-live-production
          path: |
            ecc2k130/build/certification-local.json
            ecc2k130/build/certification-local-logs/
