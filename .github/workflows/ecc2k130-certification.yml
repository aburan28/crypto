name: ECC2K local certification gates
on:
  pull_request:
    paths:
      - 'ecc2k130/**'
      - 'src/cryptanalysis/ecc2k130_guard.rs'
      - 'src/bin/ecc2k_guard.rs'
      - '.github/workflows/ecc2k130-certification.yml'
  push:
    branches: [main]
    paths:
      - 'ecc2k130/**'
      - 'src/cryptanalysis/ecc2k130_guard.rs'
      - 'src/bin/ecc2k_guard.rs'
      - '.github/workflows/ecc2k130-certification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The generator's own checks: the packed/sigma/reduction generators agree
  # with the committed headers, the Modal entry points survive click, the
  # autolab self-test, the codegen unit tests (report parsing, autotune,
  # audits, the lambda-projective formulas and price table against
  # LAMBDA-PROJECTIVE.md). Ten seconds, nothing compiled, nothing installed:
  # the failures it catches were invisible until someone ran `make check-cli`
  # by hand. The fruitless-cycle check has its own job below.
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make -C ecc2k130 check-cli
      - run: python3 ecc2k130/codegen/lambda_projective.py --table

  # The sigma step schedule must exclude orbit returns through the tested bound: a walk
  # caught in one runs to maxIters and reports nothing, on the campaign's
  # budget. `check-cycles` exits non-zero on a real hit or a degenerate step.
  no-fruitless-cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib ecc2k130_guard
      - run: make -C ecc2k130 check-cycles

  local-software:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # boto3 for the ingest's own tests: test_dp_ingest.py is offline
      # but imports the module, which reaches for boto3 to build a
      # database URL from Secrets Manager.
      - run: python -m pip install numpy==2.2.6 boto3
      # `build/test-production` is the binary; `test-production` is the
      # target that RUNS it and the aws test modules. Naming the file
      # compiled the tests and never ran one.
      - run: make -C ecc2k130 cpu test-production
      - name: Cycle hint and common-exit regressions
        run: make -C ecc2k130 test-cycle-rule test-cycle-escape test-table-walk-host TABLE_PROBE_POINTS=16
      - name: Table replay, format isolation and restart regressions
        run: |
          g++ -O2 -std=c++17 -DECC_NO_CUDA -DECC_BATCH=2 -DECC_WALK_TABLE=1 -Wno-unknown-pragmas ecc2k130/src/testproduction.cpp -o /tmp/test-production-table
          /tmp/test-production-table
      # Generated-header checks, the CLI checks and the codegen unit tests.
      # Nothing ran them in CI, and testdirectbuild.py sat red on main for
      # days after modal_app.py's image grew CPU_THREADS and CPU_BINARIES.
      - run: make -C ecc2k130 check-cli
      - run: make -C ecc2k130 certify-local
      - name: Sigma-fused square-table native replay
        run: make -C ecc2k130 test-sigma-square-table-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-certification-not-live-production
          path: |
            ecc2k130/build/certification-local.json
            ecc2k130/build/certification-local-logs/

  table-cuda-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA compiler (no GPU needed)
        run: |
          curl -sSfLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cuda-nvcc-12-9 cuda-cudart-dev-12-9
          echo /usr/local/cuda-12.9/bin >> "$GITHUB_PATH"
      - name: Compile both cold-path table layouts
        run: |
          nvcc -O2 -std=c++17 -arch=sm_90 --diag-error=20011,20014 -DECC_WALK_TABLE=1 -c ecc2k130/src/testtablewalkcuda.cu -o /tmp/table-probe.o
          nvcc -O2 -std=c++17 -arch=sm_90 --diag-error=20011,20014 -DECC_WALK_TABLE=1 -DECC_TABLE_PIVOT_BYTES=1 -DECC_TABLE_ADDEND_GLOBAL=1 -c ecc2k130/src/testtablewalkcuda.cu -o /tmp/table-probe-hybrid.o
      - name: Compile packed table client
        run: |
          nvcc -O2 -std=c++17 -arch=sm_90 --diag-error=20011,20014 -DECC_WALK_TABLE=1 -DECC_WITNESS=0 -DECC_BATCH=2 -DECC_PACKED_WEIGHTED_PREFIX=2 -DECC_PACKED_POLY_STATE=1 -DECC_PACKED_POLY_CHAIN=1 -DECC_PACKED_CACHE_DENOM=1 -DECC_PACKED_PAIR_PRODUCTS=1 -DECC_PACKED_UNROLL_INV=1 -DECC_TABLE_TAG_DENOM=1 -c ecc2k130/src/main.cu -o /tmp/table-client.o
      - name: Compile sigma-fused square-table client
        run: |
          nvcc -O2 -std=c++17 -arch=sm_90 --diag-error=20011,20014 \
            -DECC_BATCH=16 -DECC_THREADS=256 -DECC_MINBLOCKS=2 -DECC_WITNESS=0 \
            -DECC_PACKED_SINGLE_PRODUCT=1 -DECC_PACKED_CACHE_DENOM=1 -DECC_PACKED_BY_VALUE=1 \
            -DECC_PACKED_PERM_SIGMA=3 -DECC_PACKED_POLY_CHAIN=1 -DECC_PACKED_UNROLL_INV=1 \
            -DECC_PACKED_PAIR_PRODUCTS=1 -DECC_PACKED_POLY_STATE=1 -DECC_PACKED_DIRECT_REDUCE=1 \
            -DECC_PACKED_GENERATED_PRODUCT=1 -DECC_PACKED_INLINE_POLY=3 -DECC_PACKED_CLMAD=0 \
            -DECC_PACKED_WEIGHTED_PREFIX=2 -DECC_PACKED_COMPACT_STATE=1 \
            -DECC_PACKED_SHARED_SIGMA=1 -DECC_PACKED_STATE_TILE=256 \
            -DECC_SIGMA_FUSED=1 -DECC_SIGMA_SQUARE_TABLE=1 -DECC_PACKED_ALU_SQUARE=0 \
            -DECC_PACKED_SQUARE_TABLE=0 -DECC_WALK_TABLE=0 -DECC_TABLE_TAG_DENOM=0 \
            -c ecc2k130/src/main.cu -o /tmp/sigma-square-table-client.o
      - name: Compile GPU-wide hint stages (no GPU needed)
        run: |
          nvcc -O2 -std=c++17 -arch=sm_90 --diag-error=20011,20014 \
            -DECC_WALK_TABLE=1 -DECC_WITNESS=0 -DECC_BATCH=2 -DECC_THREADS=128 -DECC_MINBLOCKS=1 \
            -DECC_PACKED_WEIGHTED_PREFIX=2 -DECC_PACKED_POLY_STATE=1 -DECC_PACKED_POLY_CHAIN=1 \
            -DECC_PACKED_CACHE_DENOM=1 -DECC_PACKED_PAIR_PRODUCTS=1 -DECC_PACKED_UNROLL_INV=1 \
            -DECC_TABLE_TAG_DENOM=1 -DECC_TABLE_PIPE_SELECT=1 -DECC_TABLE_SPLIT_FORWARD=1 \
            -DECC_TABLE_BATCH_HINTS=1 -DECC_TABLE_GLOBAL_HINTS=1 \
            -c ecc2k130/src/main.cu -o /tmp/table-global-hints-client.o
          g++ -O2 -std=c++17 -Wall -Wextra -Werror \
            ecc2k130/benchmarks/global-hints/test_queue.cpp -o /tmp/table-global-hints-model
          /tmp/table-global-hints-model
          g++ -O2 -std=c++17 -Wall -Wextra -Werror \
            ecc2k130/benchmarks/global-hints/summarize.cpp -o /tmp/table-global-hints-summary
          /tmp/table-global-hints-summary --self-test
          g++ -O2 -std=c++17 -Wall -Wextra -Werror \
            ecc2k130/benchmarks/global-hints/independent_audit.cpp -o /tmp/table-global-hints-audit
          /tmp/table-global-hints-audit --self-test

  sigma-square-sm120-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: nvidia/cuda:13.3.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native host compiler
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential binutils
      - name: Compile exact sm_120 control and candidate without a GPU
        shell: bash
        run: |
          set -euo pipefail
          out=ecc2k130/benchmarks/sigma-square-table/compile-artifact
          mkdir -p "$out"
          nvcc --version | tee "$out/nvcc-version.txt"
          grep -q 'V13\.3\.73' "$out/nvcc-version.txt"
          common=(
            -O3 -std=c++17 -gencode arch=compute_120,code=sm_120 -lineinfo -Xptxas -v
            -Xcompiler -O3 -Xcompiler -fopenmp
            -DECC_BATCH=16 -DECC_THREADS=256 -DECC_MINBLOCKS=2 -DECC_WITNESS=0
            -DECC_PACKED_SINGLE_PRODUCT=1 -DECC_PACKED_CACHE_DENOM=1 -DECC_PACKED_BY_VALUE=1
            -DECC_PACKED_PERM_SIGMA=3 -DECC_PACKED_POLY_CHAIN=1 -DECC_PACKED_UNROLL_INV=1
            -DECC_PACKED_PAIR_PRODUCTS=1 -DECC_PACKED_POLY_STATE=1 -DECC_PACKED_DIRECT_REDUCE=1
            -DECC_PACKED_GENERATED_PRODUCT=1 -DECC_PACKED_INLINE_POLY=3 -DECC_PACKED_CLMAD=1
            -DECC_PACKED_CLMAD_SQUARE=0 -DECC_PACKED_KARAT3=0 -DECC_PACKED_WEIGHTED_PREFIX=2
            -DECC_PACKED_COMPACT_STATE=1 -DECC_PACKED_SHARED_SIGMA=1 -DECC_PACKED_TOP_CLMAD=0
            -DECC_PACKED_STATE_TILE=256 -DECC_PACKED_ADD_COMBINE=0 -DECC_PACKED_PAIR_ILP=0
            -DECC_UNROLL_SLOTS=1 -DECC_PACKED_SLOT_PREFETCH=0 -DECC_PACKED_SLOT_PIPELINE=0
            -DECC_SIGMA_FUSED=1 -DECC_SIGMA_FUSED_LATE_Y=0 -DECC_PACKED_L2_PERSIST=0
            -DECC_PACKED_TOP_HOIST=0 -DECC_PACKED_ONB_INV=0 -DECC_PACKED_FROM_REDUCED=0
            -DECC_PACKED_CLMUL_FLAT=0 -DECC_PACKED_PAIR_CLMUL=0 -DECC_PACKED_ALU_SQR=0
            -DECC_PACKED_ALU_SQUARE=0 -DECC_PACKED_SQUARE_TABLE=0 -DECC_PACKED_INV_POLY=0
            -DECC_PACKED_CHAINS=1 -DECC_WALK_TABLE=0 -DECC_TABLE_BRANCHES=8
            -DECC_TABLE_PIVOT_BYTES=0 -DECC_TABLE_PHASE_POPC=0 -DECC_TABLE_TAG_DENOM=0
            -DECC_TABLE_FUSED=0 -DECC_TABLE_FUSED_PIPE=0 -DECC_TABLE_PIPE_SELECT=0
            -DECC_TABLE_SPLIT_FORWARD=0 -DECC_TABLE_BATCH_HINTS=0 -DECC_TABLE_BLOCK_HINTS=0
            -DECC_TABLE_GLOBAL_HINTS=0 -DECC_TABLE_HINT_QUEUE=512 -DECC_TABLE_GLOBAL=0
            -DECC_TABLE_ADDEND_GLOBAL=0 -DECC_CYCLE_FAST2=0 -DECC_CYCLE_PROFILE=0
            -DECC_PACKED_CHAIN_FIRST=0 -DECC_PHASE_PROFILE=0
          )
          printf '%q ' nvcc "${common[@]}" > "$out/common-command.txt"
          printf '\n' >> "$out/common-command.txt"
          nvcc "${common[@]}" -DECC_SIGMA_SQUARE_TABLE=0 ecc2k130/src/main.cu \
            -o "$out/control" -lgomp > "$out/control-build.log" 2>&1
          nvcc "${common[@]}" -DECC_SIGMA_SQUARE_TABLE=1 ecc2k130/src/main.cu \
            -o "$out/candidate" -lgomp > "$out/candidate-build.log" 2>&1
          for arm in control candidate; do
            table=0
            [ "$arm" = candidate ] && table=1
            nvcc "${common[@]}" -DECC_SIGMA_SQUARE_TABLE="$table" \
              -c ecc2k130/src/testpackedcuda.cu -o "$out/probe-$arm-packed.o" \
              > "$out/probe-$arm-packed.log" 2>&1
            nvcc "${common[@]}" -DECC_SIGMA_SQUARE_TABLE="$table" \
              -c ecc2k130/src/testpackedstatecuda.cu -o "$out/probe-$arm-storage.o" \
              > "$out/probe-$arm-storage.log" 2>&1
            nvcc "${common[@]}" -DECC_SIGMA_SQUARE_TABLE="$table" \
              -c ecc2k130/src/testsharedsigmacuda.cu -o "$out/probe-$arm-shared-sigma.o" \
              > "$out/probe-$arm-shared-sigma.log" 2>&1
          done
          cuobjdump --dump-resource-usage "$out/control" > "$out/control-resources.txt"
          cuobjdump --dump-resource-usage "$out/candidate" > "$out/candidate-resources.txt"
          cuobjdump --dump-sass "$out/control" > "$out/control.sass"
          cuobjdump --dump-sass "$out/candidate" > "$out/candidate.sass"
          sha256sum "$out/control" "$out/candidate" "$out"/*.o "$out"/*.log "$out"/*.txt "$out"/*.sass \
            > "$out/files.sha256"
          grep -q '0 bytes spill stores, 0 bytes spill loads' "$out/control-build.log"
          grep -q '0 bytes spill stores, 0 bytes spill loads' "$out/candidate-build.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sigma-square-table-sm120-compile
          path: ecc2k130/benchmarks/sigma-square-table/compile-artifact/
