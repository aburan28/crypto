name: Koblitz Stage 95 n53 Itoh width sweep

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage95_itoh_width.py"
      - ".github/workflows/koblitz-stage95-itoh-width.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate Itoh width controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage95_itoh_width.py
          python3 scripts/run_koblitz_stage95_itoh_width.py self-test
          cargo test --release --example koblitz_rank_fixture
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-itoh-width:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage95_itoh_width.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage95-build" \
            --jobs 4 \
            --timeout 1800
      - name: Sweep 1024, 2048, and 4096 cursor widths
        run: |
          python3 scripts/run_koblitz_stage95_itoh_width.py run \
            --build "$RUNNER_TEMP/stage95-build" \
            --output "$RUNNER_TEMP/stage95-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage95_itoh_width.py verify \
            --build "$RUNNER_TEMP/stage95-build" \
            --output "$RUNNER_TEMP/stage95-run" \
            > "$RUNNER_TEMP/stage95-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage95-itoh-width-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage95-build
            ${{ runner.temp }}/stage95-run
            ${{ runner.temp }}/stage95-verification.json
