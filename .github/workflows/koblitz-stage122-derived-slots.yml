name: Koblitz Stage 122 n53 derived dense slots

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage122_derived_slots.py"
      - ".github/workflows/koblitz-stage122-derived-slots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate derived-slot controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage122_derived_slots.py
          python3 scripts/run_koblitz_stage122_derived_slots.py self-test
          cargo test --release --example koblitz_rank_fixture
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-derived-slots:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage122_derived_slots.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage122-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare stored and derived dense scan slots
        run: |
          python3 scripts/run_koblitz_stage122_derived_slots.py run \
            --build "$RUNNER_TEMP/stage122-build" \
            --output "$RUNNER_TEMP/stage122-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage122_derived_slots.py verify \
            --build "$RUNNER_TEMP/stage122-build" \
            --output "$RUNNER_TEMP/stage122-run" \
            > "$RUNNER_TEMP/stage122-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage122-derived-slots-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage122-build
            ${{ runner.temp }}/stage122-run
            ${{ runner.temp }}/stage122-verification.json
