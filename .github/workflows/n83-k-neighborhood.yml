name: N83 root11 K-neighborhood sealed replay

on:
  push:
    branches: [codex/n83-k-neighborhood-20261015]
    paths:
      - .github/workflows/n83-k-neighborhood.yml
      - research/n83_k_neighborhood_20261015/**
      - research/n83_k_neighborhood_results_20261015/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: n83-k-neighborhood-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sealed-four-arm-neighborhood:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the executed source snapshot
        shell: bash
        run: |
          set -euo pipefail
          frozen=85ad48ca4ab668e850623416b814a350b162beef
          git fetch --no-tags --depth=1 origin "$frozen"
          test "$(git rev-parse FETCH_HEAD)" = "$frozen"
          mkdir -p "$RUNNER_TEMP/n83-k-neighborhood-frozen-source"
          git archive "$frozen" Cargo.lock \
            examples/koblitz_orbit_dlp_fast.rs \
            examples/n83_rho_optimization_eval.rs \
            research/n83_dense_root_20261013 \
            research/n83_indexed5_20261013 \
            research/n83_root4_20261014 \
            research/n83_factor_base_confirm_20261015 \
            research/n83_k_neighborhood_20261015 \
            | tar -xf - -C "$RUNNER_TEMP/n83-k-neighborhood-frozen-source"
          test "$(sha256sum "$RUNNER_TEMP/n83-k-neighborhood-frozen-source/examples/koblitz_orbit_dlp_fast.rs" | cut -d' ' -f1)" = \
            a1eb3b937106bb7cfdee6c54d6422ceb126b628462361c9ff7a127127f230c89

      - name: Download the exact completed raw artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-k-neighborhood-sealed"
          gh api repos/aburan28/crypto/actions/artifacts/11946288154/zip > \
            "$RUNNER_TEMP/n83-k-neighborhood-sealed/raw.zip"
          test "$(sha256sum "$RUNNER_TEMP/n83-k-neighborhood-sealed/raw.zip" | cut -d' ' -f1)" = \
            f4e1edb15db6e3a4306f5f208e8f0714ef1a1e81d738ed9b30d3d28d3c30649b
          unzip -q "$RUNNER_TEMP/n83-k-neighborhood-sealed/raw.zip" -d \
            "$RUNNER_TEMP/n83-k-neighborhood-sealed/raw"
          test "$(sha256sum "$RUNNER_TEMP/n83-k-neighborhood-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            fe9c87c6730befc67fa8338204e48edc35dd3c66aa1cbd21b55fa29036b8eb88

      - name: Independently replay four bases and all 16000 targets
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 "$RUNNER_TEMP/n83-k-neighborhood-frozen-source/research/n83_k_neighborhood_20261015/verify.py" \
            "$RUNNER_TEMP/n83-k-neighborhood-sealed/raw/results" > \
            "$RUNNER_TEMP/n83-k-neighborhood-sealed/local-replay.log"
          test "$(sha256sum "$RUNNER_TEMP/n83-k-neighborhood-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            fe9c87c6730befc67fa8338204e48edc35dd3c66aa1cbd21b55fa29036b8eb88

      - name: Reproduce the canonical current-head result records
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_k_neighborhood_results_20261015/materialize.py \
            --artifact-zip "$RUNNER_TEMP/n83-k-neighborhood-sealed/raw.zip" \
            --artifact-sha256 f4e1edb15db6e3a4306f5f208e8f0714ef1a1e81d738ed9b30d3d28d3c30649b \
            --analysis-sha256 fe9c87c6730befc67fa8338204e48edc35dd3c66aa1cbd21b55fa29036b8eb88 \
            "$RUNNER_TEMP/n83-k-neighborhood-sealed/raw/results"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Preserve current-head replay receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-k-neighborhood-sealed-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-k-neighborhood-sealed/local-replay.log
          if-no-files-found: ignore
          retention-days: 14
