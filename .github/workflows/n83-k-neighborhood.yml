name: N83 root11 K-neighborhood on 4000 frozen points

on:
  push:
    branches: [codex/n83-k-neighborhood-20261015]
    paths:
      - .github/workflows/n83-k-neighborhood.yml
      - research/n83_k_neighborhood_20261015/**
      - examples/koblitz_orbit_dlp_fast.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-k-neighborhood-${{ github.ref }}
  cancel-in-progress: false

jobs:
  four-arm-neighborhood:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4

      - name: Freeze four-arm protocol and archived public points
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-k-neighborhood"
          python3 research/n83_factor_base_confirm_20261015/generate.py \
            > "$RUNNER_TEMP/n83-k-neighborhood/generate.log"
          python3 research/n83_k_neighborhood_20261015/run.py --preflight \
            > "$RUNNER_TEMP/n83-k-neighborhood/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-k-neighborhood/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-k-neighborhood/cargo-version.txt"

      - name: Build exact producer and run example tests
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-k-neighborhood-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-k-neighborhood/example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-k-neighborhood/build.log" 2>&1

      - name: Run bounded K3200 K3250 K3300 K3350 arms
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-k-neighborhood-target"
          python3 research/n83_k_neighborhood_20261015/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --output "$RUNNER_TEMP/n83-k-neighborhood/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-k-neighborhood/run.log"

      - name: Independently replay complete bases and every target
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-k-neighborhood/results" ]; then
            python3 research/n83_k_neighborhood_20261015/verify.py \
              "$RUNNER_TEMP/n83-k-neighborhood/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-k-neighborhood/verify.log"
          fi

      - name: Preserve raw receipts and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-k-neighborhood-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-k-neighborhood/
          if-no-files-found: error
          retention-days: 14
