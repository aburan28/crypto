name: Koblitz Stage 123 n53 three-window x filter

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage123_three_window_filter.py"
      - ".github/workflows/koblitz-stage123-three-window-filter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate three-window filter controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage123_three_window_filter.py
          python3 scripts/run_koblitz_stage123_three_window_filter.py self-test
          cargo test --release --example koblitz_rank_fixture
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-three-window-filter:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage123_three_window_filter.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage123-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare two- and three-window dense filters
        run: |
          python3 scripts/run_koblitz_stage123_three_window_filter.py run \
            --build "$RUNNER_TEMP/stage123-build" \
            --output "$RUNNER_TEMP/stage123-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage123_three_window_filter.py verify \
            --build "$RUNNER_TEMP/stage123-build" \
            --output "$RUNNER_TEMP/stage123-run" \
            > "$RUNNER_TEMP/stage123-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage123-three-window-filter-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage123-build
            ${{ runner.temp }}/stage123-run
            ${{ runner.temp }}/stage123-verification.json
