name: Koblitz Stage 45 gate audit

on:
  pull_request:
    paths:
      - "docs/ic/boundary_targets.json"
      - "docs/ic/BOUNDARY_TARGETS.md"
      - "scripts/compose_koblitz_stage45_gate_audit.py"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-45-current-gate-audit-20260912/**"
      - ".github/workflows/koblitz-stage45-gate-audit.yml"

permissions:
  contents: read

# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Stage 44 result, boundary twins, and seven-gate audit
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage45_gate_audit.py
          python3 scripts/compose_koblitz_stage45_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-45-current-gate-audit-20260912 \
            > "$RUNNER_TEMP/stage45-verification.json"
          python3 research/sat_factor_base_review_20260908/autolab/boundary_autolab.py preflight \
            > "$RUNNER_TEMP/boundary-preflight.json"
          python3 -m json.tool docs/ic/boundary_targets.json > /dev/null
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
