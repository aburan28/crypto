# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * 3'

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rust_root: ${{ steps.scope.outputs.rust_root }}
      rust_cd: ${{ steps.scope.outputs.rust_cd }}
      rust_fmt: ${{ steps.scope.outputs.rust_fmt }}
      release_rust: ${{ steps.scope.outputs.release_rust }}
      release_native: ${{ steps.scope.outputs.release_native }}
      release_cuda: ${{ steps.scope.outputs.release_cuda }}
      ecbench_replay: ${{ steps.scope.outputs.ecbench_replay }}
      actions: ${{ steps.scope.outputs.actions }}
      c_cpp: ${{ steps.scope.outputs.c_cpp }}
      javascript: ${{ steps.scope.outputs.javascript }}
      python: ${{ steps.scope.outputs.python }}
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /build.rs
            /rustfmt.toml
            /clippy.toml
            /rust-toolchain*
            /src/
            /tests/
            /examples/
            /benches/
            /experiments/koblitz-s3-pair-query-20261007-v4/baseline.rs
            /experiments/koblitz-s3-pair-query-20261007-v4/candidate.rs
      - id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node .github/scripts/ci-scope.mjs

  analyze:
    if: always() && !cancelled() && github.event_name != 'workflow_dispatch'
    needs: [scope, build-rust-database, warm-rust-cache]
    # Routine Rust scans consume the database finalized by the first job and
    # the evaluation cache the second job warmed; queries retain this existing
    # job identity and /language:rust category.
    # The Rust queries over the whole repository outgrew the 25-minute routine
    # cap (cancelled at 25 minutes on several PRs, 2026-10-17), so every event
    # gets 60 minutes; check-pr-budgets.py names this job as its one exception.
    # The warmed cache leaves this job far below that cap on PRs.
    timeout-minutes: 60
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    # Rust uses the standard public-repository ARM runner with the same four
    # CPUs and 16 GiB envelope; CodeQL provides a Linux arm64 bundle.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || (matrix.language == 'rust' && 'ubuntu-24.04-arm') || 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          scope: actions
          build-mode: none
        - language: c-cpp
          scope: c_cpp
          build-mode: none
        - language: javascript-typescript
          scope: javascript
          build-mode: none
        - language: python
          scope: python
          build-mode: none
        - language: rust
          scope: rust
          build-mode: none
        # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
        # Use `c-cpp` to analyze code written in C, C++ or both
        # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # To learn more about changing the languages that are analyzed or customizing the build mode for your analysis,
        # see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        # If you are analyzing a compiled language, you can modify the 'build-mode' for that language to customize how
        # your codebase is analyzed, see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
    - name: Require successful scope classification
      if: needs.scope.result != 'success'
      run: |
        echo '::error::CI scope or release metadata failed; refusing to skip validation.'
        exit 1
    - name: Require the complete Rust database handoff
      if: needs.scope.outputs[matrix.scope] != 'false' && matrix.language == 'rust' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && (needs.build-rust-database.result != 'success' || needs.warm-rust-cache.result != 'success')
      run: |
        echo '::error::Complete Rust database creation or cache warming failed; refusing incomplete analysis.'
        exit 1
    - name: Checkout repository
      if: needs.scope.outputs[matrix.scope] != 'false' && matrix.language != 'rust'
      uses: actions/checkout@v7

    # The repository contains many research receipts that CodeQL does not
    # parse as Rust. Keep every tracked Rust source and Cargo manifest while
    # avoiding those unrelated blobs in the time-limited PR scan.
    - name: Checkout complete Rust source
      if: needs.scope.outputs[matrix.scope] != 'false' && matrix.language == 'rust'
      uses: actions/checkout@v7
      with:
        filter: blob:none
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*.rs
          /**/*.rs
          /Cargo.toml
          /Cargo.lock
          /**/Cargo.toml
          /**/Cargo.lock
          /rust-toolchain*
          /.cargo/**

    - name: Prove complete Rust source coverage
      if: needs.scope.outputs[matrix.scope] != 'false' && matrix.language == 'rust'
      shell: bash
      run: |
        python3 - <<'PY'
        import os
        import subprocess

        paths = subprocess.check_output(
            ["git", "ls-tree", "-r", "-z", "--name-only", "HEAD"]
        ).decode().split("\0")
        required = [
            path for path in paths
            if path.endswith(".rs")
            or path == "Cargo.toml" or path.endswith("/Cargo.toml")
            or path == "Cargo.lock" or path.endswith("/Cargo.lock")
        ]
        missing = [path for path in required if not os.path.lexists(path)]
        if missing:
            raise SystemExit("Rust CodeQL checkout omitted source: " +
                             ", ".join(missing[:20]))
        print(f"Rust CodeQL checkout includes all {len(required)} "
              "tracked Rust sources and Cargo manifests")
        PY

    # Add any setup steps before running the `github/codeql-action/init` action.
    # This includes steps like installing compilers or runtimes (`actions/setup-node`
    # or others). This is typically only required for manual builds.
    # - name: Setup runtime (example)
    #   uses: actions/setup-example@v1

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      id: init
      if: needs.scope.outputs[matrix.scope] != 'false' && !(matrix.language == 'rust' && (github.event_name == 'pull_request' || github.event_name == 'merge_group'))
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # If the analyze step fails for one of the languages you are analyzing with
    # "We were unable to automatically build your code", modify the matrix above
    # to set the build mode to "manual" for that language. Then modify this step
    # to build your code.
    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    - name: Run manual build steps
      if: needs.scope.outputs[matrix.scope] != 'false' && matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      if: needs.scope.outputs[matrix.scope] != 'false' && !(matrix.language == 'rust' && (github.event_name == 'pull_request' || github.event_name == 'merge_group'))
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"

    - name: Set up CodeQL for the finalized Rust database
      id: rust-tools
      if: needs.scope.outputs[matrix.scope] != 'false' && matrix.language == 'rust' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
      uses: github/codeql-action/setup-codeql@v4
      with:
        languages: rust
    - name: Download this workflow attempt's warmed database
      if: needs.scope.outputs[matrix.scope] != 'false' && matrix.language == 'rust' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
      uses: actions/download-artifact@v4
      with:
        name: rust-codeql-warm-db-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/rust-codeql-handoff/
    - name: Verify handoff and run its complete query configuration
      if: needs.scope.outputs[matrix.scope] != 'false' && matrix.language == 'rust' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
      shell: bash
      env:
        CODEQL_CLI: ${{ steps.rust-tools.outputs.codeql-path }}
        CODEQL_VERSION: ${{ steps.rust-tools.outputs.codeql-version }}
      run: |
        set -euo pipefail
        handoff_dir="$RUNNER_TEMP/rust-codeql-handoff"
        cd "$handoff_dir"
        sha256sum --check rust-db.zip.sha256
        test "$(cat source-sha.txt)" = "$GITHUB_SHA"
        test "$(cat codeql-version.txt)" = "$CODEQL_VERSION"
        "$CODEQL_CLI" database unbundle --target="$RUNNER_TEMP/rust-query-db" rust-db.zip
        # With no query override, CodeQL uses the configuration retained at
        # database creation. The relocatable bundle includes generated suites
        # and the warmed cache, so shared type inference is not re-evaluated.
        "$CODEQL_CLI" database analyze "$RUNNER_TEMP/rust-query-db/rust" \
          --format=sarifv2.1.0 --output="$RUNNER_TEMP/rust.sarif" \
          --sarif-category=/language:rust --threads=4 --ram=14000 \
          --expect-discarded-cache --min-disk-free=1024
    - name: Upload complete Rust analysis
      if: needs.scope.outputs[matrix.scope] != 'false' && matrix.language == 'rust' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ runner.temp }}/rust.sarif
        category: /language:rust
        wait-for-processing: true

  build-rust-database:
    name: Build database (rust)
    if: needs.scope.outputs.rust != 'false' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: scope
    timeout-minutes: 25
    runs-on: ubuntu-24.04-arm
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout complete Rust source
        uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.rs
            /**/*.rs
            /Cargo.toml
            /Cargo.lock
            /**/Cargo.toml
            /**/Cargo.lock
            /rust-toolchain*
            /.cargo/**

      - name: Prove complete Rust source coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          paths = subprocess.check_output(
              ["git", "ls-tree", "-r", "-z", "--name-only", "HEAD"]
          ).decode().split("\0")
          required = [
              path for path in paths
              if path.endswith(".rs")
              or path == "Cargo.toml" or path.endswith("/Cargo.toml")
              or path == "Cargo.lock" or path.endswith("/Cargo.lock")
          ]
          missing = [path for path in required if not os.path.lexists(path)]
          if missing:
              raise SystemExit("Rust CodeQL checkout omitted source: " +
                               ", ".join(missing[:20]))
          print(f"Rust CodeQL checkout includes all {len(required)} "
                "tracked Rust sources and Cargo manifests")
          PY
      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
      - name: Finalize the complete Rust database
        id: analysis
        uses: github/codeql-action/analyze@v4
        with:
          skip-queries: true
          category: /language:rust
      - name: Bundle complete Rust database for the query job
        shell: bash
        env:
          CODEQL_CLI: ${{ steps.init.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.init.outputs.codeql-version }}
          RUST_DATABASE: ${{ fromJSON(steps.analysis.outputs.db-locations).rust }}
        run: |
          set -euo pipefail
          handoff_dir="$RUNNER_TEMP/rust-codeql-handoff"
          mkdir "$handoff_dir"
          test -n "$CODEQL_VERSION"
          test -n "$RUST_DATABASE"
          "$CODEQL_CLI" database bundle --include-temp --include-diagnostics \
            --output="$handoff_dir/rust-db.zip" --name=rust "$RUST_DATABASE"
          printf '%s\n' "$GITHUB_SHA" > "$handoff_dir/source-sha.txt"
          printf '%s\n' "$CODEQL_VERSION" > "$handoff_dir/codeql-version.txt"
          cd "$handoff_dir"
          sha256sum rust-db.zip > rust-db.zip.sha256

      - name: Retain immutable Rust database handoff
        uses: actions/upload-artifact@v4
        with:
          name: rust-codeql-db-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-codeql-handoff/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Rust type inference is about two thirds of the query phase's evaluation
  # time and every query depends on it, so splitting the query suite does not
  # shorten any job. This job evaluates the one diagnostic query that forces
  # type inference, to completion, and hands the trimmed evaluation cache to
  # the query job inside the database bundle. An interrupted evaluation leaves
  # no reusable cache, so the phase must finish within its own budget.
  warm-rust-cache:
    name: Warm cache (rust)
    if: needs.scope.outputs.rust != 'false' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: [scope, build-rust-database]
    timeout-minutes: 25
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: read
      actions: read
      contents: read
    steps:
      - name: Set up CodeQL for the finalized Rust database
        id: rust-tools
        uses: github/codeql-action/setup-codeql@v4
        with:
          languages: rust
      - name: Download this workflow attempt's finalized database
        uses: actions/download-artifact@v4
        with:
          name: rust-codeql-db-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-codeql-handoff/
      - name: Verify handoff and evaluate type inference to completion
        shell: bash
        env:
          CODEQL_CLI: ${{ steps.rust-tools.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.rust-tools.outputs.codeql-version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rust-codeql-handoff"
          sha256sum --check rust-db.zip.sha256
          test "$(cat source-sha.txt)" = "$GITHUB_SHA"
          test "$(cat codeql-version.txt)" = "$CODEQL_VERSION"
          "$CODEQL_CLI" database unbundle --target="$RUNNER_TEMP/rust-warm-db" rust-db.zip
          db="$RUNNER_TEMP/rust-warm-db/rust"
          "$CODEQL_CLI" database run-queries "$db" \
            codeql/rust-queries:queries/diagnostics/TypeInferenceConsistencyCounts.ql \
            --threads=4 --ram=14000 --min-disk-free=1024
          # Keep the cached predicates; drop intermediates and this query's
          # results so the query job evaluates every query itself.
          "$CODEQL_CLI" database cleanup "$db" --cache-cleanup=trim
          rm -rf "$db/results"
          du -sh "$db/db-rust/default/cache"
          out="$RUNNER_TEMP/rust-codeql-warm"
          mkdir "$out"
          "$CODEQL_CLI" database bundle --include-temp --include-diagnostics \
            --include=db-rust/default/cache \
            --output="$out/rust-db.zip" --name=rust "$db"
          printf '%s\n' "$GITHUB_SHA" > "$out/source-sha.txt"
          printf '%s\n' "$CODEQL_VERSION" > "$out/codeql-version.txt"
          cd "$out"
          sha256sum rust-db.zip > rust-db.zip.sha256
      - name: Retain immutable warmed Rust database handoff
        uses: actions/upload-artifact@v4
        with:
          name: rust-codeql-warm-db-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-codeql-warm/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  analyze-rust-long:
    if: github.event_name == 'workflow_dispatch'
    needs: scope
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Require successful scope classification
        if: needs.scope.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust-long"
