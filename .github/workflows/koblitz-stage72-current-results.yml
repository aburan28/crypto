name: Koblitz Stage 72 current results

on:
  pull_request:
    paths:
      - "scripts/verify_koblitz_stage72_current_results.py"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/koblitz-stage70-*.tar.gz*"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/koblitz-stage71-*.tar.gz*"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-70-*-34719465029.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-71-*-34719948884.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-72-current-results-20260912/**"
      - ".github/workflows/koblitz-stage72-current-results.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify retained unknown-scalar and single-core results
        run: |
          python3 -m py_compile scripts/verify_koblitz_stage72_current_results.py
          python3 scripts/verify_koblitz_stage72_current_results.py verify
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
