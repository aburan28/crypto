name: Koblitz Stage 72 current results

on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify retained unknown-scalar and single-core results
        run: |
          python3 -m py_compile scripts/verify_koblitz_stage72_current_results.py
          python3 scripts/verify_koblitz_stage72_current_results.py verify
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
