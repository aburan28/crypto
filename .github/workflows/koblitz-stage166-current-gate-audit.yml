name: Koblitz Stage 166 current gate audit

on:
  pull_request:
    paths:
      - "docs/index-calculus-scoreboard.html"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-165-current-gate-audit-20260923/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-166-dense-product-cancellation-20260923/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-166-dense-product-cancellation-verification.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-166-current-gate-audit-20260923/**"
      - "scripts/compose_koblitz_stage165_gate_audit.py"
      - "scripts/compose_koblitz_stage166_gate_audit.py"
      - "scripts/verify_koblitz_stage166_dense_mul.py"
      - ".github/workflows/koblitz-stage166-current-gate-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify historical Stage 165 and current Stage 166
        run: |
          python3 -m py_compile \
            scripts/compose_koblitz_stage165_gate_audit.py \
            scripts/compose_koblitz_stage166_gate_audit.py \
            scripts/verify_koblitz_stage166_dense_mul.py
          python3 scripts/compose_koblitz_stage165_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-165-current-gate-audit-20260923 \
            > "$RUNNER_TEMP/stage165-historical-audit.json"
          python3 scripts/verify_koblitz_stage166_dense_mul.py \
            > "$RUNNER_TEMP/stage166-result-verification.json"
          cmp "$RUNNER_TEMP/stage166-result-verification.json" \
            research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-166-dense-product-cancellation-verification.json
          python3 scripts/compose_koblitz_stage166_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-166-current-gate-audit-20260923 \
            > "$RUNNER_TEMP/stage166-current-audit.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
