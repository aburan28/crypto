name: Koblitz Stage 68 fused result

on:
  pull_request:
    paths:
      - "scripts/verify_koblitz_stage68_fused_result.py"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/koblitz-stage68-n53-fused-evidence-34718443480.tar.gz*"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-68-*-34718443480.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-68-n53-fused-result-20260912/**"
      - ".github/workflows/koblitz-stage68-fused-result.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retained-result:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify retained fused result
        run: |
          python3 -m py_compile scripts/verify_koblitz_stage68_fused_result.py
          python3 scripts/verify_koblitz_stage68_fused_result.py verify
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
