name: Koblitz Stage 68 fused result

on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retained-result:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify retained fused result
        run: |
          python3 -m py_compile scripts/verify_koblitz_stage68_fused_result.py
          python3 scripts/verify_koblitz_stage68_fused_result.py verify
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
