name: Koblitz SOTA-gate reproduction

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "examples/koblitz_algebraic_e2e.rs"
      - "examples/koblitz_public_factor_base_discovery.rs"
      - "examples/koblitz_pdp_export.rs"
      - "examples/koblitz_pdp_backend.rs"
      - "src/cryptanalysis/koblitz_index_calculus.rs"
      - "src/cryptanalysis/koblitz_pdp_phase_a.rs"
      - "src/bin/koblitz_pdp_prepare.rs"
      - "scripts/process_meter.py"
      - "scripts/run_koblitz_pdp_matrix.py"
      - "scripts/test_run_koblitz_pdp_matrix.py"
      - "scripts/test_koblitz_pdp_phase_a.py"
      - "scripts/verify_koblitz_external_reproduction.py"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/run_stage13_pdp_panel.py"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/verify_stage13_pdp_panel.py"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/compose_stage13_correction.py"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-13-pdp-panel-protocol.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-13-balanced-pdp-phase-a-protocol.json"
      - ".github/workflows/koblitz-sota-reproduction.yml"

permissions:
  contents: read

jobs:
  reproduce-toy-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build frozen executables
        run: cargo build --release --bin koblitz_pdp_prepare --example koblitz_algebraic_e2e --example koblitz_public_factor_base_discovery --example koblitz_pdp_export --example koblitz_pdp_backend
      - name: Validate balanced PDP Phase-A preparation
        run: |
          cargo test --release --lib cryptanalysis::koblitz_pdp_phase_a -- --test-threads=1
          python3 scripts/test_koblitz_pdp_phase_a.py --preparer target/release/koblitz_pdp_prepare --exporter target/release/examples/koblitz_pdp_export --backend target/release/examples/koblitz_pdp_backend
          target/release/koblitz_pdp_prepare plan --protocol research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-13-balanced-pdp-phase-a-protocol.json > /tmp/balanced-pdp-phase-a-plan.json
          python3 -c 'import json; d=json.load(open("/tmp/balanced-pdp-phase-a-plan.json")); assert d["census_executed"] is False and d["total_selected_instances"] == 160 and d["total_planned_solver_runs"] == 480 and d["largest_canonical_triple_count"] == 18896570'
      - name: Validate isolated PDP accounting and archived composition
        run: |
          python3 scripts/test_run_koblitz_pdp_matrix.py -v
          python3 research/sat_factor_base_review_20260908/continuation-05-sota-gates/verify_stage13_pdp_panel.py --self-test
          python3 scripts/run_koblitz_pdp_matrix.py --output isolated-pdp-smoke --exporter target/release/examples/koblitz_pdp_export --backend target/release/examples/koblitz_pdp_backend --configs 15:5:standard:1:0 --timeout 120 --conflicts 100000 --seed 20261101
          python3 -c 'import json; d=json.load(open("isolated-pdp-smoke/result.json")); r={x["solver"]:x for x in d["instances"][0]["solvers"]}; assert r["native-sat"]["status"]=="sat" and r["native-sat"]["source_witness_valid"] is True; assert r["direct-mitm"]["status"]=="sat" and r["direct-mitm"]["source_witness_valid"] is True; assert d["instances"][0]["source_artifacts_unchanged"] is True'
          python3 research/sat_factor_base_review_20260908/continuation-05-sota-gates/verify_stage13_pdp_panel.py --panel research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-13-panel-20260909 --output /tmp/panel-summary-relocated.json
          cmp /tmp/panel-summary-relocated.json research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-13-panel-20260909/panel-summary.json
          python3 research/sat_factor_base_review_20260908/continuation-05-sota-gates/compose_stage13_correction.py research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-13-panel-20260909 research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-13-wdsat-correction-20260909 /tmp/panel-summary-corrected.json
          cmp /tmp/panel-summary-corrected.json research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-13-panel-20260909/panel-summary-corrected.json
      - name: Reproduce scalar-blind index calculus and quotient rho
        run: |
          mkdir -p external-reproduction
          cp Cargo.lock external-reproduction/Cargo.lock
          python3 scripts/process_meter.py --cwd "$GITHUB_WORKSPACE" --timeout 120 --stdout external-reproduction/ic-53.json --stderr external-reproduction/ic-53.stderr --metrics external-reproduction/ic-53.metrics.json -- target/release/examples/koblitz_algebraic_e2e ic 9 0 2 53 20260921 10000 20000
          python3 scripts/process_meter.py --cwd "$GITHUB_WORKSPACE" --timeout 120 --stdout external-reproduction/rho-auto-53.json --stderr external-reproduction/rho-auto-53.stderr --metrics external-reproduction/rho-auto-53.metrics.json -- target/release/examples/koblitz_algebraic_e2e rho-auto 9 0 2 53 20260921 10000 20000
          python3 scripts/process_meter.py --cwd "$GITHUB_WORKSPACE" --timeout 120 --stdout external-reproduction/ic-101.json --stderr external-reproduction/ic-101.stderr --metrics external-reproduction/ic-101.metrics.json -- target/release/examples/koblitz_algebraic_e2e ic 9 0 2 101 20260922 10000 20000
          python3 scripts/process_meter.py --cwd "$GITHUB_WORKSPACE" --timeout 120 --stdout external-reproduction/rho-auto-101.json --stderr external-reproduction/rho-auto-101.stderr --metrics external-reproduction/rho-auto-101.metrics.json -- target/release/examples/koblitz_algebraic_e2e rho-auto 9 0 2 101 20260922 10000 20000
          python3 scripts/process_meter.py --cwd "$GITHUB_WORKSPACE" --timeout 120 --stdout external-reproduction/n15-discovery.json --stderr external-reproduction/n15-discovery.stderr --metrics external-reproduction/n15-discovery.metrics.json -- target/release/examples/koblitz_public_factor_base_discovery 15 1 2 8
          for run_pair in 17:20260981 53:20260982 89:20260983 137:20260984 199:20260985; do
            run_secret=${run_pair%%:*}
            run_seed=${run_pair##*:}
            python3 scripts/process_meter.py --cwd "$GITHUB_WORKSPACE" --timeout 120 --stdout external-reproduction/n15-ic-${run_secret}.json --stderr external-reproduction/n15-ic-${run_secret}.stderr --metrics external-reproduction/n15-ic-${run_secret}.metrics.json -- target/release/examples/koblitz_algebraic_e2e ic 15 1 2 ${run_secret} ${run_seed} 10000 20000 divisor:2,4
            python3 scripts/process_meter.py --cwd "$GITHUB_WORKSPACE" --timeout 120 --stdout external-reproduction/n15-rho-auto-${run_secret}.json --stderr external-reproduction/n15-rho-auto-${run_secret}.stderr --metrics external-reproduction/n15-rho-auto-${run_secret}.metrics.json -- target/release/examples/koblitz_algebraic_e2e rho-auto 15 1 2 ${run_secret} ${run_seed} 10000 20000 divisor:2,4
          done
          python3 scripts/process_meter.py --cwd "$GITHUB_WORKSPACE" --timeout 300 --stdout external-reproduction/n23-discovery-a0.json --stderr external-reproduction/n23-discovery-a0.stderr --metrics external-reproduction/n23-discovery-a0.metrics.json -- target/release/examples/koblitz_public_factor_base_discovery 23 0 2 12
          python3 scripts/process_meter.py --cwd "$GITHUB_WORKSPACE" --timeout 300 --stdout external-reproduction/n23-discovery-a1.json --stderr external-reproduction/n23-discovery-a1.stderr --metrics external-reproduction/n23-discovery-a1.metrics.json -- target/release/examples/koblitz_public_factor_base_discovery 23 1 2 12
          python3 scripts/process_meter.py --cwd "$GITHUB_WORKSPACE" --timeout 300 --stdout external-reproduction/n23-ic-101.json --stderr external-reproduction/n23-ic-101.stderr --metrics external-reproduction/n23-ic-101.metrics.json -- target/release/examples/koblitz_algebraic_e2e ic 23 0 2 101 20261001 100000 1000 divisor:0,2
          python3 scripts/process_meter.py --cwd "$GITHUB_WORKSPACE" --timeout 300 --stdout external-reproduction/n23-rho-auto-101.json --stderr external-reproduction/n23-rho-auto-101.stderr --metrics external-reproduction/n23-rho-auto-101.metrics.json -- target/release/examples/koblitz_algebraic_e2e rho-auto 23 0 2 101 20261001 100000 1000 divisor:0,2
          python3 scripts/verify_koblitz_external_reproduction.py external-reproduction
      - name: Focused library tests
        run: cargo test --release --lib cryptanalysis::koblitz_index_calculus -- --test-threads=1
      - uses: actions/upload-artifact@v4
        with:
          name: koblitz-sota-gate-external-reproduction
          path: |
            external-reproduction
            isolated-pdp-smoke
          if-no-files-found: error
