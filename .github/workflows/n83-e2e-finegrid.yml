name: N83 complete adjacent K cold screen

on:
  push:
    branches: [codex/n83-e2e-finegrid-20261016]
    paths:
      - .github/workflows/n83-e2e-finegrid.yml
      - research/n83_e2e_finegrid_20261016/run.py
      - research/n83_e2e_finegrid_20261016/verify.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-e2e-finegrid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  adjacent-k-cold-screen:
    if: github.repository == 'aburan28/crypto' && github.ref == 'refs/heads/codex/n83-e2e-finegrid-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Replay frozen exposed point and complete K interval
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          mkdir -p "$RUNNER_TEMP/n83-e2e-finegrid"
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k_abba_20261015/generate.py > /dev/null
          python3 research/n83_root4_highk_20261015/generate.py > /dev/null
          python3 research/n83_best_e2e_20261015/generate.py > /dev/null
          python3 research/n83_legacy_challenger_20261015/generate.py > /dev/null
          python3 research/n83_root4_bloom_20261015/generate.py > /dev/null
          python3 research/n83_root11_highk_20261015/generate.py > /dev/null
          python3 research/n83_compact4_crosslayout_20261016/generate.py > /dev/null
          python3 research/n83_cold_factor_base_20261016/generate.py > \
            "$RUNNER_TEMP/n83-e2e-finegrid/fixture-check.json"
          python3 research/n83_e2e_finegrid_20261016/run.py --preflight > \
            "$RUNNER_TEMP/n83-e2e-finegrid/schedule-preflight.json"
          python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); ks={a[1] for a in x["arms"]}; assert len(x["arms"]) == 21 and ks == set(range(1102,1121))' \
            "$RUNNER_TEMP/n83-e2e-finegrid/schedule-preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-e2e-finegrid/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-e2e-finegrid/cargo-version.txt"

      - name: Build and test exact IC and same-point rho producers
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-e2e-finegrid-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-e2e-finegrid/ic-example-tests.log" 2>&1
          cargo test --release --locked --example n83_rho_optimization_eval > \
            "$RUNNER_TEMP/n83-e2e-finegrid/rho-example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-e2e-finegrid/ic-build.log" 2>&1
          cargo build --release --locked --example n83_rho_optimization_eval > \
            "$RUNNER_TEMP/n83-e2e-finegrid/rho-build.log" 2>&1

      - name: Run all adjacent K cold arms and same-point rho
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-e2e-finegrid-target"
          python3 research/n83_e2e_finegrid_20261016/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --rho-binary "$CARGO_TARGET_DIR/release/examples/n83_rho_optimization_eval" \
            --output "$RUNNER_TEMP/n83-e2e-finegrid/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-e2e-finegrid/run.log"

      - name: Independently replay all bases relations answers and resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-e2e-finegrid/results" ]; then
            python3 research/n83_e2e_finegrid_20261016/verify.py \
              "$RUNNER_TEMP/n83-e2e-finegrid/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-e2e-finegrid/verify.log"
          fi

      - name: Preserve all raw receipts and failed arms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-e2e-finegrid-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-e2e-finegrid/
          if-no-files-found: error
          retention-days: 14
