name: GF2 word-batched Macaulay elimination experiment

on:
  pull_request:
    paths:
      - 'src/cryptanalysis/gf2_elim.rs'
      - 'research/gf2_word_batch_20260927/PROTOCOL.md'
      - 'research/gf2_word_batch_20260927/paired_f5.py'
      - '.github/workflows/gf2-word-batch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-output-and-paired-f5:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RAYON_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98'
      - uses: Swatinem/rust-cache@v2
      - name: GF2 kernel exact-output tests
        run: cargo test --release --lib cryptanalysis::gf2_elim::tests -- --test-threads=1
      - name: Build F5 stage benchmark
        run: cargo build --release --example f4_f2_bench
      - name: Five A/A and five paired A/B samples per workload
        run: |
          python3 research/gf2_word_batch_20260927/paired_f5.py \
            target/release/examples/f4_f2_bench \
            research/gf2_word_batch_20260927/ci-result.json \
            --pairs 5
      - name: Preserve all raw runs and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gf2-word-batch-${{ github.sha }}
          path: research/gf2_word_batch_20260927/ci-result.json
          if-no-files-found: warn
