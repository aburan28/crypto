name: n53 target-cyclic rank control

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'examples/koblitz_s5_sat_instance.rs'
      - 'Cargo.toml'
      - 'research/sat_factor_base_review_20260908/autolab_n53_rank_rotation_20260925/**'
      - 'research/sat_factor_base_review_20260908/autolab_n53_rank_rotation_replay_20260928/**'
      - '.github/workflows/n53-target-cyclic-rank.yml'
      - '.github/scripts/*frozen-workflow-check*'
      - '.github/scripts/n53-historical-cargo-lock-view-v1.json'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hash-only:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 360 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen scheduling, historical source custody, current lockstep, targets and archive
        run: |
          node .github/scripts/frozen-workflow-check.mjs \
            --workflow .github/workflows/n53-target-cyclic-rank.yml \
            --revision aa0cee7bd1769222e5706e61b64478d5aad6d573 \
            --manifest research/sat_factor_base_review_20260908/autolab_n53_rank_rotation_replay_20260928/FROZEN.json \
            --input-view-manifest .github/scripts/n53-historical-cargo-lock-view-v1.json \
            --root research/sat_factor_base_review_20260908/autolab_n53_rank_rotation_replay_20260928 \
            --root research/sat_factor_base_review_20260908/autolab_n53_rank_rotation_20260925 \
            --root Cargo.lock \
            --root Cargo.toml \
            --root examples/koblitz_s5_sat_instance.rs \
            --root research/sat_factor_base_review_20260908/autolab_combined_l384_coldbase_n53_20260925/Cargo.lock \
            --root research/sat_factor_base_review_20260908/autolab_combined_l384_coldbase_n53_20260925/run_panel.py \
            --root research/sat_factor_base_review_20260908/autolab_combined_l384_coldbase_n53_20260925/archive.py \
            --root research/sat_factor_base_review_20260908/autolab_combined_l384_coldbase_n53_20260925/points_L384.jsonl \
            --root research/sat_factor_base_review_20260908/autolab_shared_log_n53_20260925/generate_targets.py \
            --root research/sat_factor_base_review_20260908/autolab_shared_log_n53_20260925/TARGET_MANIFEST.json \
            --root research/sat_factor_base_review_20260908/autolab_orbit_extract_20260924/independent_replay_20260924_codex/replay.py \
            --root research/sat_factor_base_review_20260908/autolab_orbit_extract_20260924/independent_replay_20260924_codex/base_header.jsonl.gz \
            --root research/sat_factor_base_review_20260908/autolab_orbit_extract_20260924/cold_batch_rank.py \
            -- bash -e -c '
              replay=research/sat_factor_base_review_20260908/autolab_n53_rank_rotation_replay_20260928/replay.py
              python3 "$replay" --mode freeze
              python3 "$replay" --mode preflight
              python3 -m unittest discover -s research/sat_factor_base_review_20260908/autolab_n53_rank_rotation_replay_20260928 -p "test_replay.py" -v
              bundle=research/sat_factor_base_review_20260908/autolab_n53_rank_rotation_20260925/evidence
              if test -f "$bundle/archive_manifest.json"; then
                python3 "$replay" --mode archive --bundle "$bundle"
              fi
            '
      - name: Current checkout whitespace check
        run: git diff --check

  outcome:
    if: github.event.action == 'labeled' && github.event.label.name == 'run-n53-rotation-once' && github.event.pull_request.head.repo.full_name == github.repository
    needs: hash-only
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: n53-target-cyclic-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse held or moved exact source head
        env:
          KIC_ROTATION_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          STARTING_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin main
          python3 - <<'PY'
          import sys
          from pathlib import Path
          root = Path('research/sat_factor_base_review_20260908/autolab_n53_rank_rotation_20260925')
          sys.path.insert(0, str(root))
          import check_protocol
          check_protocol.preflight(require_release=True)
          print('released exact-source preflight PASS')
          PY
          git fetch origin "$HEAD_BRANCH:refs/remotes/origin/$HEAD_BRANCH"
          test "$(git rev-parse "origin/$HEAD_BRANCH")" = "$STARTING_HEAD"
          test ! -e research/sat_factor_base_review_20260908/autolab_n53_rank_rotation_20260925/evidence/archive_manifest.json
      - name: Build one frozen producer
        run: |
          cp research/sat_factor_base_review_20260908/autolab_combined_l384_coldbase_n53_20260925/Cargo.lock Cargo.lock
          cargo build --locked --release --example koblitz_s5_sat_instance
          sha256sum target/release/examples/koblitz_s5_sat_instance
          rustc --version
          cargo --version
      - name: Run four fixed arms and independent group/rank replay
        env:
          KIC_ROTATION_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 research/sat_factor_base_review_20260908/autolab_n53_rank_rotation_20260925/run_panel.py --out /tmp/n53-target-cyclic-rank-panel
      - name: Seal every attempted output, including failure receipts
        if: always()
        run: |
          if test -d /tmp/n53-target-cyclic-rank-panel; then
            python3 research/sat_factor_base_review_20260908/autolab_combined_l384_coldbase_n53_20260925/archive.py \
              --panel /tmp/n53-target-cyclic-rank-panel --out /tmp/n53-target-cyclic-rank-sealed
            python3 research/sat_factor_base_review_20260908/autolab_n53_rank_rotation_20260925/verify_archive.py \
              --bundle /tmp/n53-target-cyclic-rank-sealed
          fi
      - name: Commit immutable attempt to the dispatch branch
        if: always()
        env:
          STARTING_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if ! test -f /tmp/n53-target-cyclic-rank-sealed/archive_manifest.json; then exit 0; fi
          git fetch origin "$HEAD_BRANCH:refs/remotes/origin/$HEAD_BRANCH"
          test "$(git rev-parse "origin/$HEAD_BRANCH")" = "$STARTING_HEAD"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          bundle=research/sat_factor_base_review_20260908/autolab_n53_rank_rotation_20260925/evidence
          mkdir -p "$bundle"
          test ! -e "$bundle/archive_manifest.json"
          cp /tmp/n53-target-cyclic-rank-sealed/evidence.tar.gz /tmp/n53-target-cyclic-rank-sealed/archive_manifest.json "$bundle/"
          if test -f /tmp/n53-target-cyclic-rank-sealed/panel.json; then cp /tmp/n53-target-cyclic-rank-sealed/panel.json "$bundle/"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$bundle"
          git commit -m 'research: preserve n53 target-cyclic rank panel'
          git push origin "HEAD:$HEAD_BRANCH"
      - name: Upload raw attempt if evidence commit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n53-target-cyclic-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/n53-target-cyclic-rank-panel/
          if-no-files-found: warn
          retention-days: 30
