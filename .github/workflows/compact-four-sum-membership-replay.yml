name: Compact four-sum membership replay
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source and fixed target regeneration
        run: |
          python3 -m py_compile research/notes/ecc2k130/four_sum_membership_20260925/{make_inputs,run,verify,archive,replay_all}.py
          python3 research/notes/ecc2k130/four_sum_membership_20260925/make_inputs.py > /dev/null
      - name: Independently replay all archived complete pair sums, witnesses and sampled misses
        run: python3 research/notes/ecc2k130/four_sum_membership_20260925/replay_all.py
