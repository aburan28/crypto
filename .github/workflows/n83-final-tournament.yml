name: N83 frozen factor-base final tournament

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-final-tournament-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirrored-finalists:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Restore all excluded public panels and freeze final inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-final-tournament"
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k_abba_20261015/generate.py > /dev/null
          python3 research/n83_root4_highk_20261015/generate.py > /dev/null
          python3 research/n83_best_e2e_20261015/generate.py > /dev/null
          python3 research/n83_legacy_challenger_20261015/generate.py > /dev/null
          python3 research/n83_root4_bloom_20261015/generate.py > /dev/null
          python3 research/n83_root11_highk_20261015/generate.py > /dev/null
          python3 research/n83_final_tournament_20261015/generate.py > \
            "$RUNNER_TEMP/n83-final-tournament/fixture-check.json"
          test "$(sha256sum research/n83_final_tournament_20261015/targets.jsonl | cut -d' ' -f1)" = \
            cfa943ae538fcc41d2af8bb8fd1c8fc0f29adc340b55644e90382da25b213424
          test "$(sha256sum research/n83_final_tournament_20261015/answers.jsonl | cut -d' ' -f1)" = \
            1dbd4250796de4434badc2458089d7ad9fe63cc59d7b9d3f6825ad431476a13b
          test "$(sha256sum examples/koblitz_orbit_dlp_fast.rs | cut -d' ' -f1)" = \
            f2745227d95e36ef45c73c5104a23ada6cebb0794405368581d2be17044845dc
          python3 research/n83_final_tournament_20261015/run.py --preflight > \
            "$RUNNER_TEMP/n83-final-tournament/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-final-tournament/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-final-tournament/cargo-version.txt"

      - name: Build and test exact N83 producer
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-final-tournament-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-final-tournament/example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-final-tournament/build.log" 2>&1
          sha256sum "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" > \
            "$RUNNER_TEMP/n83-final-tournament/binary.sha256"

      - name: Run fresh mirrored complete-pipeline finalist arms
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-final-tournament-target"
          python3 research/n83_final_tournament_20261015/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --output "$RUNNER_TEMP/n83-final-tournament/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-final-tournament/run.log"

      - name: Independently replay every base and all finalist targets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-final-tournament/results" ]; then
            python3 research/n83_final_tournament_20261015/verify.py \
              "$RUNNER_TEMP/n83-final-tournament/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-final-tournament/verify.log"
          fi

      - name: Preserve raw rows, source receipts and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-final-tournament-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-final-tournament/
          if-no-files-found: error
          retention-days: 14
