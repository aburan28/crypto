name: Launch durable G7e devhost

on:
  push:
    branches:
      - infra/durable-g7e-devhost
    paths:
      - '.github/workflows/launch-durable-g7e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/durable-g7e-devhost

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Launch or start durable G7e host
        working-directory: ecc2k130/aws/devhost
        run: |
          set -u -o pipefail
          chmod +x devhost.sh bootstrap.sh

          # Try progressively larger single-host G7e shapes in the same region.
          # devhost.sh is idempotent by Name tag, so once one launch succeeds,
          # later attempts simply find that host rather than creating another.
          for type in g7e.2xlarge g7e.4xlarge g7e.8xlarge g7e.12xlarge; do
            echo "Trying $type ..."
            if INSTANCE_TYPE="$type" ./devhost.sh up; then
              echo "Launched/started durable host with $type"
              exit 0
            fi
            echo "$type unavailable; trying next size"
          done

          echo "No requested G7e size had capacity in us-west-2" >&2
          exit 1

      - name: Print host status
        working-directory: ecc2k130/aws/devhost
        run: ./devhost.sh status
