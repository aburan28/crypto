name: Koblitz Stage 148 current gate audit
on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay Stage 147 historical audit and Stage 148 current audit
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage147_gate_audit.py scripts/compose_koblitz_stage148_gate_audit.py
          python3 -m json.tool docs/ic/runs/koblitz-n59-prefetch16-rejection-20260922.json >/dev/null
          python3 scripts/compose_koblitz_stage148_gate_audit.py check-patch
          python3 scripts/compose_koblitz_stage147_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-147-current-gate-audit-20260922 > "$RUNNER_TEMP/stage147-historical.json"
          python3 scripts/compose_koblitz_stage148_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-148-current-gate-audit-20260922 > "$RUNNER_TEMP/stage148-current.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
