name: Koblitz Stage 65 n53 fixed reduction

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage65_n53_reduction.py"
      - ".github/workflows/koblitz-stage65-n53-reduction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate degree-53 reduction controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage65_n53_reduction.py
          python3 scripts/run_koblitz_stage65_n53_reduction.py self-test
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-fixed-reduction:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage65_n53_reduction.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage65-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare generic reduction, fixed reduction, and rho
        run: |
          python3 scripts/run_koblitz_stage65_n53_reduction.py run \
            --build "$RUNNER_TEMP/stage65-build" \
            --output "$RUNNER_TEMP/stage65-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage65_n53_reduction.py verify \
            --build "$RUNNER_TEMP/stage65-build" \
            --output "$RUNNER_TEMP/stage65-run" \
            > "$RUNNER_TEMP/stage65-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage65-n53-reduction-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage65-build
            ${{ runner.temp }}/stage65-run
            ${{ runner.temp }}/stage65-verification.json
