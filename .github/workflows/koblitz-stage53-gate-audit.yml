name: Koblitz Stage 53 gate audit

on:
  pull_request:
    paths:
      - "docs/ic/boundary_targets.json"
      - "docs/ic/BOUNDARY_TARGETS.md"
      - "scripts/compose_koblitz_stage50_gate_audit.py"
      - "scripts/compose_koblitz_stage53_gate_audit.py"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-53-current-gate-audit-20260912/**"
      - ".github/workflows/koblitz-stage53-gate-audit.yml"

permissions:
  contents: read

jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify lazy-label result and current gate audit
        run: |
          python3 -m py_compile \
            scripts/compose_koblitz_stage50_gate_audit.py \
            scripts/compose_koblitz_stage53_gate_audit.py
          python3 scripts/compose_koblitz_stage50_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-50-current-gate-audit-20260912 \
            > "$RUNNER_TEMP/stage50-historical-verification.json"
          python3 scripts/verify_koblitz_stage52_lazy_result.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-52-n53-lazy-result-20260912 \
            > "$RUNNER_TEMP/stage52-verification.json"
          python3 scripts/compose_koblitz_stage53_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-53-current-gate-audit-20260912 \
            > "$RUNNER_TEMP/stage53-verification.json"
          python3 research/sat_factor_base_review_20260908/autolab/boundary_autolab.py preflight \
            > "$RUNNER_TEMP/boundary-preflight.json"
          python3 -m json.tool docs/ic/boundary_targets.json > /dev/null
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
