# The `gpu/ecc2k` headers have a CPU test harness — `G2_HD` is `inline`
# when `__CUDACC__` is not defined, so everything but the kernels
# compiles and runs under g++ with no GPU.  Nothing ran it.
#
# `pairtable_kernel` and `pairtable_fold_kernel` are covered too, by
# `test_pairtable_emu.cpp`: their bodies are plain C++ once `__global__`
# and the thread indices are supplied, so that test compiles them as host
# functions and runs them once per emulated thread.  The folded one is
# checked against the table the CPU itself stored (`vec_fold.h`).  What
# stays uncovered is how a kernel *runs* on a device — launch geometry,
# occupancy, concurrency, and whatever nvcc does differently from g++ —
# not what it computes.
#
# That matters most for `pt_canon`, the folded pair table's key.  Its
# correctness is not a thing a reviewer can eyeball: it has to name
# Frobenius orbits exactly as the squaring chain does *and* exactly as
# `koblitz_fast::FrobeniusCanon` does, and a key that gets either wrong
# reports "no decomposition" for a target that has one — a silent wrong
# answer from an oracle rather than a crash.  `test_pairtable.cpp`
# checks both, exhaustively at composite degrees; this runs it.
name: GPU ecc2k host verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'gpu/ecc2k/**'
      # `vec_canon.h` is generated from these: the basis change comes
      # from `FrobeniusCanon`, and the vectors are its own answers, so a
      # change to either moves what the C++ side is checked against.
      - 'examples/dump_canon_vectors.rs'
      - 'src/cryptanalysis/koblitz_fast.rs'
      # `vec_fold.h` is a folded table `PairSumTable` built, so a change
      # to how the CPU builds one moves what the fold kernel must match.
      - 'examples/dump_fold_vectors.rs'
      - 'src/cryptanalysis/koblitz_index_calculus.rs'
      - '.github/workflows/gpu-ecc2k-host-verification.yml'
jobs:
  host-tests:
    runs-on: ubuntu-latest
    # Most of this is one `cargo build --release` to generate the
    # vectors; the C++ itself is seconds.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      # `make test` builds nine binaries and runs them, three per curve:
      # the field and curve harness, the pair table's building blocks,
      # and the pair-table kernels themselves run on the host.  The two
      # pair-table ones decline for `ecc2k95` at m = 97 > 62, which is
      # `pt_low64`'s ceiling and `FrobeniusCanon`'s too, and say so
      # rather than passing silently.
      - name: Host tests for the ecc2k kernels
        run: make -C gpu/ecc2k test
