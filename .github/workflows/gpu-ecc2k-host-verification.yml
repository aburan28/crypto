# The `gpu/ecc2k` headers have a CPU test harness — `G2_HD` is `inline`
# when `__CUDACC__` is not defined, so everything but the kernels
# compiles and runs under g++ with no GPU.  Nothing ran it.
#
# `pairtable_kernel` and `pairtable_fold_kernel` are covered too, by
# `test_pairtable_emu.cpp`: their bodies are plain C++ once `__global__`
# and the thread indices are supplied, so that test compiles them as host
# functions and runs them once per emulated thread.  The folded one is
# checked against the table the CPU itself stored (`vec_fold.h`), and its
# table is then loaded by `PairSumTable::from_folded_parts` and probed
# (`examples/load_fold_table.rs`).  The second job compiles every kernel
# with nvcc.  What stays uncovered is how a kernel *runs* on a device —
# launch geometry, occupancy, concurrency — not what it computes or
# whether it builds.
#
# That matters most for `pt_canon`, the folded pair table's key.  Its
# correctness is not a thing a reviewer can eyeball: it has to name
# Frobenius orbits exactly as the squaring chain does *and* exactly as
# `koblitz_fast::FrobeniusCanon` does, and a key that gets either wrong
# reports "no decomposition" for a target that has one — a silent wrong
# answer from an oracle rather than a crash.  `test_pairtable.cpp`
# checks both, exhaustively at composite degrees; this runs it.
name: GPU ecc2k host verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'gpu/ecc2k/**'
      # `vec_canon.h` is generated from these: the basis change comes
      # from `FrobeniusCanon`, and the vectors are its own answers, so a
      # change to either moves what the C++ side is checked against.
      - 'examples/dump_canon_vectors.rs'
      - 'src/cryptanalysis/koblitz_fast.rs'
      # `vec_fold.h` is a folded table `PairSumTable` built, so a change
      # to how the CPU builds one moves what the fold kernel must match.
      - 'examples/dump_fold_vectors.rs'
      - 'src/cryptanalysis/koblitz_index_calculus.rs'
      # `make test` writes plans with the first and loads the emulated
      # build's tables with the second.
      - 'examples/dump_fold_plan.rs'
      - 'examples/load_fold_table.rs'
      - '.github/workflows/gpu-ecc2k-host-verification.yml'
jobs:
  host-tests:
    runs-on: ubuntu-latest
    # Most of this is one `cargo build --release` to generate the
    # vectors; the C++ itself is seconds.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      # `make test` builds nine binaries and runs them, three per curve:
      # the field and curve harness, the pair table's building blocks,
      # and the pair-table kernels themselves run on the host.  The two
      # pair-table ones decline for `ecc2k95` at m = 97 > 62, which is
      # `pt_low64`'s ceiling and `FrobeniusCanon`'s too, and say so
      # rather than passing silently.  Then the round trip: the folded
      # tables the emulated device build made, loaded and probed on the
      # CPU; and the emulation again under ThreadSanitizer, with a
      # control that must be reported.
      # `make test` ends with the emulation under ThreadSanitizer.  GCC
      # 13's TSan cannot place its shadow memory when 32 bits of mmap
      # addresses are randomised, as they are on ubuntu-24.04 runners,
      # and aborts with "unexpected memory mapping"; 28 is what it
      # expects.
      - name: Let ThreadSanitizer map its shadow memory
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Host tests for the ecc2k kernels
        run: make -C gpu/ecc2k test

  # The same kernels through nvcc, for Hopper and both Blackwell targets.
  # The host tests compile them with g++ behind a shim and the walk has
  # been compiled with clang; this is the compiler a device build uses,
  # with warnings as errors.  Compile only: no GPU, no driver.
  nvcc-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # nvcc and the runtime headers from NVIDIA's apt repository, nothing
      # else.  12.9 is the ptxas the occupancy tables in the README quote,
      # and the first 12.x with all of sm_90, sm_100 and sm_120.
      - name: Install nvcc
        run: |
          curl -sSfLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cuda-nvcc-12-9 cuda-cudart-dev-12-9
          echo /usr/local/cuda-12.9/bin >> "$GITHUB_PATH"
      - name: Compile every ecc2k kernel with nvcc
        run: make -C gpu/ecc2k nvcc-check
