name: Boolean F5 support-aware batch

on:
  push:
    paths:
      - 'research/boolean_f5_support_aware_20261002/**'
      - 'src/cryptanalysis/gf2_elim.rs'
      - '.github/workflows/boolean-f5-support-aware.yml'
  pull_request:
    paths:
      - 'research/boolean_f5_support_aware_20261002/**'
      - 'src/cryptanalysis/gf2_elim.rs'
      - '.github/workflows/boolean-f5-support-aware.yml'
  workflow_dispatch:
    inputs:
      phase:
        description: Qualified phase
        required: true
        default: discovery
        type: choice
        options: [discovery, holdout]
      discovery_run_id:
        description: Passing discovery run ID for holdout
        required: false
        type: string
      discovery_run_attempt:
        description: Discovery run attempt for holdout
        required: false
        default: '1'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: boolean-f5-support-aware-${{ github.ref }}
  cancel-in-progress: false

env:
  KIC_F5_DIRECT_PACK: '1'
  KIC_F5_UNPACK_DIRECT: '1'
  KIC_GF2_TABLES: '4'
  KIC_F5_AVX512_UNPACK: '0'
  KIC_GF2_REUSE_TABLE: '0'
  RAYON_NUM_THREADS: '1'

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Mathematical and native verifier tests
        run: |
          python3 tools/isolated_bench.py busy -- cargo test --release --locked --manifest-path research/boolean_f5_support_aware_20261002/Cargo.toml -- --test-threads=1
          python3 tools/isolated_bench.py busy -- cargo test --lib word_aligned_prefix_then_resume_matches_fresh_echelon
      - name: Rust formatting
        run: cargo fmt --manifest-path research/boolean_f5_support_aware_20261002/Cargo.toml --check
      - name: Development exact-output processes
        run: |
          python3 tools/isolated_bench.py busy -- cargo build --release --locked --manifest-path research/boolean_f5_support_aware_20261002/Cargo.toml
          worker=research/boolean_f5_support_aware_20261002/target/release/boolean-f5-support-aware
          "$worker" --cell development 12 17 independent_affine 2 1 > "$RUNNER_TEMP/f5-support-dev-n12.jsonl"
          "$worker" --cell development 24 19 walk_affine 2 1 > "$RUNNER_TEMP/f5-support-dev-n24.jsonl"
          jq -e 'select(.kind == "sample" and .arm == "support_unpack_layout") | any(.calls[]; .support_projected == true)' "$RUNNER_TEMP/f5-support-dev-n24.jsonl"

  qualified-discovery:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'discovery'
    needs: correctness
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Frozen discovery under one reserved physical core
        run: bash research/boolean_f5_support_aware_20261002/run.sh discovery research/boolean_f5_support_aware_20261002/ci_discovery_${{ github.run_id }}_${{ github.run_attempt }}
      - name: Preserve successful or failed attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boolean-f5-support-aware-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/boolean_f5_support_aware_20261002/ci_discovery_${{ github.run_id }}_${{ github.run_attempt }}/
          if-no-files-found: error

  qualified-holdout:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'holdout'
    needs: correctness
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download passing discovery bundle
        uses: actions/download-artifact@v4
        with:
          name: boolean-f5-support-aware-discovery-${{ inputs.discovery_run_id }}-${{ inputs.discovery_run_attempt }}
          path: ${{ runner.temp }}/f5-support-discovery
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.discovery_run_id }}
      - name: Frozen fresh holdout bound to discovery
        run: bash research/boolean_f5_support_aware_20261002/run.sh holdout research/boolean_f5_support_aware_20261002/ci_holdout_${{ github.run_id }}_${{ github.run_attempt }} "$RUNNER_TEMP/f5-support-discovery"
      - name: Preserve successful or failed attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boolean-f5-support-aware-holdout-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/boolean_f5_support_aware_20261002/ci_holdout_${{ github.run_id }}_${{ github.run_attempt }}/
          if-no-files-found: error
