name: N83 K3300 K3350 balanced-order sealed replay

on:
  push:
    branches: [codex/n83-k-abba-20261015]
    paths:
      - .github/workflows/n83-k-abba.yml
      - research/n83_k_abba_20261015/**
      - research/n83_k_abba_results_20261015/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: n83-k-abba-${{ github.ref }}
  cancel-in-progress: false

jobs:
  four-arm-balanced-sealed-replay:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the executed source snapshot
        shell: bash
        run: |
          set -euo pipefail
          frozen=d5e6fc717bac432efba63564ba12081d464eebb6
          git fetch --no-tags --depth=1 origin "$frozen"
          test "$(git rev-parse FETCH_HEAD)" = "$frozen"
          mkdir -p "$RUNNER_TEMP/n83-k-abba-frozen-source"
          git archive "$frozen" Cargo.lock \
            examples/koblitz_orbit_dlp_fast.rs \
            examples/n83_rho_optimization_eval.rs \
            research/n83_dense_root_20261013 \
            research/n83_factor_base_100_20261014 \
            research/n83_factor_base_refine_20261014 \
            research/n83_factor_base_confirm_20261015 \
            research/n83_indexed5_20261013 \
            research/n83_root4_20261014 \
            research/n83_k3250_sparse_fresh_20261015 \
            research/n83_k3350_sparse_fresh_20261015 \
            research/n83_k_abba_20261015 \
            | tar -xf - -C "$RUNNER_TEMP/n83-k-abba-frozen-source"
          test "$(sha256sum "$RUNNER_TEMP/n83-k-abba-frozen-source/examples/koblitz_orbit_dlp_fast.rs" | cut -d' ' -f1)" = \
            c9824acebda0360416c3c507594bb07c17ca798c32cbf8f84bba95ca2c44d5b1

      - name: Download the exact completed raw artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-k-abba-sealed"
          gh api repos/aburan28/crypto/actions/artifacts/11964534821/zip > \
            "$RUNNER_TEMP/n83-k-abba-sealed/raw.zip"
          test "$(sha256sum "$RUNNER_TEMP/n83-k-abba-sealed/raw.zip" | cut -d' ' -f1)" = \
            62f5c35620f993203a6842f1ac643c56b05067db881214d5298177ccfff65bdc
          unzip -q "$RUNNER_TEMP/n83-k-abba-sealed/raw.zip" -d \
            "$RUNNER_TEMP/n83-k-abba-sealed/raw"
          test "$(sha256sum "$RUNNER_TEMP/n83-k-abba-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            65e66d4c5f3052eadc3dd3c23ca2df3d2203c67d10b08d2c7cba205936f59cde

      - name: Independently replay four bases and all 16000 answers
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 "$RUNNER_TEMP/n83-k-abba-frozen-source/research/n83_k3250_sparse_fresh_20261015/generate.py" > \
            "$RUNNER_TEMP/n83-k-abba-sealed/prior-fixture-check.json"
          python3 "$RUNNER_TEMP/n83-k-abba-frozen-source/research/n83_k3350_sparse_fresh_20261015/generate.py" > \
            "$RUNNER_TEMP/n83-k-abba-sealed/prior-k3350-fixture-check.json"
          python3 "$RUNNER_TEMP/n83-k-abba-frozen-source/research/n83_k_abba_20261015/generate.py" > \
            "$RUNNER_TEMP/n83-k-abba-sealed/fixture-check.json"
          python3 "$RUNNER_TEMP/n83-k-abba-frozen-source/research/n83_k_abba_20261015/verify.py" \
            "$RUNNER_TEMP/n83-k-abba-sealed/raw/results" > \
            "$RUNNER_TEMP/n83-k-abba-sealed/local-replay.log"
          test "$(sha256sum "$RUNNER_TEMP/n83-k-abba-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            65e66d4c5f3052eadc3dd3c23ca2df3d2203c67d10b08d2c7cba205936f59cde

      - name: Reproduce the canonical current-head result records
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k_abba_20261015/generate.py > /dev/null
          python3 research/n83_k_abba_results_20261015/materialize.py \
            --artifact-zip "$RUNNER_TEMP/n83-k-abba-sealed/raw.zip" \
            --artifact-sha256 62f5c35620f993203a6842f1ac643c56b05067db881214d5298177ccfff65bdc \
            --analysis-sha256 65e66d4c5f3052eadc3dd3c23ca2df3d2203c67d10b08d2c7cba205936f59cde \
            "$RUNNER_TEMP/n83-k-abba-sealed/raw/results"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Preserve current-head replay receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-k-abba-sealed-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/n83-k-abba-sealed/local-replay.log
            ${{ runner.temp }}/n83-k-abba-sealed/fixture-check.json
          if-no-files-found: ignore
          retention-days: 14
