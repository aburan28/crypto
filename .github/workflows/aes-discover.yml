name: AES discovery laboratory
on:
  pull_request:
    paths:
      - 'tools/aes-discover/**'
      - 'research/aes_distinguisher_20261017/**'
      - '.github/workflows/aes-discover.yml'
  push:
    paths:
      - 'tools/aes-discover/**'
      - 'research/aes_distinguisher_20261017/**'
      - '.github/workflows/aes-discover.yml'
permissions:
  contents: read
jobs:
  native-correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aburan28/cryptanalysis
          ref: 2fe7393e06e58c1f3504bdbf57255a1fb36017d0
          path: .mirror-reference
          sparse-checkout: tools/aes-discover
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: bash tools/aes-discover/check-mirror.sh .mirror-reference
      - run: openssl version
      - run: cargo fmt --manifest-path tools/aes-discover/Cargo.toml -- --check
      - run: cargo clippy --release --locked --all-targets --manifest-path tools/aes-discover/Cargo.toml -- -D warnings
      - run: cargo test --release --locked --manifest-path tools/aes-discover/Cargo.toml
      - run: bash -n tools/aes-discover/check-mirror.sh
