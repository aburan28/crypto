name: Koblitz Stage 98 n53 compact evidence

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage61_production_rank.py"
      - "scripts/run_koblitz_stage98_compact_evidence.py"
      - ".github/workflows/koblitz-stage98-compact-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate compact evidence controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage61_production_rank.py scripts/run_koblitz_stage98_compact_evidence.py
          python3 scripts/run_koblitz_stage98_compact_evidence.py self-test
          cargo test --release --example koblitz_rank_fixture
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-compact-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage98_compact_evidence.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage98-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare full and compact hash-complete evidence
        run: |
          python3 scripts/run_koblitz_stage98_compact_evidence.py run \
            --build "$RUNNER_TEMP/stage98-build" \
            --output "$RUNNER_TEMP/stage98-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage98_compact_evidence.py verify \
            --build "$RUNNER_TEMP/stage98-build" \
            --output "$RUNNER_TEMP/stage98-run" \
            > "$RUNNER_TEMP/stage98-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage98-compact-evidence-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage98-build
            ${{ runner.temp }}/stage98-run
            ${{ runner.temp }}/stage98-verification.json
