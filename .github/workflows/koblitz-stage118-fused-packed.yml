name: Koblitz Stage 118 n53 fused packed compaction

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage118_fused_packed.py"
      - ".github/workflows/koblitz-stage118-fused-packed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate fused packed controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage118_fused_packed.py
          python3 scripts/run_koblitz_stage118_fused_packed.py self-test
          cargo test --release --example koblitz_rank_fixture
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-fused-packed:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage118_fused_packed.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage118-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare second-pass and fused packed compaction
        run: |
          python3 scripts/run_koblitz_stage118_fused_packed.py run \
            --build "$RUNNER_TEMP/stage118-build" \
            --output "$RUNNER_TEMP/stage118-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage118_fused_packed.py verify \
            --build "$RUNNER_TEMP/stage118-build" \
            --output "$RUNNER_TEMP/stage118-run" \
            > "$RUNNER_TEMP/stage118-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage118-fused-packed-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage118-build
            ${{ runner.temp }}/stage118-run
            ${{ runner.temp }}/stage118-verification.json
