name: ic-leaderboard

# AGENTS.md §7b: docs/ic-leaderboard.html is current in every pull request
# that changes what it shows.  --check fails when an output is stale against
# the frozen files the builder reads, and when the boundary ledger has a
# section later than the one the page is current through.  It runs no
# experiment.  The lab browser's data file (AGENTS.md §7c) is checked the
# same way, against every committed session and round it indexes.
#
# A `paths:` list runs the check on a change to the files it names and on
# nothing else, so the lists below must name every file the builder reads.
# scripts/check_ic_leaderboard_paths.py records those reads and fails when
# either list misses one; the builder is on both lists, so the change that
# adds an input runs it.

on:
  pull_request:
    paths:
      - 'scripts/build_ic_leaderboard.py'
      - 'scripts/check_ic_leaderboard_paths.py'
      - 'scripts/test_check_ic_leaderboard_paths.py'
      - 'scripts/curve_id.py'
      - 'docs/ic-leaderboard.html'
      - 'docs/ic/LEADERBOARD.md'
      - 'docs/ic/leaderboard.json'
      - 'research/notes/index-calculus/RESEARCH_IC_BOUNDARY_LEDGER.md'
      - 'docs/ic/runs/ic-boundary-ledger-round5-2026-09-22.json'
      - 'research/ic_rho_reference_20260923/reprice/ic-boundary-ledger-round5-2026-09-22.json'
      - 'research/ic_rho_reference_20260923/analysis.json'
      - 'research/ic_exponent_20260926/analysis.json'
      - 'research/ic_constructions_20260926/analysis.json'
      - 'research/ic_descent_20260930/analysis-isolated.json'
      - 'research/ic_single_target_20260930/analysis.json'
      - 'docs/ic/runs/ic-oracle-pricing-lifted-2026-09-21.json'
      - 'docs/curves/registry.json'
      - 'docs/curves/ic/curves.yaml'
      - 'docs/curves/ic/curves.schema.json'
      - 'research/ic_descent_20260930/runs-isolated/main/**'
      - 'research/ic_single_target_20260930/runs/**'
      - 'research/ic_tool_program/rule/v3/analysis.json'
      - 'research/ic_tool_program/rule/v3/runs/**'
      - 'research/ecbench_n37_rank_columns_20261004/RESULT.json'
      - 'research/ecbench_n37_k8_k16_20261004/DECISION.json'
      - 'research/ecbench_n37_online_ir_20261004/DECISION.json'
      - 'research/ecbench_n37_online_ir_20261004/candidate_claims/ic-k8-0.json'
      - 'research/ecbench_n37_online_ir_20261004/candidate_claims/ic-k16-0.json'
      - 'research/ecbench_n37_native_online_wall_20261004/DECISION.json'
      - 'research/ecbench_n37_native_online_wall_20261004/EVIDENCE.json'
      - 'research/f6_ic_geometric_closure_20261003/small_cold/measurements.jsonl'
      - 'research/f6_ic_geometric_closure_20261003/small_cold/replay-certificate.json'
      - 'research/f6_ic_ecbench_ladder_20261005/ANALYSIS.json'
      - 'research/ecbench_n41_n53_shared_rank_20261005/DECISION.json'
      - '.github/workflows/ic-leaderboard.yml'
      - 'scripts/build_lab_browser.py'
      - 'docs/browser/**'
      - 'research/ecbench_*/sessions/**'
      - 'research/ic_candidate_tournament_20260915/runs/**'
      - 'docs/ic/**'
      - 'research/notes/ecc2k130/**'
  push:
    branches: [main]
    paths:
      - 'scripts/build_ic_leaderboard.py'
      - 'scripts/check_ic_leaderboard_paths.py'
      - 'scripts/test_check_ic_leaderboard_paths.py'
      - 'scripts/curve_id.py'
      - 'docs/ic-leaderboard.html'
      - 'docs/ic/LEADERBOARD.md'
      - 'docs/ic/leaderboard.json'
      - 'research/notes/index-calculus/RESEARCH_IC_BOUNDARY_LEDGER.md'
      - 'docs/ic/runs/ic-boundary-ledger-round5-2026-09-22.json'
      - 'research/ic_rho_reference_20260923/reprice/ic-boundary-ledger-round5-2026-09-22.json'
      - 'research/ic_rho_reference_20260923/analysis.json'
      - 'research/ic_exponent_20260926/analysis.json'
      - 'research/ic_constructions_20260926/analysis.json'
      - 'research/ic_descent_20260930/analysis-isolated.json'
      - 'research/ic_single_target_20260930/analysis.json'
      - 'docs/ic/runs/ic-oracle-pricing-lifted-2026-09-21.json'
      - 'docs/curves/registry.json'
      - 'docs/curves/ic/curves.yaml'
      - 'docs/curves/ic/curves.schema.json'
      - 'research/ic_descent_20260930/runs-isolated/main/**'
      - 'research/ic_single_target_20260930/runs/**'
      - 'research/ic_tool_program/rule/v3/analysis.json'
      - 'research/ic_tool_program/rule/v3/runs/**'
      - 'research/ecbench_n37_rank_columns_20261004/RESULT.json'
      - 'research/ecbench_n37_k8_k16_20261004/DECISION.json'
      - 'research/ecbench_n37_online_ir_20261004/DECISION.json'
      - 'research/ecbench_n37_online_ir_20261004/candidate_claims/ic-k8-0.json'
      - 'research/ecbench_n37_online_ir_20261004/candidate_claims/ic-k16-0.json'
      - 'research/ecbench_n37_native_online_wall_20261004/DECISION.json'
      - 'research/ecbench_n37_native_online_wall_20261004/EVIDENCE.json'
      - 'research/f6_ic_geometric_closure_20261003/small_cold/measurements.jsonl'
      - 'research/f6_ic_geometric_closure_20261003/small_cold/replay-certificate.json'
      - 'research/f6_ic_ecbench_ladder_20261005/ANALYSIS.json'
      - 'research/ecbench_n41_n53_shared_rank_20261005/DECISION.json'
      - '.github/workflows/ic-leaderboard.yml'
      - 'scripts/build_lab_browser.py'
      - 'docs/browser/**'
      - 'research/ecbench_*/sessions/**'
      - 'research/ic_candidate_tournament_20260915/runs/**'
      - 'docs/ic/**'
      - 'research/notes/ecc2k130/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  current:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: The path check's own tests
        run: python3 scripts/test_check_ic_leaderboard_paths.py
      - name: This workflow's path filter covers every file the builder reads
        run: python3 scripts/check_ic_leaderboard_paths.py
      - name: The leaderboard is current with its sources and the ledger
        run: python3 scripts/build_ic_leaderboard.py --check
      - name: The lab browser's index is current with the registry, sessions and rounds (AGENTS.md §7c)
        run: python3 scripts/build_lab_browser.py --check
