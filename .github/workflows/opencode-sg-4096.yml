name: Open OpenCode port 4096

on:
  push:
    branches:
      - cursor/opencode-sg-4096-b74d
    paths:
      - '.github/workflows/opencode-sg-4096.yml'
  workflow_dispatch:
    inputs:
      cidr:
        description: 'CIDR allowed for TCP/4096'
        required: false
        default: '0.0.0.0/0'
      instance_id:
        description: 'EC2 instance id (default: durable G7 host)'
        required: false
        default: 'i-04b1d89ecccfcc808'

permissions:
  contents: read

jobs:
  open-port:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Authorize TCP/4096 on instance security groups
        env:
          INSTANCE_ID: ${{ github.event.inputs.instance_id || 'i-04b1d89ecccfcc808' }}
          CIDR: ${{ github.event.inputs.cidr || '0.0.0.0/0' }}
        run: |
          set -euo pipefail
          echo "Instance: $INSTANCE_ID"
          echo "CIDR: $CIDR"

          mapfile -t SGS < <(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].SecurityGroups[].GroupId' \
            --output text | tr '\t' '\n')

          if [ "${#SGS[@]}" -eq 0 ] || [ -z "${SGS[0]}" ] || [ "${SGS[0]}" = None ]; then
            echo "No security groups found for $INSTANCE_ID" >&2
            exit 1
          fi

          for sg in "${SGS[@]}"; do
            echo "Updating $sg ..."
            aws ec2 authorize-security-group-ingress \
              --group-id "$sg" \
              --ip-permissions "IpProtocol=tcp,FromPort=4096,ToPort=4096,IpRanges=[{CidrIp=$CIDR,Description=OpenCode server}]" \
              >/tmp/sg-out.json 2>/tmp/sg-err.txt && status=0 || status=$?

            if [ "$status" -eq 0 ]; then
              echo "Authorized TCP/4096 from $CIDR on $sg"
              cat /tmp/sg-out.json
            elif grep -q InvalidPermission.Duplicate /tmp/sg-err.txt; then
              echo "Rule already present on $sg"
            else
              echo "authorize failed for $sg:" >&2
              cat /tmp/sg-err.txt >&2
              exit "$status"
            fi

            echo "Current ingress on $sg:"
            aws ec2 describe-security-groups --group-ids "$sg" \
              --query 'SecurityGroups[0].IpPermissions[?FromPort==`4096` || ToPort==`4096`]' \
              --output json
          done
