name: N83 K3300 root11 sparse canonical sealed replay

on:
  push:
    branches: [codex/n83-sparse-canonical-20261015]
    paths:
      - .github/workflows/n83-sparse-canonical.yml
      - research/n83_sparse_canonical_20261015/**
      - research/n83_sparse_canonical_results_20261015/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: n83-sparse-canonical-${{ github.ref }}
  cancel-in-progress: false

jobs:
  same-base-sparse-sealed-replay:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the executed source snapshot
        shell: bash
        run: |
          set -euo pipefail
          frozen=39f8c5e74b2916333c6be60f2e653d7651eb7308
          git fetch --no-tags --depth=1 origin "$frozen"
          test "$(git rev-parse FETCH_HEAD)" = "$frozen"
          mkdir -p "$RUNNER_TEMP/n83-sparse-frozen-source"
          git archive "$frozen" Cargo.lock \
            examples/koblitz_orbit_dlp_fast.rs \
            examples/n83_rho_optimization_eval.rs \
            research/n83_dense_root_20261013 \
            research/n83_indexed5_20261013 \
            research/n83_root4_20261014 \
            research/n83_factor_base_refine_20261014 \
            research/n83_sparse_canonical_20261015 \
            | tar -xf - -C "$RUNNER_TEMP/n83-sparse-frozen-source"
          test "$(sha256sum "$RUNNER_TEMP/n83-sparse-frozen-source/examples/koblitz_orbit_dlp_fast.rs" | cut -d' ' -f1)" = \
            c9824acebda0360416c3c507594bb07c17ca798c32cbf8f84bba95ca2c44d5b1

      - name: Download the exact completed raw artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-sparse-sealed"
          gh api repos/aburan28/crypto/actions/artifacts/11947421783/zip > \
            "$RUNNER_TEMP/n83-sparse-sealed/raw.zip"
          test "$(sha256sum "$RUNNER_TEMP/n83-sparse-sealed/raw.zip" | cut -d' ' -f1)" = \
            be12dbe701fbe33092b2bb104d2e4cd07d321374596b1f8c69b83c332ac137fc
          unzip -q "$RUNNER_TEMP/n83-sparse-sealed/raw.zip" -d \
            "$RUNNER_TEMP/n83-sparse-sealed/raw"
          test "$(sha256sum "$RUNNER_TEMP/n83-sparse-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            6d555f4d6f8596fda5451b18e9f6cc0451fc63b2f792fd7baf1f33cf1fcf501c

      - name: Independently replay both bases and all 2000 targets
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 "$RUNNER_TEMP/n83-sparse-frozen-source/research/n83_sparse_canonical_20261015/verify.py" \
            "$RUNNER_TEMP/n83-sparse-sealed/raw/results" > \
            "$RUNNER_TEMP/n83-sparse-sealed/local-replay.log"
          test "$(sha256sum "$RUNNER_TEMP/n83-sparse-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            6d555f4d6f8596fda5451b18e9f6cc0451fc63b2f792fd7baf1f33cf1fcf501c

      - name: Reproduce the canonical current-head result records
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_sparse_canonical_results_20261015/materialize.py \
            --artifact-zip "$RUNNER_TEMP/n83-sparse-sealed/raw.zip" \
            "$RUNNER_TEMP/n83-sparse-sealed/raw/results"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Preserve current-head replay receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-sparse-canonical-sealed-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-sparse-sealed/local-replay.log
          if-no-files-found: ignore
          retention-days: 14
