name: N83 K3300 root11 canonical-selector screen

on:
  push:
    branches: [codex/n83-sparse-canonical-20261015]
    paths:
      - .github/workflows/n83-sparse-canonical.yml
      - research/n83_sparse_canonical_20261015/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-sparse-canonical-${{ github.ref }}
  cancel-in-progress: false

jobs:
  same-base-canonical-selector:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Freeze source, public points and resource preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-sparse-canonical"
          python3 research/n83_sparse_canonical_20261015/run.py --preflight > \
            "$RUNNER_TEMP/n83-sparse-canonical/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-sparse-canonical/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-sparse-canonical/cargo-version.txt"

      - name: Build exact producer and run canonical-selector tests
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-sparse-canonical-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-sparse-canonical/example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-sparse-canonical/build.log" 2>&1

      - name: Run bounded same-base scan and sparse arms
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-sparse-canonical-target"
          python3 research/n83_sparse_canonical_20261015/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --output "$RUNNER_TEMP/n83-sparse-canonical/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-sparse-canonical/run.log"

      - name: Independently replay both bases and every target
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-sparse-canonical/results" ]; then
            python3 research/n83_sparse_canonical_20261015/verify.py \
              "$RUNNER_TEMP/n83-sparse-canonical/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-sparse-canonical/verify.log"
          fi

      - name: Preserve raw receipts and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-sparse-canonical-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-sparse-canonical/
          if-no-files-found: error
          retention-days: 14
