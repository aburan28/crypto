name: Isogeny fiber nine-arm independent Linux replay

on:
  pull_request:
    paths:
      - '.github/workflows/isogeny-fiber-nine-arm-linux.yml'
      - 'research/isogeny_torsion_fibers_20261012/chi_polynomial_20261015/different_j_resultant_20261016/RUN_HELDOUT_NINE_ARM_LINUX_V1.sh'
      - 'research/isogeny_torsion_fibers_20261012/chi_polynomial_20261015/different_j_resultant_20261016/HELDOUT_NINE_ARM_SPEC_V4.json'
      - 'research/isogeny_torsion_fibers_20261012/chi_polynomial_20261015/different_j_resultant_20261016/frozen_linux_sources_v1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/isogeny-fiber-nine-arm-linux.yml
            Cargo.toml
            Cargo.lock
            src
            docs/ic/calibration.json
            docs/ic/boundary_targets.json
            docs/ecbench/schema.sql
            docs/curves/registry.json
            docs/curves/traits.json
            examples/different_j_chi_resultant.rs
            examples/different_j_inverse_velu_oracle.rs
            examples/different_j_chi_heldout_check.rs
            examples/different_j_chi_heldout_summary.rs
            examples/different_j_chi_heldout_meter.rs
            research/isogeny_torsion_fibers_20261012/chi_polynomial_20261015/different_j_resultant_20261016/frozen_linux_sources_v1
            research/isogeny_torsion_fibers_20261012/chi_polynomial_20261015/different_j_resultant_20261016/FOUR_TARGET_PUBLIC_V1.json
            research/isogeny_torsion_fibers_20261012/chi_polynomial_20261015/different_j_resultant_20261016/FOUR_TARGET_CHECKER_V1.json
            research/isogeny_torsion_fibers_20261012/chi_polynomial_20261015/different_j_resultant_20261016/HELDOUT_NINE_ARM_SPEC_V4.json
            research/isogeny_torsion_fibers_20261012/chi_polynomial_20261015/different_j_resultant_20261016/LINUX_REPLAY_SPEC_V1.json
            research/isogeny_torsion_fibers_20261012/chi_polynomial_20261015/different_j_resultant_20261016/RUN_HELDOUT_NINE_ARM_LINUX_V1.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Restore the byte-exact frozen replay sources
        run: |
          frozen=research/isogeny_torsion_fibers_20261012/chi_polynomial_20261015/different_j_resultant_20261016/frozen_linux_sources_v1
          for name in different_j_chi_resultant different_j_inverse_velu_oracle different_j_chi_heldout_check different_j_chi_heldout_summary different_j_chi_heldout_meter; do
            cp "$frozen/$name.rs.txt" "examples/$name.rs"
          done
      - name: Record host and source receipts
        run: |
          mkdir -p "${RUNNER_TEMP}/isogeny-nine-arm-linux-v1"
          uname -a > "${RUNNER_TEMP}/isogeny-nine-arm-linux-v1/host.txt"
          lscpu >> "${RUNNER_TEMP}/isogeny-nine-arm-linux-v1/host.txt"
          git rev-parse HEAD > "${RUNNER_TEMP}/isogeny-nine-arm-linux-v1/head.txt"
          sha256sum examples/different_j_chi_resultant.rs examples/different_j_inverse_velu_oracle.rs examples/different_j_chi_heldout_check.rs examples/different_j_chi_heldout_summary.rs examples/different_j_chi_heldout_meter.rs > "${RUNNER_TEMP}/isogeny-nine-arm-linux-v1/sources.sha256"
          test "$(sha256sum examples/different_j_chi_resultant.rs | cut -d' ' -f1)" = c3cb3b06fd5d90708334d6b88ad878a780ddbd34979e8da88dfc363e41a74319
          test "$(sha256sum examples/different_j_inverse_velu_oracle.rs | cut -d' ' -f1)" = 185004244350c0a29306e232f9a13d3942cf6630923f2024cdb1bc02a4ddbcbc
          test "$(sha256sum examples/different_j_chi_heldout_check.rs | cut -d' ' -f1)" = 78966d5663e17aa43aeb2b1e3ac44ef605c64241db8fd88f0d79b6e97f8ef314
          test "$(sha256sum examples/different_j_chi_heldout_summary.rs | cut -d' ' -f1)" = 063c599c967fa5eb58a024b2b12c7e5133263868ccb2c862aba8040ced35c73e
          test "$(sha256sum examples/different_j_chi_heldout_meter.rs | cut -d' ' -f1)" = 3e478aa3edea464e97326cd4a4c6e34010a49bc18a3217ce5a809702bf0c2d7a
      - name: Build native solvers, independent checker, summary, and meter
        run: cargo build --release --locked --example different_j_chi_resultant --example different_j_inverse_velu_oracle --example different_j_chi_heldout_check --example different_j_chi_heldout_summary --example different_j_chi_heldout_meter
      - name: Execute 108 cold children and independently replay
        run: |
          output="${RUNNER_TEMP}/isogeny-nine-arm-linux-v1"
          sha256sum target/release/examples/different_j_chi_resultant target/release/examples/different_j_inverse_velu_oracle target/release/examples/different_j_chi_heldout_check target/release/examples/different_j_chi_heldout_summary target/release/examples/different_j_chi_heldout_meter > "$output/binaries.sha256"
          bash research/isogeny_torsion_fibers_20261012/chi_polynomial_20261015/different_j_resultant_20261016/RUN_HELDOUT_NINE_ARM_LINUX_V1.sh "$output/children"
          target/release/examples/different_j_chi_heldout_check research/isogeny_torsion_fibers_20261012/chi_polynomial_20261015/different_j_resultant_20261016/FOUR_TARGET_PUBLIC_V1.json research/isogeny_torsion_fibers_20261012/chi_polynomial_20261015/different_j_resultant_20261016/FOUR_TARGET_CHECKER_V1.json "$output/children" > "$output/check.json" 2> "$output/check.stderr"
          target/release/examples/different_j_chi_heldout_summary "$output/children" > "$output/summary.json"
          (cd "$output" && sha256sum children/* check.json summary.json > artifacts.sha256)
      - name: Retain host, every child, failures, and replay output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isogeny-nine-arm-linux-v1
          path: ${{ runner.temp }}/isogeny-nine-arm-linux-v1
          if-no-files-found: warn
          retention-days: 90
