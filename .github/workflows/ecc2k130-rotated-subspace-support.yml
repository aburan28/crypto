name: ECC2K-130 rotated subspace support replay
on:
  pull_request:
    paths:
      - 'research/notes/ecc2k130/rotated_subspace_support_20260925/**'
      - '.github/workflows/ecc2k130-rotated-subspace-support.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check frozen source and input hashes
        run: |
          python3 -m py_compile research/notes/ecc2k130/rotated_subspace_support_20260925/{gate,verify,run,ci_replay}.py
          python3 research/notes/ecc2k130/rotated_subspace_support_20260925/ci_replay.py
      - name: Independently replay complete n13 support and n131 density archive
        if: hashFiles('research/notes/ecc2k130/rotated_subspace_support_20260925/evidence/raw.tar.gz') != ''
        run: python3 research/notes/ecc2k130/rotated_subspace_support_20260925/ci_replay.py --evidence research/notes/ecc2k130/rotated_subspace_support_20260925/evidence
