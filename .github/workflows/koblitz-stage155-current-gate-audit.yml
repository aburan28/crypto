name: Koblitz Stage 155 current gate audit
on:
  pull_request:
    paths:
      - "docs/ic/patches/koblitz-n59-fifo-admitted-fastpath-rejected-20260922.patch"
      - "docs/ic/runs/koblitz-n59-fifo-admitted-fastpath-rejection-20260922.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-154-current-gate-audit-20260922/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-155-current-gate-audit-20260922/**"
      - "scripts/compose_koblitz_stage154_gate_audit.py"
      - "scripts/compose_koblitz_stage155_gate_audit.py"
      - ".github/workflows/koblitz-stage155-current-gate-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay Stage 154 historical audit and Stage 155 current audit
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage154_gate_audit.py scripts/compose_koblitz_stage155_gate_audit.py
          python3 -m json.tool docs/ic/runs/koblitz-n59-fifo-admitted-fastpath-rejection-20260922.json >/dev/null
          python3 scripts/compose_koblitz_stage154_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-154-current-gate-audit-20260922 > "$RUNNER_TEMP/stage154-historical.json"
          python3 scripts/compose_koblitz_stage155_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-155-current-gate-audit-20260922 > "$RUNNER_TEMP/stage155-current.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
