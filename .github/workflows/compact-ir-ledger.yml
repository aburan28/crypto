name: Compact-orbit complete instruction ledger

on:
  pull_request:
    paths:
      - '.github/workflows/compact-ir-ledger.yml'
      - 'research/notes/ecc2k130/compact_ir_ledger_20260930/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Cargo.toml
            docs/ic/calibration.json
            src
            examples/koblitz_orbit_dlp_s3_batch.rs
            examples/koblitz_rho_batch_ks_v2_n61.rs
            examples/koblitz_rho_batch_ks_v3.rs
            research/notes/ecc2k130/compact_shared_log_20260925/Cargo.lock
            research/notes/ecc2k130/compact_orbit_rank_evidence_20260929/verify_rank.py
            research/notes/ecc2k130/compact_orbit_point_panel_20260929
            research/notes/ecc2k130/compact_s3_prefilter_20260930
            research/notes/ecc2k130/compact_ir_ledger_20260930
            research/notes/ecc2k130/compact_frozen_source_replay_20260929
            research/sat_factor_base_review_20260908/autolab_orbit_extract_20260924/independent_replay.py
            tools/isolated_bench.py
            .github/workflows/compact-s3-prefilter.yml
      - name: Check frozen inputs, parser and materializer failure cases
        run: |
          python3 -m unittest discover -s research/notes/ecc2k130/compact_ir_ledger_20260930 -p 'test_panel.py' -v
          python3 -m unittest discover -s research/notes/ecc2k130/compact_frozen_source_replay_20260929 -p 'test_materialize.py' -v
      - name: Materialize exact measured source
        run: |
          mkdir -p "${{ runner.temp }}/compact-ir"
          python3 research/notes/ecc2k130/compact_frozen_source_replay_20260929/materialize.py \
            --freeze research/notes/ecc2k130/compact_s3_prefilter_20260930/FROZEN.json \
            --dest "${{ runner.temp }}/compact-ir-frozen-src" \
            --receipt "${{ runner.temp }}/compact-ir/materialization.json"
      - name: Build exact-source release examples
        working-directory: ${{ runner.temp }}/compact-ir-frozen-src
        run: |
          cp research/notes/ecc2k130/compact_shared_log_20260925/Cargo.lock Cargo.lock
          cargo build --release --locked --example koblitz_orbit_dlp_s3_batch --example koblitz_rho_batch_ks_v3
      - name: Native n37 one-target integration smoke and independent replay
        run: |
          python3 research/notes/ecc2k130/compact_ir_ledger_20260930/run_panel.py \
            --cell n37_L1 \
            --frozen-root "${{ runner.temp }}/compact-ir-frozen-src" \
            --batch "${{ runner.temp }}/compact-ir-frozen-src/target/release/examples/koblitz_orbit_dlp_s3_batch" \
            --rho "${{ runner.temp }}/compact-ir-frozen-src/target/release/examples/koblitz_rho_batch_ks_v3" \
            --materialization "${{ runner.temp }}/compact-ir/materialization.json" \
            --out "${{ runner.temp }}/compact-ir/n37_L1_smoke" --backend native
          python3 research/notes/ecc2k130/compact_ir_ledger_20260930/verify_panel.py \
            --cell n37_L1 --run-dir "${{ runner.temp }}/compact-ir/n37_L1_smoke" \
            --out "${{ runner.temp }}/compact-ir/n37_L1_smoke/receipt.json" --smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-ir-validation
          path: ${{ runner.temp }}/compact-ir
          if-no-files-found: warn
          retention-days: 90

  measure:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cell: [n37_L1, n37_L1024, n41_L1, n41_L1024, n53_L1, n53_L1024]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Cargo.toml
            docs/ic/calibration.json
            src
            examples/koblitz_orbit_dlp_s3_batch.rs
            examples/koblitz_rho_batch_ks_v2_n61.rs
            examples/koblitz_rho_batch_ks_v3.rs
            research/notes/ecc2k130/compact_shared_log_20260925/Cargo.lock
            research/notes/ecc2k130/compact_orbit_rank_evidence_20260929/verify_rank.py
            research/notes/ecc2k130/compact_orbit_point_panel_20260929
            research/notes/ecc2k130/compact_s3_prefilter_20260930
            research/notes/ecc2k130/compact_ir_ledger_20260930
            research/notes/ecc2k130/compact_frozen_source_replay_20260929
            research/sat_factor_base_review_20260908/autolab_orbit_extract_20260924/independent_replay.py
            tools/isolated_bench.py
            .github/workflows/compact-s3-prefilter.yml
      - name: Install Callgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind
          valgrind --version
      - name: Materialize exact measured source and build
        run: |
          mkdir -p "${{ runner.temp }}/compact-ir"
          python3 research/notes/ecc2k130/compact_frozen_source_replay_20260929/materialize.py \
            --freeze research/notes/ecc2k130/compact_s3_prefilter_20260930/FROZEN.json \
            --dest "${{ runner.temp }}/compact-ir-frozen-src" \
            --receipt "${{ runner.temp }}/compact-ir/materialization.json"
          cp "${{ runner.temp }}/compact-ir-frozen-src/research/notes/ecc2k130/compact_shared_log_20260925/Cargo.lock" \
            "${{ runner.temp }}/compact-ir-frozen-src/Cargo.lock"
          cargo build --manifest-path "${{ runner.temp }}/compact-ir-frozen-src/Cargo.toml" \
            --release --locked --example koblitz_orbit_dlp_s3_batch --example koblitz_rho_batch_ks_v3
      - name: Count complete frozen compact and rho processes
        id: count
        env:
          RAYON_NUM_THREADS: '1'
        run: |
          python3 research/notes/ecc2k130/compact_ir_ledger_20260930/run_panel.py \
            --cell "${{ matrix.cell }}" \
            --frozen-root "${{ runner.temp }}/compact-ir-frozen-src" \
            --batch "${{ runner.temp }}/compact-ir-frozen-src/target/release/examples/koblitz_orbit_dlp_s3_batch" \
            --rho "${{ runner.temp }}/compact-ir-frozen-src/target/release/examples/koblitz_rho_batch_ks_v3" \
            --materialization "${{ runner.temp }}/compact-ir/materialization.json" \
            --out "${{ runner.temp }}/compact-ir/${{ matrix.cell }}"
      - name: Independently replay every rank and point logarithm
        if: always() && steps.count.outcome != 'skipped'
        run: |
          python3 research/notes/ecc2k130/compact_ir_ledger_20260930/verify_panel.py \
            --cell "${{ matrix.cell }}" \
            --run-dir "${{ runner.temp }}/compact-ir/${{ matrix.cell }}" \
            --out "${{ runner.temp }}/compact-ir/${{ matrix.cell }}/receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-ir-${{ matrix.cell }}
          path: ${{ runner.temp }}/compact-ir
          if-no-files-found: warn
          retention-days: 90
