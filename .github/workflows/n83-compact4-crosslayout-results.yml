name: N83 compact4 cross-layout sealed result replay

on:
  push:
    branches: [codex/n83-compact4-crosslayout-20261016]
    paths:
      - .github/workflows/n83-compact4-crosslayout-results.yml
      - research/n83_compact4_crosslayout_results_20261016/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: n83-compact4-crosslayout-results-${{ github.ref }}
  cancel-in-progress: false

jobs:
  six-arm-sealed-replay:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read sealed artifact and analysis identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path('research/n83_compact4_crosslayout_results_20261016')
          index = json.loads((root / 'records_index.json').read_text())
          selection = json.loads((root / 'selection.json').read_text())
          if (index['schema'] != 'n83.compact4-crosslayout-compressed-records/v1'
                  or index['artifact_run_id'] != 38848691554
                  or index['artifact_id'] <= 0
                  or selection['artifact_id'] != index['artifact_id']
                  or selection['artifact_sha256'] != index['artifact_sha256']
                  or selection['analysis_sha256'] != index['analysis_sha256']
                  or selection['source_commit'] !=
                     '4a791be1d7fc53e4d3c5a7072d5a0bafa885de2a'
                  or index['measurement_rows'] != 6):
              raise SystemExit('sealed compact4 cross-layout identity differs')
          values = {'N83_ARTIFACT_ID': str(index['artifact_id']),
                    'N83_ARTIFACT_SHA': index['artifact_sha256'],
                    'N83_ANALYSIS_SHA': index['analysis_sha256']}
          for key, value in values.items():
              if key.endswith('SHA') and (len(value) != 64 or
                  any(ch not in '0123456789abcdef' for ch in value)):
                  raise SystemExit(f'invalid {key}')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in values.items():
                  output.write(f'{key}={value}\n')
          PY

      - name: Restore executed source and public fixtures
        shell: bash
        run: |
          set -euo pipefail
          frozen=4a791be1d7fc53e4d3c5a7072d5a0bafa885de2a
          git fetch --no-tags --depth=1 origin "$frozen"
          test "$(git rev-parse FETCH_HEAD)" = "$frozen"
          git worktree add --detach "$RUNNER_TEMP/n83-compact4-crosslayout-source" "$frozen"
          cd "$RUNNER_TEMP/n83-compact4-crosslayout-source"
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k_abba_20261015/generate.py > /dev/null
          python3 research/n83_root4_highk_20261015/generate.py > /dev/null
          python3 research/n83_best_e2e_20261015/generate.py > /dev/null
          python3 research/n83_legacy_challenger_20261015/generate.py > /dev/null
          python3 research/n83_root4_bloom_20261015/generate.py > /dev/null
          python3 research/n83_root11_highk_20261015/generate.py > /dev/null
          python3 research/n83_root11_edgek_20261015/generate.py > /dev/null
          python3 research/n83_final_tournament_20261015/generate.py > /dev/null
          python3 research/n83_edge_confirmation_20261015/generate.py > /dev/null
          python3 research/n83_final_tier1_20261015/generate.py > /dev/null
          python3 research/n83_unresolved_tier1_20261015/generate.py > /dev/null
          python3 research/n83_root4_memory_frontier_20261015/generate.py > /dev/null
          python3 research/n83_root4_highk_confirm_20261016/generate.py > /dev/null
          python3 research/n83_compact4_crosslayout_20261016/generate.py > /dev/null
          test "$(sha256sum research/n83_compact4_crosslayout_20261016/targets.jsonl | cut -d' ' -f1)" = \
            6c5558613d4f1115dc7bdb09b74d569645c0e85328ddad6555a2484317803a08

      - name: Download and hash exact raw artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-compact4-crosslayout-sealed"
          gh api "repos/aburan28/crypto/actions/artifacts/$N83_ARTIFACT_ID/zip" > \
            "$RUNNER_TEMP/n83-compact4-crosslayout-sealed/raw.zip"
          test "$(sha256sum "$RUNNER_TEMP/n83-compact4-crosslayout-sealed/raw.zip" | cut -d' ' -f1)" = \
            "$N83_ARTIFACT_SHA"
          unzip -q "$RUNNER_TEMP/n83-compact4-crosslayout-sealed/raw.zip" -d \
            "$RUNNER_TEMP/n83-compact4-crosslayout-sealed/raw"
          test "$(sha256sum "$RUNNER_TEMP/n83-compact4-crosslayout-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            "$N83_ANALYSIS_SHA"

      - name: Independently replay six bases and 48000 target records
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          set +e
          python3 "$RUNNER_TEMP/n83-compact4-crosslayout-source/research/n83_compact4_crosslayout_20261016/verify.py" \
            "$RUNNER_TEMP/n83-compact4-crosslayout-sealed/raw/results" > \
            "$RUNNER_TEMP/n83-compact4-crosslayout-sealed/local-replay.json"
          replay_status=$?
          set -e
          test "$(sha256sum "$RUNNER_TEMP/n83-compact4-crosslayout-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            "$N83_ANALYSIS_SHA"
          python3 - "$RUNNER_TEMP/n83-compact4-crosslayout-sealed/raw/results/analysis.json" "$replay_status" <<'PY'
          import json
          import sys
          status = json.load(open(sys.argv[1]))['status']
          code = int(sys.argv[2])
          if (status, code) not in {('COMPLETE', 0), ('INCOMPLETE', 1)}:
              raise SystemExit(f'unexpected replay status: {status}, exit {code}')
          PY

      - name: Reproduce current-head candidate and measurement records
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_compact4_crosslayout_results_20261016/materialize.py \
            --artifact-zip "$RUNNER_TEMP/n83-compact4-crosslayout-sealed/raw.zip" \
            --artifact-sha256 "$N83_ARTIFACT_SHA" \
            --analysis-sha256 "$N83_ANALYSIS_SHA" \
            --artifact-id "$N83_ARTIFACT_ID" \
            "$RUNNER_TEMP/n83-compact4-crosslayout-sealed/raw/results"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Preserve replay output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-compact4-crosslayout-sealed-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-compact4-crosslayout-sealed/local-replay.json
          if-no-files-found: ignore
          retention-days: 14
