name: N83 final tournament sealed result replay

on:
  push:
    branches: [codex/n83-final-tournament-20261015]
    paths:
      - .github/workflows/n83-final-tournament-results.yml
      - research/n83_final_tournament_results_20261015/records_index.json
      - research/n83_final_tournament_results_20261015/selection.json
      - research/n83_final_tournament_results_20261015/measurements.json.gz
      - research/n83_final_tournament_results_20261015/materialize.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: n83-final-tournament-results-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eight-arm-sealed-replay:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Read the sealed result index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path('research/n83_final_tournament_results_20261015')
          index = json.loads((root / 'records_index.json').read_text())
          selected = json.loads((root / 'selection.json').read_text())
          if (index['schema'] != 'n83.final-tournament-compressed-records/v1'
                  or index['artifact_run_id'] != 38793258972
                  or index['artifact_id'] <= 0
                  or selected['artifact_id'] != index['artifact_id']
                  or selected['artifact_sha256'] != index['artifact_sha256']
                  or selected['analysis_sha256'] != index['analysis_sha256']
                  or selected['source_commit'] !=
                     'd72ee1c00da72361c81060a15f1f25fc828a9d0f'):
              raise SystemExit('sealed result index or selection differs')
          values = {
              'N83_ARTIFACT_ID': str(index['artifact_id']),
              'N83_ARTIFACT_SHA': index['artifact_sha256'],
              'N83_ANALYSIS_SHA': index['analysis_sha256'],
          }
          for key, value in values.items():
              if key.endswith('SHA') and (len(value) != 64 or
                  any(ch not in '0123456789abcdef' for ch in value)):
                  raise SystemExit(f'invalid {key}')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in values.items():
                  output.write(f'{key}={value}\n')
          PY

      - name: Restore the exact executed source
        shell: bash
        run: |
          set -euo pipefail
          frozen=d72ee1c00da72361c81060a15f1f25fc828a9d0f
          git fetch --no-tags --depth=1 origin "$frozen"
          test "$(git rev-parse FETCH_HEAD)" = "$frozen"
          git worktree add --detach "$RUNNER_TEMP/n83-tournament-frozen-source" "$frozen"
          cd "$RUNNER_TEMP/n83-tournament-frozen-source"
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k_abba_20261015/generate.py > /dev/null
          python3 research/n83_root4_highk_20261015/generate.py > /dev/null
          python3 research/n83_best_e2e_20261015/generate.py > /dev/null
          python3 research/n83_legacy_challenger_20261015/generate.py > /dev/null
          python3 research/n83_root4_bloom_20261015/generate.py > /dev/null
          python3 research/n83_root11_highk_20261015/generate.py > /dev/null
          python3 research/n83_final_tournament_20261015/generate.py > \
            "$RUNNER_TEMP/n83-tournament-fixture.json"
          test "$(sha256sum research/n83_final_tournament_20261015/targets.jsonl | cut -d' ' -f1)" = \
            cfa943ae538fcc41d2af8bb8fd1c8fc0f29adc340b55644e90382da25b213424
          test "$(sha256sum research/n83_final_tournament_20261015/answers.jsonl | cut -d' ' -f1)" = \
            1dbd4250796de4434badc2458089d7ad9fe63cc59d7b9d3f6825ad431476a13b

      - name: Download and hash the exact raw artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-tournament-sealed"
          gh api "repos/aburan28/crypto/actions/artifacts/$N83_ARTIFACT_ID/zip" > \
            "$RUNNER_TEMP/n83-tournament-sealed/raw.zip"
          test "$(sha256sum "$RUNNER_TEMP/n83-tournament-sealed/raw.zip" | cut -d' ' -f1)" = \
            "$N83_ARTIFACT_SHA"
          unzip -q "$RUNNER_TEMP/n83-tournament-sealed/raw.zip" -d \
            "$RUNNER_TEMP/n83-tournament-sealed/raw"
          test "$(sha256sum "$RUNNER_TEMP/n83-tournament-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            "$N83_ANALYSIS_SHA"

      - name: Independently replay all bases and 32000 target records
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          set +e
          python3 "$RUNNER_TEMP/n83-tournament-frozen-source/research/n83_final_tournament_20261015/verify.py" \
            "$RUNNER_TEMP/n83-tournament-sealed/raw/results" > \
            "$RUNNER_TEMP/n83-tournament-sealed/local-replay.json"
          replay_status=$?
          set -e
          test "$(sha256sum "$RUNNER_TEMP/n83-tournament-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            "$N83_ANALYSIS_SHA"
          python3 - "$RUNNER_TEMP/n83-tournament-sealed/raw/results/analysis.json" "$replay_status" <<'PY'
          import json
          import sys
          status = json.load(open(sys.argv[1]))['status']
          code = int(sys.argv[2])
          if (status, code) not in {('COMPLETE', 0), ('INCOMPLETE', 1)}:
              raise SystemExit(f'unexpected replay status: {status}, exit {code}')
          PY

      - name: Reproduce current-head result records
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k_abba_20261015/generate.py > /dev/null
          python3 research/n83_root4_highk_20261015/generate.py > /dev/null
          python3 research/n83_best_e2e_20261015/generate.py > /dev/null
          python3 research/n83_legacy_challenger_20261015/generate.py > /dev/null
          python3 research/n83_root4_bloom_20261015/generate.py > /dev/null
          python3 research/n83_root11_highk_20261015/generate.py > /dev/null
          python3 research/n83_final_tournament_20261015/generate.py > /dev/null
          python3 research/n83_final_tournament_results_20261015/materialize.py \
            --artifact-zip "$RUNNER_TEMP/n83-tournament-sealed/raw.zip" \
            --artifact-sha256 "$N83_ARTIFACT_SHA" \
            --analysis-sha256 "$N83_ANALYSIS_SHA" \
            --artifact-id "$N83_ARTIFACT_ID" \
            "$RUNNER_TEMP/n83-tournament-sealed/raw/results"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Preserve replay output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-final-tournament-sealed-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-tournament-sealed/local-replay.json
          if-no-files-found: ignore
          retention-days: 14
