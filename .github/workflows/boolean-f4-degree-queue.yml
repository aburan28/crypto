name: Boolean F4 degree-bucket pair queue experiment

on:
  pull_request:
    paths:
      - 'src/cryptanalysis/pq_f4_f2.rs'
      - 'research/boolean_f4_degree_queue_20260927/PROTOCOL.md'
      - 'research/boolean_f4_degree_queue_20260927/paired_boolean_f4.py'
      - '.github/workflows/boolean-f4-degree-queue.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-output-and-paired-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RAYON_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98'
      - uses: Swatinem/rust-cache@v2
      - name: Boolean F4 queue and solver tests
        run: cargo test --release --lib cryptanalysis::pq_f4_f2::tests -- --test-threads=1
      - name: Build Boolean F4 stage benchmark
        run: cargo build --release --example f4_f2_bench
      - name: Five A/A and five paired A/B samples per workload
        run: |
          python3 research/boolean_f4_degree_queue_20260927/paired_boolean_f4.py \
            target/release/examples/f4_f2_bench \
            research/boolean_f4_degree_queue_20260927/ci-result.json \
            --pairs 5 --threads 1
      - name: Preserve all raw runs and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boolean-f4-degree-queue-${{ github.sha }}
          path: research/boolean_f4_degree_queue_20260927/ci-result.json
          if-no-files-found: warn
