name: ECC2K-130 leaf degree-7 bridge freeze
on:
  pull_request:
    paths:
      - 'research/ecc2k130_leaf7_bridge_20260925/**'
      - 'research/notes/ecc2k130/LEAF_HORIZONTAL_SEVEN_BRIDGE_20260925.md'
      - 'research/ecc2k130_direction_review_20260924/twist_torsion_results.json'
      - 'research/ecc2k130_endo_ring_263_20260925/receipt.json'
      - 'research/ecc2k130_dual_transport_20260925/**'
      - 'research/ecc2k130_factor_base_replication_20260925/exact_replay.json'
      - 'research/ecc2k130_relations/**'
      - 'research/ecc2k130_oriented_transport_20260924/oriented_velu.py'
      - '.github/workflows/ecc2k130-leaf7-bridge-freeze.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin exact freeze file
        run: |
          echo '4d8be7c3077fc1b40b08611d43063e24b4b189ac76d6f97e58c63de57d36e125  research/ecc2k130_leaf7_bridge_20260925/FROZEN.json' | sha256sum -c -
      - name: Check source and implementation hashes only
        run: python3 research/ecc2k130_leaf7_bridge_20260925/ci_replay.py
      - name: Replay first hosted preflight artifact without bridge work
        run: python3 research/ecc2k130_leaf7_bridge_20260925/verify_hosted_preflight.py
      - name: Check Python syntax only
        run: |
          python3 -m py_compile \
            research/ecc2k130_leaf7_bridge_20260925/cubic_velu.py \
            research/ecc2k130_leaf7_bridge_20260925/run.py \
            research/ecc2k130_leaf7_bridge_20260925/verify.py \
            research/ecc2k130_leaf7_bridge_20260925/verify_extension.py \
            research/ecc2k130_leaf7_bridge_20260925/ci_replay.py \
            research/ecc2k130_leaf7_bridge_20260925/host_preflight.py \
            research/ecc2k130_leaf7_bridge_20260925/verify_hosted_preflight.py

  host-preflight:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check Sage 10.9 and hard cap without constructing a bridge
        run: |
          docker run --rm \
            -e DOT_SAGE=/tmp/leaf7-sage-home \
            -v "$PWD:/work:ro" -w /work \
            --entrypoint /usr/bin/sage \
            sagemath/sagemath@sha256:2401ffa8e9fc85c7ea17d3649bde5958b4dbf0858b3e504098c4102720151711 \
            -python research/ecc2k130_leaf7_bridge_20260925/host_preflight.py \
            > "$RUNNER_TEMP/leaf7-host-preflight.json" \
            2> "$RUNNER_TEMP/leaf7-host-preflight.stderr"
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"leaf7-host-preflight.json"; assert json.loads(p.read_text().splitlines()[-1])["decision"] == "HOST_PREFLIGHT_PASS"'
          cat "$RUNNER_TEMP/leaf7-host-preflight.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaf7-host-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/leaf7-host-preflight.json
            ${{ runner.temp }}/leaf7-host-preflight.stderr
          if-no-files-found: warn
          retention-days: 30
