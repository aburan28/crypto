name: Koblitz Stage 115 n53 packed dense support

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage115_packed_dense.py"
      - ".github/workflows/koblitz-stage115-packed-dense.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate packed-dense controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage115_packed_dense.py
          python3 scripts/run_koblitz_stage115_packed_dense.py self-test
          cargo test --release --example koblitz_rank_fixture
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-packed-dense:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage115_packed_dense.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage115-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare streamed dense and packed dense support
        run: |
          python3 scripts/run_koblitz_stage115_packed_dense.py run \
            --build "$RUNNER_TEMP/stage115-build" \
            --output "$RUNNER_TEMP/stage115-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage115_packed_dense.py verify \
            --build "$RUNNER_TEMP/stage115-build" \
            --output "$RUNNER_TEMP/stage115-run" \
            > "$RUNNER_TEMP/stage115-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage115-packed-dense-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage115-build
            ${{ runner.temp }}/stage115-run
            ${{ runner.temp }}/stage115-verification.json
