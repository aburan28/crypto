name: Koblitz Stage 109 current gate audit

on:
  pull_request:
    paths:
      - "docs/ic/boundary_targets.json"
      - "docs/ic/BOUNDARY_TARGETS.md"
      - "research/sat_factor_base_review_20260908/autolab/protocol.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-109-current-gate-audit-20260913/**"
      - "scripts/compose_koblitz_stage109_gate_audit.py"

permissions:
  contents: read

# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Replay the Stage 109 historical audit (superseded by Stage 124)
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage109_gate_audit.py
          python3 -m json.tool docs/ic/boundary_targets.json >/dev/null
          python3 -m json.tool research/sat_factor_base_review_20260908/autolab/protocol.json >/dev/null
          python3 scripts/compose_koblitz_stage109_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-109-current-gate-audit-20260913
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
