name: N83 four-byte fixed30 index with eleven-byte states

on:
  push:
    branches: [codex/n83-root4-fixed30-root11-20261014]
    paths:
      - .github/workflows/n83-root4-fixed30-root11.yml
      - research/n83_root4_fixed30_root11_20261014/**
      - examples/koblitz_orbit_dlp_fast.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-root4-fixed30-root11-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seven-arm-comparison:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Freeze common and reserve public points
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-root4-fixed30-root11"
          python3 research/n83_root4_fixed30_20261014/generate.py \
            > "$RUNNER_TEMP/n83-root4-fixed30-root11/generate.log"
          python3 research/n83_root4_fixed30_20261014/generate_reserve.py \
            > "$RUNNER_TEMP/n83-root4-fixed30-root11/generate-reserve.log"
          python3 research/n83_root4_fixed30_root11_20261014/run.py --preflight \
            > "$RUNNER_TEMP/n83-root4-fixed30-root11/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-root4-fixed30-root11/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-root4-fixed30-root11/cargo-version.txt"

      - name: Build exact producer and run example tests
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-root4-fixed30-root11-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-root4-fixed30-root11/example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-root4-fixed30-root11/build.log" 2>&1

      - name: Run seven bounded layout arms
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-root4-fixed30-root11-target"
          python3 research/n83_root4_fixed30_root11_20261014/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --output "$RUNNER_TEMP/n83-root4-fixed30-root11/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-root4-fixed30-root11/run.log"

      - name: Independently replay every base and target
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-root4-fixed30-root11/results" ]; then
            python3 research/n83_root4_fixed30_root11_20261014/verify.py \
              "$RUNNER_TEMP/n83-root4-fixed30-root11/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-root4-fixed30-root11/verify.log"
          fi

      - name: Preserve every raw arm and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-root4-fixed30-root11-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-root4-fixed30-root11/
          if-no-files-found: error
          retention-days: 14
