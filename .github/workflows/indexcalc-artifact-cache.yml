name: Index-calculus artifact cache

on:
  pull_request:
    paths:
      - "cache/**"
      - "docs/ic/binary-example.json"
      - "docs/ic/prime-example.json"
      - ".github/workflows/indexcalc-artifact-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # No dependency install step on purpose: `redis` and `boto3` are
      # imported lazily inside the tier that needs them, so the package and
      # its tests must run on a machine that has neither.  If this job ever
      # needs a pip install, a lazy import has become an eager one.
      - name: Confirm the optional dependencies really are absent
        run: |
          python3 - <<'PY'
          import importlib.util
          for name in ("redis", "boto3"):
              assert importlib.util.find_spec(name) is None, f"{name} is installed; this job no longer tests the lazy-import path"
          PY
      - name: Run the cache tests
        run: python3 cache/test_cache.py
