name: Index-calculus artifact cache

on:
  pull_request:
    paths:
      - "cache/**"
      - "docs/ic/binary-example.json"
      - "docs/ic/prime-example.json"
      - ".github/workflows/indexcalc-artifact-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # No dependency install step on purpose: `redis` and `boto3` are
      # imported lazily inside the tier that needs them, so the package and
      # its tests must run on a machine that has neither.  The runner image
      # happens to ship boto3, so that property is asserted where it can be
      # asserted honestly -- in the suite, which checks in a clean subprocess
      # that importing `cache` pulls in neither module.  If this job ever
      # needs a pip install, a lazy import has become an eager one.
      - name: Run the cache tests
        run: python3 cache/test_cache.py
