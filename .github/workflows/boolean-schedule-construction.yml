name: Standalone Boolean construction cost bound
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness-and-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Shared scan and retained algebra checks
        run: |
          rustc --edition 2021 -O --test research/boolean_schedule_construction_20260923/measure.rs -o /tmp/boolean-construction-tests
          /tmp/boolean-construction-tests
      - name: Frozen cost partition and corruption checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s research/boolean_schedule_construction_20260923 -p 'test_*.py' -v
