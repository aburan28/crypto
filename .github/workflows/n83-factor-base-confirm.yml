name: N83 fresh 4000-point K3300 versus K3100 factor-base confirmation

on:
  push:
    branches: [codex/n83-factor-base-confirm-20261015]
    paths:
      - .github/workflows/n83-factor-base-confirm.yml
      - research/n83_factor_base_confirm_20261015/**
      - examples/koblitz_orbit_dlp_fast.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-factor-base-confirm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  four-thousand-point-confirmation:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Freeze archived selection and reserve points
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-factor-base-confirm"
          python3 research/n83_factor_base_confirm_20261015/generate.py \
            > "$RUNNER_TEMP/n83-factor-base-confirm/generate.log"
          python3 research/n83_factor_base_confirm_20261015/run.py --preflight \
            > "$RUNNER_TEMP/n83-factor-base-confirm/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-factor-base-confirm/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-factor-base-confirm/cargo-version.txt"

      - name: Build exact producer and run example tests
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-factor-base-confirm-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-factor-base-confirm/example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-factor-base-confirm/build.log" 2>&1

      - name: Run bounded 4000-point confirmation arms
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-factor-base-confirm-target"
          python3 research/n83_factor_base_confirm_20261015/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --output "$RUNNER_TEMP/n83-factor-base-confirm/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-factor-base-confirm/run.log"

      - name: Independently replay complete bases and all targets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-factor-base-confirm/results" ]; then
            python3 research/n83_factor_base_confirm_20261015/verify.py \
              "$RUNNER_TEMP/n83-factor-base-confirm/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-factor-base-confirm/verify.log"
          fi

      - name: Preserve raw receipts and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-factor-base-confirm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-factor-base-confirm/
          if-no-files-found: error
          retention-days: 14
