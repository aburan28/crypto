name: isogeny-invariant-baseline

on:
  pull_request:
    paths:
      - 'research/isogeny_invariant_baseline_20260926/**'
      - '.github/workflows/isogeny-invariant-baseline.yml'
  push:
    branches: [main]
    paths:
      - 'research/isogeny_invariant_baseline_20260926/**'
      - '.github/workflows/isogeny-invariant-baseline.yml'

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay and audit all eligible tiny constructions
        run: |
          set -euo pipefail
          python3 research/isogeny_invariant_baseline_20260926/benchmark.py --output /tmp/isogeny-run.json
          python3 research/isogeny_invariant_baseline_20260926/summarize.py \
            /tmp/isogeny-run.json --output /tmp/isogeny-summary.json
          python3 research/isogeny_invariant_baseline_20260926/summarize.py \
            research/isogeny_invariant_baseline_20260926/results/run-001.json.gz \
            --output /tmp/isogeny-archive-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          frozen=json.loads(Path('research/isogeny_invariant_baseline_20260926/results/summary-001.json').read_text())
          fresh=json.loads(Path('/tmp/isogeny-summary.json').read_text())
          archive=json.loads(Path('/tmp/isogeny-archive-summary.json').read_text())
          assert fresh==frozen==archive, 'Exact audited incidence or construction changed'
          print('Frozen, archived and freshly replayed 18-row summaries agree')
          PY
