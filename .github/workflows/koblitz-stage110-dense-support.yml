name: Koblitz Stage 110 n53 dense support

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage110_dense_support.py"
      - ".github/workflows/koblitz-stage110-dense-support.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate dense-support controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage110_dense_support.py
          python3 scripts/run_koblitz_stage110_dense_support.py self-test
          cargo test --release --example koblitz_rank_fixture
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-dense-support:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage110_dense_support.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage110-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare selected and dense support layouts
        run: |
          python3 scripts/run_koblitz_stage110_dense_support.py run \
            --build "$RUNNER_TEMP/stage110-build" \
            --output "$RUNNER_TEMP/stage110-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage110_dense_support.py verify \
            --build "$RUNNER_TEMP/stage110-build" \
            --output "$RUNNER_TEMP/stage110-run" \
            > "$RUNNER_TEMP/stage110-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage110-dense-support-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage110-build
            ${{ runner.temp }}/stage110-run
            ${{ runner.temp }}/stage110-verification.json
