name: ECC2K130 rotated arity screen

on:
  pull_request:
    paths:
      - 'research/notes/ecc2k130/rotated_arity_screen_20260925/**'
      - '.github/workflows/ecc2k130-rotated-arity-screen.yml'
  push:
    branches: [main]
    paths:
      - 'research/notes/ecc2k130/rotated_arity_screen_20260925/**'
      - '.github/workflows/ecc2k130-rotated-arity-screen.yml'

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen hash and source preflight
        run: python3 research/notes/ecc2k130/rotated_arity_screen_20260925/ci_replay.py
      - name: Independent exact evidence replay when committed
        shell: bash
        run: |
          if test -f research/notes/ecc2k130/rotated_arity_screen_20260925/evidence/receipt.json; then
            python3 research/notes/ecc2k130/rotated_arity_screen_20260925/ci_replay.py --evidence research/notes/ecc2k130/rotated_arity_screen_20260925/evidence
          fi
