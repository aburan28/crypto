name: N83 indexed five-byte load75 Tier 1 capacity gate

on:
  push:
    branches: [codex/n83-indexed5-load75-20261013]
    paths:
      - .github/workflows/n83-indexed5-load75-tier1.yml
      - examples/koblitz_orbit_dlp_fast.rs
      - research/n83_indexed5_load75_20261013/DenseCapacity.lean
      - research/n83_indexed5_load75_20261013/PROTOCOL.md
      - research/n83_indexed5_load75_20261013/AMENDMENT.md
      - research/n83_indexed5_load75_20261013/run.py
      - research/n83_indexed5_load75_20261013/verify.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-indexed5-load75-tier1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-lib:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Run complete release library gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-indexed5-load75-lib"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-indexed5-load75-lib-target"
          export CARGO_BUILD_JOBS=2
          export RUST_TEST_THREADS=2
          cargo test --release --locked --lib \
            > "$RUNNER_TEMP/n83-indexed5-load75-lib/lib-tests.log" 2>&1
      - name: Preserve release library receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-indexed5-load75-lib-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-indexed5-load75-lib/
          if-no-files-found: error
          retention-days: 14
  primary-point:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4

      - name: Freeze public input and observe runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-indexed5-load75-tier1"
          python3 research/n83_indexed5_load75_20261013/run.py --preflight \
            > "$RUNNER_TEMP/n83-indexed5-load75-tier1/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-indexed5-load75-tier1/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-indexed5-load75-tier1/cargo-version.txt"

      - name: Build and test exact producer and rho worker
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-indexed5-load75-cargo-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-indexed5-load75-tier1/example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast \
            --example n83_rho_optimization_eval \
            > "$RUNNER_TEMP/n83-indexed5-load75-tier1/build.log" 2>&1

      - name: Run bounded same-point arms and strong rho
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-indexed5-load75-cargo-target"
          python3 research/n83_indexed5_load75_20261013/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --rho-binary "$CARGO_TARGET_DIR/release/examples/n83_rho_optimization_eval" \
            --output "$RUNNER_TEMP/n83-indexed5-load75-tier1/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-indexed5-load75-tier1/run.log"

      - name: Independently replay complete base, relation and scalar
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-indexed5-load75-tier1/results" ]; then
            python3 research/n83_indexed5_load75_20261013/verify.py \
              "$RUNNER_TEMP/n83-indexed5-load75-tier1/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-indexed5-load75-tier1/verify.log"
          fi

      - name: Preserve all raw receipts and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-indexed5-load75-tier1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-indexed5-load75-tier1/
          if-no-files-found: error
          retention-days: 14
