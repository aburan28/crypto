name: Koblitz Stage 149 current gate audit
on:
  pull_request:
    paths:
      - "src/cryptanalysis/koblitz_index_calculus.rs"
      - "docs/ic/params/k1n59-cofactor-projected-l15-rank-tail-public-59001.json"
      - "docs/ic/runs/koblitz-n59-bucket-prefetch-optimization-20260922.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-148-current-gate-audit-20260922/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-149-current-gate-audit-20260922/**"
      - "scripts/compose_koblitz_stage148_gate_audit.py"
      - "scripts/compose_koblitz_stage149_gate_audit.py"
      - ".github/workflows/koblitz-stage149-current-gate-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay Stage 148 historical audit and Stage 149 current audit
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage148_gate_audit.py scripts/compose_koblitz_stage149_gate_audit.py
          python3 -m json.tool docs/ic/params/k1n59-cofactor-projected-l15-rank-tail-public-59001.json >/dev/null
          python3 -m json.tool docs/ic/runs/koblitz-n59-bucket-prefetch-optimization-20260922.json >/dev/null
          python3 scripts/compose_koblitz_stage148_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-148-current-gate-audit-20260922 > "$RUNNER_TEMP/stage148-historical.json"
          python3 scripts/compose_koblitz_stage149_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-149-current-gate-audit-20260922 > "$RUNNER_TEMP/stage149-current.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
