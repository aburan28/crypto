name: ECC2K-130 pinned x-only witness regression

on:
  pull_request:
    paths:
      - .github/workflows/ecc2k130-pinned-x-witness.yml
      - research/notes/ecc2k130/pinned_x_witness_20260930/**
  push:
    branches: [main]
    paths:
      - .github/workflows/ecc2k130-pinned-x-witness.yml
      - research/notes/ecc2k130/pinned_x_witness_20260930/**

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/notes/ecc2k130/pinned_x_witness_20260930
            research/notes/ecc2k130/point_sum_cold_20260930/FROZEN.json
            research/notes/ecc2k130/point_sum_cold_20260930/fixtures/n37_L1024.fixture.jsonl
            research/notes/ecc2k130/point_sum_cold_outcome_20260930/evidence/run_36764654520/MANIFEST.json
            research/notes/ecc2k130/point_sum_cold_outcome_20260930/evidence/run_36764654520/artifacts/point-sum-cold-n37_L1024.tar.gz
            research/notes/ecc2k130/compact_orbit_rank_evidence_20260929/verify_rank.py
            research/notes/ecc2k130/compact_orbit_point_panel_20260929/verify_panel.py
            research/sat_factor_base_review_20260908/autolab_orbit_extract_20260924/independent_replay.py
      - name: Replay archived witness and tamper checks
        run: |
          python3 -m py_compile research/notes/ecc2k130/pinned_x_witness_20260930/*.py
          python3 research/notes/ecc2k130/pinned_x_witness_20260930/replay_archived_failure.py \
            --out "$RUNNER_TEMP/pinned-x-witness-replay.json"
          cmp "$RUNNER_TEMP/pinned-x-witness-replay.json" \
            research/notes/ecc2k130/pinned_x_witness_20260930/REPLAY.json
