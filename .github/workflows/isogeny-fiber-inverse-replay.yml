name: Isogeny inverse-Velu independent Linux replay

on:
  pull_request:
    paths:
      - '.github/workflows/isogeny-fiber-inverse-replay.yml'
      - 'research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/inverse_velu/run_panel_linux_v1.sh'
      - 'research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/inverse_velu/FOUR_GATE_PROTOCOL_V1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inverse-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/isogeny-fiber-inverse-replay.yml
            Cargo.toml
            Cargo.lock
            src
            docs/ic/calibration.json
            docs/ic/boundary_targets.json
            docs/ecbench/schema.sql
            docs/curves/registry.json
            docs/curves/traits.json
            examples/different_j_inverse_velu_oracle.rs
            examples/different_j_inverse_velu_check.rs
            examples/different_j_order_process_meter.rs
            research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/inverse_velu/RUN_SPEC_V2.json
            research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/inverse_velu/run_panel_linux_v1.sh
            research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/order1000/BATCH_1237_1201_V2.public.json
            research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/order1000/BATCH_1237_1201_V2.checker.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build native solver, independent checker, and process meter
        run: cargo build --release --locked --example different_j_inverse_velu_oracle --example different_j_inverse_velu_check --example different_j_order_process_meter
      - name: Execute all 60 cold children and replay every result
        run: bash research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/inverse_velu/run_panel_linux_v1.sh "${RUNNER_TEMP}/isogeny-inverse-linux-v1"
      - name: Retain host, every child, failures, and exact checker output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isogeny-inverse-linux-v1
          path: ${{ runner.temp }}/isogeny-inverse-linux-v1
          if-no-files-found: warn
          retention-days: 90
