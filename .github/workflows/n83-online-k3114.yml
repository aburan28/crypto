name: N83 K3114 online capacity-frontier screen

on:
  push:
    branches: [codex/n83-k3114-online-20261016]
    paths:
      - .github/workflows/n83-online-k3114.yml
      - research/n83_online_k3114_20261016/PROTOCOL.md
      - research/n83_online_k3114_20261016/run.py
      - research/n83_online_k3114_20261016/verify.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-online-k3114-${{ github.ref }}
  cancel-in-progress: false

jobs:
  one-point-online-screen:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen source, point and arm order
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          mkdir -p "$RUNNER_TEMP/n83-online-k3114/bin"
          python3 research/n83_online_k3114_20261016/run.py --preflight > \
            "$RUNNER_TEMP/n83-online-k3114/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-online-k3114/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-online-k3114/cargo-version.txt"

      - name: Build and test exact IC and same-point rho producers
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-online-k3114-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-online-k3114/ic-example-tests.log" 2>&1
          cargo test --release --locked --example n83_rho_optimization_eval > \
            "$RUNNER_TEMP/n83-online-k3114/rho-example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-online-k3114/ic-build.log" 2>&1
          cargo build --release --locked --example n83_rho_optimization_eval > \
            "$RUNNER_TEMP/n83-online-k3114/rho-build.log" 2>&1
          cp "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            "$RUNNER_TEMP/n83-online-k3114/bin/koblitz_orbit_dlp_fast"
          cp "$CARGO_TARGET_DIR/release/examples/n83_rho_optimization_eval" \
            "$RUNNER_TEMP/n83-online-k3114/bin/n83_rho_optimization_eval"

      - name: Run K3114 and K3072 online A/A pairs and same-point rho
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_online_k3114_20261016/run.py \
            --binary "$RUNNER_TEMP/n83-online-k3114/bin/koblitz_orbit_dlp_fast" \
            --rho-binary "$RUNNER_TEMP/n83-online-k3114/bin/n83_rho_optimization_eval" \
            --output "$RUNNER_TEMP/n83-online-k3114/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-online-k3114/run.log"

      - name: Independently replay bases, target relations and rho scalar
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          if [ -d "$RUNNER_TEMP/n83-online-k3114/results" ]; then
            python3 research/n83_online_k3114_20261016/verify.py \
              "$RUNNER_TEMP/n83-online-k3114/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-online-k3114/verify.log"
          fi

      - name: Preserve every raw row and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-online-k3114-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-online-k3114/
          if-no-files-found: error
          retention-days: 14
