name: N83 frozen fresh-point edge confirmation

on:
  push:
    branches: [codex/n83-final-tournament-20261015]
    paths:
      - .github/workflows/n83-edge-confirmation.yml
      - research/n83_edge_confirmation_20261015/admission.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-edge-confirmation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirrored-confirmation:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Restore excluded public panels and freeze confirmation inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-edge-confirmation"
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k_abba_20261015/generate.py > /dev/null
          python3 research/n83_root4_highk_20261015/generate.py > /dev/null
          python3 research/n83_best_e2e_20261015/generate.py > /dev/null
          python3 research/n83_legacy_challenger_20261015/generate.py > /dev/null
          python3 research/n83_root4_bloom_20261015/generate.py > /dev/null
          python3 research/n83_root11_highk_20261015/generate.py > /dev/null
          python3 research/n83_final_tournament_20261015/generate.py > /dev/null
          python3 research/n83_edge_confirmation_20261015/generate.py > \
            "$RUNNER_TEMP/n83-edge-confirmation/fixture-check.json"
          python3 research/n83_edge_confirmation_20261015/admit.py > \
            "$RUNNER_TEMP/n83-edge-confirmation/admission-check.json"
          test "$(sha256sum research/n83_edge_confirmation_20261015/targets.jsonl | cut -d' ' -f1)" = \
            66c4683e252f1cd321b4b6c7c9d06744c82140222ddce160faa4e7a0e0984b7e
          test "$(sha256sum research/n83_edge_confirmation_20261015/answers.jsonl | cut -d' ' -f1)" = \
            e1207d1be9a7689c42209ed50f048325812436d5f7e6f313b5e5e8a04a5730b1
          test "$(sha256sum examples/koblitz_orbit_dlp_fast.rs | cut -d' ' -f1)" = \
            f2745227d95e36ef45c73c5104a23ada6cebb0794405368581d2be17044845dc
          python3 research/n83_edge_confirmation_20261015/run.py --preflight > \
            "$RUNNER_TEMP/n83-edge-confirmation/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-edge-confirmation/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-edge-confirmation/cargo-version.txt"

      - name: Build and test exact N83 producer
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-edge-confirmation-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-edge-confirmation/example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-edge-confirmation/build.log" 2>&1
          sha256sum "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" > \
            "$RUNNER_TEMP/n83-edge-confirmation/binary.sha256"

      - name: Run fresh mirrored complete-pipeline confirmation arms
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-edge-confirmation-target"
          python3 research/n83_edge_confirmation_20261015/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --output "$RUNNER_TEMP/n83-edge-confirmation/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-edge-confirmation/run.log"

      - name: Independently replay every base and target
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-edge-confirmation/results" ]; then
            python3 research/n83_edge_confirmation_20261015/verify.py \
              "$RUNNER_TEMP/n83-edge-confirmation/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-edge-confirmation/verify.log"
          fi

      - name: Preserve raw rows, source receipts and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-edge-confirmation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-edge-confirmation/
          if-no-files-found: error
          retention-days: 14
