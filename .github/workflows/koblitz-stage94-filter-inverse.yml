name: Koblitz Stage 94 n53 filter and inverse

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage94_filter_inverse.py"
      - ".github/workflows/koblitz-stage94-filter-inverse.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate direct-bit filter and Itoh-Tsujii controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage94_filter_inverse.py
          python3 scripts/run_koblitz_stage94_filter_inverse.py self-test
          cargo test --release --example koblitz_rank_fixture
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-filter-inverse:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage94_filter_inverse.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage94-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare filters, inverses, and rho
        run: |
          python3 scripts/run_koblitz_stage94_filter_inverse.py run \
            --build "$RUNNER_TEMP/stage94-build" \
            --output "$RUNNER_TEMP/stage94-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage94_filter_inverse.py verify \
            --build "$RUNNER_TEMP/stage94-build" \
            --output "$RUNNER_TEMP/stage94-run" \
            > "$RUNNER_TEMP/stage94-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage94-filter-inverse-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage94-build
            ${{ runner.temp }}/stage94-run
            ${{ runner.temp }}/stage94-verification.json
