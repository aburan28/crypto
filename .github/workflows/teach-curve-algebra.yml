name: Teach curve algebra fixtures
on:
  pull_request:
    paths:
      - '.agents/skills/teach-curve-algebra/**'
      - '.github/workflows/teach-curve-algebra.yml'
  push:
    branches: [main]
    paths:
      - '.agents/skills/teach-curve-algebra/**'
      - '.github/workflows/teach-curve-algebra.yml'
permissions:
  contents: read
jobs:
  verify-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile native educational verifier
        run: c++ -std=c++17 -O2 -Wall -Wextra -Werror .agents/skills/teach-curve-algebra/scripts/verify_examples.cpp -o /tmp/teach-curve-algebra-check
      - name: Verify both exact examples
        run: /tmp/teach-curve-algebra-check
