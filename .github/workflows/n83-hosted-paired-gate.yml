name: N83 hosted K600 Gray/hash paired first trial

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-hosted-pair-first-trial
  cancel-in-progress: false

jobs:
  paired-first-trial:
    if: github.repository == 'aburan28/crypto' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/n83-hosted-regenerate-20261016')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 125
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RAYON_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      IMAGE_REF: rust:1.98.1-bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cb98e85d1c1c1afdd5000bc70eea00969ee86c6c
          fetch-depth: 1
      - name: Set task-owned runner paths
        run: |
          printf 'CARGO_HOME=%s/n83-cargo\nARCHIVE_DIR=%s/n83-archives\nOUT_DIR=%s/n83-hosted-pair\nSCRATCH_DIR=%s/n83-hosted-scratch\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Record runner and immutable image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-setup"
          {
            uname -a
            docker version
            docker pull --platform linux/arm64 "$IMAGE_REF"
            docker image inspect "$IMAGE_REF" --format '{{.Id}} {{.Architecture}} {{.Os}} {{json .RepoDigests}}'
          } > "$RUNNER_TEMP/n83-setup/image.stdout" 2> "$RUNNER_TEMP/n83-setup/image.stderr"
      - name: Prepare pinned Python audit dependency and offline Cargo registry
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --only-binary=:all: \
            --target "$RUNNER_TEMP/n83-pydeps" 'blake3==1.0.8' \
            > "$RUNNER_TEMP/n83-setup/python.stdout" 2> "$RUNNER_TEMP/n83-setup/python.stderr"
          mkdir -p "$CARGO_HOME"
          docker run --rm --pull never --platform linux/arm64 \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            --mount "type=bind,src=$CARGO_HOME,dst=/cargo" \
            --env CARGO_HOME=/cargo --workdir /src "$IMAGE_REF" \
            cargo fetch --locked --target aarch64-unknown-linux-gnu \
            > "$RUNNER_TEMP/n83-setup/cargo-fetch.stdout" 2> "$RUNNER_TEMP/n83-setup/cargo-fetch.stderr"
      - name: Regenerate and hash the three frozen public factor bases
        env:
          PYTHONPATH: ${{ runner.temp }}/n83-pydeps
        run: |
          set -euo pipefail
          started=$(date +%s)
          mkdir -p "$RUNNER_TEMP/n83-exporter-target" "$RUNNER_TEMP/n83-pilot-parent"
          docker run --rm --pull never --platform linux/arm64 \
            --network none --cpus 4 --memory 8192m --memory-swap 8192m \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            --mount "type=bind,src=$CARGO_HOME,dst=/cargo" \
            --mount "type=bind,src=$RUNNER_TEMP/n83-exporter-target,dst=/target" \
            --env CARGO_HOME=/cargo --env CARGO_TARGET_DIR=/target \
            --workdir /src "$IMAGE_REF" \
            cargo build --release --locked --offline --example koblitz_n83_factor_base_export \
            > "$RUNNER_TEMP/n83-setup/exporter-build.stdout" \
            2> "$RUNNER_TEMP/n83-setup/exporter-build.stderr"
          docker run --rm --pull never --platform linux/arm64 \
            --network none --cpus 1 --memory 4096m --memory-swap 4096m \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/n83-exporter-target,dst=/target,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/n83-pilot-parent,dst=/pilot" \
            --workdir /src "$IMAGE_REF" \
            /target/release/examples/koblitz_n83_factor_base_export \
            pilot /pilot/panel 1800 \
            > "$RUNNER_TEMP/n83-setup/pilot.stdout" \
            2> "$RUNNER_TEMP/n83-setup/pilot.stderr"
          python3 research/koblitz_n83_factor_base_sweep_20261008/verification/hosted-paired-gate-20261015/prepare_archives.py \
            --panel "$RUNNER_TEMP/n83-pilot-parent/panel" \
            --archives "$ARCHIVE_DIR" \
            --receipt "$RUNNER_TEMP/n83-setup/regeneration.json" \
            --source-commit "$(git rev-parse HEAD)" \
            --workflow-commit "$GITHUB_SHA" \
            --started-unix-seconds "$started" \
            > "$RUNNER_TEMP/n83-setup/regeneration.stdout" \
            2> "$RUNNER_TEMP/n83-setup/regeneration.stderr"
      - name: Run separately cold bounded Gray and hash arms
        env:
          PYTHONPATH: ${{ runner.temp }}/n83-pydeps
        run: |
          set -euo pipefail
          python3 research/koblitz_n83_factor_base_sweep_20261008/verification/hosted-paired-gate-20261015/run.py \
            --archives "$ARCHIVE_DIR" --output "$OUT_DIR" --scratch "$SCRATCH_DIR" \
            --preparation-receipt "$RUNNER_TEMP/n83-setup/regeneration.json" \
            > "$RUNNER_TEMP/n83-setup/run.stdout" 2> "$RUNNER_TEMP/n83-setup/run.stderr"
      - name: Preserve setup, raw stages and audited outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-hosted-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/n83-setup/
            ${{ runner.temp }}/n83-archives/*.jsonl.gz
            ${{ runner.temp }}/n83-pilot-parent/panel/manifest.json
            ${{ runner.temp }}/n83-hosted-pair/
            ${{ runner.temp }}/n83-hosted-scratch/*/build/build.stdout
            ${{ runner.temp }}/n83-hosted-scratch/*/build/build.stderr
          if-no-files-found: warn
          retention-days: 90
