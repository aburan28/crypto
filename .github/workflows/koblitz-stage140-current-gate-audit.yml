name: Koblitz Stage 140 current gate audit
on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay Stage 139 historical audit and Stage 140 current audit
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage139_gate_audit.py scripts/compose_koblitz_stage140_gate_audit.py
          python3 -m json.tool docs/ic/params/k1n59-cofactor-projected-l15-targeted-tail-public-59001.json >/dev/null
          python3 -m json.tool docs/ic/runs/koblitz-n59-targeted-tail-20260922.json >/dev/null
          python3 scripts/compose_koblitz_stage139_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-139-current-gate-audit-20260921 > "$RUNNER_TEMP/stage139-historical.json"
          python3 scripts/compose_koblitz_stage140_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-140-current-gate-audit-20260922 > "$RUNNER_TEMP/stage140-current.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
