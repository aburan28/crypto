name: Koblitz Stage 140 current gate audit
on:
  pull_request:
    paths:
      - "docs/ic/params/k1n59-cofactor-projected-l15-first-hit-control-public-59001.json"
      - "docs/ic/patches/koblitz-n59-first-hit-tail-rejected-20260922.patch"
      - "docs/ic/runs/koblitz-n59-first-hit-tail-rejection-20260922.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-139-current-gate-audit-20260922/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-140-current-gate-audit-20260922/**"
      - "scripts/compose_koblitz_stage139_gate_audit.py"
      - "scripts/compose_koblitz_stage140_gate_audit.py"
      - ".github/workflows/koblitz-stage140-current-gate-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay Stage 139 historical audit and Stage 140 current audit
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage139_gate_audit.py scripts/compose_koblitz_stage140_gate_audit.py
          python3 -m json.tool docs/ic/params/k1n59-cofactor-projected-l15-first-hit-control-public-59001.json >/dev/null
          python3 -m json.tool docs/ic/runs/koblitz-n59-first-hit-tail-rejection-20260922.json >/dev/null
          git apply --check docs/ic/patches/koblitz-n59-first-hit-tail-rejected-20260922.patch
          python3 scripts/compose_koblitz_stage139_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-139-current-gate-audit-20260922 > "$RUNNER_TEMP/stage139-historical.json"
          python3 scripts/compose_koblitz_stage140_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-140-current-gate-audit-20260922 > "$RUNNER_TEMP/stage140-current.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
