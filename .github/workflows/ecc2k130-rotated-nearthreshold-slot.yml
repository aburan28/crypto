name: ECC2K130 rotated near-threshold slot placement

on:
  pull_request:
    paths:
      - 'research/notes/ecc2k130/rotated_nearthreshold_slot_20260925/**'
      - 'research/notes/ecc2k130/rotated_slot_placement_20260925/**'
      - 'research/notes/ecc2k130/rotated_pdp_corpus_20260925/**'
      - 'research/notes/ecc2k130/rotated_subspace_support_20260925/**'
      - '.github/workflows/ecc2k130-rotated-nearthreshold-slot.yml'
  push:
    branches: [main]
    paths:
      - 'research/notes/ecc2k130/rotated_nearthreshold_slot_20260925/**'
      - '.github/workflows/ecc2k130-rotated-nearthreshold-slot.yml'

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen source and independent factor-only preflight
        run: python3 research/notes/ecc2k130/rotated_nearthreshold_slot_20260925/ci_replay.py
      - name: Replay complete evidence only when later committed
        shell: bash
        run: |
          if test -f research/notes/ecc2k130/rotated_nearthreshold_slot_20260925/evidence/receipt.json; then
            python3 research/notes/ecc2k130/rotated_nearthreshold_slot_20260925/ci_replay.py --evidence research/notes/ecc2k130/rotated_nearthreshold_slot_20260925/evidence
          fi
