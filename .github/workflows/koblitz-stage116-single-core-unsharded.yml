name: Koblitz Stage 116 n53 single-core unsharded support

on:
  pull_request:
    paths:
      - "scripts/run_koblitz_stage116_single_core_unsharded.py"
      - ".github/workflows/koblitz-stage116-single-core-unsharded.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate single-core unsharded controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage116_single_core_unsharded.py
          python3 scripts/run_koblitz_stage116_single_core_unsharded.py self-test
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-single-core-unsharded:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage116_single_core_unsharded.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage116-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare unsharded and four-shard layouts on one CPU
        run: |
          python3 scripts/run_koblitz_stage116_single_core_unsharded.py run \
            --build "$RUNNER_TEMP/stage116-build" \
            --output "$RUNNER_TEMP/stage116-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage116_single_core_unsharded.py verify \
            --build "$RUNNER_TEMP/stage116-build" \
            --output "$RUNNER_TEMP/stage116-run" \
            > "$RUNNER_TEMP/stage116-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage116-single-core-unsharded-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage116-build
            ${{ runner.temp }}/stage116-run
            ${{ runner.temp }}/stage116-verification.json
