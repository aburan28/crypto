name: Koblitz Stage 73 current gate audit

on:
  pull_request:
    paths:
      - "docs/ic/boundary_targets.json"
      - "docs/ic/BOUNDARY_TARGETS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/autolab/protocol.json"
      - "scripts/compose_koblitz_stage73_gate_audit.py"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-73-current-gate-audit-20260912/**"
      - ".github/workflows/koblitz-stage73-current-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify current audit and retained predecessors
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage73_gate_audit.py
          python3 scripts/compose_koblitz_stage73_gate_audit.py verify
          python3 research/sat_factor_base_review_20260908/autolab/boundary_autolab.py preflight
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
