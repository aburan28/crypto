name: PKM tower pilot
on:
  pull_request:
    paths:
      - 'research/pkm_tower_pilot_20260924/**'
      - 'research/pkm_tower_round2_20260925/**'
      - 'research/pkm_tower_round3_20260925/**'
      - 'research/pkm_tower_round4_20260926/**'
      - 'src/cryptanalysis/f4_fp_tower.rs'
      - 'src/cryptanalysis/sig_fp_tower.rs'
      - 'examples/pkm_tower_pilot.rs'
      - '.github/workflows/pkm-tower-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exhaustive counters against planted decompositions
        run: python3 -m unittest discover -s research/pkm_tower_pilot_20260924 -p 'test_*.py' -v
      - name: Every committed pilot tower row against exhaustive search
        run: python3 research/pkm_tower_pilot_20260924/verify.py research/pkm_tower_pilot_20260924/runs/*.jsonl
      - name: Every committed round-2 tower row against exhaustive search
        run: python3 research/pkm_tower_pilot_20260924/verify.py research/pkm_tower_round2_20260925/runs/*.jsonl
      - name: Every committed round-3 tower row against exhaustive search
        run: python3 research/pkm_tower_pilot_20260924/verify.py research/pkm_tower_round3_20260925/runs/*.jsonl
      - name: Every committed round-4 row, both engines, against exhaustive search
        run: |
          shopt -s nullglob
          rows=(research/pkm_tower_round4_20260926/runs/*.jsonl)
          if [ ${#rows[@]} -gt 0 ]; then
            python3 research/pkm_tower_pilot_20260924/verify.py "${rows[@]}"
          else
            echo "no round-4 rows committed yet"
          fi
      - name: Repeats agree, no planted solution is lost, and the engines' verdicts agree
        run: |
          shopt -s nullglob
          python3 research/pkm_tower_pilot_20260924/analyze.py \
            research/pkm_tower_pilot_20260924/runs/*.jsonl \
            research/pkm_tower_round2_20260925/runs/*.jsonl \
            research/pkm_tower_round3_20260925/runs/*.jsonl \
            research/pkm_tower_round4_20260926/runs/*.jsonl
      - name: The compact-basis build reproduces every round-2 row and trace (round 3, note section 12.2)
        run: python3 research/pkm_tower_round3_20260925/compare_builds.py
      - name: The signature engine beside F4, and this round's F4 rows against round 2's (round 4, note section 13.4)
        run: python3 research/pkm_tower_round4_20260926/compare_engines.py
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The tower engine's unit tests
        run: cargo test --release --lib f4_fp_tower
      - name: The signature engine's unit tests
        run: cargo test --release --lib sig_fp_tower
