name: GF(2) table reuse four-thread F5 control

on:
  pull_request:
    paths:
      - 'research/gf2_table_reuse_20260929/FOUR_THREAD_PROTOCOL.md'
      - '.github/workflows/gf2-table-reuse-four-thread.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-f5-four-thread:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RAYON_NUM_THREADS: '4'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98'
      - uses: Swatinem/rust-cache@v2
      - name: Build F5 stage benchmark
        run: cargo build --release --example f4_f2_bench
      - name: Frozen four-thread triads
        run: |
          python3 research/gf2_table_reuse_20260929/paired_f5.py \
            target/release/examples/f4_f2_bench \
            research/gf2_table_reuse_20260929/ci-result-threads4.json \
            --pairs 5 --threads 4
      - name: Preserve raw runs and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gf2-table-reuse-threads4-${{ github.sha }}
          path: research/gf2_table_reuse_20260929/ci-result-threads4.json
          if-no-files-found: warn
