name: spotlab
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'spotlab/**'
      - '.github/workflows/spotlab.yml'
  push:
    branches: [main]
    paths:
      - 'spotlab/**'
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: spotlab
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit and end-to-end tests (local provider)
        run: cargo test
      - name: Static agent build
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Bootstrap script syntax
        run: bash -n src/bootstrap.sh
