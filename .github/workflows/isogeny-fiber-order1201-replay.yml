name: Isogeny fiber order-1201 independent Linux replay

on:
  pull_request:
    paths:
      - '.github/workflows/isogeny-fiber-order1201-replay.yml'
      - 'examples/different_j_trend_batch.rs'
      - 'examples/different_j_trend_batch_check.rs'
      - 'examples/different_j_order_process_meter.rs'
      - 'research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/order1000/RUN_SPEC_V2.json'
      - 'research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/order1000/HOST_SPEC_V1.json'
      - 'research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/order1000/BATCH_1237_1201_V2.public.json'
      - 'research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/order1000/BATCH_1237_1201_V2.checker.json'
      - 'research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/order1000/FIBER_1237_1201_V1.json'
      - 'research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/order1000/run_batch_linux_v1.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/isogeny-fiber-order1201-replay.yml
            Cargo.toml
            Cargo.lock
            src
            docs/ic/calibration.json
            docs/ic/boundary_targets.json
            docs/ecbench/schema.sql
            docs/curves/registry.json
            docs/curves/traits.json
            examples/different_j_trend_batch.rs
            examples/different_j_trend_batch_check.rs
            examples/different_j_order_process_meter.rs
            research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/order1000/RUN_SPEC_V2.json
            research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/order1000/HOST_SPEC_V1.json
            research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/order1000/BATCH_1237_1201_V2.public.json
            research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/order1000/BATCH_1237_1201_V2.checker.json
            research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/order1000/FIBER_1237_1201_V1.json
            research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/order1000/run_batch_linux_v1.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the frozen native runner and independent checker
        run: cargo build --release --locked --example different_j_trend_batch --example different_j_trend_batch_check --example different_j_order_process_meter
      - name: Run all 84 cold children and replay every output
        run: bash research/isogeny_torsion_fibers_20261012/portable_order_trend_20261015/order1000/run_batch_linux_v1.sh "${RUNNER_TEMP}/isogeny-fiber-order1201-linux-v1"
      - name: Retain host receipt, every child, and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isogeny-fiber-order1201-linux-v1
          path: ${{ runner.temp }}/isogeny-fiber-order1201-linux-v1
          if-no-files-found: warn
          retention-days: 90
