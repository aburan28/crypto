name: IC autolab integration
on:
  pull_request:
    paths:
      - 'src/**'
      - 'examples/ic_tournament_worker.rs'
      - 'examples/ic_query_law_vectors.rs'
      - 'Cargo.toml'
      - 'research/ic_candidate_tournament_20260915/**'
      - 'research/sat_factor_base_review_20260908/autolab/**'
      - '.github/workflows/ic-autolab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ic-autolab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ic-autolab-integration
      - name: Install calibrated profiler
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          test "$(valgrind --version)" = valgrind-3.22.0
      - name: Freeze dependency resolution
        run: |
          cp research/ic_candidate_tournament_20260915/ci/Cargo.lock Cargo.lock
          cargo fetch --locked
      - name: Harness and accounting regression tests
        run: |
          python -m unittest discover -s research/ic_candidate_tournament_20260915 -p 'test_*.py' -v
          python -m unittest discover -s research/sat_factor_base_review_20260908/autolab -p 'test_boundary_autolab.py' -v
      - name: Independently replay pinned Rust random streams
        run: |
          cargo run --locked --release --example ic_query_law_vectors > "$RUNNER_TEMP/ic-query-law-rust-vectors.json"
          python research/ic_candidate_tournament_20260915/generic_query_law.py \
            --rust-vectors "$RUNNER_TEMP/ic-query-law-rust-vectors.json"
      - name: Release arithmetic and descent regressions
        run: |
          cargo test --locked --release --lib pdp_admission_ -- --test-threads=1
          cargo test --locked --release --lib query_accounting_ -- --test-threads=1
          cargo test --locked --release --lib la_accounting_ -- --test-threads=1
          cargo test --locked --release --lib all_three_oracles_answer_every_target_identically -- --test-threads=1
          cargo test --locked --release --lib undecomposable_targets -- --test-threads=1
          cargo test --locked --release --lib cryptanalysis::crossbred::tests -- --test-threads=1
          cargo test --locked --release --lib cryptanalysis::polynomial_reuse::tests -- --test-threads=1
          cargo test --locked --release --lib descent_
          cargo test --locked --release --lib rho_
          cargo test --locked --release --lib rho_preparation_ -- --test-threads=1
          cargo test --locked --release --lib exclusive_measurement_ -- --include-ignored --test-threads=1
          RAYON_NUM_THREADS=1 cargo test --locked --release --lib exclusive_descent_ -- --test-threads=1
          cargo test --locked --release --example ic_tournament_worker public_input_ -- --test-threads=1
          RAYON_NUM_THREADS=1 cargo test --locked --release --example ic_tournament_worker exclusive_worker_ -- --include-ignored --test-threads=1
      - name: Build source-bound generic worker and audit scientific controls
        run: |
          python research/ic_candidate_tournament_20260915/generic_build.py \
            --out "$RUNNER_TEMP/ic-generic-build"
          python research/ic_candidate_tournament_20260915/goal_20260924/generic-scientific-admission/run_controls.py \
            --build "$RUNNER_TEMP/ic-generic-build" --out "$RUNNER_TEMP/ic-generic-admission"
      - name: Complete-solve and profiler integration
        run: |
          python research/ic_candidate_tournament_20260915/ci_smoke.py \
            --worker "$RUNNER_TEMP/ic-generic-build/worker" \
            --build-dir "$RUNNER_TEMP/ic-generic-build" \
            --out "$RUNNER_TEMP/ic-autolab-integration"
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ic-autolab-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ic-autolab-integration
            ${{ runner.temp }}/ic-query-law-rust-vectors.json
            ${{ runner.temp }}/ic-generic-build
            ${{ runner.temp }}/ic-generic-admission
            Cargo.lock
          retention-days: 30
          if-no-files-found: warn
