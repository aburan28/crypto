name: N83 sparse K3350 first reversed-order replication

on:
  push:
    branches: [codex/n83-k3350-reverse-20261015]
    paths:
      - .github/workflows/n83-k3350-reverse.yml
      - research/n83_k3350_reverse_20261015/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-k3350-reverse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  two-arm-fresh-confirmation:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Freeze 20000 disjoint public points and source preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-k3350-reverse"
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > \
            "$RUNNER_TEMP/n83-k3350-reverse/prior-fixture-check.json"
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > \
            "$RUNNER_TEMP/n83-k3350-reverse/fixture-check.json"
          python3 research/n83_k3350_reverse_20261015/run.py --preflight > \
            "$RUNNER_TEMP/n83-k3350-reverse/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-k3350-reverse/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-k3350-reverse/cargo-version.txt"

      - name: Build and test exact N83 producer
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-k3350-reverse-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-k3350-reverse/example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-k3350-reverse/build.log" 2>&1

      - name: Run bounded sparse K3350 then K3300 arms
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-k3350-reverse-target"
          python3 research/n83_k3350_reverse_20261015/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --output "$RUNNER_TEMP/n83-k3350-reverse/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-k3350-reverse/run.log"

      - name: Independently replay two bases and all 40000 targets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-k3350-reverse/results" ]; then
            python3 research/n83_k3350_reverse_20261015/verify.py \
              "$RUNNER_TEMP/n83-k3350-reverse/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-k3350-reverse/verify.log"
          fi

      - name: Preserve all raw rows and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-k3350-reverse-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-k3350-reverse/
          if-no-files-found: error
          retention-days: 14
