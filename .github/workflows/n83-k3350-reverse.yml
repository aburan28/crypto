name: N83 K3350 first reversed-order sealed replay

on:
  push:
    branches: [codex/n83-k3350-reverse-20261015]
    paths:
      - .github/workflows/n83-k3350-reverse.yml
      - research/n83_k3350_reverse_20261015/**
      - research/n83_k3350_reverse_results_20261015/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: n83-k3350-reverse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  two-arm-reverse-sealed-replay:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the executed source snapshot
        shell: bash
        run: |
          set -euo pipefail
          frozen=53339d82a372e09958dd43bb7391e283de8933f5
          git fetch --no-tags --depth=1 origin "$frozen"
          test "$(git rev-parse FETCH_HEAD)" = "$frozen"
          mkdir -p "$RUNNER_TEMP/n83-k3350-frozen-source"
          git archive "$frozen" Cargo.lock \
            examples/koblitz_orbit_dlp_fast.rs \
            examples/n83_rho_optimization_eval.rs \
            research/n83_dense_root_20261013 \
            research/n83_factor_base_100_20261014 \
            research/n83_factor_base_refine_20261014 \
            research/n83_factor_base_confirm_20261015 \
            research/n83_indexed5_20261013 \
            research/n83_root4_20261014 \
            research/n83_k3250_sparse_fresh_20261015 \
            research/n83_k3350_sparse_fresh_20261015 \
            research/n83_k3350_reverse_20261015 \
            | tar -xf - -C "$RUNNER_TEMP/n83-k3350-frozen-source"
          test "$(sha256sum "$RUNNER_TEMP/n83-k3350-frozen-source/examples/koblitz_orbit_dlp_fast.rs" | cut -d' ' -f1)" = \
            c9824acebda0360416c3c507594bb07c17ca798c32cbf8f84bba95ca2c44d5b1

      - name: Download the exact completed raw artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-k3350-sealed"
          gh api repos/aburan28/crypto/actions/artifacts/11960333030/zip > \
            "$RUNNER_TEMP/n83-k3350-sealed/raw.zip"
          test "$(sha256sum "$RUNNER_TEMP/n83-k3350-sealed/raw.zip" | cut -d' ' -f1)" = \
            8ad1eb8759a7d6d9872b93697990992e0a91eb2b728bdfd211d4a3c744ac8c76
          unzip -q "$RUNNER_TEMP/n83-k3350-sealed/raw.zip" -d \
            "$RUNNER_TEMP/n83-k3350-sealed/raw"
          test "$(sha256sum "$RUNNER_TEMP/n83-k3350-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            a7d94c1a201868f8084d414edd2a1d99baf853ac92393cf4fe616c6ba8732db7

      - name: Independently replay both bases and all 40000 answers
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 "$RUNNER_TEMP/n83-k3350-frozen-source/research/n83_k3250_sparse_fresh_20261015/generate.py" > \
            "$RUNNER_TEMP/n83-k3350-sealed/prior-fixture-check.json"
          python3 "$RUNNER_TEMP/n83-k3350-frozen-source/research/n83_k3350_sparse_fresh_20261015/generate.py" > \
            "$RUNNER_TEMP/n83-k3350-sealed/fixture-check.json"
          python3 "$RUNNER_TEMP/n83-k3350-frozen-source/research/n83_k3350_reverse_20261015/verify.py" \
            "$RUNNER_TEMP/n83-k3350-sealed/raw/results" > \
            "$RUNNER_TEMP/n83-k3350-sealed/local-replay.log"
          test "$(sha256sum "$RUNNER_TEMP/n83-k3350-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            a7d94c1a201868f8084d414edd2a1d99baf853ac92393cf4fe616c6ba8732db7

      - name: Reproduce the canonical current-head result records
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k3350_reverse_results_20261015/materialize.py \
            --artifact-zip "$RUNNER_TEMP/n83-k3350-sealed/raw.zip" \
            --artifact-sha256 8ad1eb8759a7d6d9872b93697990992e0a91eb2b728bdfd211d4a3c744ac8c76 \
            --analysis-sha256 a7d94c1a201868f8084d414edd2a1d99baf853ac92393cf4fe616c6ba8732db7 \
            "$RUNNER_TEMP/n83-k3350-sealed/raw/results"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Preserve current-head replay receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-k3350-reverse-sealed-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/n83-k3350-sealed/local-replay.log
            ${{ runner.temp }}/n83-k3350-sealed/fixture-check.json
          if-no-files-found: ignore
          retention-days: 14
