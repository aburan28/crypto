name: Koblitz Stage 168 current gate audit

on:
  pull_request:
    paths:
      - "docs/index-calculus-scoreboard.html"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-167-current-gate-audit-20260923/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-168-single-batch-39-20260923/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-168-single-batch-39-verification.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-168-current-gate-audit-20260923/**"
      - "scripts/compose_koblitz_stage167_gate_audit.py"
      - "scripts/compose_koblitz_stage168_gate_audit.py"
      - "scripts/verify_koblitz_stage168_single_batch.py"
      - ".github/workflows/koblitz-stage168-current-gate-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify historical Stage 167 and current Stage 168
        run: |
          python3 -m py_compile \
            scripts/compose_koblitz_stage167_gate_audit.py \
            scripts/compose_koblitz_stage168_gate_audit.py \
            scripts/verify_koblitz_stage168_single_batch.py
          python3 scripts/compose_koblitz_stage167_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-167-current-gate-audit-20260923 \
            > "$RUNNER_TEMP/stage167-historical-audit.json"
          python3 scripts/verify_koblitz_stage168_single_batch.py \
            > "$RUNNER_TEMP/stage168-result-verification.json"
          cmp "$RUNNER_TEMP/stage168-result-verification.json" \
            research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-168-single-batch-39-verification.json
          python3 scripts/compose_koblitz_stage168_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-168-current-gate-audit-20260923 \
            > "$RUNNER_TEMP/stage168-current-audit.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
