name: N83 root11 K3500 K3550 capacity-edge screen

on:
  push:
    branches: [codex/n83-final-tournament-20261015]
    paths:
      - .github/workflows/n83-root11-edgek.yml
      - research/n83_root11_edgek_20261015/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-root11-edgek-${{ github.ref }}
  cancel-in-progress: false

jobs:
  six-arm-root11-edgek-screen:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Freeze 1000 new public points and source preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-root11-edgek"
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > \
            "$RUNNER_TEMP/n83-root11-edgek/prior-k3250-fixture-check.json"
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > \
            "$RUNNER_TEMP/n83-root11-edgek/prior-k3350-fixture-check.json"
          python3 research/n83_k_abba_20261015/generate.py > \
            "$RUNNER_TEMP/n83-root11-edgek/prior-abba-fixture-check.json"
          python3 research/n83_root4_highk_20261015/generate.py > \
            "$RUNNER_TEMP/n83-root11-edgek/prior-highk-fixture-check.json"
          python3 research/n83_best_e2e_20261015/generate.py > \
            "$RUNNER_TEMP/n83-root11-edgek/prior-best-e2e-fixture-check.json"
          python3 research/n83_legacy_challenger_20261015/generate.py > \
            "$RUNNER_TEMP/n83-root11-edgek/prior-legacy-fixture-check.json"
          python3 research/n83_root4_bloom_20261015/generate.py > \
            "$RUNNER_TEMP/n83-root11-edgek/prior-root4-bloom-fixture-check.json"
          python3 research/n83_root11_highk_20261015/generate.py > /dev/null
          python3 research/n83_final_tournament_20261015/generate.py > /dev/null
          python3 research/n83_final_tier1_20261015/generate.py > /dev/null
          python3 research/n83_root11_edgek_20261015/generate.py > \
            "$RUNNER_TEMP/n83-root11-edgek/fixture-check.json"
          python3 research/n83_root11_edgek_20261015/run.py --preflight > \
            "$RUNNER_TEMP/n83-root11-edgek/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-root11-edgek/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-root11-edgek/cargo-version.txt"

      - name: Build and test exact N83 producer
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-root11-edgek-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-root11-edgek/example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-root11-edgek/build.log" 2>&1

      - name: Run six bounded complete pipeline arms
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-root11-edgek-target"
          python3 research/n83_root11_edgek_20261015/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --output "$RUNNER_TEMP/n83-root11-edgek/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-root11-edgek/run.log"

      - name: Independently replay six bases and all 6000 targets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-root11-edgek/results" ]; then
            python3 research/n83_root11_edgek_20261015/verify.py \
              "$RUNNER_TEMP/n83-root11-edgek/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-root11-edgek/verify.log"
          fi

      - name: Preserve all raw rows and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-root11-edgek-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-root11-edgek/
          if-no-files-found: error
          retention-days: 14
