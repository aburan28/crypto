name: Koblitz degree-73 descent archive replay

on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-committed-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/koblitz_isogeny_descent_37_results_20260925
            research/koblitz_isogeny_descent_37_20260925
            research/toy_f5_neighbors_20260924
      - name: Check raw custody and archived claims
        run: |
          python3 research/koblitz_isogeny_descent_37_20260925/verify.py \
            research/koblitz_isogeny_descent_37_results_20260925
          python3 research/koblitz_isogeny_descent_37_results_20260925/verify_archive.py \
            --out "$RUNNER_TEMP/n37-archive-replay.json"
          cmp "$RUNNER_TEMP/n37-archive-replay.json" \
            research/koblitz_isogeny_descent_37_results_20260925/REPLAY.json
