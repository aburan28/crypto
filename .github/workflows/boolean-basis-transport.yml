name: Standalone Boolean basis transport
on:
  pull_request:
    paths:
      - 'research/boolean_basis_transport_20260923/**'
      - '.github/workflows/boolean-basis-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  correctness-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exhaustive bounded algebra and search checks
        run: |
          rustc --edition 2021 -O --test research/boolean_basis_transport_20260923/worker.rs -o /tmp/boolean-basis-tests
          /tmp/boolean-basis-tests
      - name: Frozen evidence and corruption checks
        run: python3 -m unittest discover -s research/boolean_basis_transport_20260923 -p 'test_*.py' -v
