name: Release

# Every merge to main publishes a rolling build. The tag uses the crate's
# major/minor version and patch + run number, giving ReleaseMe a distinct
# stable version per run so /releases/latest remains the newest main build.
on:
  push:
    branches: [main]
  # Dry run on pull requests that touch what the build consumes, so the
  # macOS and Windows legs are proven before a merge can turn a release
  # red. The `release` job is skipped for these; nothing is published.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # `cargo build --bins` consumes the library and every binary target.
      # Exercise the cross-platform packaging path whenever any Rust source
      # changes, including the cover/Jacobian command-line tools.
      - 'src/**'
      - 'tests/fixtures/ecbench_manifest_small.json'
      - 'ecc2k130/Makefile'
      - 'tools/isogeny-cli/**'
      - 'isogeny_algos/**'
      - 'research/p192_p224_large_degree_isogenies_20261009/**'
      - 'docs/curves/registry.json'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Main releases finish their uploads. Superseded PR dry runs cannot
  # publish and may be cancelled so the latest head gets tested promptly.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Portable baseline for the native client. ecc2k130/Makefile defaults to
  # -march=native, which bakes the runner's CPU into the binary and SIGILLs
  # elsewhere. x86-64-v3 is AVX2 + BMI2 + FMA (Haswell / Zen 1 onwards).
  ECC_MARCH: x86-64-v3
  # 12.8 is the first release that knows compute_120, which the Makefile's
  # gencode list requires.
  CUDA_PKG_VERSION: 12-8
  CUDA_DIR_VERSION: "12.8"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      short_sha: ${{ steps.v.outputs.short_sha }}
      release_version: ${{ steps.v.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$version" ] || { echo "no version found in Cargo.toml"; exit 1; }
          IFS=. read -r major minor patch <<< "$version"
          release_version="$major.$minor.$((patch + ${{ github.run_number }}))"
          {
            echo "short_sha=$(git rev-parse --short HEAD)"
            echo "release_version=$release_version"
            echo "tag=v$release_version"
          } >> "$GITHUB_OUTPUT"

  rust:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu,  os: ubuntu-latest}
          - {target: x86_64-unknown-linux-musl, os: ubuntu-latest}
          - {target: aarch64-apple-darwin,      os: macos-latest}
          - {target: x86_64-pc-windows-msvc,    os: windows-latest}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Enable long Git paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}
      - name: Install the musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build release binaries with source provenance
        env:
          CRYPTO_BUILD_GIT_COMMIT: ${{ github.sha }}
          CRYPTO_BUILD_GIT_DIRTY: "false"
        run: cargo build --locked --release --bins --target ${{ matrix.target }}
      - name: Smoke-test the binaries
        # Every target in the matrix is native to its runner, so the
        # binaries must start here.
        shell: bash
        run: |
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          for bin in crypto curve_cover_check hyperelliptic-cover; do
            "./target/${{ matrix.target }}/release/$bin$ext" --help > /dev/null
          done
          "./target/${{ matrix.target }}/release/ic$ext" --help > /dev/null
          "./target/${{ matrix.target }}/release/curve_cover_check$ext" --help > /dev/null
          "./target/${{ matrix.target }}/release/curve_standards$ext" --help > /dev/null
          "./target/${{ matrix.target }}/release/ic$ext" --version > /dev/null
          "./target/${{ matrix.target }}/release/ic$ext" --json > ic-smoke.json
          grep -Fq '"git_commit": "'"$GITHUB_SHA"'"' ic-smoke.json
          "./target/${{ matrix.target }}/release/ic$ext" --json large-prime \
            --manifest tests/fixtures/ecbench_manifest_small.json --validate-only \
            > ic-large-prime-smoke.json
          grep -Fq '"status": "checks_passed"' ic-large-prime-smoke.json
          "./target/${{ matrix.target }}/release/ecbench$ext" --version > /dev/null
          "./target/${{ matrix.target }}/release/ecbench$ext" methods --json \
            > ecbench-methods-smoke.json
          grep -Fq 'ic.large_prime' ecbench-methods-smoke.json
          "./target/${{ matrix.target }}/release/ecbench$ext" host --json \
            > ecbench-host-smoke.json
          grep -Fq '"git_commit": "'"$GITHUB_SHA"'"' ecbench-host-smoke.json
      - name: Stage the archive
        shell: bash
        run: |
          name="crypto-${{ needs.meta.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/crypto$ext" "dist/$name/"
          cp "target/${{ matrix.target }}/release/ic$ext" "dist/$name/"
          cp "target/${{ matrix.target }}/release/curve_cover_check$ext" "dist/$name/"
          cp "target/${{ matrix.target }}/release/curve_standards$ext" "dist/$name/"
          mkdir -p "dist/$name/docs/curves"
          cp docs/curves/registry.json docs/curves/covers.json docs/curves/cover-links.yaml \
             docs/curves/cover-links.schema.json docs/curves/COVERS.md docs/curves/ICV1.md \
             "dist/$name/docs/curves/"
          cp -R docs/curves/standards "dist/$name/docs/curves/"
          for bin in crypto ic ecbench curve_cover_check hyperelliptic-cover; do
            cp "target/${{ matrix.target }}/release/$bin$ext" "dist/$name/"
          done
          # `[ -f ] && cp` leaves the loop's exit status at 1 when the last
          # candidate is absent, which trips the step's `bash -e`.
          for extra in README.md LICENSE LICENSE.md; do
            [ -f "$extra" ] && cp "$extra" "dist/$name/" || true
          done
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  isogeny:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu,  os: ubuntu-latest}
          - {target: x86_64-unknown-linux-musl, os: ubuntu-latest}
          - {target: aarch64-apple-darwin,      os: macos-latest}
          - {target: x86_64-pc-windows-msvc,    os: windows-latest}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Enable long Git paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: ${{ matrix.target }}
      - name: Install the musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/isogeny-cli
      - name: Build and test the dedicated executable
        env:
          CRYPTO_BUILD_GIT_COMMIT: ${{ github.sha }}
          CRYPTO_BUILD_GIT_DIRTY: "false"
        run: |
          cargo build --locked --release --manifest-path tools/isogeny-cli/Cargo.toml --target ${{ matrix.target }}
          cargo test --locked --release --manifest-path tools/isogeny-cli/Cargo.toml --target ${{ matrix.target }}
      - name: Test the installed executable without a checkout
        shell: bash
        run: |
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir -p "$RUNNER_TEMP/isogeny-installed"
          cp "tools/isogeny-cli/target/${{ matrix.target }}/release/isogeny$ext" "$RUNNER_TEMP/isogeny-installed/"
          cd "$RUNNER_TEMP/isogeny-installed"
          "./isogeny$ext" --help > /dev/null
          "./isogeny$ext" --version > BUILD.json
          grep -Fq '"git_commit": "'"$GITHUB_SHA"'"' BUILD.json
          "./isogeny$ext" screen --curve p192 --from 1010 --to 65537 > screen.json
          grep -Fq '10453' screen.json
          "./isogeny$ext" curves > catalogue.json
          grep -Fq 'brainpoolP384r1' catalogue.json
          "./isogeny$ext" search --curve p224 --ell 1471 --out p224-1471 --timeout 180 > search-result.json
          grep -Fq '"status": "PASS"' search-result.json
          grep -Fq '"degree_coverage": "PARTIAL"' search-result.json
          "./isogeny$ext" verify --input p224-1471 > verification.json
          grep -Fq '"exact_rational_map_check": "PASS"' verification.json
          "./isogeny$ext" search --curve p192 --ell 73 --method modpoly --out p192-73 --timeout 180 > full-result.json
          grep -Fq '"degree_coverage": "COMPLETE"' full-result.json
          "./isogeny$ext" search --curve P-521 --ell 7 --out p521-7 --timeout 180 > wide-result.json
          grep -Fq '"degree_coverage": "COMPLETE"' wide-result.json
      - name: Stage the dedicated tool archive
        shell: bash
        run: |
          name="isogeny-${{ needs.meta.outputs.tag }}-${{ matrix.target }}"
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir -p "dist/$name"
          cp "tools/isogeny-cli/target/${{ matrix.target }}/release/isogeny$ext" "dist/$name/"
          cp tools/isogeny-cli/README.md "dist/$name/README.md"
          cp "$RUNNER_TEMP/isogeny-installed/BUILD.json" "dist/$name/BUILD.json"
          for license in LICENSE LICENSE.md; do
            [ -f "$license" ] && cp "$license" "dist/$name/" || true
          done
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: isogeny-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  native:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the ECC2K-130 CPU client
        run: make -C ecc2k130 cpu MARCH="$ECC_MARCH"
      - name: Solve a toy curve with it
        # Curve 23 is a planted instance that finishes in well under a
        # second. The exit code alone proves nothing: a run that collects
        # distinguished points without ever finding a collision also exits
        # 0 (curve 83 at --launches 1 does exactly that), so assert on the
        # verification line instead.
        run: |
          ./ecc2k130/ecc2k130-cpu --curve 23 --launches 1 | tee /tmp/smoke.log
          grep -q 'verified \[k\]P == Q' /tmp/smoke.log \
            || { echo "::error::client ran but did not solve the planted instance"; exit 1; }
      - name: Compile the CUDA header suites on the host
        # gpu/*/Makefile `test` builds the .cu/.cuh sources as host C++ and
        # runs their self-checks. No workflow covered these before.
        run: |
          for d in gpu/ecc gpu/ecc2k gpu/semaev gpu/macaulay gpu/btcpuzzle; do
            echo "::group::$d"
            make -C "$d" test
            echo "::endgroup::"
          done
      - name: Stage the archive
        run: |
          name="ecc2k130-cpu-${{ needs.meta.outputs.tag }}-x86_64-linux"
          mkdir -p "dist/$name"
          cp ecc2k130/ecc2k130-cpu ecc2k130/README.md "dist/$name/"
          echo "built with -march=$ECC_MARCH (AVX2/BMI2/FMA baseline)" \
            > "dist/$name/BUILD-FLAGS.txt"
          tar czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: dist/*
          if-no-files-found: error

  cuda:
    needs: meta
    # Pinned, not ubuntu-latest: the NVIDIA apt repo below is addressed by
    # distro, and the CUDA version is pinned, so letting the runner image
    # float would eventually 404 the install and block every release.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install nvcc
        # Compiler and CUDA headers only, not the full toolkit: ~330 MB
        # instead of several GB.
        run: |
          distro="ubuntu$(lsb_release -rs | tr -d .)"
          curl -fsSL -o /tmp/cuda-keyring.deb \
            "https://developer.download.nvidia.com/compute/cuda/repos/$distro/x86_64/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            "cuda-nvcc-$CUDA_PKG_VERSION" "cuda-cudart-dev-$CUDA_PKG_VERSION"
          echo "/usr/local/cuda-$CUDA_DIR_VERSION/bin" >> "$GITHUB_PATH"
      - run: nvcc --version
      - name: Compile the CUDA client
        # Compile only: GitHub runners have no GPU. This proves the device
        # code builds for every architecture in the gencode list; it does
        # not run it.
        run: make -C ecc2k130 gpu
      - name: Stage the archive
        run: |
          name="ecc2k130-cuda-${{ needs.meta.outputs.tag }}-x86_64-linux"
          mkdir -p "dist/$name"
          cp ecc2k130/ecc2k130 "dist/$name/"
          nvcc --version | tail -2 > "dist/$name/BUILD-FLAGS.txt"
          echo "fatbinary: sm_80 sm_86 sm_89 sm_90 sm_120; compiled, not GPU-tested in CI" \
            >> "dist/$name/BUILD-FLAGS.txt"
          tar czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: native-cuda
          path: dist/*
          if-no-files-found: error

  release:
    needs: [meta, rust, native, cuda, isogeny]
    # Dry runs build and stage everything, then stop short of publishing.
    # The ref test is not redundant with the event test: workflow_dispatch
    # can be started from any branch, and a release tagged `-main.` that
    # was not built from main would still become /releases/latest.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staging
      - name: Collect the archives and checksum them
        id: assets
        run: |
          mkdir -p dist
          find staging -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec mv -t dist/ {} +
          # Build the sums outside dist so the glob cannot race the file
          # being written into the directory it is listing.
          ( cd dist && sha256sum -- * ) > /tmp/SHA256SUMS
          mv /tmp/SHA256SUMS dist/
          cat dist/SHA256SUMS
          {
            echo 'files<<RELEASE_ASSETS'
            for asset in dist/*; do printf '%s\n' "$asset"; done
            echo 'RELEASE_ASSETS'
          } >> "$GITHUB_OUTPUT"
      - name: Write the release notes
        run: |
          cat > /tmp/notes.md <<'NOTES'
          Rolling build of `main`.

          | Artifact | Contents |
          | --- | --- |
          | `crypto-*-x86_64-unknown-linux-gnu.tar.gz` | `crypto`, `ic`, `ecbench`, `curve_cover_check`, `hyperelliptic-cover` — glibc |
          | `crypto-*-x86_64-unknown-linux-musl.tar.gz` | same five executables — static |
          | `crypto-*-aarch64-apple-darwin.tar.gz` | same five executables — Apple silicon |
          | `crypto-*-x86_64-pc-windows-msvc.zip` | same five executables (`.exe`) |
          | `isogeny-*-x86_64-unknown-linux-gnu.tar.gz` | dedicated `isogeny` executable, README, BUILD.json — glibc |
          | `isogeny-*-x86_64-unknown-linux-musl.tar.gz` | dedicated tool — static |
          | `isogeny-*-aarch64-apple-darwin.tar.gz` | dedicated tool — Apple silicon |
          | `isogeny-*-x86_64-pc-windows-msvc.zip` | dedicated `isogeny.exe` tool |
          | `ecc2k130-cpu-*.tar.gz` | ECC2K-130 client, CPU (`-march=x86-64-v3`) |
          | `ecc2k130-cuda-*.tar.gz` | ECC2K-130 client, CUDA fatbinary (sm_80–sm_120) |

          Verify with `sha256sum -c SHA256SUMS`.

          Run `isogeny --help` after extracting the dedicated tool archive.
          `isogeny search --curve p224 --ell 1471 --out p224-1471` constructs
          and independently verifies the recorded one-eigenline map.

          The CUDA binary is compiled, not GPU-tested: GitHub runners have no GPU.
          NOTES
          printf '\nBuilt from commit %s.\n' "$GITHUB_SHA" >> /tmp/notes.md
      - name: Pin the release tag to the built source commit
        # ReleaseMe otherwise resolves the current branch tip when creating
        # the tag; main may have advanced while the binaries were building.
        run: |
          git tag "${{ needs.meta.outputs.tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ needs.meta.outputs.tag }}"
      - name: Publish with ReleaseMe
        # ReleaseMe v1.1.0, pinned to the verified immutable tag revision.
        uses: dev-build-deploy/release-me@cede87fd8a4829ef571dff6bde807ebbfcaeb3e9
        with:
          token: ${{ github.token }}
          prefix: v
          version: ${{ needs.meta.outputs.release_version }}
          draft: false
          release-notes: /tmp/notes.md
          files: ${{ steps.assets.outputs.files }}
