name: N83 one-point cold neighborhood screen

on:
  push:
    branches: [codex/n83-cold-neighborhood-20261016]
    paths:
      - .github/workflows/n83-cold-neighborhood.yml
      - research/n83_cold_neighborhood_20261016/PROTOCOL.md
      - research/n83_cold_neighborhood_20261016/run.py
      - research/n83_cold_neighborhood_20261016/verify.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-cold-neighborhood-${{ github.ref }}
  cancel-in-progress: false

jobs:
  same-point-neighborhood:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate prior exclusions and check the frozen public point
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          mkdir -p "$RUNNER_TEMP/n83-cold-neighborhood"
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k_abba_20261015/generate.py > /dev/null
          python3 research/n83_root4_highk_20261015/generate.py > /dev/null
          python3 research/n83_best_e2e_20261015/generate.py > /dev/null
          python3 research/n83_legacy_challenger_20261015/generate.py > /dev/null
          python3 research/n83_root4_bloom_20261015/generate.py > /dev/null
          python3 research/n83_root11_highk_20261015/generate.py > /dev/null
          python3 research/n83_compact4_crosslayout_20261016/generate.py > /dev/null
          python3 research/n83_cold_factor_base_20261016/generate.py > \
            "$RUNNER_TEMP/n83-cold-neighborhood/fixture-check.json"
          python3 research/n83_cold_neighborhood_20261016/run.py --preflight > \
            "$RUNNER_TEMP/n83-cold-neighborhood/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-cold-neighborhood/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-cold-neighborhood/cargo-version.txt"

      - name: Build and test exact IC and same-point rho producers
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-cold-neighborhood-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-cold-neighborhood/ic-example-tests.log" 2>&1
          cargo test --release --locked --example n83_rho_optimization_eval > \
            "$RUNNER_TEMP/n83-cold-neighborhood/rho-example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-cold-neighborhood/ic-build.log" 2>&1
          cargo build --release --locked --example n83_rho_optimization_eval > \
            "$RUNNER_TEMP/n83-cold-neighborhood/rho-build.log" 2>&1

      - name: Run bounded one-point neighborhood arms and same-point rho
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-cold-neighborhood-target"
          python3 research/n83_cold_neighborhood_20261016/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --rho-binary "$CARGO_TARGET_DIR/release/examples/n83_rho_optimization_eval" \
            --output "$RUNNER_TEMP/n83-cold-neighborhood/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-cold-neighborhood/run.log"

      - name: Independently replay bases, relations and answers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-cold-neighborhood/results" ]; then
            python3 research/n83_cold_neighborhood_20261016/verify.py \
              "$RUNNER_TEMP/n83-cold-neighborhood/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-cold-neighborhood/verify.log"
          fi

      - name: Preserve all raw rows and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-cold-neighborhood-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-cold-neighborhood/
          if-no-files-found: error
          retention-days: 14
