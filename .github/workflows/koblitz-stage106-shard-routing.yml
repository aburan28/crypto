name: Koblitz Stage 106 n53 shard routing

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage106_shard_routing.py"
      - ".github/workflows/koblitz-stage106-shard-routing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate shard-routing controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage106_shard_routing.py
          python3 scripts/run_koblitz_stage106_shard_routing.py self-test
          cargo test --release --example koblitz_rank_fixture
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-shard-routing:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage106_shard_routing.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage106-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare mixed and direct shard routing
        run: |
          python3 scripts/run_koblitz_stage106_shard_routing.py run \
            --build "$RUNNER_TEMP/stage106-build" \
            --output "$RUNNER_TEMP/stage106-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage106_shard_routing.py verify \
            --build "$RUNNER_TEMP/stage106-build" \
            --output "$RUNNER_TEMP/stage106-run" \
            > "$RUNNER_TEMP/stage106-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage106-shard-routing-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage106-build
            ${{ runner.temp }}/stage106-run
            ${{ runner.temp }}/stage106-verification.json
