name: Factor-base designs Lean proofs
# Builds every theorem of research/factor_base_designs_20261015/lean (Lean
# core only, no dependencies), audits axioms, re-checks the environment with
# leanchecker, and refuses sorry / admit / native_decide / custom axioms.
on:
  pull_request:
    paths:
      - '.github/workflows/factor-base-designs-lean.yml'
      - 'research/factor_base_designs_20261015/lean/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/factor-base-designs-lean.yml'
      - 'research/factor_base_designs_20261015/lean/**'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: research/factor_base_designs_20261015/lean
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            research/factor_base_designs_20261015/lean
      - name: Cache the pinned Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: ${{ runner.os }}-lean-${{ hashFiles('research/factor_base_designs_20261015/lean/lean-toolchain') }}
      - name: Install Lean (toolchain pinned by lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: No sorry, admit, native_decide or custom axioms
        run: |
          if grep -rnE '\bsorry\b|\badmit\b|native_decide|^axiom ' FactorBaseDesigns FactorBaseDesigns.lean | grep -v '`native_decide` in this package'; then
            echo "forbidden construct found"; exit 1; fi
      - name: lake build
        run: lake build
      - name: Axiom audit (standard axioms only)
        run: |
          lake env lean AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -vE "does not depend on any axioms|depends on axioms: \[(propext|Classical.choice|Quot.sound)(, (propext|Classical.choice|Quot.sound))*\]" /tmp/axioms.txt; then
            echo "unexpected axiom"; exit 1; fi
      - name: leanchecker --fresh
        run: lake env leanchecker --fresh FactorBaseDesigns
