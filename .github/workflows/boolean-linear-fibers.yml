name: Standalone Boolean linear fibers
on:
  pull_request:
    paths:
      - 'research/boolean_linear_fibers_20260923/**'
      - '.github/workflows/boolean-linear-fibers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exact linear systems, fibers and SIMD checks
        run: |
          rustc --edition 2021 -O --test research/boolean_linear_fibers_20260923/worker.rs -o /tmp/boolean-fiber-tests
          /tmp/boolean-fiber-tests
      - name: Frozen evidence and corruption checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s research/boolean_linear_fibers_20260923 -p 'test_*.py' -v
