name: Matched point-only rho replay
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the point-input rho producer
        run: cargo build --release --example koblitz_rho_batch_ks
      - name: Check point-input behavior and frozen receipts
        run: |
          python3 research/sat_factor_base_review_20260908/autolab_matched_point_rho_n53_20260925/test_rho_point_input.py
          python3 -m py_compile research/sat_factor_base_review_20260908/autolab_matched_point_rho_n53_20260925/analyze.py research/sat_factor_base_review_20260908/autolab_matched_point_rho_n53_20260925/replay_ic_single.py
          python3 research/sat_factor_base_review_20260908/autolab_matched_point_rho_n53_20260925/replay_ic_single.py
          python3 research/sat_factor_base_review_20260908/autolab_matched_point_rho_n53_20260925/analyze.py
          git diff --exit-code -- research/sat_factor_base_review_20260908/autolab_matched_point_rho_n53_20260925/analysis.json
