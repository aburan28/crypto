name: N83 K3300 root11 Bloom sealed replay

on:
  push:
    branches: [codex/n83-root11-bloom-20261015]
    paths:
      - .github/workflows/n83-root11-bloom.yml
      - research/n83_root11_bloom_20261015/**
      - research/n83_root11_bloom_results_20261015/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: n83-root11-bloom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  same-base-bloom-sealed-replay:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the executed source snapshot
        shell: bash
        run: |
          set -euo pipefail
          frozen=a9b44ee1454beb2bbe8614b681714df07fd11f3c
          git fetch --no-tags --depth=1 origin "$frozen"
          test "$(git rev-parse FETCH_HEAD)" = "$frozen"
          mkdir -p "$RUNNER_TEMP/n83-bloom-frozen-source"
          git archive "$frozen" Cargo.lock \
            examples/koblitz_orbit_dlp_fast.rs \
            examples/n83_rho_optimization_eval.rs \
            research/n83_dense_root_20261013 \
            research/n83_indexed5_20261013 \
            research/n83_root4_20261014 \
            research/n83_factor_base_refine_20261014 \
            research/n83_root11_bloom_20261015 \
            | tar -xf - -C "$RUNNER_TEMP/n83-bloom-frozen-source"
          test "$(sha256sum "$RUNNER_TEMP/n83-bloom-frozen-source/examples/koblitz_orbit_dlp_fast.rs" | cut -d' ' -f1)" = \
            814afa03ae1c386e62e518be3c7a55fb108b09c41b05bef64ca1371787466c39

      - name: Download the exact completed raw artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-bloom-sealed"
          gh api repos/aburan28/crypto/actions/artifacts/11945754917/zip > \
            "$RUNNER_TEMP/n83-bloom-sealed/raw.zip"
          test "$(sha256sum "$RUNNER_TEMP/n83-bloom-sealed/raw.zip" | cut -d' ' -f1)" = \
            098c1ea1383c3ddaf78aaf1ac28bc32c80cb2caa5c69ccfb155bb060f5d2bda2
          unzip -q "$RUNNER_TEMP/n83-bloom-sealed/raw.zip" -d \
            "$RUNNER_TEMP/n83-bloom-sealed/raw"
          test "$(sha256sum "$RUNNER_TEMP/n83-bloom-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            2976f932e8eb2fd2d285b1f40f065c43dd6573fb6879845bd915f9b7ee675a6a

      - name: Independently replay both bases and all 2000 targets
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 "$RUNNER_TEMP/n83-bloom-frozen-source/research/n83_root11_bloom_20261015/verify.py" \
            "$RUNNER_TEMP/n83-bloom-sealed/raw/results" > \
            "$RUNNER_TEMP/n83-bloom-sealed/local-replay.log"
          test "$(sha256sum "$RUNNER_TEMP/n83-bloom-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            2976f932e8eb2fd2d285b1f40f065c43dd6573fb6879845bd915f9b7ee675a6a

      - name: Reproduce the canonical current-head result records
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_root11_bloom_results_20261015/materialize.py \
            --artifact-zip "$RUNNER_TEMP/n83-bloom-sealed/raw.zip" \
            "$RUNNER_TEMP/n83-bloom-sealed/raw/results"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Preserve current-head replay receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-root11-bloom-sealed-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-bloom-sealed/local-replay.log
          if-no-files-found: ignore
          retention-days: 14
