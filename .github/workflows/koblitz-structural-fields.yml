name: Koblitz structural field survey
on:
  pull_request:
    paths:
      - 'research/koblitz_structural_fields_20260924/**'
      - '.github/workflows/koblitz-structural-fields.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact structural arithmetic and evidence
        run: python3 research/koblitz_structural_fields_20260924/verify.py
