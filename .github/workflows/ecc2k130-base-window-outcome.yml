name: ECC2K-130 base-window sealed outcome replay

on:
  pull_request:
    paths:
      - '.github/workflows/ecc2k130-base-window-outcome.yml'
      - 'research/notes/ecc2k130/base_window_screen_outcome_20261001/**'
      - 'docs/index-calculus-scoreboard.html'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ecc2k130-base-window-outcome.yml'
      - 'research/notes/ecc2k130/base_window_screen_outcome_20261001/**'
      - 'docs/index-calculus-scoreboard.html'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/ecc2k130-base-window-source-lock.yml
            /examples/koblitz_base_window.rs
            /research/notes/ecc2k130/base_window_screen_20261001/*
            /research/notes/ecc2k130/base_window_screen_20261001/fixtures/*
            /research/notes/ecc2k130/base_window_screen_outcome_20261001/*
            /research/notes/ecc2k130/base_window_screen_outcome_20261001/evidence_run_36827211814/*
            /research/notes/ecc2k130/base_window_screen_outcome_20261001/evidence_run_36827211814/raw/*
            /research/notes/ecc2k130/base_window_screen_outcome_20261001/evidence_run_36827211814/receipts/*
            /research/notes/ecc2k130/compact_ir_ledger_20260930/archive.py
            /research/notes/ecc2k130/compact_ir_ledger_20260930/run_panel.py
            /research/notes/ecc2k130/compact_orbit_rank_evidence_20260929/verify_rank.py
            /research/notes/ecc2k130/disjoint_cold_v2_20261001/check_pairing.py
            /research/sat_factor_base_review_20260908/autolab_orbit_extract_20260924/independent_replay.py
            /tools/isolated_bench.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The replay checks every file the screen's source lock pins against
      # the working tree. One of them, tools/isolated_bench.py, has changed
      # on main since the lock (#1162), so the pinned files are restored from
      # the lock's merge commit first. The replay then runs on exactly the
      # sources the screen locked, and verify_inputs.py still checks each
      # one against its pinned SHA-256.
      - name: Restore the screen's locked sources from their merge commit
        run: |
          set -euo pipefail
          lock=research/notes/ecc2k130/base_window_screen_20261001/FROZEN.json
          commit=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["source_lock"]["merge_commit"])' "$lock")
          python3 -c 'import json, sys; print("\n".join(json.load(open(sys.argv[1]))["source_lock"]["sha256"]))' "$lock" \
            | xargs git checkout "$commit" --
          git status --short
      - name: Rehash 419 raw members and independently replay the complete decision
        run: |
          set -euo pipefail
          python3 -m py_compile \
            research/notes/ecc2k130/base_window_screen_outcome_20261001/*.py
          python3 research/notes/ecc2k130/base_window_screen_outcome_20261001/replay_archive.py \
            --archive research/notes/ecc2k130/base_window_screen_outcome_20261001/evidence_run_36827211814 \
            --out "$RUNNER_TEMP/base-window-sealed-replay.json"
          cmp "$RUNNER_TEMP/base-window-sealed-replay.json" \
            research/notes/ecc2k130/base_window_screen_outcome_20261001/REPLAY_RECEIPT.json
