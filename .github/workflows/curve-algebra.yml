name: Curve algebra fixtures
on:
  pull_request:
    paths:
      - '.agents/skills/curve-algebra/**'
      - '.github/workflows/curve-algebra.yml'
  push:
    branches: [main]
    paths:
      - '.agents/skills/curve-algebra/**'
      - '.github/workflows/curve-algebra.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-examples:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 360 }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile native algebraic verifier
        run: c++ -std=c++17 -O2 -Wall -Wextra -Werror .agents/skills/curve-algebra/scripts/verify_examples.cpp -o /tmp/curve-algebra-check
      - name: Verify both exact examples
        run: /tmp/curve-algebra-check
