name: Koblitz Stage 78 n53 combined field fast path

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage78_combined_fast_path.py"
      - ".github/workflows/koblitz-stage78-combined-fast-path.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate combined field fast-path controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage78_combined_fast_path.py
          python3 scripts/run_koblitz_stage78_combined_fast_path.py self-test
          cargo test --release --example koblitz_rank_fixture
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-combined-fast-path:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage78_combined_fast_path.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage78-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare legacy dispatch, combined fast path, and rho
        run: |
          python3 scripts/run_koblitz_stage78_combined_fast_path.py run \
            --build "$RUNNER_TEMP/stage78-build" \
            --output "$RUNNER_TEMP/stage78-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage78_combined_fast_path.py verify \
            --build "$RUNNER_TEMP/stage78-build" \
            --output "$RUNNER_TEMP/stage78-run" \
            > "$RUNNER_TEMP/stage78-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage78-combined-fast-path-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage78-build
            ${{ runner.temp }}/stage78-run
            ${{ runner.temp }}/stage78-verification.json
