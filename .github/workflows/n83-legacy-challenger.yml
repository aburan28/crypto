name: N83 root22 root21 four-pipeline challenger screen

on:
  push:
    branches: [codex/n83-legacy-challenger-20261015]
    paths:
      - .github/workflows/n83-legacy-challenger.yml
      - research/n83_legacy_challenger_20261015/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-legacy-challenger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eight-arm-challenger-screen:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      - name: Freeze 1000 new public points and source preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-legacy-challenger"
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > \
            "$RUNNER_TEMP/n83-legacy-challenger/prior-k3250-fixture-check.json"
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > \
            "$RUNNER_TEMP/n83-legacy-challenger/prior-k3350-fixture-check.json"
          python3 research/n83_k_abba_20261015/generate.py > \
            "$RUNNER_TEMP/n83-legacy-challenger/prior-abba-fixture-check.json"
          python3 research/n83_root4_highk_20261015/generate.py > \
            "$RUNNER_TEMP/n83-legacy-challenger/prior-highk-fixture-check.json"
          python3 research/n83_best_e2e_20261015/generate.py > \
            "$RUNNER_TEMP/n83-legacy-challenger/prior-best-e2e-fixture-check.json"
          python3 research/n83_legacy_challenger_20261015/generate.py > \
            "$RUNNER_TEMP/n83-legacy-challenger/fixture-check.json"
          python3 research/n83_legacy_challenger_20261015/run.py --preflight > \
            "$RUNNER_TEMP/n83-legacy-challenger/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-legacy-challenger/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-legacy-challenger/cargo-version.txt"

      - name: Build and test exact N83 producer
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-legacy-challenger-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-legacy-challenger/example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-legacy-challenger/build.log" 2>&1

      - name: Run eight bounded complete pipeline arms
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-legacy-challenger-target"
          python3 research/n83_legacy_challenger_20261015/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --output "$RUNNER_TEMP/n83-legacy-challenger/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-legacy-challenger/run.log"

      - name: Independently replay eight bases and all 8000 targets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-legacy-challenger/results" ]; then
            python3 research/n83_legacy_challenger_20261015/verify.py \
              "$RUNNER_TEMP/n83-legacy-challenger/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-legacy-challenger/verify.log"
          fi

      - name: Preserve all raw rows and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-legacy-challenger-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-legacy-challenger/
          if-no-files-found: error
          retention-days: 14
