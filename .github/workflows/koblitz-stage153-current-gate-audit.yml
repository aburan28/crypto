name: Koblitz Stage 153 current gate audit
on:
  pull_request:
    paths:
      - "docs/ic/patches/koblitz-n59-fifo-lookahead64-rejected-20260922.patch"
      - "docs/ic/runs/koblitz-n59-fifo-lookahead64-rejection-20260922.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-152-current-gate-audit-20260922/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-153-current-gate-audit-20260922/**"
      - "scripts/compose_koblitz_stage152_gate_audit.py"
      - "scripts/compose_koblitz_stage153_gate_audit.py"
      - ".github/workflows/koblitz-stage153-current-gate-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay Stage 152 historical audit and Stage 153 current audit
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage152_gate_audit.py scripts/compose_koblitz_stage153_gate_audit.py
          python3 -m json.tool docs/ic/runs/koblitz-n59-fifo-lookahead64-rejection-20260922.json >/dev/null
          python3 scripts/compose_koblitz_stage152_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-152-current-gate-audit-20260922 > "$RUNNER_TEMP/stage152-historical.json"
          python3 scripts/compose_koblitz_stage153_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-153-current-gate-audit-20260922 > "$RUNNER_TEMP/stage153-current.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
