name: N83 five-point cold factor-base holdout

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-e2e-holdout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  five-point-cold-holdout:
    if: github.repository == 'aburan28/crypto' && github.ref == 'refs/heads/codex/n83-e2e-holdout-freeze-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Replay frozen points and require sealed grid selection
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          mkdir -p "$RUNNER_TEMP/n83-e2e-holdout"
          python3 research/n83_e2e_holdout_20261016/generate.py > \
            "$RUNNER_TEMP/n83-e2e-holdout/fixture-check.json"
          python3 research/n83_e2e_holdout_20261016/run.py --preflight > \
            "$RUNNER_TEMP/n83-e2e-holdout/preflight.json"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["selection_pending"] is False' \
            "$RUNNER_TEMP/n83-e2e-holdout/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-e2e-holdout/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-e2e-holdout/cargo-version.txt"

      - name: Build and check exact IC and same-point rho producers
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-e2e-holdout-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-e2e-holdout/ic-tests.log" 2>&1
          cargo test --release --locked --example n83_rho_optimization_eval > \
            "$RUNNER_TEMP/n83-e2e-holdout/rho-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-e2e-holdout/ic-build.log" 2>&1
          cargo build --release --locked --example n83_rho_optimization_eval > \
            "$RUNNER_TEMP/n83-e2e-holdout/rho-build.log" 2>&1

      - name: Run five sealed cold point panels and same-point rho
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-e2e-holdout-target"
          python3 research/n83_e2e_holdout_20261016/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --rho-binary "$CARGO_TARGET_DIR/release/examples/n83_rho_optimization_eval" \
            --output "$RUNNER_TEMP/n83-e2e-holdout/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-e2e-holdout/run.log"

      - name: Independently replay all bases relations scalars and resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-e2e-holdout/results" ]; then
            python3 research/n83_e2e_holdout_20261016/verify.py \
              "$RUNNER_TEMP/n83-e2e-holdout/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-e2e-holdout/verify.log"
          fi

      - name: Preserve raw receipts and every failed arm
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-e2e-holdout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-e2e-holdout/
          if-no-files-found: error
          retention-days: 14
