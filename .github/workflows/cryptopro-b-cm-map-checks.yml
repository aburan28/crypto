name: CryptoPro-B CM map correctness

on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98'
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Prepare native replay
        run: |
          mkdir -p "$RUNNER_TEMP/cryptopro-b-cm"
          rustfmt --edition 2021 examples/cryptopro_b_cm_map_checks.rs
          cp examples/cryptopro_b_cm_map_checks.rs "$RUNNER_TEMP/cryptopro-b-cm/cryptopro_b_cm_map_checks.rs"
      - name: Positive replay and rejection controls
        run: cargo test --release --example cryptopro_b_cm_map_checks
      - name: Native forward-map report
        run: |
          cargo run --release --example cryptopro_b_cm_map_checks > "$RUNNER_TEMP/cryptopro-b-cm/cryptopro_b_cm_native.json"
          sha256sum "$RUNNER_TEMP/cryptopro-b-cm/cryptopro_b_cm_native.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cryptopro-b-cm-native-replay
          path: ${{ runner.temp }}/cryptopro-b-cm/
          if-no-files-found: error
