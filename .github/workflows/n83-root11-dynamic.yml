name: N83 dynamic one-root exact index cold screen

on:
  push:
    branches: [codex/n83-root11-dynamic-20261016]
    paths:
      - .github/workflows/n83-root11-dynamic.yml
      - examples/koblitz_orbit_dlp_fast.rs
      - research/n83_root11_dynamic_20261016/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-root11-dynamic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dynamic-one-root-screen:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate prior exclusions and verify the frozen point
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          mkdir -p "$RUNNER_TEMP/n83-root11-dynamic"
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k_abba_20261015/generate.py > /dev/null
          python3 research/n83_root4_highk_20261015/generate.py > /dev/null
          python3 research/n83_best_e2e_20261015/generate.py > /dev/null
          python3 research/n83_legacy_challenger_20261015/generate.py > /dev/null
          python3 research/n83_root4_bloom_20261015/generate.py > /dev/null
          python3 research/n83_root11_highk_20261015/generate.py > /dev/null
          python3 research/n83_compact4_crosslayout_20261016/generate.py > /dev/null
          python3 research/n83_cold_factor_base_20261016/generate.py > \
            "$RUNNER_TEMP/n83-root11-dynamic/fixture-check.json"
          python3 research/n83_root11_dynamic_20261016/run.py --preflight > \
            "$RUNNER_TEMP/n83-root11-dynamic/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-root11-dynamic/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-root11-dynamic/cargo-version.txt"

      - name: Build and test exact IC and same-point rho producers
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-root11-dynamic-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-root11-dynamic/ic-example-tests.log" 2>&1
          cargo test --release --locked --example n83_rho_optimization_eval > \
            "$RUNNER_TEMP/n83-root11-dynamic/rho-example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-root11-dynamic/ic-build.log" 2>&1
          cargo build --release --locked --example n83_rho_optimization_eval > \
            "$RUNNER_TEMP/n83-root11-dynamic/rho-build.log" 2>&1

      - name: Run bounded one-point exact-index arms and same-point rho
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-root11-dynamic-target"
          python3 research/n83_root11_dynamic_20261016/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --rho-binary "$CARGO_TARGET_DIR/release/examples/n83_rho_optimization_eval" \
            --output "$RUNNER_TEMP/n83-root11-dynamic/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-root11-dynamic/run.log"

      - name: Independently replay bases, target relations and rho scalar
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-root11-dynamic/results" ]; then
            python3 research/n83_root11_dynamic_20261016/verify.py \
              "$RUNNER_TEMP/n83-root11-dynamic/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-root11-dynamic/verify.log"
          fi

      - name: Preserve all raw rows and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-root11-dynamic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-root11-dynamic/
          if-no-files-found: error
          retention-days: 14

  proof-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache the pinned Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: ${{ runner.os }}-n83-root11-dynamic-lean-${{ hashFiles('research/n83_root11_dynamic_20261016/lean-toolchain') }}
      - name: Install pinned Lean and check capacity declarations
        shell: bash
        working-directory: research/n83_root11_dynamic_20261016
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lean Root11DynamicCapacity.lean > /tmp/n83-root11-dynamic-proof-check.log
          diff -u proof_check.log /tmp/n83-root11-dynamic-proof-check.log
          if rg -n '\b(sorry|admit|sorryAx)\b' Root11DynamicCapacity.lean; then
            exit 1
          fi
