name: Koblitz Stage 42 n53 same target

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "examples/koblitz_rho_fixture.rs"
      - "scripts/run_koblitz_stage42_n53_same_target.py"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/STAGE41_42_N53_SAME_TARGET.md"
      - ".github/workflows/koblitz-stage42-n53-same-target.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate explicit same-target producer boundary
        run: |
          python3 -m py_compile scripts/run_koblitz_stage42_n53_same_target.py
          python3 scripts/run_koblitz_stage42_n53_same_target.py self-test
          cp research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-20-rust-build/Cargo.lock Cargo.lock
          RUSTFLAGS=-Awarnings cargo build --release --locked \
            --example koblitz_rank_fixture --example koblitz_rho_fixture
          target/release/examples/koblitz_rank_fixture \
            13 0 1 2 12345 signed_expanded independent pair_pair_256 1 3 \
            > "$RUNNER_TEMP/direct-n13.jsonl"
          target/release/examples/koblitz_rho_fixture \
            13 0 signed_frobenius 1 packed 67890 3 \
            > "$RUNNER_TEMP/rho-n13.jsonl"
          python3 - "$RUNNER_TEMP/direct-n13.jsonl" "$RUNNER_TEMP/rho-n13.jsonl" <<'PY'
          import json, pathlib, sys
          direct = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          direct = next(row for row in direct if row.get("kind") == "relation_rank_summary")
          rho = json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert direct["fixture_scalar_source"] == rho["fixture_scalar_source"] == "explicit_public_validation_scalar"
          assert direct["published_fixture_scalar"] == rho["published_fixture_scalar"] == 3
          assert direct["published_q"] == rho["published_q"]
          assert direct["recovered_fixture_scalar"] == rho["recovered_fixture_scalar"] == 3
          assert direct["linear_solution_verified"] and rho["verified"] and rho["reference_group_validation"]
          PY
          rm Cargo.lock
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-same-target:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage42_n53_same_target.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage42-build" \
            --jobs 4 \
            --timeout 1800
      - name: Run exact n53 target through direct and rho
        run: |
          python3 scripts/run_koblitz_stage42_n53_same_target.py run \
            --build "$RUNNER_TEMP/stage42-build" \
            --output "$RUNNER_TEMP/stage42-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage42_n53_same_target.py verify \
            --build "$RUNNER_TEMP/stage42-build" \
            --output "$RUNNER_TEMP/stage42-run" \
            > "$RUNNER_TEMP/stage42-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage42-n53-same-target-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage42-build
            ${{ runner.temp }}/stage42-run
            ${{ runner.temp }}/stage42-verification.json
