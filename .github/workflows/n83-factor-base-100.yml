name: N83 100-point factor-base selection panel

on:
  push:
    branches: [codex/n83-factor-base-100-20261014]
    paths:
      - .github/workflows/n83-factor-base-100.yml
      - research/n83_factor_base_100_20261014/**
      - examples/koblitz_orbit_dlp_fast.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-factor-base-100-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hundred-point-selection:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Freeze archived selection and reserve points
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-factor-base-100"
          python3 research/n83_factor_base_100_20261014/generate.py \
            > "$RUNNER_TEMP/n83-factor-base-100/generate.log"
          python3 research/n83_factor_base_100_20261014/generate_reserve.py \
            > "$RUNNER_TEMP/n83-factor-base-100/generate-reserve.log"
          python3 research/n83_factor_base_100_20261014/run.py --preflight \
            > "$RUNNER_TEMP/n83-factor-base-100/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-factor-base-100/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-factor-base-100/cargo-version.txt"

      - name: Build exact producer and run example tests
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-factor-base-100-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-factor-base-100/example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-factor-base-100/build.log" 2>&1

      - name: Run bounded 100-point selection arms
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-factor-base-100-target"
          python3 research/n83_factor_base_100_20261014/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --output "$RUNNER_TEMP/n83-factor-base-100/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-factor-base-100/run.log"

      - name: Independently replay complete bases and all targets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-factor-base-100/results" ]; then
            python3 research/n83_factor_base_100_20261014/verify.py \
              "$RUNNER_TEMP/n83-factor-base-100/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-factor-base-100/verify.log"
          fi

      - name: Preserve raw receipts and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-factor-base-100-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-factor-base-100/
          if-no-files-found: error
          retention-days: 14
