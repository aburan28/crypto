name: ECC2K130 point-sum frozen-Q cold CPU panel

on:
  pull_request:
    paths:
      - .github/workflows/ecc2k130-point-sum-cold.yml
      - research/notes/ecc2k130/point_sum_cold_20260930/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            examples/koblitz_orbit_dlp_s3_batch.rs
            examples/koblitz_rho_batch_ks_v3.rs
            research/notes/ecc2k130/compact_ir_ledger_20260930/run_panel.py
            research/notes/ecc2k130/compact_k_boundary_20260929
            research/notes/ecc2k130/compact_orbit_point_panel_20260929
            research/notes/ecc2k130/compact_orbit_rank_evidence_20260929/verify_rank.py
            research/notes/ecc2k130/compact_orbit_strong_rho_20260929
            research/notes/ecc2k130/compact_s3_batch_20260929
            research/notes/ecc2k130/compact_s3_prefilter_20260930
            research/notes/ecc2k130/compact_swap_quotient_20260929
            research/notes/ecc2k130/point_sum_cold_20260930
            research/sat_factor_base_review_20260908/autolab_orbit_extract_20260924/independent_replay.py
            tools/isolated_bench.py
      - name: Replay the frozen inputs and check runner syntax
        run: |
          mkdir -p "$RUNNER_TEMP/point-sum-cold"
          python3 -m py_compile research/notes/ecc2k130/point_sum_cold_20260930/*.py
          python3 research/notes/ecc2k130/point_sum_cold_20260930/verify_frozen.py \
            | tee "$RUNNER_TEMP/point-sum-cold/input_replay.json"
          python3 -c 'import sys; sys.path.insert(0,"research/notes/ecc2k130/point_sum_cold_20260930"); from run_cold import checked_spec,schedule; [schedule(checked_spec(c)["blocks"],"measure") for c in ("n37_L1","n37_L1024","n41_L1","n41_L1024","n53_L1","n53_L1024")]'
      - name: Rehash and replay all final local smoke traces on Linux
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, tarfile
          root = Path('research/notes/ecc2k130/point_sum_cold_20260930')
          archive = root / 'LOCAL_SMOKE.tar.gz'
          manifest = json.loads((root / 'LOCAL_SMOKE_FILES.json').read_text())
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == manifest['archive_sha256']
          dest = Path(os.environ['RUNNER_TEMP']) / 'point-sum-cold' / 'local-smoke'
          dest.mkdir(parents=True)
          with tarfile.open(archive, 'r:gz') as raw:
              assert set(raw.getnames()) == set(manifest['files'])
              for member in raw:
                  assert len(Path(member.name).parts) == 2 and member.isfile()
                  data = raw.extractfile(member).read()
                  expected = manifest['files'][member.name]
                  assert len(data) == expected['bytes']
                  assert hashlib.sha256(data).hexdigest() == expected['sha256']
                  target = dest / member.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          PY
          for CELL_AND_DIR in n37_L1:n37_L1_v2 n41_L1024:n41_L1024 n53_L1024:n53_L1024; do
            CELL="${CELL_AND_DIR%%:*}"
            DIR="${CELL_AND_DIR#*:}"
            python3 research/notes/ecc2k130/point_sum_cold_20260930/verify_cold.py \
              --cell "$CELL" --relocated \
              --run-dir "$RUNNER_TEMP/point-sum-cold/local-smoke/$DIR" \
              --out "$RUNNER_TEMP/point-sum-cold/local-smoke/$DIR/hosted_replay.json"
          done
      - uses: actions/checkout@v4
        with:
          ref: d8d67d3b683334db105195b0fc74d8e660dc4b5e
          path: frozen-src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Cargo.toml
            docs/ic/calibration.json
            src
            examples/koblitz_orbit_dlp_s3_batch.rs
            examples/koblitz_rho_batch_ks_v3.rs
      - name: Build exact merged source with frozen lock
        run: |
          set -euo pipefail
          test "$(git -C frozen-src rev-parse HEAD)" = d8d67d3b683334db105195b0fc74d8e660dc4b5e
          cp research/notes/ecc2k130/point_sum_cold_20260930/CARGO_LOCK_SNAPSHOT.txt frozen-src/Cargo.lock
          cargo build --manifest-path frozen-src/Cargo.toml --release --locked \
            --example koblitz_orbit_dlp_s3_batch --example koblitz_rho_batch_ks_v3 \
            2>&1 | tee "$RUNNER_TEMP/point-sum-cold/build.log"
      - name: One-arm native smoke and independent replay
        run: |
          python3 research/notes/ecc2k130/point_sum_cold_20260930/run_cold.py \
            --cell n37_L1 --mode smoke --source-root frozen-src \
            --compact frozen-src/target/release/examples/koblitz_orbit_dlp_s3_batch \
            --rho frozen-src/target/release/examples/koblitz_rho_batch_ks_v3 \
            --out "$RUNNER_TEMP/point-sum-cold/n37_L1_smoke"
          python3 research/notes/ecc2k130/point_sum_cold_20260930/verify_cold.py \
            --cell n37_L1 --run-dir "$RUNNER_TEMP/point-sum-cold/n37_L1_smoke" \
            --out "$RUNNER_TEMP/point-sum-cold/n37_L1_smoke/receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: point-sum-cold-validation
          path: ${{ runner.temp }}/point-sum-cold
          if-no-files-found: warn
          retention-days: 90

  measure:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cell: [n37_L1, n37_L1024, n41_L1, n41_L1024, n53_L1, n53_L1024]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            examples/koblitz_orbit_dlp_s3_batch.rs
            examples/koblitz_rho_batch_ks_v3.rs
            research/notes/ecc2k130/compact_ir_ledger_20260930/run_panel.py
            research/notes/ecc2k130/compact_k_boundary_20260929
            research/notes/ecc2k130/compact_orbit_point_panel_20260929
            research/notes/ecc2k130/compact_orbit_rank_evidence_20260929/verify_rank.py
            research/notes/ecc2k130/compact_orbit_strong_rho_20260929
            research/notes/ecc2k130/compact_s3_batch_20260929
            research/notes/ecc2k130/compact_s3_prefilter_20260930
            research/notes/ecc2k130/compact_swap_quotient_20260929
            research/notes/ecc2k130/point_sum_cold_20260930
            research/sat_factor_base_review_20260908/autolab_orbit_extract_20260924/independent_replay.py
            tools/isolated_bench.py
      - uses: actions/checkout@v4
        with:
          ref: d8d67d3b683334db105195b0fc74d8e660dc4b5e
          path: frozen-src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Cargo.toml
            docs/ic/calibration.json
            src
            examples/koblitz_orbit_dlp_s3_batch.rs
            examples/koblitz_rho_batch_ks_v3.rs
      - name: Build exact merged source with frozen lock
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/point-sum-cold"
          test "$(git -C frozen-src rev-parse HEAD)" = d8d67d3b683334db105195b0fc74d8e660dc4b5e
          cp research/notes/ecc2k130/point_sum_cold_20260930/CARGO_LOCK_SNAPSHOT.txt frozen-src/Cargo.lock
          cargo build --manifest-path frozen-src/Cargo.toml --release --locked \
            --example koblitz_orbit_dlp_s3_batch --example koblitz_rho_batch_ks_v3 \
            2>&1 | tee "$RUNNER_TEMP/point-sum-cold/build.log"
      - name: Run fixed cold blocks under reserved-core monitor
        id: run
        run: |
          set -euo pipefail
          CPU=$(python3 -c 'import os; print(sorted(os.sched_getaffinity(0))[-1])')
          CPUS=$(cat "/sys/devices/system/cpu/cpu${CPU}/topology/thread_siblings_list")
          PARENT="$RUNNER_TEMP/point-sum-cold"
          RUN_DIR="$PARENT/${{ matrix.cell }}"
          STATUS=1
          for ATTEMPT in 1 2 3 4 5 6; do
            sleep 20
            LOG="$PARENT/${{ matrix.cell }}_preflight_${ATTEMPT}.log"
            set +e
            python3 tools/isolated_bench.py reserve --cpus "$CPUS" --max-psi 5 \
              --out "$PARENT/${{ matrix.cell }}.isolation.jsonl" \
              --label "point-sum-cold-${{ matrix.cell }}" -- \
              python3 research/notes/ecc2k130/point_sum_cold_20260930/run_cold.py \
                --cell "${{ matrix.cell }}" --mode measure \
                --source-root frozen-src \
                --compact frozen-src/target/release/examples/koblitz_orbit_dlp_s3_batch \
                --rho frozen-src/target/release/examples/koblitz_rho_batch_ks_v3 \
                --out "$RUN_DIR" --cpu "$CPU" > "$LOG" 2>&1
            STATUS=$?
            set -e
            cat "$LOG"
            if [ "$STATUS" -eq 0 ] || [ -d "$RUN_DIR" ]; then
              break
            fi
            if ! grep -q '^machine is busy:' "$LOG"; then
              break
            fi
          done
          mkdir -p "$RUN_DIR"
          if [ -f "$PARENT/${{ matrix.cell }}.isolation.jsonl" ]; then
            cp "$PARENT/${{ matrix.cell }}.isolation.jsonl" "$RUN_DIR/isolation.jsonl"
          fi
          cp "$PARENT"/${{ matrix.cell }}_preflight_*.log "$RUN_DIR/"
          exit "$STATUS"
      - name: Independently replay all completed rank and point logs
        if: always() && steps.run.outcome != 'skipped'
        run: |
          python3 research/notes/ecc2k130/point_sum_cold_20260930/verify_cold.py \
            --cell "${{ matrix.cell }}" \
            --run-dir "$RUNNER_TEMP/point-sum-cold/${{ matrix.cell }}" \
            --out "$RUNNER_TEMP/point-sum-cold/${{ matrix.cell }}/receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: point-sum-cold-${{ matrix.cell }}
          path: ${{ runner.temp }}/point-sum-cold
          if-no-files-found: warn
          retention-days: 90
