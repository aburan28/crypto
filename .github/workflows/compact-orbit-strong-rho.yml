name: Compact-orbit strong rho cold point panel
on:
  pull_request:
    paths:
      - '.github/workflows/compact-orbit-strong-rho.yml'
      - 'examples/koblitz_rho_batch_ks_v3.rs'
      - 'examples/koblitz_rho_batch_ks_v2_n61.rs'
      - 'examples/koblitz_orbit_dlp_fast.rs'
      - 'research/notes/ecc2k130/compact_orbit_strong_rho_20260929/**'
      - 'research/notes/ecc2k130/compact_orbit_point_panel_20260929/run_panel.py'
      - 'research/notes/ecc2k130/compact_orbit_point_panel_20260929/verify_panel.py'
      - 'research/notes/ecc2k130/compact_orbit_rank_evidence_20260929/verify_rank.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-orbit-strong-rho.yml'
      - 'examples/koblitz_rho_batch_ks_v3.rs'
      - 'research/notes/ecc2k130/compact_orbit_strong_rho_20260929/**'
  workflow_dispatch:

jobs:
  point-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Cargo.toml
            docs/ic/calibration.json
            src
            examples/koblitz_rho_batch_ks_v3.rs
            research/notes/ecc2k130/compact_shared_log_20260925/Cargo.lock
            research/notes/ecc2k130/compact_orbit_point_panel_20260929/test_point_mode.py
      - run: cp research/notes/ecc2k130/compact_shared_log_20260925/Cargo.lock Cargo.lock
      - run: cargo build --release --locked --example koblitz_rho_batch_ks_v3
      - run: cargo test --release --locked --example koblitz_rho_batch_ks_v3
      - run: python3 research/notes/ecc2k130/compact_orbit_point_panel_20260929/test_point_mode.py target/release/examples/koblitz_rho_batch_ks_v3

  paired-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        n: [37, 41, 53]
        L: [1, 1024]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Cargo.toml
            docs/ic/calibration.json
            src
            examples/koblitz_orbit_dlp_fast.rs
            examples/koblitz_rho_batch_ks_v2_n61.rs
            examples/koblitz_rho_batch_ks_v3.rs
            research/notes/ecc2k130/compact_shared_log_20260925/Cargo.lock
            research/notes/ecc2k130/compact_orbit_rank_evidence_20260929/verify_rank.py
            research/sat_factor_base_review_20260908/autolab_orbit_extract_20260924/independent_replay.py
            research/notes/ecc2k130/compact_orbit_point_panel_20260929/run_panel.py
            research/notes/ecc2k130/compact_orbit_point_panel_20260929/verify_panel.py
            research/notes/ecc2k130/compact_orbit_point_panel_20260929/test_point_mode.py
            research/notes/ecc2k130/compact_orbit_strong_rho_20260929
            .github/workflows/compact-orbit-strong-rho.yml
      - run: cp research/notes/ecc2k130/compact_shared_log_20260925/Cargo.lock Cargo.lock
      - run: cargo build --release --locked --example koblitz_rho_batch_ks_v2_n61 --example koblitz_rho_batch_ks_v3 --example koblitz_orbit_dlp_fast
      - name: Run four alternating cold arms on the same public points
        id: run
        run: |
          python3 research/notes/ecc2k130/compact_orbit_strong_rho_20260929/run_panel.py \
            --n ${{ matrix.n }} --L ${{ matrix.L }} \
            --rho-v2 target/release/examples/koblitz_rho_batch_ks_v2_n61 \
            --rho-v3 target/release/examples/koblitz_rho_batch_ks_v3 \
            --ic target/release/examples/koblitz_orbit_dlp_fast \
            --out "${{ runner.temp }}/strong-rho/n${{ matrix.n }}_L${{ matrix.L }}"
      - name: Independently replay every full-rank and public-point answer
        if: always() && steps.run.outcome != 'skipped'
        run: |
          python3 research/notes/ecc2k130/compact_orbit_strong_rho_20260929/verify_panel.py \
            --n ${{ matrix.n }} --L ${{ matrix.L }} \
            --run-dir "${{ runner.temp }}/strong-rho/n${{ matrix.n }}_L${{ matrix.L }}" \
            --out "${{ runner.temp }}/strong-rho/n${{ matrix.n }}_L${{ matrix.L }}/receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-strong-rho-n${{ matrix.n }}-L${{ matrix.L }}
          path: ${{ runner.temp }}/strong-rho/n${{ matrix.n }}_L${{ matrix.L }}
          if-no-files-found: warn
          retention-days: 90
