name: Koblitz Stage 79 n53 specialized pair batch

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage79_specialized_pair_batch.py"
      - ".github/workflows/koblitz-stage79-specialized-pair-batch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate specialized pair-batch controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage79_specialized_pair_batch.py
          python3 scripts/run_koblitz_stage79_specialized_pair_batch.py self-test
          cargo test --release --example koblitz_rank_fixture
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-specialized-pair-batch:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage79_specialized_pair_batch.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage79-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare generic batch, specialized batch, and rho
        run: |
          python3 scripts/run_koblitz_stage79_specialized_pair_batch.py run \
            --build "$RUNNER_TEMP/stage79-build" \
            --output "$RUNNER_TEMP/stage79-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage79_specialized_pair_batch.py verify \
            --build "$RUNNER_TEMP/stage79-build" \
            --output "$RUNNER_TEMP/stage79-run" \
            > "$RUNNER_TEMP/stage79-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage79-specialized-pair-batch-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage79-build
            ${{ runner.temp }}/stage79-run
            ${{ runner.temp }}/stage79-verification.json
