name: Koblitz Stage 162 historical gate audit

on:
  pull_request:
    paths:
      - "docs/index-calculus-scoreboard.html"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-161-current-gate-audit-20260923/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-162-grouped-pair-selection-20260923/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-162-pair-selection-verification.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-162-current-gate-audit-20260923/**"
      - "scripts/compose_koblitz_stage161_gate_audit.py"
      - "scripts/compose_koblitz_stage162_gate_audit.py"
      - "scripts/verify_koblitz_stage162_pair_selection.py"
      - ".github/workflows/koblitz-stage162-current-gate-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify historical Stage 161 and Stage 162
        run: |
          python3 -m py_compile \
            scripts/compose_koblitz_stage161_gate_audit.py \
            scripts/compose_koblitz_stage162_gate_audit.py \
            scripts/verify_koblitz_stage162_pair_selection.py
          python3 scripts/compose_koblitz_stage161_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-161-current-gate-audit-20260923 \
            > "$RUNNER_TEMP/stage161-historical-audit.json"
          python3 scripts/verify_koblitz_stage162_pair_selection.py \
            > "$RUNNER_TEMP/stage162-result-verification.json"
          cmp "$RUNNER_TEMP/stage162-result-verification.json" \
            research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-162-pair-selection-verification.json
          python3 scripts/compose_koblitz_stage162_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-162-current-gate-audit-20260923 \
            > "$RUNNER_TEMP/stage162-current-audit.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
