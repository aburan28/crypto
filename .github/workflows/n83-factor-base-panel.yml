name: N83 secondary factor-base selection panel

on:
  push:
    branches: [codex/n83-base-panel-20261014]
    paths:
      - .github/workflows/n83-factor-base-panel.yml
      - research/n83_factor_base_panel_20261014/**
      - examples/koblitz_orbit_dlp_fast.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-factor-base-panel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  five-point-selection:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4

      - name: Freeze archived secondary targets and observe runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-factor-base-panel"
          python3 research/n83_factor_base_panel_20261014/run.py --preflight \
            > "$RUNNER_TEMP/n83-factor-base-panel/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-factor-base-panel/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-factor-base-panel/cargo-version.txt"

      - name: Build exact producer and run example tests
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-factor-base-cargo-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-factor-base-panel/example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-factor-base-panel/build.log" 2>&1

      - name: Run bounded five-point selection arms
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-factor-base-cargo-target"
          python3 research/n83_factor_base_panel_20261014/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --output "$RUNNER_TEMP/n83-factor-base-panel/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-factor-base-panel/run.log"

      - name: Independently replay all completed bases and targets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-factor-base-panel/results" ]; then
            python3 research/n83_factor_base_panel_20261014/verify.py \
              "$RUNNER_TEMP/n83-factor-base-panel/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-factor-base-panel/verify.log"
          fi

      - name: Preserve all raw receipts and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-factor-base-panel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-factor-base-panel/
          if-no-files-found: error
          retention-days: 14
