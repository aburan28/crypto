name: N83 one-point online factor-base range screen

on:
  push:
    branches: [codex/n83-online-range-20261016]
    paths:
      - .github/workflows/n83-online-range.yml
      - research/n83_online_range_20261016/PROTOCOL.md
      - research/n83_online_range_20261016/run.py
      - research/n83_online_range_20261016/verify.py
      - research/n83_online_range_20261016/OnlineRangeCapacity.lean
      - research/n83_online_range_20261016/PROOF_MAP.md
      - research/n83_online_range_20261016/lean-toolchain
      - research/n83_online_range_20261016/proof_check.log
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-online-range-${{ github.ref }}
  cancel-in-progress: false

jobs:
  one-point-online-screen:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen source, point and arm order
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          mkdir -p "$RUNNER_TEMP/n83-online-range/bin"
          python3 research/n83_online_range_20261016/run.py --preflight > \
            "$RUNNER_TEMP/n83-online-range/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-online-range/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-online-range/cargo-version.txt"

      - name: Build and test exact IC and same-point rho producers
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-online-range-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-online-range/ic-example-tests.log" 2>&1
          cargo test --release --locked --example n83_rho_optimization_eval > \
            "$RUNNER_TEMP/n83-online-range/rho-example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > \
            "$RUNNER_TEMP/n83-online-range/ic-build.log" 2>&1
          cargo build --release --locked --example n83_rho_optimization_eval > \
            "$RUNNER_TEMP/n83-online-range/rho-build.log" 2>&1
          cp "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            "$RUNNER_TEMP/n83-online-range/bin/koblitz_orbit_dlp_fast"
          cp "$CARGO_TARGET_DIR/release/examples/n83_rho_optimization_eval" \
            "$RUNNER_TEMP/n83-online-range/bin/n83_rho_optimization_eval"

      - name: Run bounded one-point online K range and same-point rho
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_online_range_20261016/run.py \
            --binary "$RUNNER_TEMP/n83-online-range/bin/koblitz_orbit_dlp_fast" \
            --rho-binary "$RUNNER_TEMP/n83-online-range/bin/n83_rho_optimization_eval" \
            --output "$RUNNER_TEMP/n83-online-range/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-online-range/run.log"

      - name: Independently replay bases, target relations and rho scalar
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          if [ -d "$RUNNER_TEMP/n83-online-range/results" ]; then
            python3 research/n83_online_range_20261016/verify.py \
              "$RUNNER_TEMP/n83-online-range/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-online-range/verify.log"
          fi

      - name: Preserve every raw row and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-online-range-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-online-range/
          if-no-files-found: error
          retention-days: 14

  proof-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache the pinned Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: ${{ runner.os }}-n83-online-range-lean-${{ hashFiles('research/n83_online_range_20261016/lean-toolchain') }}
      - name: Check capacity declarations and axioms
        shell: bash
        working-directory: research/n83_online_range_20261016
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lean OnlineRangeCapacity.lean > /tmp/n83-online-range-proof-check.log
          diff -u proof_check.log /tmp/n83-online-range-proof-check.log
          if rg -n '\b(sorry|admit|sorryAx)\b' OnlineRangeCapacity.lean; then
            exit 1
          fi
