name: N83 root11 high-K sealed result replay

on:
  push:
    branches: [codex/n83-final-tournament-20261015]
    paths:
      - .github/workflows/n83-root11-highk-results.yml
      - research/n83_root11_highk_results_20261015/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: n83-root11-highk-results-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eight-arm-sealed-replay:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore the exact executed source and regenerate public points
        shell: bash
        run: |
          set -euo pipefail
          frozen=e66475a416dead205ec797ca16f025abcea34d16
          git fetch --no-tags --depth=1 origin "$frozen"
          test "$(git rev-parse FETCH_HEAD)" = "$frozen"
          git worktree add --detach "$RUNNER_TEMP/n83-frozen-source" "$frozen"
          cd "$RUNNER_TEMP/n83-frozen-source"
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k_abba_20261015/generate.py > /dev/null
          python3 research/n83_root4_highk_20261015/generate.py > /dev/null
          python3 research/n83_best_e2e_20261015/generate.py > /dev/null
          python3 research/n83_legacy_challenger_20261015/generate.py > /dev/null
          python3 research/n83_root4_bloom_20261015/generate.py > /dev/null
          python3 research/n83_root11_highk_20261015/generate.py > \
            "$RUNNER_TEMP/n83-root11-highk-fixture.json"
          test "$(sha256sum research/n83_root11_highk_20261015/targets.jsonl | cut -d' ' -f1)" = \
            fec0ad0c82b0608bbc7fdf4b9b29ba47e2c4761124e80ac7827d7e4260e78b42
          test "$(sha256sum research/n83_root11_highk_20261015/answers.jsonl | cut -d' ' -f1)" = \
            45affe3da0cafb3f98a7b4be25da82779985258c8283a5241128e44ad12754c3
          cp research/n83_root11_highk_20261015/targets.jsonl \
            "$GITHUB_WORKSPACE/research/n83_root11_highk_20261015/targets.jsonl"
          cp research/n83_root11_highk_20261015/answers.jsonl \
            "$GITHUB_WORKSPACE/research/n83_root11_highk_20261015/answers.jsonl"

      - name: Download and hash the exact completed artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-root11-highk-sealed"
          gh api repos/aburan28/crypto/actions/artifacts/12000855288/zip > \
            "$RUNNER_TEMP/n83-root11-highk-sealed/raw.zip"
          test "$(sha256sum "$RUNNER_TEMP/n83-root11-highk-sealed/raw.zip" | cut -d' ' -f1)" = \
            dce8c2bf021d3058bc9b5fc61a4be6cbac4fdaa06b40ab9b178924ccca853ad8
          unzip -q "$RUNNER_TEMP/n83-root11-highk-sealed/raw.zip" -d \
            "$RUNNER_TEMP/n83-root11-highk-sealed/raw"
          test "$(sha256sum "$RUNNER_TEMP/n83-root11-highk-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            f5547c4516c9ea29965fe624d677f8677222b0d02918684691dcf92746360fec

      - name: Independently replay eight bases and all 8000 target records
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 "$RUNNER_TEMP/n83-frozen-source/research/n83_root11_highk_20261015/verify.py" \
            "$RUNNER_TEMP/n83-root11-highk-sealed/raw/results" > \
            "$RUNNER_TEMP/n83-root11-highk-sealed/local-replay.json"
          test "$(sha256sum "$RUNNER_TEMP/n83-root11-highk-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            f5547c4516c9ea29965fe624d677f8677222b0d02918684691dcf92746360fec

      - name: Reproduce current-head candidate and measurement records
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_root11_highk_results_20261015/materialize.py \
            --artifact-zip "$RUNNER_TEMP/n83-root11-highk-sealed/raw.zip" \
            "$RUNNER_TEMP/n83-root11-highk-sealed/raw/results"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Preserve replay output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-root11-highk-sealed-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-root11-highk-sealed/local-replay.json
          if-no-files-found: ignore
          retention-days: 14
