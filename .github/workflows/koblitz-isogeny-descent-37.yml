name: Koblitz degree-73 descent at 2^37

on:
  pull_request:
    paths:
      - "research/koblitz_isogeny_descent_37_20260925/**"
      - "research/toy_f5_neighbors_20260924/matrix.py"
      - ".github/workflows/koblitz-isogeny-descent-37.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-isogeny-and-matched-stage:
    runs-on: ubuntu-latest
    container: sagemath/sagemath:10.6
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Construct map and run frozen comparison
        run: |
          sage -python research/koblitz_isogeny_descent_37_20260925/experiment.py \
            --output "$RUNNER_TEMP/koblitz-37-run"
      - name: Verify saved evidence
        run: |
          python3 research/koblitz_isogeny_descent_37_20260925/verify.py \
            "$RUNNER_TEMP/koblitz-37-run"
      - name: Retain raw run and summary
        uses: actions/upload-artifact@v4
        with:
          name: koblitz-isogeny-descent-37
          path: |
            ${{ runner.temp }}/koblitz-37-run/raw.json.gz
            ${{ runner.temp }}/koblitz-37-run/summary.json
          retention-days: 90
