name: Koblitz Stage 132 current gate audit

on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay Stage 131 historical audit and Stage 132 current audit
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage131_gate_audit.py scripts/compose_koblitz_stage132_gate_audit.py
          python3 -m json.tool docs/ic/runs/koblitz-n59-standard-cap-20260921.json >/dev/null
          python3 -m json.tool docs/ic/params/k1n59-standard-l9-m3-cap-public-59001.json >/dev/null
          python3 scripts/compose_koblitz_stage131_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-131-current-gate-audit-20260921 > "$RUNNER_TEMP/stage131-historical.json"
          python3 scripts/compose_koblitz_stage132_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-132-current-gate-audit-20260921 > "$RUNNER_TEMP/stage132-current.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
