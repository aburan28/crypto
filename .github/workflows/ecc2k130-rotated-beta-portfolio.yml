name: ECC2K130 rotated beta portfolio

on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen source and reference preflight
        run: python3 research/notes/ecc2k130/rotated_beta_portfolio_20260925/ci_replay.py
      - name: Independent evidence replay when committed
        shell: bash
        run: |
          if test -f research/notes/ecc2k130/rotated_beta_portfolio_20260925/evidence/receipt.json; then
            python3 research/notes/ecc2k130/rotated_beta_portfolio_20260925/ci_replay.py --evidence research/notes/ecc2k130/rotated_beta_portfolio_20260925/evidence
          fi
