name: N83 Sparse plus Bloom K3300 five fresh Tier 1 IC versus rho pairs

on:
  push:
    branches: [codex/n83-tier1-combined-20261015]
    paths:
      - .github/workflows/n83-tier1-combined.yml
      - research/n83_tier1_combined_20261015/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-tier1-combined-${{ github.ref }}
  cancel-in-progress: false

jobs:
  five-fresh-pairs:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4

      - name: Freeze combined candidate, unseen public points and allocation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-tier1-combined"
          python3 research/n83_tier1_combined_20261015/generate.py > \
            "$RUNNER_TEMP/n83-tier1-combined/fixture-check.json"
          python3 research/n83_tier1_combined_20261015/run.py --preflight > \
            "$RUNNER_TEMP/n83-tier1-combined/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-tier1-combined/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-tier1-combined/cargo-version.txt"

      - name: Build and test exact IC and strong-rho workers
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-tier1-combined-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast \
            > "$RUNNER_TEMP/n83-tier1-combined/ic-example-tests.log" 2>&1
          cargo test --release --locked --example n83_rho_optimization_eval \
            > "$RUNNER_TEMP/n83-tier1-combined/rho-example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast \
            --example n83_rho_optimization_eval \
            > "$RUNNER_TEMP/n83-tier1-combined/build.log" 2>&1

      - name: Run five alternating same-point combined IC and rho pairs
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-tier1-combined-target"
          python3 research/n83_tier1_combined_20261015/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --rho-binary "$CARGO_TARGET_DIR/release/examples/n83_rho_optimization_eval" \
            --output "$RUNNER_TEMP/n83-tier1-combined/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-tier1-combined/run.log"

      - name: Independently replay answers and Tier 1 noise gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-tier1-combined/results" ]; then
            python3 research/n83_tier1_combined_20261015/verify.py \
              "$RUNNER_TEMP/n83-tier1-combined/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-tier1-combined/verify.log"
          fi

      - name: Preserve every raw pair and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-tier1-combined-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-tier1-combined/
          if-no-files-found: error
          retention-days: 14
