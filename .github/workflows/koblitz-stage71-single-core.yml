name: Koblitz Stage 71 n53 single core

on:
  pull_request:
    paths:
      - "scripts/run_koblitz_stage71_single_core.py"
      - ".github/workflows/koblitz-stage71-single-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate single-core controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage71_single_core.py
          python3 scripts/run_koblitz_stage71_single_core.py self-test
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-single-core:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage71_single_core.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage71-build" \
            --jobs 4 \
            --timeout 1800
      - name: Run direct and rho under inherited one-CPU affinity
        run: |
          python3 scripts/run_koblitz_stage71_single_core.py run \
            --build "$RUNNER_TEMP/stage71-build" \
            --output "$RUNNER_TEMP/stage71-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage71_single_core.py verify \
            --build "$RUNNER_TEMP/stage71-build" \
            --output "$RUNNER_TEMP/stage71-run" \
            > "$RUNNER_TEMP/stage71-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage71-single-core-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage71-build
            ${{ runner.temp }}/stage71-run
            ${{ runner.temp }}/stage71-verification.json
