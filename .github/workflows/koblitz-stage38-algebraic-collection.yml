name: Koblitz Stage 38 algebraic collection windows

on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate windowed witnesses, work units, and retained charges
        run: |
          python3 -m py_compile scripts/run_koblitz_stage38_collection_window.py
          python3 -m py_compile scripts/verify_koblitz_stage38_result.py
          python3 scripts/run_koblitz_stage38_collection_window.py self-test
          python3 scripts/verify_koblitz_stage38_result.py > /tmp/stage38-result-verification.json
          cp research/weil_factor_composition_20260914/validation/dependencies.lock.txt Cargo.lock
          RUSTFLAGS=-Awarnings cargo test --locked --lib window -- --test-threads=1
          RUSTFLAGS=-Awarnings cargo test --locked --lib \
            the_single_word_orbit_map_agrees_with_the_general_one -- --test-threads=1
          RUSTFLAGS=-Awarnings cargo test --locked --lib \
            walked_work_units_partition_the_probe_sequence_exactly -- --test-threads=1
          RUSTFLAGS=-Awarnings cargo test --locked --test ic_framework \
            workflow_runs_in_stages_and_resumes_without_redoing_work -- --exact
          rm Cargo.lock
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  collection-window-sweep:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean dependency acquisition and four-core build
        run: |
          python3 scripts/run_koblitz_stage38_collection_window.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage38-build" \
            --jobs 4 \
            --timeout 3000
      - name: Sweep six collection windows on one CPU
        run: |
          python3 scripts/run_koblitz_stage38_collection_window.py run \
            --build "$RUNNER_TEMP/stage38-build" \
            --output "$RUNNER_TEMP/stage38-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage38_collection_window.py verify \
            --build "$RUNNER_TEMP/stage38-build" \
            --output "$RUNNER_TEMP/stage38-run" \
            > "$RUNNER_TEMP/stage38-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage38-algebraic-collection-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage38-build
            ${{ runner.temp }}/stage38-run
            ${{ runner.temp }}/stage38-verification.json
