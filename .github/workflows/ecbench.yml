name: ecbench
# The native ECDLP measurement harness (docs/ecbench/README.md).
#
# Unit and integration tests run on every change.  Then a real session
# runs on Linux as root, so the paths a laptop cannot exercise are
# exercised here: whole-core reservation, eviction, pinning between fork
# and exec, the kernel's tick, steal and PSI counters, and the grading
# that reads them.  The job requires every measured child to report the
# run CPU as its whole affinity mask and to start and finish on it, and
# the audit's replays to reproduce exactly.  A hosted runner is a shared
# VM, so its records are expected to stop at L1 (steal and frequency are
# outside a guest's control); the job checks the machinery, never the
# numbers.
#
# PRs validate every historical session hash/seal/answer without rerunning
# expensive historical solvers. Fresh smoke sessions replay eight runs.
# The weekly/manual lane retains exhaustive all-run replay and historical
# independent-receipt/claim reconstruction. PR correctness receipts
# are CI diagnostics, never full independent-replay certificates for claims.
#
# Committed evidence sessions (research/ecbench_*/sessions, the binary-curve
# comparison, and the n37 compact-orbit note sessions below) are re-audited
# in the weekly/manual lane with every measured run replayed: their counts
# were recorded on another host and architecture and must reproduce here
# bit for bit, so a change that alters what a registered method counts
# fails here.  They are evidence and are never edited.
on:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "37 1 * * 0"
permissions:
  contents: read
concurrency:
  group: ecbench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rust_root: ${{ steps.scope.outputs.rust_root }}
      rust_cd: ${{ steps.scope.outputs.rust_cd }}
      rust_fmt: ${{ steps.scope.outputs.rust_fmt }}
      release_rust: ${{ steps.scope.outputs.release_rust }}
      release_native: ${{ steps.scope.outputs.release_native }}
      release_cuda: ${{ steps.scope.outputs.release_cuda }}
      ecbench_replay: ${{ steps.scope.outputs.ecbench_replay }}
      actions: ${{ steps.scope.outputs.actions }}
      c_cpp: ${{ steps.scope.outputs.c_cpp }}
      javascript: ${{ steps.scope.outputs.javascript }}
      python: ${{ steps.scope.outputs.python }}
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /src/
            /tests/
            /examples/
            /benches/
            /experiments/koblitz-s3-pair-query-20261007-v4/baseline.rs
            /experiments/koblitz-s3-pair-query-20261007-v4/candidate.rs
      - id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node .github/scripts/ci-scope.mjs

  harness:
    if: always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.ecbench_replay != 'false')
    needs: scope
    runs-on: ubuntu-24.04
    # Keep the exhaustive scientific audit's existing 300-minute budget in
    # the weekly/manual lane; ordinary PR validation is bounded at 25 minutes.
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 25 || 300 }}
    steps:
      - name: Require successful scope classification
        if: needs.scope.result != 'success'
        run: |
          echo '::error::CI scope or release metadata failed; refusing to skip validation.'
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 1 || 0 }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Cargo.toml
            /Cargo.lock
            /.cargo/
            /.github/scripts/
            /src/
            /tests/
            /examples/
            /benches/
            /docs/
            /experiments/koblitz-s3-pair-query-20261007-v4/baseline.rs
            /experiments/koblitz-s3-pair-query-20261007-v4/candidate.rs
            /research/ecbench_*/
            /research/ghs_curve_comparison_20261009/
            /research/notes/ecc2k130/cold_compact_orbit_ic_20261003/
            /research/notes/ecc2k130/full_rank_compact_orbit_ic_20261003/
            /research/sat_factor_base_review_20260908/autolab/
      - name: Materialize compile-time inputs without unrelated archives
        run: node .github/scripts/ci-scope.mjs --materialize
      - name: Committed sessions are evidence and are never edited
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          changed=$(git diff --name-only --no-renames --diff-filter=MDRT "$BASE" HEAD -- \
            'research/ecbench_*/sessions' \
            'research/ghs_curve_comparison_20261009/sessions' \
            'research/notes/ecc2k130/cold_compact_orbit_ic_20261003/sessions' \
            'research/notes/ecc2k130/full_rank_compact_orbit_ic_20261003/sessions')
          if [ -n "$changed" ]; then
            echo "these committed session files were modified, renamed or deleted; add a new session instead:" >&2
            echo "$changed" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ecbench
      - name: Unit tests
        run: cargo test --release --lib ecbench
      - name: Integration tests
        run: cargo test --release --test ecbench
      - name: Exact n-1 and large-prime integration tests
        run: cargo test --release --test ecbench_large_prime
      - name: Build
        run: cargo build --release --bin ecbench
      - name: Host
        run: ./target/release/ecbench host | tee -a "$GITHUB_STEP_SUMMARY"
      # Bounds are re-derivable from the sessions they name, challenges must
      # still build in their domain, and the frontier page must be the one
      # the records give (docs/bounds/README.md §8).
      - name: Bound records re-derive, challenges check, the frontier is current
        run: |
          ./target/release/ecbench bound check --root . --record docs/bounds/records/*.json
          ./target/release/ecbench challenge check --file docs/bounds/challenges/*.json
          ./target/release/ecbench frontier build --bounds docs/bounds/records \
            --out docs/bounds/frontier.json --markdown docs/bounds/FRONTIER.md --check
          {
            echo '## Frontier'
            echo
            sed -n '1,4p' docs/bounds/FRONTIER.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Independent all-run replay of the n37 shared-rank session
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          mkdir -p "$RUNNER_TEMP/ecbench-independent"
          receipt="$RUNNER_TEMP/ecbench-independent/n37-shared-rank-final.json"
          ./target/release/ecbench verify \
            --dir research/ecbench_n37_shared_rank_20261004/sessions/mac_arm64_l0_02 \
            --replay-all --exit-code --out "$receipt" > /dev/null
          jq -e \
            --arg session 'ECBS1h33c3e5e4f75d' \
            --arg original_class 'ECBENV2hd82681268e96' \
            --arg records_sha '8046061f5078f254627a343998b810c7e570fc9fe575f403466114e70a0b1693' \
            '.ok == true and .session_id == $session
             and .auditor_env_class_id != null
             and .auditor_env_class_id != $original_class
             and .files["records.jsonl"] == $records_sha
             and (.replays | length) == 15
             and all(.replays[]; .reproduced)' "$receipt" > /dev/null
      - name: Independent all-run replay of the n37 column sweep
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          receipt="$RUNNER_TEMP/ecbench-independent/n37-rank-columns.json"
          ./target/release/ecbench verify \
            --dir research/ecbench_n37_rank_columns_20261004/sessions/mac_arm64_l0_01 \
            --replay-all --exit-code --out "$receipt" > /dev/null
          jq -e \
            --arg session 'ECBS1h9a1d373bbe54' \
            --arg original_class 'ECBENV2hd82681268e96' \
            --arg records_sha '82c8b31640074b2f829d88e546bf487ee4b598edf4ef26f779984d625ed7de3c' \
            '.ok == true and .session_id == $session
             and .session_status == "complete"
             and .auditor_env_class_id != null
             and .auditor_env_class_id != $original_class
             and .files["records.jsonl"] == $records_sha
             and .records == 384 and .verified_records == 384
             and (.replays | length) == 320
             and all(.replays[]; .reproduced)' "$receipt" > /dev/null
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        with:
          name: ecbench-n37-rank-columns-independent-receipt
          path: ${{ runner.temp }}/ecbench-independent/n37-rank-columns.json
          if-no-files-found: error
      - name: Recompute the frozen n37 column decision
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          cargo build --release --locked --example n37_rank_columns_analyze
          ./target/release/examples/n37_rank_columns_analyze \
            research/ecbench_n37_rank_columns_20261004/sessions/mac_arm64_l0_01 \
            research/ecbench_n37_rank_columns_20261004/candidate_claims \
            research/ecbench_n37_rank_columns_20261004/AUDIT.json \
            research/ecbench_n37_rank_columns_20261004/independent_validation/RECEIPT.json \
            "$RUNNER_TEMP/ecbench-independent/n37-rank-columns-result.json"
          cmp "$RUNNER_TEMP/ecbench-independent/n37-rank-columns-result.json" \
            research/ecbench_n37_rank_columns_20261004/RESULT.json
      - name: Attach the independent receipt without changing the frozen claim
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          # The claim binds the measuring binary's source hashes. Build its
          # pre-instrumentation source snapshot for this historical attachment;
          # the current binary remains responsible for the subsequent checker.
          frozen="$RUNNER_TEMP/ecbench-frozen-source"
          git worktree add --detach --no-checkout "$frozen" 1d1b1fb7206aa3cfd4be9dd1953fb57d3c79b439
          git -C "$frozen" sparse-checkout set --no-cone \
            '/Cargo.toml' '/src/**' '/docs/ic/**' \
            '/docs/ecbench/**' '/docs/curves/**' '/.cargo/**'
          git -C "$frozen" checkout HEAD
          cp Cargo.lock "$frozen/Cargo.lock"
          claim=research/ecbench_n37_shared_rank_20261004/CLAIM_FINAL_DIAGNOSTIC.json
          jq -e '([.candidate_manifest.implementation.components[].role] | sort) ==
            (["ic_pipeline","ic_plugins","ic_solvers","ic_linalg","relation_loop","harness","shared_rank"] | sort)' \
            "$claim" > /dev/null
          for entry in \
            ic_pipeline:src/cryptanalysis/ic_framework/mod.rs \
            ic_plugins:src/cryptanalysis/ic_framework/plugins.rs \
            ic_solvers:src/cryptanalysis/ic_framework/solvers.rs \
            ic_linalg:src/cryptanalysis/ic_framework/linalg.rs \
            relation_loop:src/cryptanalysis/ic_boundary.rs \
            harness:src/cryptanalysis/ecbench/methods.rs \
            shared_rank:src/cryptanalysis/ic_framework/shared_rank.rs; do
            role=${entry%%:*}
            path=${entry#*:}
            expected=$(jq -r --arg role "$role" '.candidate_manifest.implementation.components[] | select(.role == $role) | .sha256' "$claim")
            actual=$(sha256sum "$frozen/$path" | cut -d' ' -f1)
            test "$actual" = "$expected" || { echo "frozen source differs for $role" >&2; exit 1; }
          done
          CARGO_TARGET_DIR="$RUNNER_TEMP/ecbench-frozen-target" \
            cargo build --release --locked --manifest-path "$frozen/Cargo.toml" --bin ecbench
          frozen_ecbench="$RUNNER_TEMP/ecbench-frozen-target/release/ecbench"
          receipt=research/ecbench_n37_shared_rank_20261004/independent_validation_20261004/RECEIPT.json
          report=research/ecbench_n37_shared_rank_20261004/independent_validation_20261004/CLAIM_INDEPENDENT_DIAGNOSTIC.json
          check=research/ecbench_n37_shared_rank_20261004/independent_validation_20261004/CHECK.json
          attach=("$frozen_ecbench" claim attach
            --dir research/ecbench_n37_shared_rank_20261004/sessions/mac_arm64_l0_02
            --ic ic-shared --rho rho-strong --workload W157bda94ea05
            --independent-receipt "$receipt"
            --pointer research/ecbench_n37_shared_rank_20261004/independent_validation_20261004/RECEIPT.json)
          "${attach[@]}" \
            --base-report research/ecbench_n37_shared_rank_20261004/CLAIM_FINAL_DIAGNOSTIC.json \
            --out "$RUNNER_TEMP/ecbench-independent/claim.json" --exit-code
          cmp "$RUNNER_TEMP/ecbench-independent/claim.json" "$report"
          "$frozen_ecbench" claim check --report "$report" \
            > "$RUNNER_TEMP/ecbench-independent/check-frozen.json"
          cmp "$RUNNER_TEMP/ecbench-independent/check-frozen.json" "$check"
          if ./target/release/ecbench claim check --report "$report" \
            > "$RUNNER_TEMP/ecbench-independent/check-current.json"; then
            echo 'the current checker admitted a frozen L0 wall claim' >&2
            exit 1
          fi
          jq -e '.status == "FAIL" and
            (.validation_errors | index("isolation_levels.ic L0 is below required L2") != null) and
            (.validation_errors | index("isolation_levels.rho L0 is below required L2") != null)' \
            "$RUNNER_TEMP/ecbench-independent/check-current.json" > /dev/null
          jq -e '.independent_validation == true
            and .isolation_levels.ic == "L0" and .isolation_levels.rho == "L0"
            and (.verdict | startswith("descriptive only"))' "$report" > /dev/null
          jq '.ic_online_wall_ms = 999' \
            research/ecbench_n37_shared_rank_20261004/CLAIM_FINAL_DIAGNOSTIC.json \
            > "$RUNNER_TEMP/ecbench-independent/tampered-base.json"
          if "${attach[@]}" \
            --base-report "$RUNNER_TEMP/ecbench-independent/tampered-base.json" \
            --out "$RUNNER_TEMP/ecbench-independent/tampered-claim.json"; then
            echo 'a tampered original claim was accepted' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        with:
          name: ecbench-n37-shared-rank-independent-receipt
          path: ${{ runner.temp }}/ecbench-independent/n37-shared-rank-final.json
          if-no-files-found: ignore
      - name: Pinned session as root
        run: |
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo ./target/release/ecbench run --spec docs/ecbench/specs/smoke-prime.json \
            --out "$RUNNER_TEMP/prime" --allow-busy --settle 1 --quiet
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/prime"
      - name: Pinning took effect in every measured child
        run: |
          jq -s -e '
            map(select(.isolation.run_cpu != null)) as $p
            | ($p | length) == 72
              and ($p | all(.isolation.placement.affinity == [.isolation.run_cpu]))
              and ($p | all(.isolation.placement.cpu_at_start == .isolation.run_cpu
                            and .isolation.placement.cpu_at_end == .isolation.run_cpu))
              and (map(.outcome.status) | all(. == "verified"))
          ' "$RUNNER_TEMP/prime/records.jsonl"
          {
            echo "### Levels earned on this runner"
            jq -s -r 'group_by(.isolation.level) | map("- \(.[0].isolation.level): \(length)") | .[]' "$RUNNER_TEMP/prime/records.jsonl"
            echo "### Most common blockers"
            jq -s -r '[.[].isolation.blockers[]] | group_by(sub("[0-9.]+"; "N"; "g")) | map({n: length, b: .[0]}) | sort_by(-.n) | .[:8] | map("- \(.n)× \(.b)") | .[]' "$RUNNER_TEMP/prime/records.jsonl"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Audit with replays
        run: ./target/release/ecbench verify --dir "$RUNNER_TEMP/prime" --replay 8 --exit-code --out "$RUNNER_TEMP/prime-audit.json" > /dev/null
      - name: Compare and tabulate
        run: |
          ./target/release/ecbench compare --dir "$RUNNER_TEMP/prime" --a rho-neg --b bsgs-neg | tee -a "$GITHUB_STEP_SUMMARY"
          ./target/release/ecbench compare --dir "$RUNNER_TEMP/prime" --a rho-neg --b rho-neg-aa > /dev/null
          ./target/release/ecbench table --dir "$RUNNER_TEMP/prime" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Database loads, twice, strictly
        run: |
          command -v sqlite3 >/dev/null || sudo apt-get install -y -qq sqlite3
          for _ in 1 2; do ./target/release/ecbench db sql "$RUNNER_TEMP/prime" | sqlite3 -bail "$RUNNER_TEMP/ecbench.db"; done
          test "$(sqlite3 "$RUNNER_TEMP/ecbench.db" 'select count(*) from runs')" = 72
      - name: A vs_rho claim builds, loads, and fails closed at L0
        run: |
          ./target/release/ecbench run --spec docs/ecbench/specs/claim-koblitz.json \
            --out "$RUNNER_TEMP/claim" --cpus none --lock "$RUNNER_TEMP/claim.lock" --allow-busy --settle 1 --quiet
          w=$(./target/release/ecbench plan --spec docs/ecbench/specs/claim-koblitz.json --json | jq -r '.workloads[0].workload_id')
          ./target/release/ecbench claim build --dir "$RUNNER_TEMP/claim" --ic ic --rho rho-strong \
            --workload "$w" --out "$RUNNER_TEMP/claim.json"
          # This L0 diagnostic also needs an independent replay. The native
          # checker enforces both conditions without a legacy Python verifier.
          ./target/release/ecbench claim check --report "$RUNNER_TEMP/claim.json" > "$RUNNER_TEMP/check-native.json" && exit 1 || true
          jq -e '.status == "FAIL" and .validation_errors == [
            "independent_validation must be true",
            "ic_replay_certificate_sha256 must be a full lowercase SHA-256 digest",
            "rho_replay_certificate_sha256 must be a full lowercase SHA-256 digest",
            "isolation_levels.ic L0 is below required L2",
            "isolation_levels.rho L0 is below required L2"]' "$RUNNER_TEMP/check-native.json" > /dev/null
          for _ in 1 2; do ./target/release/ecbench db sql "$RUNNER_TEMP/claim" "$RUNNER_TEMP/claim.json" | sqlite3 -bail "$RUNNER_TEMP/ecbench.db"; done
          test "$(sqlite3 "$RUNNER_TEMP/ecbench.db" 'select count(*), min(check_status) from claims')" = "1|FAIL"
          jq -r '.verdict' "$RUNNER_TEMP/claim.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Validate committed evidence integrity on pull requests
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.scope.outputs.ecbench_replay != 'false'
        timeout-minutes: 12
        run: |
          shopt -s nullglob
          sessions=(research/ecbench_*/sessions/*/
            research/ghs_curve_comparison_20261009/sessions/*/
            research/notes/ecc2k130/cold_compact_orbit_ic_20261003/sessions/*/
            research/notes/ecc2k130/full_rank_compact_orbit_ic_20261003/sessions/*/)
          test "${#sessions[@]}" -gt 0 || { echo '::error::no committed evidence sessions found'; exit 1; }
          for d in "${sessions[@]}"; do
            echo "auditing $d (all integrity checks; exhaustive replay in weekly/manual lane)"
            ./target/release/ecbench verify --dir "$d" --replay 0 --allow-interrupted --exit-code > /dev/null
          done
          echo 'PR evidence validation: every session hash/seal/answer audited. Fresh smoke sessions exercise deterministic replay; exhaustive historical replay belongs to the weekly/manual lane.' >> "$GITHUB_STEP_SUMMARY"
      - name: Committed evidence reproduces exhaustively on this host
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          shopt -s nullglob
          for d in research/ecbench_*/sessions/*/ \
            research/ghs_curve_comparison_20261009/sessions/*/ \
            research/notes/ecc2k130/cold_compact_orbit_ic_20261003/sessions/*/ \
            research/notes/ecc2k130/full_rank_compact_orbit_ic_20261003/sessions/*/; do
            echo "auditing $d"
            # An interrupted session is evidence of the interruption: every
            # integrity check applies to it, only completeness does not.
            ./target/release/ecbench verify --dir "$d" --replay-all --allow-interrupted --exit-code > /dev/null
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecbench-session
          path: |
            ${{ runner.temp }}/prime
            ${{ runner.temp }}/prime-audit.json
            ${{ runner.temp }}/claim
            ${{ runner.temp }}/claim.json
          if-no-files-found: ignore
