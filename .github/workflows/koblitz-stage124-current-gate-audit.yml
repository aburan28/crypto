name: Koblitz Stage 124 current gate audit

on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay the Stage 109 and Stage 124 historical audits (superseded by Stage 125)
        run: |
          python3 -m py_compile \
            scripts/compose_koblitz_stage109_gate_audit.py \
            scripts/compose_koblitz_stage124_gate_audit.py
          python3 -m json.tool docs/ic/boundary_targets.json >/dev/null
          python3 -m json.tool research/sat_factor_base_review_20260908/autolab/protocol.json >/dev/null
          python3 scripts/compose_koblitz_stage109_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-109-current-gate-audit-20260913 \
            > "$RUNNER_TEMP/stage109-historical-audit.json"
          python3 scripts/compose_koblitz_stage124_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-124-current-gate-audit-20260921 \
            > "$RUNNER_TEMP/stage124-audit.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
