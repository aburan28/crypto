name: Random control input validation
on:
  pull_request:
    paths:
      - 'src/cryptanalysis/koblitz_bench.rs'
      - '.github/workflows/control-input-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib control_input_
