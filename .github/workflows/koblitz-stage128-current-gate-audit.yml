name: Koblitz Stage 128 current gate audit

on:
  pull_request:
    paths:
      - "docs/ic/boundary_targets.json"
      - "docs/ic/BOUNDARY_TARGETS.md"
      - "research/sat_factor_base_review_20260908/autolab/protocol.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-109-current-gate-audit-20260913/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-124-current-gate-audit-20260921/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-125-current-gate-audit-20260921/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-126-current-gate-audit-20260921/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-127-current-gate-audit-20260921/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-128-current-gate-audit-20260922/**"
      - "scripts/compose_koblitz_stage109_gate_audit.py"
      - "scripts/compose_koblitz_stage124_gate_audit.py"
      - "scripts/compose_koblitz_stage125_gate_audit.py"
      - "scripts/compose_koblitz_stage126_gate_audit.py"
      - "scripts/compose_koblitz_stage127_gate_audit.py"
      - "scripts/compose_koblitz_stage128_gate_audit.py"
      - ".github/workflows/koblitz-stage128-current-gate-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay the Stage 109, 124, 125, 126 and 127 historical audits and the current seven-gate audit
        run: |
          python3 -m py_compile \
            scripts/compose_koblitz_stage109_gate_audit.py \
            scripts/compose_koblitz_stage124_gate_audit.py \
            scripts/compose_koblitz_stage125_gate_audit.py \
            scripts/compose_koblitz_stage126_gate_audit.py \
            scripts/compose_koblitz_stage127_gate_audit.py \
            scripts/compose_koblitz_stage128_gate_audit.py
          python3 -m json.tool docs/ic/boundary_targets.json >/dev/null
          python3 -m json.tool research/sat_factor_base_review_20260908/autolab/protocol.json >/dev/null
          python3 scripts/compose_koblitz_stage109_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-109-current-gate-audit-20260913 \
            > "$RUNNER_TEMP/stage109-historical-audit.json"
          python3 scripts/compose_koblitz_stage124_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-124-current-gate-audit-20260921 \
            > "$RUNNER_TEMP/stage124-historical-audit.json"
          python3 scripts/compose_koblitz_stage125_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-125-current-gate-audit-20260921 \
            > "$RUNNER_TEMP/stage125-historical-audit.json"
          python3 scripts/compose_koblitz_stage126_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-126-current-gate-audit-20260921 \
            > "$RUNNER_TEMP/stage126-historical-audit.json"
          python3 scripts/compose_koblitz_stage127_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-127-current-gate-audit-20260921 \
            > "$RUNNER_TEMP/stage127-historical-audit.json"
          python3 scripts/compose_koblitz_stage128_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-128-current-gate-audit-20260922 \
            > "$RUNNER_TEMP/stage128-audit.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
