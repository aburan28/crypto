name: Koblitz Stage 128 current gate audit

on:
  pull_request:
    paths:
      - "docs/ic/runs/koblitz-n41-single-target-20260921.json"
      - "docs/ic/params/k0n41-fixed-algebraic-single-public-41301.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-127-current-gate-audit-20260921/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-128-current-gate-audit-20260921/**"
      - "scripts/compose_koblitz_stage127_gate_audit.py"
      - "scripts/compose_koblitz_stage128_gate_audit.py"
      - ".github/workflows/koblitz-stage128-current-gate-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay Stage 127 historical audit and Stage 128 current audit
        run: |
          python3 -m py_compile \
            scripts/compose_koblitz_stage127_gate_audit.py \
            scripts/compose_koblitz_stage128_gate_audit.py
          python3 -m json.tool docs/ic/runs/koblitz-n41-single-target-20260921.json >/dev/null
          python3 -m json.tool docs/ic/params/k0n41-fixed-algebraic-single-public-41301.json >/dev/null
          python3 scripts/compose_koblitz_stage127_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-127-current-gate-audit-20260921 \
            > "$RUNNER_TEMP/stage127-historical-audit.json"
          python3 scripts/compose_koblitz_stage128_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-128-current-gate-audit-20260921 \
            > "$RUNNER_TEMP/stage128-current-audit.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
