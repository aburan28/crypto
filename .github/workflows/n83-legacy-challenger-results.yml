name: N83 root22 root21 challenger sealed result replay

on:
  push:
    branches: [codex/n83-final-tournament-20261015]
    paths:
      - .github/workflows/n83-legacy-challenger-results.yml
      - research/n83_legacy_challenger_results_20261015/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: n83-legacy-challenger-results-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eight-arm-sealed-replay:
    if: github.repository == 'aburan28/crypto'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore the exact executed source and regenerate public points
        shell: bash
        run: |
          set -euo pipefail
          frozen=d6293e278a037ef34a6de0101844fcfbf97703e2
          git fetch --no-tags --depth=1 origin "$frozen"
          test "$(git rev-parse FETCH_HEAD)" = "$frozen"
          git worktree add --detach "$RUNNER_TEMP/n83-frozen-source" "$frozen"
          cd "$RUNNER_TEMP/n83-frozen-source"
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_k3250_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k3350_sparse_fresh_20261015/generate.py > /dev/null
          python3 research/n83_k_abba_20261015/generate.py > /dev/null
          python3 research/n83_root4_highk_20261015/generate.py > /dev/null
          python3 research/n83_best_e2e_20261015/generate.py > /dev/null
          python3 research/n83_legacy_challenger_20261015/generate.py > \
            "$RUNNER_TEMP/n83-legacy-challenger-fixture.json"
          test "$(sha256sum research/n83_legacy_challenger_20261015/targets.jsonl | cut -d' ' -f1)" = \
            1603eea50d7ddebea7fe23d6c3ba7f480736f2682bcba819f5592daa8081c884
          test "$(sha256sum research/n83_legacy_challenger_20261015/answers.jsonl | cut -d' ' -f1)" = \
            7f7c1a54562f95efbb95754190053e303a1338eca6cfd48d4339556acbca61f7
          cp research/n83_legacy_challenger_20261015/targets.jsonl \
            "$GITHUB_WORKSPACE/research/n83_legacy_challenger_20261015/targets.jsonl"
          cp research/n83_legacy_challenger_20261015/answers.jsonl \
            "$GITHUB_WORKSPACE/research/n83_legacy_challenger_20261015/answers.jsonl"

      - name: Download and hash the exact completed artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-legacy-challenger-sealed"
          gh api repos/aburan28/crypto/actions/artifacts/11997698000/zip > \
            "$RUNNER_TEMP/n83-legacy-challenger-sealed/raw.zip"
          test "$(sha256sum "$RUNNER_TEMP/n83-legacy-challenger-sealed/raw.zip" | cut -d' ' -f1)" = \
            e14fbbaff7afbc0ee0bf4cc815cce4cc5323492eed584d14f6fe9e1f92f39aad
          unzip -q "$RUNNER_TEMP/n83-legacy-challenger-sealed/raw.zip" -d \
            "$RUNNER_TEMP/n83-legacy-challenger-sealed/raw"
          test "$(sha256sum "$RUNNER_TEMP/n83-legacy-challenger-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            7d10662fe9987fd1766734188855a57f355b4244f26a815c5e065d7a93f85551

      - name: Independently replay eight bases and all 8000 target records
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 "$RUNNER_TEMP/n83-frozen-source/research/n83_legacy_challenger_20261015/verify.py" \
            "$RUNNER_TEMP/n83-legacy-challenger-sealed/raw/results" > \
            "$RUNNER_TEMP/n83-legacy-challenger-sealed/local-replay.json"
          test "$(sha256sum "$RUNNER_TEMP/n83-legacy-challenger-sealed/raw/results/analysis.json" | cut -d' ' -f1)" = \
            7d10662fe9987fd1766734188855a57f355b4244f26a815c5e065d7a93f85551

      - name: Reproduce current-head candidate and measurement records
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/n83_legacy_challenger_results_20261015/materialize.py \
            --artifact-zip "$RUNNER_TEMP/n83-legacy-challenger-sealed/raw.zip" \
            "$RUNNER_TEMP/n83-legacy-challenger-sealed/raw/results"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Preserve replay output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-legacy-challenger-sealed-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-legacy-challenger-sealed/local-replay.json
          if-no-files-found: ignore
          retention-days: 14
