name: Koblitz Stage 43 gate audit

on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify source results, boundary twins, and seven-gate audit
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage43_gate_audit.py
          python3 scripts/compose_koblitz_stage43_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-43-current-gate-audit-20260912 \
            > "$RUNNER_TEMP/stage43-verification.json"
          python3 research/sat_factor_base_review_20260908/autolab/boundary_autolab.py preflight \
            > "$RUNNER_TEMP/boundary-preflight.json"
          python3 -m json.tool docs/ic/boundary_targets.json > /dev/null
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
