name: Toy binary formula audit
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaustive bounded replay
        working-directory: research/toy_binary_formula_audit_20260924
        run: |
          python3 audit.py --output /tmp/binary-formula-replay.json
          cmp results.json /tmp/binary-formula-replay.json
      - name: Verify evidence hashes
        working-directory: research/toy_binary_formula_audit_20260924
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          receipt = json.loads(Path('receipt.json').read_text())
          for name, expected in receipt['source_input_hashes'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          PY
