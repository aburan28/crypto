name: Koblitz Stage 59 gate audit

on:
  pull_request:
    paths:
      - "docs/ic/boundary_targets.json"
      - "docs/ic/BOUNDARY_TARGETS.md"
      - "scripts/compose_koblitz_stage53_gate_audit.py"
      - "scripts/compose_koblitz_stage59_gate_audit.py"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-59-current-gate-audit-20260912/**"
      - ".github/workflows/koblitz-stage59-gate-audit.yml"

permissions:
  contents: read

jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify PCLMUL, unknown-scalar, and current audit
        run: |
          python3 -m py_compile \
            scripts/compose_koblitz_stage53_gate_audit.py \
            scripts/compose_koblitz_stage59_gate_audit.py
          python3 scripts/compose_koblitz_stage53_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-53-current-gate-audit-20260912 \
            > "$RUNNER_TEMP/stage53-historical-verification.json"
          python3 scripts/verify_koblitz_stage56_pclmul_result.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-56-n53-pclmul-result-20260912 \
            > "$RUNNER_TEMP/stage56-verification.json"
          python3 scripts/verify_koblitz_stage58_unknown_result.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-58-n53-unknown-result-20260912 \
            > "$RUNNER_TEMP/stage58-verification.json"
          python3 scripts/compose_koblitz_stage59_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-59-current-gate-audit-20260912 \
            > "$RUNNER_TEMP/stage59-verification.json"
          python3 research/sat_factor_base_review_20260908/autolab/boundary_autolab.py preflight \
            > "$RUNNER_TEMP/boundary-preflight.json"
          python3 -m json.tool docs/ic/boundary_targets.json > /dev/null
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
