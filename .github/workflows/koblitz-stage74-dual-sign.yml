name: Koblitz Stage 74 n53 dual-sign scan

on:
  pull_request:
    paths:
      - "examples/koblitz_rank_fixture.rs"
      - "scripts/run_koblitz_stage74_dual_sign.py"
      - ".github/workflows/koblitz-stage74-dual-sign.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate dual-sign scan controls
        run: |
          python3 -m py_compile scripts/run_koblitz_stage74_dual_sign.py
          python3 scripts/run_koblitz_stage74_dual_sign.py self-test
          cargo test --release --example koblitz_rank_fixture
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  n53-dual-sign:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean producer build
        run: |
          python3 scripts/run_koblitz_stage74_dual_sign.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage74-build" \
            --jobs 4 \
            --timeout 1800
      - name: Compare separate-sign scan, dual-sign scan, and rho
        run: |
          python3 scripts/run_koblitz_stage74_dual_sign.py run \
            --build "$RUNNER_TEMP/stage74-build" \
            --output "$RUNNER_TEMP/stage74-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage74_dual_sign.py verify \
            --build "$RUNNER_TEMP/stage74-build" \
            --output "$RUNNER_TEMP/stage74-run" \
            > "$RUNNER_TEMP/stage74-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage74-dual-sign-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage74-build
            ${{ runner.temp }}/stage74-run
            ${{ runner.temp }}/stage74-verification.json
