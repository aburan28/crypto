name: n53 combined L384 one-table control

on:
  pull_request:
    paths:
      - 'research/sat_factor_base_review_20260908/autolab_combined_l384_n53_20260925/**'
      - '.github/workflows/n53-combined-l384.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paired-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scripts and immutable pre-outcome source boundary
        run: |
          python3 -m py_compile research/sat_factor_base_review_20260908/autolab_combined_l384_n53_20260925/{operational,audit,run_panel,archive,verify_archive}.py
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          root = Path('research/sat_factor_base_review_20260908/autolab_combined_l384_n53_20260925')
          spec = importlib.util.spec_from_file_location('l384_verify_archive', root / 'verify_archive.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          freeze = json.loads((root / 'SOURCE_FREEZE.json').read_text())
          assert freeze['target_sha256'] == module.sha(root / 'points_L384.jsonl')
          assert freeze['protocol_sha256'] == module.sha(root / 'PROTOCOL.md')
          assert all(module.sha(path) == freeze['source_sha256'][key]
                     for key, path in module.sources().items())
          print('source-and-input-freeze PASS')
          PY
          git merge-base --is-ancestor 1909cf45577ee9e141fc1e26acf215c990db4760 HEAD
          test -z "$(git status --porcelain)"
      - name: Replay committed evidence if present
        run: |
          bundle=research/sat_factor_base_review_20260908/autolab_combined_l384_n53_20260925/evidence
          if test -f "$bundle/archive_manifest.json"; then
            python3 research/sat_factor_base_review_20260908/autolab_combined_l384_n53_20260925/verify_archive.py --bundle "$bundle"
            echo 'PANEL_ARCHIVED=1' >> "$GITHUB_ENV"
          fi
      - name: Build exact checked-out producers
        if: env.PANEL_ARCHIVED != '1'
        run: cargo build --release --example koblitz_s5_sat_instance --example koblitz_rho_batch_ks
      - name: Hash both binaries before measured children
        if: env.PANEL_ARCHIVED != '1'
        run: |
          sha256sum target/release/examples/koblitz_s5_sat_instance target/release/examples/koblitz_rho_batch_ks
          rustc --version
          cargo --version
      - name: Run frozen cold training, one-table rho and one-index IC
        if: env.PANEL_ARCHIVED != '1'
        run: python3 research/sat_factor_base_review_20260908/autolab_combined_l384_n53_20260925/run_panel.py --out /tmp/n53-combined-l384-panel
      - name: Seal all attempted outputs, including censored runs
        if: always() && env.PANEL_ARCHIVED != '1'
        run: |
          if test -d /tmp/n53-combined-l384-panel; then
            python3 research/sat_factor_base_review_20260908/autolab_combined_l384_n53_20260925/archive.py               --panel /tmp/n53-combined-l384-panel --out /tmp/n53-combined-l384-sealed
          fi
      - name: Commit immutable raw evidence to PR branch
        if: always() && github.event_name == 'pull_request' && env.PANEL_ARCHIVED != '1'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          STARTING_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! test -f /tmp/n53-combined-l384-sealed/archive_manifest.json; then exit 0; fi
          git fetch origin "$HEAD_BRANCH:refs/remotes/origin/$HEAD_BRANCH"
          test "$(git rev-parse "origin/$HEAD_BRANCH")" = "$STARTING_HEAD"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          bundle=research/sat_factor_base_review_20260908/autolab_combined_l384_n53_20260925/evidence
          mkdir -p "$bundle"
          cp /tmp/n53-combined-l384-sealed/{evidence.tar.gz,archive_manifest.json} "$bundle/"
          if test -f /tmp/n53-combined-l384-sealed/panel.json; then cp /tmp/n53-combined-l384-sealed/panel.json "$bundle/"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$bundle"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: preserve n53 combined L384 one-table panel'
          git push origin "HEAD:$HEAD_BRANCH"
      - name: Upload every attempted raw output
        if: always() && env.PANEL_ARCHIVED != '1'
        uses: actions/upload-artifact@v4
        with:
          name: n53-combined-l384-${{ github.sha }}
          path: /tmp/n53-combined-l384-panel/
          if-no-files-found: warn
          retention-days: 30
