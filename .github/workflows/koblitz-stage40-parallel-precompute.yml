name: Koblitz Stage 40 parallel precompute

on:
  pull_request:
    paths:
      - "scripts/run_koblitz_stage39_fixed_algebraic_holdout.py"
      - "scripts/run_koblitz_stage40_parallel_precompute.py"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/STAGE40_PARALLEL_PRECOMPUTE.md"
      - ".github/workflows/koblitz-stage40-parallel-precompute.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate ABBA instance, historical replay, and claim boundary
        run: |
          python3 -m py_compile scripts/run_koblitz_stage39_fixed_algebraic_holdout.py
          python3 -m py_compile scripts/run_koblitz_stage40_parallel_precompute.py
          python3 scripts/run_koblitz_stage40_parallel_precompute.py self-test
          python3 scripts/verify_koblitz_stage39_result.py > /tmp/stage39-result-verification.json
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  parallel-precompute:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Charge clean dependency acquisition and four-core build
        run: |
          python3 scripts/run_koblitz_stage40_parallel_precompute.py build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/stage40-build" \
            --jobs 4 \
            --timeout 3000
      - name: Run same-instance single/four/four/single control
        run: |
          python3 scripts/run_koblitz_stage40_parallel_precompute.py run \
            --build "$RUNNER_TEMP/stage40-build" \
            --output "$RUNNER_TEMP/stage40-run" \
            --timeout 1800
          python3 scripts/run_koblitz_stage40_parallel_precompute.py verify \
            --build "$RUNNER_TEMP/stage40-build" \
            --output "$RUNNER_TEMP/stage40-run" \
            > "$RUNNER_TEMP/stage40-verification.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: koblitz-stage40-parallel-precompute-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage40-build
            ${{ runner.temp }}/stage40-run
            ${{ runner.temp }}/stage40-verification.json
