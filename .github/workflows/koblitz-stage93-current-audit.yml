name: Koblitz Stage 93 current CPU-0 audit

on:
  pull_request:
    paths:
      - "docs/ic/BOUNDARY_TARGETS.md"
      - "docs/ic/boundary_targets.json"
      - "research/sat_factor_base_review_20260908/autolab/protocol.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/koblitz-stage91-current-single-core-evidence-34726819616.tar.gz"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/koblitz-stage91-current-single-core-evidence-34726819616.tar.gz.sha256"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-91-artifacts-34726819616.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-91-workflow-34726819616.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-92-current-single-core-20260913/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-93-current-gate-audit-20260913/**"
      - "scripts/compose_koblitz_stage90_gate_audit.py"
      - "scripts/verify_koblitz_stage92_current_single_core.py"
      - "scripts/compose_koblitz_stage93_gate_audit.py"
      - ".github/workflows/koblitz-stage93-current-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify current CPU-0 result and gate audit
        run: |
          python3 -m py_compile \
            scripts/compose_koblitz_stage90_gate_audit.py \
            scripts/verify_koblitz_stage92_current_single_core.py \
            scripts/compose_koblitz_stage93_gate_audit.py
          python3 scripts/compose_koblitz_stage90_gate_audit.py verify \
            > "$RUNNER_TEMP/stage90-historical-audit.json"
          python3 scripts/verify_koblitz_stage92_current_single_core.py verify \
            > "$RUNNER_TEMP/stage92-single-core.json"
          python3 scripts/compose_koblitz_stage93_gate_audit.py verify \
            > "$RUNNER_TEMP/stage93-audit.json"
          cd research/sat_factor_base_review_20260908/autolab
          python3 -m unittest test_boundary_autolab.py
          python3 boundary_autolab.py preflight > "$RUNNER_TEMP/autolab-preflight.json"
          cd "$GITHUB_WORKSPACE"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
