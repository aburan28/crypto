name: Koblitz Stage 93 current CPU-0 audit

on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify current CPU-0 result and gate audit
        run: |
          python3 -m py_compile \
            scripts/compose_koblitz_stage90_gate_audit.py \
            scripts/verify_koblitz_stage92_current_single_core.py \
            scripts/compose_koblitz_stage93_gate_audit.py
          python3 scripts/compose_koblitz_stage90_gate_audit.py verify \
            > "$RUNNER_TEMP/stage90-historical-audit.json"
          python3 scripts/verify_koblitz_stage92_current_single_core.py verify \
            > "$RUNNER_TEMP/stage92-single-core.json"
          python3 scripts/compose_koblitz_stage93_gate_audit.py verify \
            > "$RUNNER_TEMP/stage93-audit.json"
          cd research/sat_factor_base_review_20260908/autolab
          python3 -m unittest test_boundary_autolab.py
          python3 boundary_autolab.py preflight > "$RUNNER_TEMP/autolab-preflight.json"
          cd "$GITHUB_WORKSPACE"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
