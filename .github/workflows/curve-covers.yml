name: Curve cover certificates
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'src/bin/curve_standards.rs'
      - 'src/bin/curve_standards/**'
      - 'src/bin/curve_cover_check.rs'
      - 'src/bin/curve_cover_check/**'
      - 'src/binary_ecc/**'
      - 'src/cryptanalysis/ecc2k130_guard.rs'
      - 'src/hash/sha256.rs'
      - 'src/utils/**'
      - 'docs/curves/**'
      - 'docs/browser/**'
      - 'scripts/build_lab_browser.py'
      - 'scripts/test_cover_catalog.py'
      - 'scripts/update_curve_standards.py'
      - 'scripts/build_curve_registry.py'
      - '.github/workflows/curve-covers.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'src/bin/curve_standards.rs'
      - 'src/bin/curve_standards/**'
      - 'src/bin/curve_cover_check.rs'
      - 'src/bin/curve_cover_check/**'
      - 'src/binary_ecc/**'
      - 'src/cryptanalysis/ecc2k130_guard.rs'
      - 'src/hash/sha256.rs'
      - 'src/utils/**'
      - 'docs/curves/**'
      - 'docs/browser/**'
      - 'scripts/build_lab_browser.py'
      - 'scripts/test_cover_catalog.py'
      - 'scripts/update_curve_standards.py'
      - 'scripts/build_curve_registry.py'
      - '.github/workflows/curve-covers.yml'
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98'
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --bin curve_cover_check --bin curve_standards
      - run: cargo run --bin curve_standards -- --check
      - run: python3 scripts/update_curve_standards.py --check
      - run: cargo run --bin curve_cover_check -- --check
      - run: python3 scripts/test_cover_catalog.py
      - name: Check native catalog and session browser additions
        run: |
          git fetch --no-tags --depth=1 origin f9011e5375155bd9ef7839abe4eea12718e4b401 fd8bcacf4cc097cc0dcb55ba068ad94a3d3202ae
          cargo run --release --locked --manifest-path research/ecbench_open_questions_20261014/native-publish/Cargo.toml -- --historical-inputs
          cargo run --release --locked --manifest-path research/ecbench_open_questions_20261014/native-publish/Cargo.toml -- --check
