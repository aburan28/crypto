name: Koblitz Stage 129 current gate audit

on:
  pull_request:
    paths:
      - "docs/ic/runs/koblitz-n59-standard-cap-20260921.json"
      - "docs/ic/params/k1n59-standard-l9-m3-cap-public-59001.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-128-current-gate-audit-20260921/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-129-current-gate-audit-20260921/**"
      - "scripts/compose_koblitz_stage128_gate_audit.py"
      - "scripts/compose_koblitz_stage129_gate_audit.py"
      - ".github/workflows/koblitz-stage129-current-gate-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay Stage 128 historical audit and Stage 129 current audit
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage128_gate_audit.py scripts/compose_koblitz_stage129_gate_audit.py
          python3 -m json.tool docs/ic/runs/koblitz-n59-standard-cap-20260921.json >/dev/null
          python3 -m json.tool docs/ic/params/k1n59-standard-l9-m3-cap-public-59001.json >/dev/null
          python3 scripts/compose_koblitz_stage128_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-128-current-gate-audit-20260921 > "$RUNNER_TEMP/stage128-historical.json"
          python3 scripts/compose_koblitz_stage129_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-129-current-gate-audit-20260921 > "$RUNNER_TEMP/stage129-current.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
