name: Standalone Boolean projected syndromes
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness-and-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exact projections, Gray schedules and complete models
        run: |
          rustc --edition 2021 -O --test research/boolean_byte_sieve_20260923/worker.rs -o /tmp/boolean-byte-tests
          /tmp/boolean-byte-tests
      - name: Frozen evidence, randomized orders and corruption checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s research/boolean_byte_sieve_20260923 -p 'test_*.py' -v
