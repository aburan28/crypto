name: Koblitz Stage 170 current gate audit

on:
  pull_request:
    paths:
      - "docs/index-calculus-scoreboard.html"
      - "examples/koblitz_pdp_backend.rs"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/GATE_STATUS.md"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-169-current-gate-audit-20260923/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-170-parallel-fixed-x1-construction-20260923/**"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-170-parallel-fixed-x1-construction-verification.json"
      - "research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-170-current-gate-audit-20260923/**"
      - "scripts/compose_koblitz_stage169_gate_audit.py"
      - "scripts/compose_koblitz_stage170_gate_audit.py"
      - "scripts/verify_koblitz_stage170_parallel_construction.py"
      - ".github/workflows/koblitz-stage170-current-gate-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify historical Stage 169 and current Stage 170
        run: |
          python3 -m py_compile \
            scripts/compose_koblitz_stage169_gate_audit.py \
            scripts/compose_koblitz_stage170_gate_audit.py \
            scripts/verify_koblitz_stage170_parallel_construction.py
          python3 scripts/compose_koblitz_stage169_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-169-current-gate-audit-20260923 \
            > "$RUNNER_TEMP/stage169-historical-audit.json"
          python3 scripts/verify_koblitz_stage170_parallel_construction.py \
            > "$RUNNER_TEMP/stage170-result-verification.json"
          cmp "$RUNNER_TEMP/stage170-result-verification.json" \
            research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-170-parallel-fixed-x1-construction-verification.json
          python3 scripts/compose_koblitz_stage170_gate_audit.py verify \
            --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-170-current-gate-audit-20260923 \
            > "$RUNNER_TEMP/stage170-current-audit.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
