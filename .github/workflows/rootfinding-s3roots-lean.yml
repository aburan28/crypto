name: Root-finding S3Roots Lean proof
# Builds papers/rootfinding-decomposition/lean (S3Roots, Proposition 1 of the
# paper; Mathlib pinned by lake-manifest.json, fetched from the Mathlib cache),
# replays it in a fresh kernel with leanchecker, refuses sorry, admit,
# native_decide and custom axioms, and audits the main theorems' axioms
# (AxiomAudit.lean; only propext, Classical.choice and Quot.sound are allowed),
# keeping the audit log as an artifact. Sheriff case SHF-20261016-3caa6f,
# finding L6.
on:
  pull_request:
    paths:
      - '.github/workflows/rootfinding-s3roots-lean.yml'
      - 'papers/rootfinding-decomposition/lean/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rootfinding-s3roots-lean.yml'
      - 'papers/rootfinding-decomposition/lean/**'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 90 }}
    defaults:
      run:
        working-directory: papers/rootfinding-decomposition/lean
    steps:
      - uses: actions/checkout@v4
      - name: No sorry, admit, native_decide or custom axioms
        run: |
          if grep -nE '\bsorry\b|\badmit\b|native_decide|^axiom ' S3Roots.lean AxiomAudit.lean; then
            echo "forbidden construct found"; exit 1; fi
      - name: Build S3Roots and replay in a fresh kernel
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: papers/rootfinding-decomposition/lean
          auto-config: false
          use-mathlib-cache: true
          build: true
          build-args: 'S3Roots'
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose S3Roots'
      - name: Axiom audit (standard axioms only)
        run: |
          set -o pipefail
          lake env lean AxiomAudit.lean | tee /tmp/axioms.txt
          test "$(grep -cE "depends on axioms|does not depend on any axioms" /tmp/axioms.txt)" -eq 3
          if grep -vE "^AXIOM_AUDIT\||does not depend on any axioms|depends on axioms: \[(propext|Classical.choice|Quot.sound)(, (propext|Classical.choice|Quot.sound))*\]" /tmp/axioms.txt; then
            echo "unexpected axiom"; exit 1; fi
      - name: Keep the audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rootfinding-s3roots-axiom-audit
          path: /tmp/axioms.txt
          if-no-files-found: ignore
