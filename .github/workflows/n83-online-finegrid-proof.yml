name: N83 K3114 fine-grid capacity proof

on:
  push:
    branches: [codex/n83-online-range-20261016]
    paths:
      - .github/workflows/n83-online-finegrid-proof.yml
      - research/n83_online_finegrid_20261016/Capacity.lean
      - research/n83_online_finegrid_20261016/lean-toolchain
      - research/n83_online_finegrid_20261016/proof_check.log
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check the pinned capacity theorem and axioms
        shell: bash
        working-directory: research/n83_online_finegrid_20261016
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lean Capacity.lean > /tmp/n83-finegrid-proof-check.log
          diff -u proof_check.log /tmp/n83-finegrid-proof-check.log
          if rg -n '\b(sorry|admit|sorryAx)\b' Capacity.lean; then
            exit 1
          fi
