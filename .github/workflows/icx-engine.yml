name: icx engine (multi-arch)

# Builds and tests the `icx` index-calculus engine and its standardized-curve
# catalog on x86-64, Linux aarch64, and Apple silicon, and runs the binary
# against every curve in the catalog. This is the completion gate for
# "run icx against every standardized curve" across architectures.

on:
  pull_request:
    paths:
      - "src/bin/icx.rs"
      - "src/bin/icx/**"
      - "src/cryptanalysis/curve_catalog.rs"
      - "src/cryptanalysis/ic_engine.rs"
      - "src/cryptanalysis/ic_progress.rs"
      - "src/cryptanalysis/ic_run.rs"
      - "src/cryptanalysis/semaev_decomp.rs"
      - "src/cryptanalysis/field_dispatch.rs"
      - "src/cryptanalysis/fes_gpu.rs"
      - "src/cryptanalysis/gf3m.rs"
      - "tests/icx.rs"
      - "Cargo.toml"
      - "docs/ic/ENGINE_AUDIT_AND_DESIGN.md"
      - "gpu/fes/**"
      - ".github/workflows/icx-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-run:
    name: build+run (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: linux-x86_64
          - runner: ubuntu-24.04-arm
            arch: linux-aarch64
          - runner: macos-14
            arch: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build icx
        run: cargo build --release --bin icx
      - name: Unit tests (catalog, engine, progress, run, field backend, fes-gpu)
        run: cargo test --release --lib -- cryptanalysis::curve_catalog cryptanalysis::ic_engine cryptanalysis::ic_progress cryptanalysis::ic_run cryptanalysis::fes_gpu cryptanalysis::semaev_decomp::tests::clmul_path_matches_independent_reference
      - name: Build the host-emulation FES worker (drives the GPU offload path)
        run: make -C gpu/fes host-worker
      - name: Integration tests (catalog + FES worker subprocess path)
        env:
          ICX_FES_WORKER: ${{ github.workspace }}/gpu/fes/fes_solve
        run: cargo test --release --test icx
      - name: List the catalog (log which curves ran on ${{ matrix.arch }})
        run: ./target/release/icx list
      - name: Estimate one curve per family
        run: |
          set -e
          for c in p256 sect163k1 sect163r2 oakley-group-3; do
            echo "== $c =="
            ./target/release/icx estimate "$c"
          done
      - name: Run the pipeline on a same-family analogue (each architecture)
        run: |
          set -e
          echo "== Koblitz analogue (sect163k1) =="
          ./target/release/icx run sect163k1 --degree 13 --rho-runs 4
          echo "== Random binary analogue (sect163r2) =="
          ./target/release/icx run sect163r2 --degree 13 --rho-runs 0
          echo "== Prime analogue (p256) =="
          ./target/release/icx run p256 --bits 16 --rho-runs 4
          echo "== Gray-code FES solver plugged in =="
          ./target/release/icx run sect233k1 --degree 11 --oracle descent-algebraic --solver fes-f2 --rho-runs 0
      - name: GPU FES kernel — host verification (no GPU needed)
        run: make -C gpu/fes test
      - name: GPU FES — drive the worker from icx (subprocess offload path)
        run: |
          ./target/release/icx fes --n 18 --m 20 --seed 1 --worker gpu/fes/fes_solve
      - name: GPU FES kernel — Metal worker compile-check (Apple silicon)
        if: matrix.arch == 'macos-arm64'
        run: make -C gpu/fes metal-worker

  gpu-fes-cuda:
    name: GPU FES CUDA compile-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUDA_PKG_VERSION: 12-8
      CUDA_DIR_VERSION: "12.8"
    steps:
      - uses: actions/checkout@v4
      - name: Install nvcc (compiler + CUDA headers only)
        run: |
          distro="ubuntu$(lsb_release -rs | tr -d .)"
          curl -fsSL -o /tmp/cuda-keyring.deb \
            "https://developer.download.nvidia.com/compute/cuda/repos/$distro/x86_64/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            "cuda-nvcc-$CUDA_PKG_VERSION" "cuda-cudart-dev-$CUDA_PKG_VERSION"
          echo "/usr/local/cuda-$CUDA_DIR_VERSION/bin" >> "$GITHUB_PATH"
      - run: nvcc --version
      - name: Generate the system header
        run: make -C gpu/fes gen
      - name: Compile the FES kernel for sm_70/80/90 (no GPU needed)
        run: make -C gpu/fes nvcc-check
