icms: icms.spec/v1
label: "random 20-bit prime curve: 67 smallest abscissae, mitm m=3, tails of 2 (autoresearcher)"
description: >
  Candidate arm for the m = 3 engine comparison on the crypto-autoresearcher
  producer.  A 20-bit prime field curve drawn from the workload seed, the
  factor base of the 67 smallest on-curve abscissae, meet-in-the-middle
  decomposition with m = 3 against a table of every signed sum of two base
  points (solve one point with S3, look the other two up; the table build is
  charged inside the S3 count), a
  first-log stop, min-fill Gaussian elimination, and the producer's plain
  Teske rho on the same instance.  Counted in S3 solves; group additions and
  wall time are recorded beside them as separate units.
role: candidate
instance:
  curve: {regime: prime, bits: 20, selected_by_seed: true}
  workload: {targets: 1, law: known_answer, seeds: [0]}
factor_base:
  family: prime_small_abscissa
  params: {size: 67}
  quotient: [negation]
decomposition: {arity: 3, method: mitm, params: {table_arity: 2}}
relations: {collector: random, stop: first_log}
linear_algebra: {method: gauss, pivot: min_fill}
descent: {method: embedded}
reference: {rho: rho.plain}
accounting: {unit: count.s3_solves}
measurement:
  window: cold_end_to_end
  repetitions: 5
  warmup: 1
  interleave: abab
  isolation_required: L2
  timeout_seconds: 120
execution:
  adapter: autoresearcher.index_calculus
  threads: 1
  cpus: 1
  args: {root: ../crypto-autoresearcher}
